services:
  keeper:
    build:
      context: .
      dockerfile: Dockerfile
    image: keeper-coc-trpg:latest
    container_name: keeper-coc-trpg
    restart: unless-stopped
    # Use Docker's built-in init (docker-init) as PID 1 so `docker stop`
    # delivers SIGTERM cleanly to node. Avoids needing to apk-install tini
    # inside the image, which kept failing whenever Alpine's CDN was flaky.
    init: true
    environment:
      NODE_ENV: production
      # NyaaChat-MCP token for objective CoC dice rolling.
      # Leave empty to fall back to the in-process local roll implementation.
      NYAACHAT_MCP_TOKEN: "${NYAACHAT_MCP_TOKEN:-}"
      # Public-facing prefix used to mint clue-image URLs that survive in
      # the client's localStorage. Read from the project root .env file
      # (compose loads it automatically). Leave it empty in .env to fall
      # back to the request origin — fine for localhost-only setups, but
      # required if you want generated images to remain reachable from
      # other devices/networks.
      IMAGE_PUBLIC_BASE_URL: "${IMAGE_PUBLIC_BASE_URL:-}"
      # Reverse-proxy trust setting passed to Express's `trust proxy`. Default
      # ("loopback, linklocal, uniquelocal") covers nginx on the same host and
      # Docker bridge networks. Override only when the proxy hops sit on a
      # public range — see .docs/nginx-reverse-proxy.md.
      TRUST_PROXY: "${TRUST_PROXY:-loopback, linklocal, uniquelocal}"
      # NyaaAcount credentials for unified account system (P3+).
      # Leave empty until P5 (NyaaAcount provisioning); login returns 503
      # when these are missing (fail-closed).
      NYAAACOUNT_BASE_URL: "${NYAAACOUNT_BASE_URL:-}"
      NYAAACOUNT_API_TOKEN: "${NYAAACOUNT_API_TOKEN:-}"
      NYAAACOUNT_ENCRYPTION_KEY: "${NYAAACOUNT_ENCRYPTION_KEY:-}"
      # SQLite database path inside the container.
      KEEPER_DB_PATH: "${KEEPER_DB_PATH:-/data/db/keeper.db}"
      # Host directory for persistent data (DB, user storage).
      # Set in .env to E:\DockerRes\keeper-coc-trpg per workspace policy.
      KEEPER_DATA_DIR: "${KEEPER_DATA_DIR:-.}"
      # Container path for per-user encrypted chat-session archives (P7).
      KEEPER_USER_STORAGE_DIR: "${KEEPER_USER_STORAGE_DIR:-/data/user-storage}"
    ports:
      # host:container — host port 3093 was selected by the user from the
      # free slots in 3090-3099. Container always listens on 3000.
      - "3093:3000"
    volumes:
      # Persist the 30-day rolling image cache across container rebuilds so
      # generated clue photos remain reachable for their full TTL.
      - keeper_image_cache:/app/cache/images
      # SQLite database + user storage (P3+ account system).
      # KEEPER_DATA_DIR is configured in .env; defaults to "." (current dir).
      - ${KEEPER_DATA_DIR:-.}/db:/data/db
      # Per-user encrypted chat-session archives (P7).
      - ${KEEPER_DATA_DIR:-.}/user-storage:/data/user-storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  keeper_image_cache:
