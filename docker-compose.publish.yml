services:
  keeper:
    image: ${PRIVATE_DOCKER_REGISTRY_HOST:?err}/keeper-coc-trpg:latest
    container_name: keeper-coc-trpg
    pull_policy: always
    init: true
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
      - NODE_ENV=production
      - KEEPER_DB_PATH=/data/db/keeper.db
      - KEEPER_USER_STORAGE_DIR=/data/user-storage
    ports:
      - "3093:3000"
    volumes:
      - keeper_image_cache:/app/cache/images
      - ${KEEPER_DATA_DIR:-./data}/db:/data/db
      - ${KEEPER_DATA_DIR:-./data}/user-storage:/data/user-storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  keeper_image_cache:
