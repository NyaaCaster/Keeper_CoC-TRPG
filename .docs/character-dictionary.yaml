          - { id: lang-chinese,  nameZh: "汉语",       base: 1 }
          - { id: lang-japanese, nameZh: "日语",       base: 1 }

  excluded_from_skills:
    - { name: "闪避",       reason: "派生战斗值，写入 combatDerived.dodge。" }
    - { name: "母语",       reason: "派生 = EDU，仅 motherTongue 字段记语言名称。" }
    - { name: "信用评级",   reason: "基本信息层字段 creditRating；不进 skills。" }


# =============================================================================
# 6. 职业模板（occupations）
# =============================================================================
occupations:

  $description: |
    创建期角色应优先选用 src/data/cocOccupations.ts 的职业模板。完整列表
    （1920s 43 条 / modern 33 条）以代码为准；本表仅说明结构与解析规则。

  template_shape:
    id:
      $type: string
      $description: "形如 '<slug>-1920s' 或 '<slug>-modern'，避免两表同名冲突。"
    nameZh: { $type: string, $description: "中文职业名，写入 sheet.occupation。" }
    nameEn: { $type: string }
    era:    { $type: string, $enum: ["1920s", "modern"] }
    coreSkills:
      $type: "OccupationSkillRef[]"
      $description: "8 槽展开后总数恒为 8（含 freeSlot.count、oneOf 计 1）。"
    occupationPointFormula:
      $type: object
      shape: { terms: "[{ attr, mult }]", max: "整数（可选上限）" }
      default: "{ terms: [{ attr: 'edu', mult: 4 }] }   # EDU × 4 兜底"

  occupation_skill_ref_kinds:
    $description: "5 种 kind，描述职业核心技能槽如何展开。"
    skill:
      shape: '{ kind: "skill", id }'
      meaning: "确定的单技能（id 是 cocSkills.SKILL_REGISTRY_ALL 中的 skill id）。"
    branch:
      shape: '{ kind: "branch", parentId, branchId }'
      meaning: "确定的分支（如 firearms / firearms-handgun）。"
    anyBranchOf:
      shape: '{ kind: "anyBranchOf", parentId }'
      meaning: "玩家在该多分支父类下任选一个分支。"
    oneOf:
      shape: '{ kind: "oneOf", options: OccupationSkillRef[] }'
      meaning: "在多个候选项中任选一个。"
    freeSlot:
      shape: '{ kind: "freeSlot", count }'
      meaning: "自定 N 个职业槽（玩家从全标准技能集任意选）。"

  selection_rules:
    - "职业槽 8 个，总数恒为 8；自拟职业 = 8 个 freeSlot。"
    - "兴趣槽 4 个，永远是 freeSlot；从全标准技能集任意挑选。"
    - "提交时合并去重，按最大值结算。"
    - "本项目不强校验职业 CR 上下限；creditRating 可自由填 0–99。"

  example_template:
    id: "antiquarian-1920s"
    nameZh: "古董商"
    nameEn: "Antiquarian"
    era: "1920s"
    coreSkills:
      - { kind: "skill", id: "appraise" }
      - { kind: "anyBranchOf", parentId: "art-craft" }
      - { kind: "skill", id: "history" }
      - { kind: "skill", id: "library-use" }
      - { kind: "anyBranchOf", parentId: "language-other" }
      - { kind: "skill", id: "listen" }
      - { kind: "skill", id: "spot-hidden" }
    occupationPointFormula: { terms: [{ attr: "edu", mult: 4 }] }


# =============================================================================
# 7. 装备与背包（inventory）
# =============================================================================
inventory:

  $description: |
    长度恒为 8 的判别联合数组（House Rule：8 槽硬上限）。
    每槽形如：
      - { kind: "item",   text: "..." }            # 自由文本物品；text === "" 视为空槽
      - { kind: "weapon", weaponId: "...", ammo: <number> }   # ammo 由武器表 maxAmmo 派生

  default_empty_slot: { kind: "item", text: "" }

  rules:
    - "武器 + 物品共享 8 槽。极限：8 件武器 / 8 个物品 / 8 槽全空都合法。"
    - "弹药跟随武器条目（ammo 字段），不单独占槽。"
    - "重要物品 / 意义之锚作为普通 item 录入，无特殊标记位。"
    - "创建期 ammo = maxAmmo 自动写入；玩家不可调，跑团时由 KP 扣加。"

  weapon_slot_population:
    description: "weapon 槽 weaponId 必须存在于 cocWeapons.WEAPON_REGISTRY_ALL；ammo = maxAmmo。"

  example:
    - { kind: "weapon", weaponId: "revolver-38", ammo: 6 }
    - { kind: "item",   text: "出诊包（听诊器+吗啡+纱布）" }
    - { kind: "item",   text: "父亲的怀表" }
    - { kind: "item",   text: "笔记本与钢笔" }
    - { kind: "item",   text: "" }
    - { kind: "item",   text: "" }
    - { kind: "item",   text: "" }
    - { kind: "item",   text: "" }


# =============================================================================
# 8. 武器结构（weapons —— 仅供查询；inventory.weapon 引用 weaponId）
# =============================================================================
weapons:
  $description: |
    武器表见 src/data/cocWeapons.ts WEAPON_REGISTRY_ALL（按时代 + 跨代通用合并）。
    本节仅描述结构与 DB 加成口径，LLM 引用 weaponId 即可，不需要把整张表内联。

  weapon_definition_shape:
    id:        { $type: string, $description: "武器表 id" }
    nameZh:    { $type: string }
    nameEn:    { $type: string }
    era:       { $type: string, $enum: ["1920s", "modern", "any"] }
    skillRef:  { $type: "OccupationSkillRef", $description: "仅用 'skill' / 'branch' 两种 kind。" }
    damage:
      shape:
        formula: "string  # 主伤害公式，如 '1D3' / '1D10+2' / '4D6 / 2D6 / 1D6'（散弹三档）"
        addDB:   "boolean? # true → 战斗结算时加 DB（近战）"
        halfDB:  "boolean? # true → 战斗结算时加 ½DB（投掷 / 弓；弩 = false）"
    range:        { $type: string, $description: "近战 = '触及'；火器 = '15m' / 'STR×3m' / 散弹三档 '10m / 20m / 50m'。" }
    attacks:      { $type: string, $description: "每轮攻击次数：'1' / '2' / '1(3)' / '1/2' / '1 或 2'。" }
    maxAmmo:      { $type: integer, $description: "装弹数；近战 / 单发投掷 = 0 或 1。" }
    malfunction:  { $type: integer, $required: false, $description: "命中骰 ≥ 此值卡壳。" }

  damage_bonus_policy:
    melee:    "addDB = true   → 战斗结算时拼加 combatDerived.db.dice 或 db.flat"
    thrown:   "halfDB = true  → 加 ½DB（弩例外，halfDB = false）"
    firearm:  "不加 DB"
    unarmed_brawl: "1D3 + DB"


# =============================================================================
# 9. MythicEncounters（神秘接触档案）
# =============================================================================
mythic_encounters:
  $type: object
  $description: |
    神话相关档案。**创建期一律为空对象**（4 类容器各为 []）；
    游戏中由 KP 按 7e 规则触发追加，玩家不可手动调。

  fields:
    tomes:
      $type: "MythicTomeEntry[]"
      $required: false
      shape:
        id:          string
        name:        string
        state:       'string  # "skimmed" | "read" | "studied"   略读/通读/精研'
        acquiredAt:  'string?'
        notes:       'string?'

    spells:
      $type: "MythicSpellEntry[]"
      $required: false
      shape:
        id:          string
        name:        string
        cost:        'string?  # POW / MP / SAN 消耗描述'
        acquiredAt:  'string?'
        notes:       'string?'

    artifacts:
      $type: "MythicArtifactEntry[]"
      $required: false
      shape:
        id:          string
        name:        string
        state:       'string  # "held" | "encountered"   持有 / 仅接触过'
        acquiredAt:  'string?'
        notes:       'string?'

    entities:
      $type: "MythicEntityEntry[]"
      $required: false
      shape:
        id:            string
        name:          string
        encounteredAt: 'string?'
        notes:         'string?'

  empty_default:
    tomes: []
    spells: []
    artifacts: []
    entities: []


# =============================================================================
# 10. SanityState（疯狂状态机 —— 运行期）
# =============================================================================
sanity_state:
  $type: object
  $description: |
    疯狂状态机。创建期固定写空（episodeSanLoss = 0，madness = null）；
    运行期由前端硬规则维护。LLM 创建角色时不要自行填别的值。

  fields:
    episodeSanLoss:
      $type: integer
      $description: "本模组累计 SAN 损失（用于 1/5 阈值判断）。"
    madness:
      $type: "string | null"
      $enum: [null, "bout", "temporary", "indefinite"]
      $description: "null = 正常 / bout = 急性发作 / temporary = 临时疯狂 / indefinite = 不定期疯狂。"
    boutTurnsRemaining:      { $type: integer, $required: false }
    temporaryTurnsRemaining: { $type: integer, $required: false }
    boutRoll:                { $type: integer, $required: false, $range: [1, 10] }
    indefiniteAnchor:
      $type: object
      $required: false
      shape: { moduleName: string, turnId: string }

  creation_default:
    episodeSanLoss: 0
    madness: null


