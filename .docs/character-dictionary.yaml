      drive:
        nameZh: "驾驶"
        parent_base: 0
        key_pattern: "驾驶(<分支>)"
        branches:
          - { id: drive-auto,       nameZh: "汽车",        base: 20 }
          - { id: drive-carriage,   nameZh: "马车",        base: 20, era: "1920s" }
