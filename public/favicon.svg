    <path d="M45 32 q9 0 11 -4 t-2 -6"/>
    <path d="M38.5 43.3 q4.5 7.8 1.5 11.4 t-7 2.5"/>
    <path d="M25.5 43.3 q-4.5 7.8 -1.5 11.4 t7 2.5"/>
    <path d="M19 32 q-9 0 -11 -4 t2 -6"/>
    <path d="M25.5 20.7 q-4.5 -7.8 -1.5 -11.4 t7 -2.5"/>
    <path d="M38.5 20.7 q4.5 -7.8 1.5 -11.4 t-7 -2.5"/>
  </g>
</svg>
