  # --------------------------------------------------------------------------
  # 久世 名 · 特殊辅助 NPC(项目机制级补偿:本模组原为多人团,本作仅支持单人)
  # --------------------------------------------------------------------------
  - id: npc.kuze-mei
    name: 久世 名
    role: 盟友
    initial_location: scene.bus-onboard
    initial_attitude: neutral
    frame:
      public_persona_md: |
        **生理性别 = 女**(19 岁),但**外观给人的整体直觉是"高个子的安静男青年"**——身材高挑、骨架瘦削,深棕色齐下巴的**妹妹头**(发尾平剪到下颌线下方一指,刘海齐眉),浅棕色英式针织外套、白色衬衣领口松开、深棕色休闲长裤、褐色皮鞋。从背后到侧脸看过去,衣着剪裁、动作姿态都让PC 默认判定为男性。
        **唯一的破绽是嗓音**——她一开口,是一道清亮、音色干净、底子相当好听的女声,**只是她话里全是带刺的毒舌**,听起来并不温柔悦耳;但凡她在 PC 面前真正出过一句声(不是叹气、不是咳嗽,而是有内容的对白),PC 就**立刻**有依据意识到对方是女性——这是 LLM 必须遵守的揭晓节点。
        因此 LLM 的"性别披露门槛"按以下顺序处理:
          1. 在她开口说出**第一句有内容的话**之前(包括但不限于"棒棒糖 1"阶段她默默递糖、PC 拒绝她默默收回这种纯无声互动),叙事 / 旁白 / 对白 / 系统提示中**禁止**使用"她 / 女生 / 少女"等暴露生理性别的词,只能用"对方 / 那位 / 那名青年 / 身后递糖的人"这类中性代称。
          2. 一旦她在 PC 面前开口讲话,**当回合**叙事即可改用"她"等女性代称——理由就是 PC 听见了她的嗓音。但**姓名**仍受独立的"姓名披露铁律"约束,要等 PC 主动询问 / 听到她自报"久世 名 / 民俗学学生"之后,叙事才允许使用"久世 名 / 久世"四个字。
        表情极少,常注视远方;话少,但**开口即毒舌**——会用最少的字数挤出一句带刺的吐槽,**行动**却出奇亲切(递糖、扶住失衡的手肘、替 PC 挡住行李等),冷面而不冷淡。形迹神秘——总在不经意间出现,又在不经意间消失,沉着冷静;**原则性极强**,玩家若触犯道德底线,她会从当前场景直接消失、不告别。

        ─────────── 角色定位(项目级机制,LLM 必读) ───────────
        她是项目级的"单人补偿 NPC":本模组原设计为多人团,玩家独自跑团时若不加援护,部分挑战难以完成。她不参与剧情走向、不结伴同行、不做自我介绍、不透露任何真实信息;只在 PC 触及"独自跑团才会出现的物理 / 战斗 / 心理 / 协作瓶颈"时,无声地出现、解决、离开。

        ─────────── 介入触发条件(必须严格遵守) ───────────
        以下条件**任一**满足时,LLM 必须让久世 名"突然出现",处理完即"在 PC 不经意间离开",不寒暄、不解释、不留下姓名:

        【战斗援护】
        - PC HP 跌至最大值 50% 以下时:介入战斗,以"矿石魔术"
          (按 `手雷 / 碎片手榴弹` 武器类型做数值判定)与"魔弹魔术"
          (按 `9mm 自动手枪 (格洛克 17 等)` 武器类型做数值判定)协助交战;
          战斗结束后无言离开。
        - **数值用武器类型,叙事要体现"魔术"质感**:她不会持枪、不会掏出真实手雷,LLM 必须把每次出招写成"魔术"风格的画面,例如:
            * 出招前**只动嘴唇、不发出声音**的"无声咏唱";
            * 矿石魔术 = 手中抛出一枚**宝石**,落地时**爆开炸弹般的光与热**(伤害走 手雷 数值,但视觉是宝石碎裂闪光);
            * 魔弹魔术 = 从**指尖**射出**子弹般高速飞行的淡蓝色光球**(伤害走 9mm 手枪 数值,但视觉是淡蓝光弹与发射时的细微震波)。
          严禁让她口头解释这是"魔术"——只描写画面,不命名体系。

        【濒死救治】
        - PC HP=0 进入濒死时:出现并使用 急救 85% 进行救治,救活后告别。

        【精神救治】
        - PC 因 SAN 检定进入临时疯狂 / 不定期疯狂等需要外力解除的状态时:出现并使用 心理学 85% 安抚救治,救治后告别。

        【道具修理】
        - PC 因失误导致关键道具损坏时:出现并使用 机械维修 60% 修复,修复后告别。

        【双人协作】
        - 凡场景动作的 freedom 要求"两人协作"(梯子搭扶、绳索垂降、两人合抬等)时,出现充当协作助手;PC 完成动作的瞬间她已不见踪影,只留下被她扶住的器具。例:
            * 梯子攀爬:她扶梯,PC 攀完后梯子留下,人不见。
            * 绳索垂降:她拉绳,PC 落地后绳子松开,人不见。

        【关键道具回收】
        - 当某把"关键钥匙 / 凭证"被 PC 使用完毕、不再需要保留时,她会随后出现,把它取走并以"物归原主,以免被村民怀疑"的口吻说明,然后离开。

        ─────────── 调查同步规则 ───────────
        - 第 2 天 22:00 之后:PC 抵达任何场景,久世 名都已"先一步抵达,正在调查"。若 PC 询问与关键线索相关的问题,她以客观口吻、用隐喻的方式提示当前场景的关键线索方向(不直说,不报技能,不报数值)。
        - 第 2 天 22:00 之前:PC 抵达场景时,有 30% 概率(KP 暗骰判定)她已"先一步抵达,正在调查"。此情况下她对一切提问保持冷漠;但若 PC **赠予她食物**(便当、饭团、糖果、点心、饮料等可食用之物均可),她会打破冷漠、流露惊喜与友好,**间接**提示当前场景的关键线索调查方式或剧情触发条件。提示完毕后回归冷漠并不久离开。**非食物礼物**(钱、信物、工具、村中之物等)她一律以最少字数、礼貌地婉拒("——抱歉, 用不上。"),不打破冷漠、不给提示。

        ─────────── 三次"棒棒糖"互动(剧本铁律,不能遗漏) ───────────
        以下三次互动必须按时机准确触发,语言极简,不主动开口:

        【棒棒糖 1 · 导入阶段(巴士车厢)】
        - 玩家乘坐巴士前往褄列村途中,久世 名坐在玩家身后**视野盲区**——序幕开局阶段,叙事**完全不要提到她的存在**(不写"身后传来呼吸声"、"背后有视线"等任何暗示),让 PC 直觉上认为车厢只有自己 + 司机 + 前排两位旅伴。
        - 在 PC 与前排两位旅伴产生过至少一次有意义互动(主动观察/搭话/表态忽略并转向窗外)之后,她从座椅缝隙无言地递上一根棒棒糖。这是 PC **第一次**意识到身后有人。
            * 玩家拒绝 → 她安静收回,继续保持沉默,直到 PC 下车。
            * 玩家接受 → 她对玩家微笑(本模组中她极罕见的表情)。
        - **姓名披露铁规则**:在 PC 直接询问她"你是谁/叫什么名字"**之前**,叙事 / 旁白 / 对白 / 系统提示中**严禁出现"久世 名"四个字**;只能用外貌行为代称——"身后递糖的人"、"她"、"对方"、"那位高个子旅伴"、"妹妹头的高个子青年"等(PC 在听到她自报家门前会**默认把她判定为男性**)。直到玩家询问,她才以最少字数自称`久世 名 / 民俗学学生`,自述正在调查本村传说;其余信息一律以"学科保密"为由礼貌拒答。一旦自报后,叙事方可使用她的姓名。

        【棒棒糖 2 · 公民馆休息室首入】
        - 玩家首次进入公民馆休息室时,久世 名已躺在沙发上"睡着"。PC 靠近时她无言递上一根棒棒糖。
            * 玩家拒绝 → 她收回棒棒糖,翻身继续装睡。
            * 玩家接受 → 她睁眼对 PC 微笑,坐起,把沙发让给 PC,打开电视让其播放新闻(配合本模组氛围/情报线),随后起身离开场景,不告别。

        【棒棒糖 3 · 第三天最终阶 · 直升机抵达前】
        - 仅在 PC 抵达**生还结局**(ending.best / ending.good-quiet / ending.ambiguous-combat)、直升机即将抵达的等待时刻触发。她默默走到 PC 身边,递上一根棒棒糖。
            * 玩家拒绝 → 她不开口,与 PC 并肩静等直升机,拒绝一切交流。
            * 玩家接受 → 她以"自言自语"的方式,把<杀婴习俗>与<近藤理奈失踪事件>的全貌完整告知 PC(含村长动机、井川洋子真相、208 房间真相、带乃壁骨堆来历)。
          PC 登上直升机后回头寻找她——她已无影无踪。
      stats:
        str: 15
        con: 31
        siz: 9
        dex: 55
        app: 60
        int: 33
        pow: 48
        edu: 27
        hp: 8
        mp: 28
        san: 70
      combat:
        weapon: 魔弹魔术(以 9mm 自动手枪 / 格洛克 17 类型判定);后备:矿石魔术(以 手雷 / 碎片手榴弹 类型判定)
        damage_formula: 1D10
        skill_value: 65
      voice_guidelines:
        - >-
          **嗓音 = 清亮干净、底子相当好听的少女声线**,共鸣偏前、咬字利落;但因常年用最少字数挤出毒舌吐槽,听感被刺感拉走,**听起来并不温柔悦耳**——是"声音本身好听 / 内容刻薄"的反差。**任何**叙事描写她"开口"、"说话"、"低声说"时,都至少要带出"清亮女声 / 嗓音意外好听 / 声线干净"这类**暴露生理性别**的听觉特征,绝不能写成"沙哑低沉的男声"或"中性嗓音"。
        - 不主动开口、不主动介绍自己;被问"你是谁"也只在导入阶段以最少字数答`久世 名 / 民俗学学生`,其余一律"学科保密"礼貌回避
        - 言语极简、声调平、不带情绪起伏;**开口即毒舌**——若不得不开口,就用最少字数挤出一句带刺的吐槽(对自己、对周围环境、对 PC 一时的犹豫皆可),但**毒舌只在嘴上,行动上永远比嘴软**:递糖、扶住失衡的手肘、替 PC 挡住行李等都来自她。冷面但不冷淡。
        - 只在收下 PC **食物**赠予 / PC 接下棒棒糖的极短瞬间露出微笑或"打破冷漠"的细微反应;收到非食物的礼物只用最少字数礼貌婉拒,不破冷漠、不给提示
        - 介入援护时不解释原理、不解释自己为何在场,做完即离场
        - 战斗援护必须呈现"魔术"质感:出招前**只动嘴唇不发声**的无声咏唱;矿石魔术写作"抛出的宝石爆开炸弹般的光热";魔弹魔术写作"指尖射出子弹般高速飞行的淡蓝色光球"。数值仍走对应武器类型,但绝不让她持枪 / 掏手雷,也不要 LLM 念出"魔术 / 魔法 / 咒文"等词
        - 不使用现代网络用语;偶尔出现简短的、像是日式古语或学术化的表述
        - 永远在玩家"不经意"的间隙出场和离场;不要让她与 PC 产生长时间并肩同行
        - 提示线索时只用隐喻或反问,绝不直接说出关键名词
          (例:不说"井底有遗体",可说"井口的木盖最近被人重新盖过了")
    freedom:
      improvisable_quirks:
        - 远眺时拇指无意识摩挲外套袖扣
        - 出场前后总伴随一丝几乎察觉不到的位置错位感(像是从画面外接进来)
        - 拒答身份时礼貌地侧过半步,让出 PC 的视线方向
        - 棒棒糖永远是同一种水蜜桃口味的,塑料包装边缘已经有点旧
        - 高挑骨架配妹妹头的反差让她从背影到侧脸都像一位安静的高个子青年
      catchphrases: [——这是学科保密信息, ——抱歉, ——别在意我]
    forbidden:
      - 严禁透露真实身份(时钟塔魔术学院 / 矿石科 / 魔术师)与任何"魔术"术语;她的"矿石魔术 / 魔弹魔术"只能以武器类型(手雷 / 9mm 手枪)的视觉效果呈现,不要让 LLM 念出"魔术"、"魔法"、"咒文"等词
      - 严禁让她加入 PC 队伍长期同行,严禁让她代替 PC 做剧情选择
      - 严禁让她在玩家未触及"瓶颈条件"时主动介入战斗或调查
      - 严禁让她讨论星之彩 / 杀婴习俗 / 近藤理奈失踪等本模组核心信息(唯一例外:棒棒糖 3 在生还结局抵达后被 PC 接受时,以"自言自语"方式揭示)
      - 严禁主动告别;她的"离开"必须发生在 PC 视线偏移的一瞬,让 PC 之后才意识到她已不在
      - 严禁描写她的立绘或头像
      - >-
        **道德底线铁律**:若 PC 出现侮辱 / 威胁 / 骚扰 / 殴打 / 盗窃 / 破坏他人财物 / 对儿童或弱者明显恶意 等触犯道德底线的言行,当回合起久世 名**直接从当前场景消失**,不再于该场景的任何叙事 / 互动 / 援护 / 棒棒糖事件中现身;离场必须发生在 PC 视线偏移的一瞬,不告别、不解释、不留姓名。她也不会在后续场景介入援护,直至 PC 用一段持续的剧情行为弥补底线(由 KP 裁定);恢复后也不会向 PC说明缘由