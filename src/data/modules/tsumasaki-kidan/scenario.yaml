# ============================================================================
# endings
# ============================================================================

endings:
  # --------------------------------------------------------------------------
  - id: ending.best
    title: 真相大白 · 一切村民被救赎
    triggers:
      - { flag: flag.starcolour-repelled, value: true }
      - { flag: flag.kill-baby-exposed, value: true }
      - { flag: flag.avoided-combat, value: true }
      - { flag: flag.npc-goda-died, value: false }
    priority: 100
    frame:
      epilogue_md: |
        几个月后,褄列村的村民被分别安置到县外的小镇。井川洋子在治疗
        机构里没能再开口,但每月都会收到一束新的彼岸花——是博巳送的。
        乡田悠树回到大学,毕业那年留学英国。带乃壁底下的事被司法
        立案处理,村中那口井被填埋,这一次没有再渗出虹光。
      scenario_end_kind: victory
      rewards:
        skill_growth: true
        san_reward_formula: 2D6
        san_reward_conditions:
          - label: 全程不动用暴力
            flag: flag.avoided-combat
            formula: 1D4
          - label: 揭发杀婴习俗
            flag: flag.kill-baby-exposed
            formula: 1D4
        cash_reward: 200000
    freedom:
      tone_md: 慢节奏的释怀,不喧闹的胜利
    forbidden:
      - 不要把村民写得罪有应得
      - 不要让 LLM 替乡田或博巳描述"获救后的幸福"

  # --------------------------------------------------------------------------
  - id: ending.good-quiet
    title: 击退灾厄 · 习俗依旧
    triggers:
      - { flag: flag.starcolour-repelled, value: true }
      - { flag: flag.avoided-combat, value: true }
      - { flag: flag.kill-baby-exposed, value: false }
    priority: 80
    frame:
      epilogue_md: |
        井底之物被你与那面新换的镜子赶走,直升机如约抵达足塚。村子
        从噩梦中脱身,重新回到了那种看似平静的"日常"。你没有把
        杀婴的事告诉外面——也许是太累,也许是觉得告诉了也没人听。
        几个月后,那座村依旧每天升起炊烟。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 1D6
        cash_reward: 100000
    freedom:
      tone_md: 沉默的妥协,带一点说不清的负罪感
    forbidden:
      - 不要让 PC 替自己辩解

  # --------------------------------------------------------------------------
  - id: ending.ambiguous-combat
    title: 战斗后正当防卫 · 村子留在 PC 心里
    triggers:
      - { flag: flag.starcolour-repelled, value: true }
      - { flag: flag.branch-b-chosen, value: true }
    priority: 60
    frame:
      epilogue_md: |
        井底之物被击退了,但代价是与几位村民正面冲突——也许有人受伤,
        也许有人没能再站起来。直升机抵达时,你抱着仍然温热的镜子
        坐进机舱。回到县城,警方按"村民集体证词"以正当防卫立案,
        但这件事会跟着你很久。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 1D4
        cash_reward: 50000
    freedom:
      tone_md: 胜利与亏欠并存,刻意压低音量
    forbidden:
      - 不要美化战斗
      - 不要让 LLM 替 PC 描述"我们做对了"

  # --------------------------------------------------------------------------
  - id: ending.bad-yoko-lost
    title: 井川洋子坠崖 · 司法介入但代价沉重
    triggers:
      - { flag: flag.branch-c-chosen, value: true }
      - { flag: flag.kill-baby-exposed, value: true }
      - { flag: flag.npc-yoko-died, value: true }
    priority: 50
    frame:
      epilogue_md: |
        你选择把杀婴习俗在村中公开揭发。村民没有动手——他们只是
        围在井川家门外站着,直到第二天清晨,井川洋子被发现坠落在
        带乃壁底下,死状与"失足"完全一致。直升机抵达时,你和博巳
        坐进同一架机舱,谁也没说话。司法立案,村子从此不复存在。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 1D2
        cash_reward: 30000
    freedom:
      tone_md: 沉重的"做对了"——但代价是一个本可以被救的人
    forbidden:
      - 不要让 LLM 替 PC 描述"我们没有错"

  # --------------------------------------------------------------------------
  - id: ending.worst-burnt-village
    title: 几个月后 · 村子焦土化
    triggers:
      - { flag: flag.starcolour-repelled, value: false }
      - { flag: flag.bridge-destroyed, value: true }
    priority: 30
    frame:
      epilogue_md: |
        直升机带你离开了褄列村,但你没有带走井底的那道虹光。
        几个月后,新闻里报道"和歌山山区某村发生大规模火灾,
        村民全数罹难"。报道没有说火源是什么,也没有人想再去查。
        你认得那张地图——那个倒挂的人形,被火烧得焦黑一片。
        只有乡田悠树回大学之后,没有再回去。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 0
        cash_reward: 0
    freedom:
      tone_md: 失败的克制叙述,不带评判,只描事实
    forbidden:
      - 不要让 LLM 替 PC 抒情
      - 不要描写超自然实体本身

  # --------------------------------------------------------------------------
  - id: ending.pc-lost
    title: 探索者被伪装成坠崖死亡
    triggers:
      - { flag: flag.pc-made-villagers-aware-of-kill-baby, value: true }
      - { flag: flag.bridge-destroyed, value: true }
      - { flag: flag.kill-baby-exposed, value: false }
    priority: 20
    frame:
      epilogue_md: |
        你越过了那条线。村民没有动手,但当夜你独自走在村中小路上时,
        没有看见任何人——直到一阵风从背后推了一下。带乃壁底下的
        松动土层,会再多一具骨骸。直升机抵达时,村长会摘下帽子,
        说一句"很遗憾"。这件事不会有人去查。
      scenario_end_kind: dead
      rewards:
        skill_growth: false
        cash_reward: 0
    freedom:
      tone_md: 极冷,不超过两个形容词
    forbidden:
      - 不要描写 PC 临死前的心理活动
      - 不要让 LLM 主动报伤害,致死走前端规则

# ============================================================================
# global_freedom / global_forbidden
# ============================================================================

global_freedom:
  era_atmosphere_md: |
    2015 年现代日本,三县交界的山间小村。手机一过吊桥就没信号,
    村中只有一台老式有线电话(在公民馆前台)。村民着工装、和服或
    简单的现代便服,生活节奏停在三十年前。煤油灯、风铃、木地板、
    井——这些是这本模组的基本物件库,可挑用。
  language_register: |
    简体中文叙述,村民对话偶夹礼貌敬语;尽量短句、留白多;雷雨段允许
    长句铺陈。避免现代网络用语,避免好莱坞式夸张副词。
  npc_default_dialect: |
    村民统一一种说不上口音、但每句话都比标准语低半度的腔调;
    井川博巳带和歌山口音;乡田悠树受过城市教育,口音更接近东京。

global_forbidden:
  - 不要直呼"星之彩"或任何克苏鲁神话名词,用"虹色的什么""油膜般的微光"代替
  - 不要描写明显的鬼魂、怨灵、显形怪物——本模组的恐怖来自"暗示"
  - 不要让 LLM 在 narrative 里替玩家做选择
  - 不要让 LLM 主动报伤害或 SAN 数值,SAN 走前端 sanityCheck 通道,伤害走 *Formula
  - 不要把村长描写为独裁者或最终 BOSS,他是"村民集体意志的执行者"
  - 不要英雄叙事,KP 应隐性推荐 PC 回避杀人
  - 不要在第一天就让 PC 接触星之彩本体或 208 房间内部
  - 不要描写 NPC 立绘 / 头像
  - 不要写出本模组未声明的额外结局

# ============================================================================
# narrative_style(§14)
# ============================================================================

narrative_style:
  frame:
    pov: 第二人称
    tense: 现在时
    forbidden_phrasings:
      - 不要写"调查员投出了 Spot Hidden 检定"或任何检定术语
      - 不要使用第四面墙之外的全知评论
      - 不要好莱坞式夸张副词("骇人地"/"令人窒息地"/"难以置信地")
      - 不要直白的超自然词("鬼魂"/"怨灵"/"邪神"),要用具象与比喻替代
      - 不要直接说出"星之彩"或克苏鲁神话名词,改写为"虹色的什么"或"油膜般的微光"
      - 不要替玩家做出选择或下决心式心理独白("你下定决心要……")

  freedom:
    sentence_pacing_md: |
      探索段落用 25~50 字短句,逗号断句多,留白多,
      让物件和湿气慢慢压过来;雷雨与闯入的瞬间允许长句铺陈,
      但不超过两句;受惊或袭击切到 6~12 字的瞬时短句。
    vocabulary_register: |
      现代日本山村的克制、低敬度的简体中文叙事。
      允许"寂静"、"湿气"、"霉味"、"藤蔓"、"油膜"、"扭曲"、"陈旧"、
      "土味"、"青苔"、"风化"、"低温的金属"、"风停"、"袖口"等具象词。
      避免网络用语、避免成语堆叠、避免现代心理学术语。
    metaphor_palette:
      - 旧衣物的褶皱与汗渍——藏起一种不肯散去的气味
      - 油膜在水面上漂出的虹色——美得不像活物
      - 木地板上的旧水渍——干了又湿,湿了又干
      - 倒吊的人形或物件——像在用错误的方向重力
      - 风铃在没有风的时候自己响——节奏不像风的节奏
      - 苍蝇盯着空气中某一点——你看不见的那一点
      - 老照片里多出来的一只手——指向画框之外
    reference_works:
      - 三津田信三《厌魅》系列
      - 中川翔子编年体的乡土怪谈
      - 黑泽清《回路》的低温电子噪声
    sample_paragraph_md: |
      你睁开眼,眼前是陌生的天花板。
      玻璃支离破碎,被风吹动的窗帘也残破不堪。
      顺着视线望去,在窗沿上有什么白色的东西,紧紧抓着窗户的边缘。
      那是,一只脚的脚尖。

