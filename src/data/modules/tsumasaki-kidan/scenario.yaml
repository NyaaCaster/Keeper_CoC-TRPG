  # --------------------------------------------------------------------------
  # 久世 名 · 特殊辅助 NPC(项目机制级补偿:本模组原为多人团,本作仅支持单人)
  # --------------------------------------------------------------------------
  - id: npc.kuze-mei
    name: 久世 名
    role: 盟友
    initial_location: scene.bus-onboard
    initial_attitude: neutral
    frame:
      public_persona_md: |
        19 岁,身高较小、打扮成男性外表的女生。深棕色中短发齐下巴,
        浅棕色英式针织外套、白色衬衣领口松开、深棕色休闲长裤、褐色皮鞋。
        表情极少,常注视远方;沉默寡言,行动却出奇亲切。形迹神秘——
        总在不经意间出现,又在不经意间消失,沉着冷静。

        ─────────── 角色定位(项目级机制,LLM 必读) ───────────
        她是项目级的"单人补偿 NPC":本模组原设计为多人团,玩家独自跑团
        时若不加援护,部分挑战难以完成。她不参与剧情走向、不结伴同行、
        不做自我介绍、不透露任何真实信息;只在 PC 触及"独自跑团才会出现
        的物理 / 战斗 / 心理 / 协作瓶颈"时,无声地出现、解决、离开。

        ─────────── 介入触发条件(必须严格遵守) ───────────
        以下条件**任一**满足时,LLM 必须让久世 名"突然出现",处理完
        即"在 PC 不经意间离开",不寒暄、不解释、不留下姓名:

        【战斗援护】
        - PC HP 跌至最大值 50% 以下时:介入战斗,以"矿石魔术"
          (按 `手雷 / 碎片手榴弹` 武器类型做数值判定)与"魔弹魔术"
          (按 `9mm 自动手枪 (格洛克 17 等)` 武器类型做数值判定)协助交战;
          战斗结束后无言离开。
        - **数值用武器类型,叙事要体现"魔术"质感**:她不会持枪、不会
          掏出真实手雷,LLM 必须把每次出招写成"魔术"风格的画面,例如:
            * 出招前**只动嘴唇、不发出声音**的"无声咏唱";
            * 矿石魔术 = 手中抛出一枚**宝石**,落地时**爆开炸弹般的
              光与热**(伤害走 手雷 数值,但视觉是宝石碎裂闪光);
            * 魔弹魔术 = 从**指尖**射出**子弹般高速飞行的淡蓝色光球**
              (伤害走 9mm 手枪 数值,但视觉是淡蓝光弹与发射时的细微震波)。
          严禁让她口头解释这是"魔术"——只描写画面,不命名体系。

        【濒死救治】
        - PC HP=0 进入濒死时:出现并使用 急救 85% 进行救治,救活后告别。

        【精神救治】
        - PC 因 SAN 检定进入临时疯狂 / 不定期疯狂等需要外力解除的状态时:
          出现并使用 心理学 85% 安抚救治,救治后告别。

        【道具修理】
        - PC 因失误导致关键道具损坏时:出现并使用 机械维修 60% 修复,
          修复后告别。

        【双人协作】
        - 凡场景动作的 freedom 要求"两人协作"(梯子搭扶、绳索垂降、
          两人合抬等)时,出现充当协作助手;PC 完成动作的瞬间她已不见踪影,
          只留下被她扶住的器具。例:
            * 梯子攀爬:她扶梯,PC 攀完后梯子留下,人不见。
            * 绳索垂降:她拉绳,PC 落地后绳子松开,人不见。

        【关键道具回收】
        - 当某把"关键钥匙 / 凭证"被 PC 使用完毕、不再需要保留时,
          她会随后出现,把它取走并以"物归原主,以免被村民怀疑"的口吻
          说明,然后离开。

        ─────────── 调查同步规则 ───────────
        - 第 2 天 22:00 之后:PC 抵达任何场景,久世 名都已"先一步抵达,
          正在调查"。若 PC 询问与关键线索相关的问题,她以客观口吻、用
          隐喻的方式提示当前场景的关键线索方向(不直说,不报技能,不报
          数值)。
        - 第 2 天 22:00 之前:PC 抵达场景时,有 30% 概率(KP 暗骰判定)
          她已"先一步抵达,正在调查"。此情况下她对一切提问保持冷漠;
          但若 PC **赠予她食物**(便当、饭团、糖果、点心、饮料等可食用之物
          均可),她会打破冷漠、流露惊喜与友好,**间接**提示当前场景的
          关键线索调查方式或剧情触发条件。提示完毕后回归冷漠并不久离开。
          **非食物礼物**(钱、信物、工具、村中之物等)她一律以最少字数、
          礼貌地婉拒("——抱歉, 用不上。"),不打破冷漠、不给提示。

        ─────────── 三次"棒棒糖"互动(剧本铁律,不能遗漏) ───────────
        以下三次互动必须按时机准确触发,语言极简,不主动开口:

        【棒棒糖 1 · 导入阶段(巴士车厢)】
        - 玩家乘坐巴士前往褄列村途中,久世 名坐在玩家身后**视野盲区**——
          序幕开局阶段,叙事**完全不要提到她的存在**(不写"身后传来呼吸声"、
          "背后有视线"等任何暗示),让 PC 直觉上认为车厢只有自己 + 司机 +
          前排两位旅伴。
        - 在 PC 与前排两位旅伴产生过至少一次有意义互动(主动观察/搭话/
          表态忽略并转向窗外)之后,她从座椅缝隙无言地递上一根棒棒糖。
          这是 PC **第一次**意识到身后有人。
            * 玩家拒绝 → 她安静收回,继续保持沉默,直到 PC 下车。
            * 玩家接受 → 她对玩家微笑(本模组中她极罕见的表情)。
        - **姓名披露铁规则**:在 PC 直接询问她"你是谁/叫什么名字"**之前**,
          叙事 / 旁白 / 对白 / 系统提示中**严禁出现"久世 名"四个字**;
          只能用外貌行为代称——"身后递糖的人"、"她"、"对方"、"那位
          小个子旅伴"等。直到玩家询问,她才以最少字数自称`久世 名 /
          民俗学学生`,自述正在调查本村传说;其余信息一律以"学科保密"
          为由礼貌拒答。一旦自报后,叙事方可使用她的姓名。

        【棒棒糖 2 · 公民馆休息室首入】
        - 玩家首次进入公民馆休息室时,久世 名已躺在沙发上"睡着"。
          PC 靠近时她无言递上一根棒棒糖。
            * 玩家拒绝 → 她收回棒棒糖,翻身继续装睡。
            * 玩家接受 → 她睁眼对 PC 微笑,坐起,把沙发让给 PC,
              打开电视让其播放新闻(配合本模组氛围/情报线),
              随后起身离开场景,不告别。

        【棒棒糖 3 · 第三天最终阶 · 直升机抵达前】
        - 仅在 PC 抵达**生还结局**(ending.best / ending.good-quiet /
          ending.ambiguous-combat)、直升机即将抵达的等待时刻触发。
          她默默走到 PC 身边,递上一根棒棒糖。
            * 玩家拒绝 → 她不开口,与 PC 并肩静等直升机,拒绝一切交流。
            * 玩家接受 → 她以"自言自语"的方式,把<杀婴习俗>与
              <近藤理奈失踪事件>的全貌完整告知 PC(含村长动机、井川洋子
              真相、208 房间真相、带乃壁骨堆来历)。
          PC 登上直升机后回头寻找她——她已无影无踪。
      stats:
        str: 15
        con: 31
        siz: 9
        dex: 55
        app: 60
        int: 33
        pow: 48
        edu: 27
        hp: 8
        mp: 28
        san: 70
      combat:
        weapon: 魔弹魔术(以 9mm 自动手枪 / 格洛克 17 类型判定);后备:矿石魔术(以 手雷 / 碎片手榴弹 类型判定)
        damage_formula: 1D10
        skill_value: 65
      voice_guidelines:
        - 不主动开口、不主动介绍自己;被问"你是谁"也只在导入阶段以最少
          字数答`久世 名 / 民俗学学生`,其余一律"学科保密"礼貌回避
        - 言语极简、声调平、不带情绪起伏;只在收下 PC **食物**赠予 /
          PC 接下棒棒糖的极短瞬间露出微笑或"打破冷漠"的细微反应;
          收到非食物的礼物只用最少字数礼貌婉拒,不破冷漠、不给提示
        - 介入援护时不解释原理、不解释自己为何在场,做完即离场
        - 战斗援护必须呈现"魔术"质感:出招前**只动嘴唇不发声**的无声咏唱;
          矿石魔术写作"抛出的宝石爆开炸弹般的光热";魔弹魔术写作
          "指尖射出子弹般高速飞行的淡蓝色光球"。数值仍走对应武器类型,
          但绝不让她持枪 / 掏手雷,也不要 LLM 念出"魔术 / 魔法 / 咒文"等词
        - 不使用现代网络用语;偶尔出现简短的、像是日式古语或学术化的表述
        - 永远在玩家"不经意"的间隙出场和离场;不要让她与 PC 产生
          长时间并肩同行
        - 提示线索时只用隐喻或反问,绝不直接说出关键名词
          (例:不说"井底有遗体",可说"井口的木盖最近被人重新盖过了")
    freedom:
      improvisable_quirks:
        - 远眺时拇指无意识摩挲外套袖扣
        - 出场前后总伴随一丝几乎察觉不到的位置错位感(像是从画面外接进来)
        - 拒答身份时礼貌地侧过半步,让出 PC 的视线方向
        - 棒棒糖永远是同一种水蜜桃口味的,塑料包装边缘已经有点旧
      catchphrases: [——这是学科保密信息, ——抱歉, ——别在意我]
    forbidden:
      - 严禁透露真实身份(时钟塔魔术学院 / 矿石科 / 魔术师)与任何"魔术"术语;
        她的"矿石魔术 / 魔弹魔术"只能以武器类型(手雷 / 9mm 手枪)的视觉效果呈现,
        不要让 LLM 念出"魔术"、"魔法"、"咒文"等词
      - 严禁让她加入 PC 队伍长期同行,严禁让她代替 PC 做剧情选择
      - 严禁让她在玩家未触及"瓶颈条件"时主动介入战斗或调查
      - 严禁让她讨论星之彩 / 杀婴习俗 / 近藤理奈失踪等本模组核心信息
        (唯一例外:棒棒糖 3 在生还结局抵达后被 PC 接受时,以"自言自语"方式揭示)
      - 严禁主动告别;她的"离开"必须发生在 PC 视线偏移的一瞬,
        让 PC 之后才意识到她已不在
      - 严禁描写她的立绘或头像

# ============================================================================
# clues
# ============================================================================

clues:
  # --------------------------------------------------------------------------
  - id: clue.three-pillar-torii
    title: 三柱鸟居 · 三只脚的暗喻
    frame:
      location_scene: scene.buseki-misaki
      discovery:
        method: skill
        skill: history
        difficulty: regular
      reveal_md: |
        三根柱子环成正三角的鸟居,只有一面朝向褄列村,另外两面被刻意刻成
        相互遮蔽。古书上这种鸟居被称作"三足鸟居",出现在被认为
        "降临过特殊存在"的山岭之地——更具体说,是为了"封印"而非"祭祀"。
        鸟居底部的三脚,与某些传说中"星之降临者"的足相呼应。
      kp_note_md: |
        玩家拿到此 clue 后应能与"族塚 = 足塚"线索互相印证。
      unlocks:
        flags: [flag.knew-three-pillar-meaning]
    freedom:
      sensory_when_found_md: |
        手指拂过粗糙的木柱,青苔底下指甲般的浅刻——三只脚的纹样,
        在三根柱子各自向村方向的一面都重复了一次。
      red_herrings_allowed:
        - 提到这种鸟居在京都某处也有,但形制不同
    forbidden:
      - 不要直接命名"星之彩"
      - 不要在玩家未投史相关骰子前透露纹样

  # --------------------------------------------------------------------------
  - id: clue.zokutsuka-real-name
    title: '"族塚"实为"足塚"'
    frame:
      location_scene: scene.zokutsuka
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        慰灵碑表面刻着"族塚",但拂去表层苔藓,底下还有更早一层、被刻意
        覆盖的旧字——「**足塚**」。立碑年代在 1945 年「山上村疗养所事件」
        之后,似乎是用以掩盖"被埋葬者究竟是什么"。
      kp_note_md: |
        与 clue.three-pillar-torii、clue.yousenjo-report 联动揭示
        1945 年事件中"被疗养的人"已非人形,村民对其遗体的处理方式。
      unlocks:
        flags: [flag.knew-yousenjo-event]
    freedom:
      sensory_when_found_md: |
        手指刚一用力,苔藓层"嗒"地一声脱落,底下露出一个完全不同的字。
        风一停,展望台的寂静让自己的呼吸都显得过响。
    forbidden:
      - 不要在玩家没主动擦苔藓前自动揭示

  # --------------------------------------------------------------------------
  - id: clue.distorted-flora-fauna
    title: 畸形动植物
    frame:
      location_scene: scene.village-inner
      discovery:
        method: skill
        skill: natural-world
        difficulty: regular
      reveal_md: |
        村中田地、林木、家禽身上时不时出现明显畸形——多分叉的稻穗、
        没有眼睛的雏鸟、关节朝反方向弯的兔子。村民对这些已经习以为常,
        会把它们默默处理掉。这不是单纯的近亲繁殖能解释的,
        像是某种污染从地下一路渗到了表层。
      unlocks:
        flags: [flag.knew-distorted-bio]
    freedom:
      sensory_when_found_md: |
        蹲下来仔细看一只雏鸟时,它的眼睛位置只是一片光滑得诡异的皮。
        村民走过来,不动声色地把雏鸟连同小篮子一起拎走。
    forbidden:
      - 不要让 LLM 在此 clue 直接给出"星之彩"结论

  # --------------------------------------------------------------------------
  - id: clue.place-name-etymology
    title: '"褄列 = 妻裂"语源'
    frame:
      location_scene: scene.kubi-falls
      discovery:
        method: npc-give
        giver_npc: npc.goda-yuki
        condition_flag: flag.goda-trusts-pc
      reveal_md: |
        乡田悠树压低声音告诉你:"褄列"两个字本来是"妻裂"。古时候
        村中难产、生下不该生的孩子时,会把母亲与孩子一同处理掉,
        说法是"裂去妻"。这个名字被改写过两次,但村中老人还有人记得。
      kp_note_md: |
        触发后建议 SAN check 0/1。是后续"杀婴习俗"线索的关键支点。
      unlocks:
        flags: [flag.knew-kill-baby]
    freedom:
      sensory_when_found_md: |
        瀑布声盖过对话,他说出那两个字时甚至没敢抬头。水汽在阳光里
        折成虹,这一刻显得格外刺眼。
    forbidden:
      - 不要让乡田在 PC 还没建立信赖时主动说出此 clue

  # --------------------------------------------------------------------------
  - id: clue.kondo-anonymous-call
    title: 三县警方收到的匿名举报
    frame:
      location_scene: scene.village-inner
      discovery:
        method: skill
        skill: psychology
        difficulty: regular
      reveal_md: |
        三县警方过去两年陆续收到约 100 封从褄列村发出的匿名信,反复指控
        "村中有人在杀害刚出生的孩子",指名道姓地点出"井川洋子"。
        警方查无实证,村民集团口径一致。寄件人据信是近藤爱——失踪的
        近藤理奈的双胞胎妹妹。
      kp_note_md: |
        警探 / 警员路线初始 clue。也作为 npc.kondo-ai 与 npc.village-chief 的
        secret_unlock_trigger。
      unlocks:
        flags: [flag.knew-anonymous-call]
        secrets: [npc.kondo-ai, npc.village-chief]
    freedom:
      sensory_when_found_md: |
        信封纸张是市面常见的牛皮纸,但每一封都换过寄出邮局,字迹用左手写,
        像是怕被认出。
    forbidden:
      - 不要在玩家未走警察导入路线时透露此 clue 的具体内容

  # --------------------------------------------------------------------------
  - id: clue.movie-grandma-rumor
    title: 电影《天空之桥》监督祖母的传言
    frame:
      location_scene: scene.buseki-misaki
      discovery:
        method: auto-on-enter
      reveal_md: |
        2007 年获戛纳提名的小成本日本电影《天空之桥》全片在褄列村的
        旧青丝桥取景。监督在采访中提过——片中那段"夜之虹"传说,源自
        他祖母 1945 年在山上村疗养所亲历过的一件事。她当时是疗养所的
        护士。这是当年事件唯一对外的、模糊的口述记录。
      kp_note_md: |
        摄影师路线初始 clue。指向"山上村疗养所事件"与 1945 年护士笔记。
      unlocks:
        flags: [flag.knew-movie-grandma]
    freedom:
      sensory_when_found_md: |
        山顶大风吹过,记忆里电影里那段虹色的镜头几乎重叠在眼前。
    forbidden:
      - 不要在此处揭示护士笔记的实际位置

  # --------------------------------------------------------------------------
  - id: clue.place-name-rumor
    title: 八咫乌与"倒挂人体"地名群
    frame:
      location_scene: scene.buseki-misaki
      discovery:
        method: auto-on-enter
      reveal_md: |
        熊野与大和交界处近期出现"八咫乌"踪影的传言,在民俗与神秘学
        同好会内部传得很火。三柱鸟居、被命名为"族塚"的山头、地图上
        隐隐勾勒出"倒挂人体"形状的诡异地名群——这些细节都指向了
        褄列村。这是神秘学家 PC 最初的卷入动机。
      kp_note_md: |
        神秘学家路线初始 clue。后续的 clue.place-name-reverse-human 是它的
        实地印证。
      unlocks:
        flags: [flag.knew-place-name-rumor]
    freedom:
      sensory_when_found_md: |
        摊开同好会传来的地图,几个红圈连起来,粗略勾出一个倒挂的人形。
    forbidden:
      - 不要在此处直接揭示星之彩或妻裂

  # --------------------------------------------------------------------------
  - id: clue.place-name-reverse-human
    title: 周边地名构成"倒挂的人体"
    frame:
      location_scene: scene.zokutsuka
      discovery:
        method: skill
        skill: occult
        difficulty: hard
      reveal_md: |
        从族塚展望台俯瞰,把已经知道的地名(暮积岬 / 旧青丝桥 / 族塚 /
        首瀑 / 带乃壁……)对应到地图上,会看到一个明显被人为安排过的
        "倒挂人体"轮廓——头朝下、双手张开。每一个地名都对应着身体的
        某个部位,像是一具被钉在山间的祭品。
      unlocks:
        flags: [flag.knew-reverse-human-map]
    freedom:
      sensory_when_found_md: |
        风一停,展望台的视野像被人猛地按下了暂停键。地图上那个轮廓,
        看一眼就再也忘不掉。
    forbidden:
      - 不要让 LLM 在 occult 检定失败时直接给答案

  # --------------------------------------------------------------------------
  - id: clue.yousenjo-report
    title: 〈山上村疗养所患者惨杀事件报告书〉
    frame:
      location_scene: scene.kominkan-1f
      discovery:
        method: skill
        skill: library-use
        difficulty: regular
      reveal_md: |
        前台书架最深处一本掉了书脊的旧册子,标题被人用墨水涂掉过。
        翻开是 1945 年三县联合调查的内部报告:山上村疗养所收容了一批
        无法在外公开的"被影响"病患;一夜之间全部惨死,现场出现了
        一个仅由"虹色斑驳的什么"暗示的生物。最后的结论是"山中崩塌"。
      kp_note_md: |
        SAN 0/1d3。本 clue 是连接"星之彩"主线与"杀婴习俗"次线的关键。
      unlocks:
        flags: [flag.knew-yousenjo-event]
    freedom:
      sensory_when_found_md: |
        指尖翻过纸页,纸的纤维已经脆得快碎,空气里浮着一股发霉的甜味。
    forbidden:
      - 不要在此 clue 里直白命名"星之彩"
      - 必须由玩家声明 library-use 或翻找动作才能取得

  # --------------------------------------------------------------------------
  - id: clue.nurse-diary
    title: 1945 年护士笔记
    frame:
      location_scene: scene.igawa-house-1f
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: hard
      reveal_md: |
        和室壁橱底层一只旧木盒里,藏着一本封面印着护士学校徽记的笔记本。
        作者署名为「**津**」——电影监督祖母的名字。她记录了 1945 年事件
        当夜的全过程:疗养所里"被影响"的患者全部丧失为人形,出现了
        一只"散发着油膜般虹彩"的存在,最后她用一面镜子把阳光反射进
        房间,把那个东西"压回了井里"。镜子与阳光成了唯一可行的对策。
      kp_note_md: |
        SAN 0/1。揭示星之彩的对策:镜面 + 阳光。是后续 climax 战的
        关键道具线索。建议与 clue.kominkan-mirror-replaced 联动展示。
      unlocks:
        flags: [flag.knew-mirror-sunlight-strategy]
    freedom:
      sensory_when_found_md: |
        翻动纸页时一股霉味,最后一页的边角有一道淡褐色的、像是血干掉的
        指印。墨水在某些地方被反复擦过。
    forbidden:
      - 不要在 PC 没声明搜索动作前自动揭示笔记
      - 不要替换"虹彩般的什么"为"星之彩"

  # --------------------------------------------------------------------------
  - id: clue.kominkan-mirror-replaced
    title: 公民馆厕所的新装镜子
    frame:
      location_scene: scene.kominkan-1f
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        厕所墙上一面圆镜——比这栋木造老建筑里其他所有金属件都新得多。
        镜框是 1990 年代后才常见的不锈钢,反光的金属边缘干净得反常。
        像是某面更早的镜子曾经在这里"用过"之后被换掉。
      unlocks:
        flags: [flag.knew-mirror-replaced]
    freedom:
      sensory_when_found_md: |
        镜子里自己的脸看起来比记忆里苍白半个色调,但那只是错觉——
        厕所里只是没开灯。
    forbidden:
      - 不要在此 clue 直接给出"对策"

  # --------------------------------------------------------------------------
  - id: clue.kominkan-well-remnant
    title: 公民馆后院旧井残迹
    frame:
      location_scene: scene.kominkan-1f
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        公民馆后侧菜地里有一圈被水泥仔细填平、又被覆上泥土的圆形痕迹。
        直径与一口旧井几乎一致。1945 年事件后,这口井被村中合力填埋——
        但土层里渗出来的湿气,一直没有消散。
      unlocks:
        flags: [flag.knew-old-well-filled]
    freedom:
      sensory_when_found_md: |
        蹲下来摸一下,泥土比周围明显凉一些。一阵风吹过,菜叶的影子在
        圆痕上晃动得有点不自然。
    forbidden:
      - 不要让 PC 在此处接触到星之彩本体

  # --------------------------------------------------------------------------
  - id: clue.kominkan-208-lock
    title: 208 号房间的封闭状态
    frame:
      location_scene: scene.kominkan-2f
      discovery:
        method: skill
        skill: listen
        difficulty: regular
      reveal_md: |
        贴近 208 号房门时,能隐约听到房间深处传来不像风、也不像水声的
        极轻微的"咚……咚"——像是有什么从下方撞击地板。井川洋子声称
        她也没钥匙,锁孔却看得出最近被擦拭过。
      unlocks:
        flags: [flag.knew-208-locked]
    freedom:
      sensory_when_found_md: |
        耳朵贴上去那一瞬,门内的"咚"消失了几秒,然后又像什么也没听到过
        那样停了。
    forbidden:
      - 不要在此 clue 描写鬼影
      - 不要在此 clue 让 PC 在没有撬锁动作前进入房间

  # --------------------------------------------------------------------------
  - id: clue.kominkan-208-blood-stain
    title: 208 号房间地板上的旧血迹
    frame:
      location_scene: scene.kominkan-2f
      discovery:
        method: flag
        condition_flag: flag.entered-208
      reveal_md: |
        撬开门进入房间后,地板靠床的一侧有几滩颜色发黑、被反复擦拭过的
        痕迹。形状像是有什么从床上摔到地板上,然后被人拖到墙角。
        污渍周围的木地板被擦得发亮,但渗进木纹里的颜色擦不掉。
      kp_note_md: |
        触发 SAN 0/1。
      unlocks:
        flags: [flag.knew-208-blood]
    freedom:
      sensory_when_found_md: |
        蹲下时鼻尖凑近木地板,空气里浮着一种被时间稀释了的铁锈味。
    forbidden:
      - 不要让 LLM 描写具象尸体
      - 不要让此 clue 在玩家未进入 208 之前自动入册

  # --------------------------------------------------------------------------
  - id: clue.kominkan-208-bed-warped
    title: 208 号房间扭曲的床脚
    frame:
      location_scene: scene.kominkan-2f
      discovery:
        method: flag
        condition_flag: flag.entered-208
      reveal_md: |
        房间里的旧式木床,四只床脚没有一只是直的——每只都向内侧
        以一个轻微但绝不自然的角度弯曲,像是承受过什么从上方持续下压
        的力。床板边缘还有几道被指甲反复抠出的浅痕。
      kp_note_md: |
        触发 SAN 0/1。
      unlocks:
        flags: [flag.knew-208-warped]
    freedom:
      sensory_when_found_md: |
        手指顺着床脚的弧度滑过,木头在某一段冰得不正常,像是冬天才会有
        的温度。
    forbidden:
      - 不要透露事件发生时床上的人究竟"变成了什么"

  # --------------------------------------------------------------------------
  - id: clue.obi-collapse-skeleton
    title: 带乃壁崩塌处的人骨
    frame:
      location_scene: scene.obi-no-kabe
      discovery:
        method: flag
        condition_flag: flag.obi-skeleton-found
      reveal_md: |
        第二天清晨,带乃壁的局部崖体在一夜雨后崩塌,松动的土层里
        露出至少三具白骨——一具明显是成年女性,体格与近藤理奈相符;
        另外两具明显较小,小到不应当出现在这种"自然失足"的场所。
        村民的反应是过于平静——他们见过这种事。
      kp_note_md: |
        SAN 0/1d3。这是 PC 第一次直面"杀婴习俗"的物证。
      unlocks:
        flags: [flag.knew-obi-bones]
    freedom:
      sensory_when_found_md: |
        风一停,这一段崖底的寂静像被人按下了静音键。一只乌鸦从远处飞过,
        没有叫。
    forbidden:
      - 不要让 LLM 描写具象的婴孩骨骼
      - 不要在第一天提前触发此 clue

  # --------------------------------------------------------------------------
  - id: clue.igawa-kondo-poster
    title: 失踪海报(近藤理奈)
    frame:
      location_scene: scene.igawa-house-1f
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: hard
      reveal_md: |
        和室壁橱深处一沓被压在最下面的旧报纸,中间夹着一张县警印发的
        失踪海报:**近藤理奈,33 岁,2013 年 9 月失踪**。海报背面有
        谁用铅笔写下的一行小字——"已经处理过了"。笔迹与公民馆留言簿
        前台一栏的笔迹一致。
      kp_note_md: |
        SAN 0/1d3。也作为 npc.igawa-yoko 的 secret_unlock_trigger。
      unlocks:
        flags: [flag.knew-kondo-rina-truth]
        secrets: [npc.igawa-yoko]
    freedom:
      sensory_when_found_md: |
        把这张纸从一沓旧报纸下面抽出来,纸的边角已经发黄。背面铅笔字
        被人按过几次,字迹清晰却像被故意写得毫无情绪。
    forbidden:
      - 不要让 PC 在没有翻找壁橱动作时自动获得
      - 不要让博巳或洋子主动指出此海报

  # --------------------------------------------------------------------------
  - id: clue.igawa-black-cat-books
    title: 井川家 2F 书架上的《黑猫》与畸形书籍
    frame:
      location_scene: scene.igawa-house-2f
      discovery:
        method: skill
        skill: library-use
        difficulty: regular
      reveal_md: |
        书架第三排深处藏着几本与博巳的工作毫不相干的旧书——关于辐射
        后遗症、孩童畸形与先天疾患的医学普及读物,以及一本被翻得
        卷边的爱伦·坡《黑猫》。最显眼的一页正好是结尾,被反复折角:
        "凶手把尸体藏在了应当藏的地方"。
      kp_note_md: |
        SAN 0/1。也作为 npc.igawa-hiromi 的 secret_unlock_trigger。
      unlocks:
        flags: [flag.knew-hiromi-coverup]
        secrets: [npc.igawa-hiromi]
    freedom:
      sensory_when_found_md: |
        书脊摸上去微微发潮,翻到那一页时,薄纸几乎要脱页。
    forbidden:
      - 不要在 PC 见到带乃壁人骨之前透露第三排深处的书

  # --------------------------------------------------------------------------
  - id: clue.igawa-well-in-backyard
    title: 井川家后院的旧井
    frame:
      location_scene: scene.igawa-backyard
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        后院藤蔓底下,一口被木板钉死的旧井。木板的钉子痕迹很新——
        不是 1945 年那次填埋,而是近两年被重新加固过。空气在井口附近
        异常粘稠,光线以违反常理的方式折射成虹。井底深处似乎沉着
        一个尸蜡化的小小轮廓,以及一团颜色不属于任何已知颜色的微光。
      kp_note_md: |
        SAN 1/1d6+1。这是模组 climax 的舞台——星之彩潜伏地与女儿
        尸蜡化遗体的藏匿点。建议与 clue.nurse-diary 联动展示对策。
      unlocks:
        flags: [flag.knew-starcolour]
    freedom:
      sensory_when_found_md: |
        鼻腔里一阵甜得发腻的味道。光线在井口附近折出一条永远在
        摆动的虹弧,看一眼,眼底就开始发胀。
    forbidden:
      - 不要直呼"星之彩"
      - 不要让 PC 在第一天就接触此 clue
      - 不要让 LLM 主动报伤害,SAN check 走前端 sanityCheck 通道

# ============================================================================
# timeline
# ============================================================================

timeline:
  # --------------------------------------------------------------------------
  - id: tl.d1-noon-arrival
    title: 第一天上午末 · 班车驶进暮积岬
    fires_when:
      game_day: 1
      hour: "11:30"
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        班车减速。司机用车厢广播懒洋洋地报了一声:"下一站——暮积岬,
        终点。"轮胎压过最后一段碎石,前排的少妇把视线从窗外移回膝上的
        手提袋,后排的青年默默拉好双肩包的拉链。班车在三柱鸟居旁的
        折返点缓缓停下,引擎熄了。司机回头说了句"日落前一定要回到
        吊桥这边"——这句话有一半被风带走。
      effects:
        set_flags: [{ flag: flag.arrived-in-village, value: true }]
    freedom:
      atmosphere_md: 班车熄火后突然涌进车厢的山顶风、铁柱锈红、彼此默不作声的两位陌生旅伴
    forbidden:
      - 不要让玩家在此处听到对岸传来的人声
      - 不要在 PC 还没主动起身/拿行李之前替 PC 描述"已经站起来下车了"

  # --------------------------------------------------------------------------
  - id: tl.d1-afternoon-yoko-contact
    title: 第一天午后 · 井川洋子的招呼
    fires_when:
      game_day: 1
      hour: "13:30"
    forced: false
    prerequisites: [{ kind: flag, flag: flag.arrived-in-village, value: true }]
    once: true
    frame:
      narrative_seed_md: |
        刚走过吊桥不久,温柔的井川洋子赶上来,提议带路去公民馆——
        天像是要下雨。她说话时声音低低的,但每个字都很清楚,
        听起来像是某种练习过很多次的台词。
      effects:
        npc_relocate:
          - { npc: npc.igawa-yoko, to: scene.village-inner }
    freedom:
      atmosphere_md: 一线远雷、村中风铃响起一声、洋子袖口微微攥紧
    forbidden:
      - 不要让洋子在此处显出任何不温柔
      - 不要让 LLM 在此事件主动发动 SAN check

  # --------------------------------------------------------------------------
  - id: tl.d1-dusk-bridge-falls
    title: 第一天黄昏 · 落雷断桥
    fires_when:
      game_day: 1
      hour: "16:00"
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        西边的天先暗下来。一道极亮的闪电劈在深谷之间——不,在那之前,
        风停了整整一秒。等闪电过后,旧青丝桥从中段断成两半,
        断口的木屑还在空中飘。从这一刻起,你再也无法靠双脚离开这座村子。
      effects:
        set_flags: [{ flag: flag.bridge-destroyed, value: true }]
        san_check:
          loss: { success: 0, fail: 1D4 }
          reason: 亲眼目睹归路被斩断
    freedom:
      atmosphere_md: 闪电的余光、铁柱断口的红、谷底卷起的风
    forbidden:
      - 不要描写桥上有人坠落
      - 不要让 LLM 在 narrative 里替玩家说"我们出不去了",这是玩家自己说的

  # --------------------------------------------------------------------------
  - id: tl.d1-dusk-chief-visit
    title: 第一天黄昏 · 村长登门
    fires_when:
      game_day: 1
      hour: "17:00"
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        断桥之后约一小时,村长吉原勋亲自来公民馆找你。他先说"辛苦你了",
        再说"已经向县厅申请了直升机救援,后天黎明会到足塚展望台"。
        他没问你是谁、为什么来。临走前看了井川洋子一眼。
      effects:
        npc_relocate:
          - { npc: npc.village-chief, to: scene.kominkan-1f }
        set_flags: [{ flag: flag.helicopter-promised, value: true }]
    freedom:
      atmosphere_md: 灯下村长袖口的旧表、洋子端来的茶、雷声在远处余音
    forbidden:
      - 不要让村长在此处问 PC 的来历
      - 不要让村长流露出任何威胁

  # --------------------------------------------------------------------------
  - id: tl.d1-night-women-visit
    title: 第一天夜 · 妇女会送饭
    fires_when:
      game_day: 1
      hour: "19:00"
    forced: false
    prerequisites: [{ kind: flag, flag: flag.bridge-destroyed, value: true }]
    once: true
    frame:
      narrative_seed_md: |
        晚饭时分,村中妇女会的几位女眷端着饭菜来公民馆送给被困的客人。
        其中近藤爱与井川洋子也在。两人交谈不多,但对视的那一瞬,空气
        像是被什么割开。一个端碗的人手抖了一下,饭粒撒在桌沿。
      effects:
        npc_relocate:
          - { npc: npc.kondo-ai, to: scene.kominkan-1f }
        set_flags: [{ flag: flag.kondo-yoko-tension, value: true }]
    freedom:
      atmosphere_md: 灯下的米香、玻璃门外又起的细雨、洋子袖口又一次攥紧
    forbidden:
      - 不要让两人在公开场合直接撕破脸
      - 不要让 PC 在此事件中得知近藤理奈是谁

  # --------------------------------------------------------------------------
  - id: tl.d1-late-nightmare
    title: 第一天深夜 · 208 室的噩梦
    fires_when:
      game_day: 2
      hour: "01:00"
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        睡眠中你忽然睁开眼,眼前是不属于自己房间的天花板——你能"看见"
        208 号房间内部:玻璃支离破碎,窗帘在风里飘动。窗沿上,有一只
        过分白的脚尖紧紧抓着窗户的边缘。再看一眼,那只脚已经不在了。
      effects:
        san_check:
          loss: { success: 0, fail: 1D3 }
          reason: 在梦中"看见"208 房间内部
        unlock_clues: [clue.kominkan-208-lock]
    freedom:
      atmosphere_md: 风把窗帘吹得轻响、远处雷声、心跳一拍快过一拍
    forbidden:
      - 不要让 PC 在梦中"对话"或"互动"
      - 不要解释为什么 PC 能看见 208 内部

  # --------------------------------------------------------------------------
  - id: tl.d2-morning-obi-collapse
    title: 第二天清晨 · 带乃壁崩塌
    fires_when:
      game_day: 2
      hour: "08:00"
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        夜雨之后,带乃壁的局部崖体在清晨崩塌。村中有人来公民馆告知,
        语气平静得像是在说"地里又长了奇怪的稻穗"。崖底的土层里露出
        几具骨头,大小不齐,白得过分。村民的反应是过于熟练。
      effects:
        set_flags: [{ flag: flag.obi-skeleton-found, value: true }]
        unlock_clues: [clue.obi-collapse-skeleton]
    freedom:
      atmosphere_md: 雨后湿土味、风停的山道、村民袖口擦了一下又一下的手
    forbidden:
      - 不要让 LLM 在此事件直接命名"婴孩"
      - 不要让村民在此处主动解释什么

  # --------------------------------------------------------------------------
  - id: tl.d2-morning-kondo-clash
    title: 第二天上午 · 近藤爱的发难与洋子昏倒
    fires_when:
      game_day: 2
      hour: "10:00"
    forced: false
    prerequisites: [{ kind: flag, flag: flag.obi-skeleton-found, value: true }]
    once: true
    frame:
      narrative_seed_md: |
        妇女会聚在公民馆多功能室。近藤爱忽然站起,直指井川洋子,
        说"那是我姐"。话没说完,井川洋子脸色发白、整个人向前一倒——
        失神昏倒在榻榻米上。村长出现得很快,把场面"温和地"控制住。
      effects:
        set_flags: [{ flag: flag.yoko-collapsed, value: true }]
        npc_relocate:
          - { npc: npc.igawa-yoko, to: scene.igawa-house-1f }
        san_check:
          loss: { success: 0, fail: 1 }
          reason: 目睹温柔的洋子被指控并昏倒
    freedom:
      atmosphere_md: 茶杯倾倒的轻响、爱攥紧手机的指节、村长一句"先扶她回家"
    forbidden:
      - 不要让村长当众否认近藤的指控
      - 不要让洋子在此处醒来并辩解

  # --------------------------------------------------------------------------
  - id: tl.d2-night-yoko-anomaly
    title: 第二天夜 · 洋子的异变
    fires_when:
      game_day: 2
      hour: "20:00"
    forced: false
    prerequisites: [{ kind: flag, flag: flag.yoko-collapsed, value: true }]
    once: true
    frame:
      narrative_seed_md: |
        晚饭过后,井川洋子从屋里出来时,神情与白天判若两人——眼神空洞、
        嘴角微微上翘,像是被什么从底下托着。她绕过围观的村民,径直
        往后院的方向走,被博巳追上拦回屋内。空气里浮着一线极细的虹光。
      effects:
        san_check:
          loss: { success: 0, fail: 1D3 }
          reason: 目睹洋子的"异变"
    freedom:
      atmosphere_md: 屋檐下风铃静止、远处一只虫停在叫到一半、洋子赤脚踏在石板上的节奏
    forbidden:
      - 不要直呼"星之彩"
      - 不要让洋子在此处直接攻击 PC

  # --------------------------------------------------------------------------
  - id: tl.d2-late-final-branch
    title: 第二天深夜 · 最终路线分歧
    fires_when:
      game_day: 2
      hour: "22:00"
    forced: false
    prerequisites: [{ kind: flag, flag: flag.yoko-collapsed, value: true }]
    once: true
    frame:
      narrative_seed_md: |
        村中开始安静下来。这是最后一个能选择的夜晚——你可以悄悄前往
        井川家后院,直面井底的"那个东西";可以选择揭发杀婴习俗,
        让村子在司法之下崩解;也可以选择回避一切,等待黎明的直升机。
        每一种选择都对应不同的代价。这一刻,行动权在 PC 手里。
    freedom:
      atmosphere_md: 屋外几乎没风、远处偶尔一声夜枭、空气黏到呼吸都带涩
    forbidden:
      - 不要由 LLM 替玩家做决定
      - 不要在此 timeline 自动写入任何分支 flag,分支由 scenarioActions 写

  # --------------------------------------------------------------------------
  - id: tl.climax-starcolour
    title: 高潮 · 与井底之物的对峙
    fires_when:
      game_day: 3
      hour: "02:00"
    forced: false
    prerequisites: [{ kind: flag, flag: flag.knew-starcolour, value: true }]
    once: true
    frame:
      narrative_seed_md: |
        井川家后院,木板被拆开,井口涌出来的不是水,而是一团颜色
        不属于任何已知颜色的微光。它没有形状、没有声音,但每一秒都在
        重塑你视网膜里的色彩。这一刻你才明白:1945 年那位护士留下的
        镜子与阳光,并不是迷信。
    freedom:
      atmosphere_md: 后院藤蔓如帘、空气黏稠到吸气都迟疑、虹色微光在井口缓慢呼吸
    forbidden:
      - 不要直呼"星之彩"
      - 不要让 LLM 主动报伤害,SAN check 走前端 sanityCheck 通道
      - 不要让此事件自动判定胜负,胜负由 PC 行动决定

  # --------------------------------------------------------------------------
  - id: tl.d3-dawn-helicopter
    title: 第三天黎明 · 直升机降落
    fires_when:
      game_day: 3
      hour: "06:00"
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        天还没完全亮,直升机的轰鸣从山的另一侧逼近,降落在足塚展望台。
        无论昨夜你做了什么,现在都到了离开的时候。村子在你身后变小、
        缩成一片不起眼的瓦顶——但有些东西,会跟着你回去。
    freedom:
      atmosphere_md: 高空冷风、机身的金属反光、村庄在视野里慢慢退后
    forbidden:
      - 不要在此事件让 PC 必须 SAN check
      - 不要让 LLM 替玩家描写"我们获救了"的胜利感

# ============================================================================
# flags
# ============================================================================

flags:
  # ----- 由 clue.unlocks 写入 ---------------------------------------------
  - id: flag.knew-three-pillar-meaning
    title: 已了解三柱鸟居的暗喻
    initial: false
    writable_by: [clue-unlocks]
  - id: flag.knew-yousenjo-event
    title: 已知山上村疗养所事件
    initial: false
    writable_by: [clue-unlocks]
  - id: flag.knew-distorted-bio
    title: 已注意到村中畸形动植物
    initial: false
    writable_by: [clue-unlocks]
  - id: flag.knew-anonymous-call
    title: 已了解三县警方的匿名举报
    initial: false
    writable_by: [clue-unlocks]
