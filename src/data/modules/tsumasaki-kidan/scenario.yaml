schema_version: 1

# ============================================================================
# meta
# ============================================================================

meta:
  id: tsumasaki-kidan
  title: 褄列奇谈
  era: modern
  language: zh-CN
  difficulty: 高强度
  tags: [日式恐怖, 闭幕村庄, 心理战]
  cover: assets/cover.jpg
  start_time: { game_day: 1, hour: "09:00" }
  synopsis_md: |
    9 月初的山区,你乘大巴抵达一座只能靠吊桥进出的山村——褄列村。
    村民温柔却疏离,孩子的笑声稀薄,木门后总有视线在凝视。
    黄昏过后,雷击落,吊桥断裂,你被困在了这里。
  author_credits_md: |
    原作者:驟雨 / 白雨堂(日本)Rev1.2。中文化译者:麦芽,校对补遗排版:苍叶。
    本项目转写:Keeper_CoC-TRPG。
  recommended_occupations:
    - 警探
    - 警员
    - 私家侦探
    - 记者
    - 摄影师
    - 神秘学家
    - 教授
  recommended: true

# ============================================================================
# hook
# ============================================================================

hook:
  start_scene: scene.bus-onboard
  prologue_md: |
    9 月上旬的早上。一辆开往山区的班车从和歌山发车,沿盘山路向北。
    海拔越升越高,乘客越来越少。中途换乘后,你坐在最后一段山路的
    班车上。视线扫过车厢——你能注意到的旅伴有两位:坐在前排靠窗
    的少妇(面色温柔却有些疲倦)、与坐在你斜前方过道侧的小个子
    青年(沉默,膝上抱着一只略旧的双肩包)。两人各自望着自己那
    一侧的窗外,谁也不和谁说话。

    司机偶尔哼一句模糊的小调,引擎闷在山间发出节奏均匀的低鸣。
    距离山顶**暮积岬**站还有大约半小时车程。你知道,班车在那里
    会折返,你必须在那里下车。山顶之后,通往**褄列村**的唯一通路,
    是横跨深谷的「旧青丝桥」。
  call_to_action_md: |
    沉甸甸的双肩包压在你脚边。窗外杉木林反复闪过,引擎声低得
    像一首催眠曲。你来到褄列村各有理由——也许只是巧合,也许
    并不是。距离暮积岬还剩不到半小时,你可以选择望着窗外发呆,
    也可以打量同车的两位陌生旅伴,看看能不能搭上几句话。
  default_initial_clues: []
  # 多路线导入:每种职业各自携带不同的卷入动机与初始线索。
  # key 与 meta.recommended_occupations 完全对齐(中文名)。
  occupation_variants:
    "警探":
      call_to_action_md: |
        同期的警官最近为一封从褄列村发出的匿名信发愁——信里反复指控村中"有人
        在杀害刚出生的孩子",这样的信件三县警方已经收到过百余次。上头从未
        把它当真,但你的同事拗不过,托你以普通游客身份去村里转转,只看,
        不动手。如果是诬告,就回来一句话;如果是真的——再说。
      initial_clues: [clue.kondo-anonymous-call]
    "警员":
      call_to_action_md: |
        派出所的同事最近为一封从褄列村发出的匿名信发愁——信里反复指控村中"有人
        在杀害刚出生的孩子",三县警方已经收到过百余次。没人当真,但同事拗不过,
        托你以普通游客身份去村里看看。如果是诬告就一句话回来,如果是真的——再说。
      initial_clues: [clue.kondo-anonymous-call]
    "私家侦探":
      call_to_action_md: |
        一位富裕的老妇人来事务所委托:儿子要娶一位姓**乡田**的姑娘,女方家在
        三县交界处的褄列村。老妇人对这门亲事不放心,希望你去暗中调查未来儿媳
        的"家系背景"——她原话是,"那种地方出来的人,血里有什么我得知道。"
        预付金不少。你接了。
      initial_clues: []
    "记者":
      call_to_action_md: |
        报社策划了一个"风评被害"的特辑——那些因为传言而生意凋敝、人口锐减的
        小村庄。你的选题落在了褄列村:据说"自古多畸形作物"、"孩子常常生不下来"。
        编辑给了你两周时间,要的是有温度的人物特写,不是猎奇报道。你决定先去
        看看,再下笔。
      initial_clues: []
    "摄影师":
      call_to_action_md: |
        你是日本电影《天空之桥》的爱好者。这部 2007 年获戛纳提名的小成本作品,
        全片在褄列村的"旧青丝桥"取景。监督的祖母是片中"夜之虹"传说的亲历者。
        你想去那座桥上拍一组属于自己的照片,顺便看看监督笔下的村子,如今是
        什么模样。
      initial_clues: [clue.movie-grandma-rumor]
    "神秘学家":
      call_to_action_md: |
        同好会近日讨论得最多的传闻,是"熊野与大和交界处出现了八咫乌的踪影"。
        三柱鸟居、被命名为"族塚"的山头、地图上隐隐勾勒出"倒挂人体"的诡异
        地名群——这些细节都指向了那座叫**褄列村**的山村。你决定亲自去一趟。
      initial_clues: [clue.place-name-rumor]
    "教授":
      call_to_action_md: |
        你的研究课题恰好需要一份"被现代化遗忘的山村田野样本"。一位民俗学界的
        老朋友给你递了张地图,圈出三县交界的褄列村,附了一句话:"那里是块
        活化石,但我不建议你住下。"你笑了笑,还是去了。
      initial_clues: []

# ============================================================================
# scenes
# ============================================================================

scenes:
  # --------------------------------------------------------------------------
  - id: scene.bus-onboard
    title: 山间班车 · 车厢内
    frame:
      summary_md: |
        最后一段山路上的班车,木质内饰、皮革座椅磨得发亮。引擎声闷而均匀,
        车窗外是反复闪过的杉木林与盘山道。PC 直观能注意到的旅伴只有两位
        ——前排靠窗的少妇(井川洋子,但此刻 PC 还不知道她的名字),与
        斜前方过道侧的小个子青年(乡田悠树,同样此时未自报姓名)。
        实际上 **PC 正后方的座位** 还坐着第三名乘客(久世 名),她身高
        小、体型瘦、动作极轻,坐在 PC 视野盲区里——序幕开局 PC 直观察
        觉不到她的存在,直到她从座椅缝隙递出第一根棒棒糖(棒棒糖 1
        互动),PC 才会真正"发现"她。距离班车折返点**暮积岬**还有约
        30 分钟。这是序幕场景——序幕未结束前,班车不会停,PC 不会下车。
      facts:
        - 班车驶在和歌山以北的盘山道上,引擎低鸣均匀,车厢里其实有 4 名乘客
        - PC 正前方两位旅伴此时尚未自报姓名;PC 也无法从外貌直接判断他们的身份
        - PC 正后方座位还坐着第三名乘客(身高较小、动作极轻),开局处于 PC 视野盲区
        - 距离暮积岬站约 30 分钟车程,司机会在到站前广播"下一站,暮积岬"
        - 车窗手机依然有信号,但不稳定;过桥之后才会彻底失联(此事 PC 暂不知)
      exits:
        - to: scene.buseki-misaki
          condition: free
          label: (司机宣布到站后)在暮积岬下车
      npcs_present: [npc.igawa-yoko, npc.goda-yuki, npc.kuze-mei]
      available_clues: []
    freedom:
      mood_tags: [山道班车的颠簸, 引擎闷鸣, 车窗外不停闪过的杉木]
      sensory_palette:
        sight: 车窗外掠过的杉木林、皮革座椅磨得发亮的光泽、前排少妇侧脸的安静
        sound: 引擎均匀的低鸣、轮胎压过山道的颠簸节拍、司机偶尔哼出的模糊小调
        smell: 旧皮革味、班车空调淡淡的金属凉气、隐隐一点雨前的潮气
        touch: 座椅靠背微微震颤、握扶手的手心被硬塑料硌住的轻微痒
      improvisable_props:
        - 前排少妇随身一只灰布手提袋,看不清里面装了什么
        - 斜前方青年膝上的双肩包补过两次,肩带换过新的
        - 司机仪表台上一枚已经褪色的安全行车护身符
      npc_action_hints:
        npc.igawa-yoko:
          - 这一阶段她不主动开口、不自报姓名、不提及褄列村
          - 若 PC 主动搭话,只用最简短温柔的回应("嗯""是啊"),并把视线移回车窗
          - 不流露任何村中相关信息,也不打听 PC 的身份与目的
          - 给人的整体印象是"礼貌但疲倦",而不是"冷淡"或"防备"
        npc.goda-yuki:
          - 这一阶段他几乎不说话,看到 PC 主动看他时会微微低头避开视线
          - 若 PC 主动搭话,他会简短回答最多一两句,然后把目光重新放回窗外
          - 不主动透露自己来自褄列村,不主动提到祖母或村中事
          - 整体表现是"心事重重的内向年轻人",而不是"敌意"或"鬼祟"
        npc.kuze-mei:
          - >-
            **视野盲区铁规则**:在 PC 主动回头 / 主动注意身后 / 久世递出
            第一根棒棒糖之前,叙事中**完全不要提到她的存在**(不写"身后
            传来呼吸声"、"背后有视线"之类暗示),序幕只允许 PC 感觉车厢
            空旷。
          - >-
            **第一次现身=棒棒糖 1**:在 PC 与前排两位旅伴产生过至少一次
            互动(主动观察、主动搭话、或表态忽略后转向窗外)之后,从 PC
            正后方座椅缝隙安静伸出一只手,递上一根水蜜桃口味的棒棒糖
            ——这是 PC 第一次意识到身后有人。
          - >-
            **姓名披露铁规则**:在 PC 直接询问她"你是谁/叫什么名字"之前,
            叙事、旁白、其他 NPC 对白中**严禁出现"久世 名"四个字**;
            只能用外貌行为代称——"身后递糖的人"、"那位小个子旅伴"、
            "她"、"对方"等。
          - >-
            若 PC 询问身份,她仅以最少字数自称`久世 名 / 民俗学学生`,
            其余信息一律以"学科保密"礼貌回避;此后叙事才允许使用她的
            姓名。
          - 棒棒糖 1 后她回到沉默,继续坐在原位,不主动同 PC 闲谈;PC 下车前她不离座
          - 棒棒糖 1 阶段不要让她展现任何"魔术"、不要让她触及村中事项、不要让她替 PC 做选择
    forbidden:
      - 序幕至少持续到 PC 与前排同车 NPC 之间至少完成一次有意义互动(主动搭话/默默打量/翻看手机查村子等);**班车不会主动到站**,直到 PC 已经把"接下来要做什么"通过言语或动作表态过——避免开局直接拽到山顶
      - 在司机广播"下一站,暮积岬"之前,**禁止**让 PC 下车、禁止描述班车停下、禁止描述 PC 起身整理行李或拿背包
      - 在 PC 与前排两位 NPC 之间还没有任何对话之前,禁止任何一方自报姓名、禁止透露各自的目的地或动机
      - 禁止 NPC 在车上主动谈"褄列村"、"杀婴"、"近藤"、"井川"、"族塚"、"鸟居"等任何村中具体事项
      - 禁止任何超自然或暗示性元素出现在车上(没有怪声、没有窗外异象、没有视线被吸引到莫名物体)——序幕只允许"日常通勤式的疲倦感"
      - >-
        **久世 名 视野盲区**:在 PC 主动回头、或久世递出第一根棒棒糖之前,
        叙事禁止以任何形式提到她的存在(不能写"身后还有别人"、"背后传来
        视线"、"有什么在后排注视你"之类暗示);序幕开局 PC 应当感觉车厢
        只有自己 + 司机 + 前排两位旅伴。
      - >-
        **姓名揭晓铁律**:在 PC 直接询问久世 名的姓名、并听到她以
        `久世 名 / 民俗学学生`自报家门之前,叙事 / 对白 / 旁白 / 系统提示
        中**严禁出现"久世 名"、"久世"或单独的"名"作为人名的写法**;
        只能用"身后递糖的人"、"她"、"对方"、"那位小个子旅伴"等外貌
        行为代称。
      - 禁止司机过早(车程不到 25 分钟前)就广播报站

  # --------------------------------------------------------------------------
  - id: scene.buseki-misaki
    title: 暮积岬村 · 山顶巴士站
    frame:
      summary_md: |
        山脊上一座小到几乎不算"村"的聚落,只剩几户做林业农业的人家,风把云
        吹得贴着地面跑。大巴折返点旁有一座**三柱鸟居**——三根柱子环成正三角,
        其中一面正对着深谷对岸的褄列村,另外两面相互遮蔽。司机说,过了这座桥,
        手机就连不上了。
      facts:
        - 暮积岬村只有林业与农业,没有旅店,通往褄列的唯一手段是「旧青丝桥」
        - 三柱鸟居中只有一面朝向褄列,另外两面被刻意做成相互遮蔽
        - 司机折返时反复叮嘱"日落前一定要回到吊桥这边"
        - 大巴停车点旁有一面写着"褄列村 · 山上村疗养所旧址"的木牌,落款 1968
      exits:
        - to: scene.aoshi-bridge
          condition: free
          label: 走向吊桥入口
      npcs_present: []
      available_clues: [clue.three-pillar-torii]
    freedom:
      mood_tags: [山岭薄雾, 高处的风, 三柱鸟居的静默]
      sensory_palette:
        sight: 远处山影叠成层、鸟居柱身上的青苔、被风揉乱的杉木林
        sound: 大巴开走后的引擎余音、风掠过木牌的低鸣
        smell: 山间湿木味、淡淡的松脂气
        touch: 鸟居木柱粗糙、风从颈后灌进衣领
      improvisable_props:
        - 鸟居底座一只被供奉了一整盒、几乎已经化掉的米菓
        - 木牌反面用红笔涂改过的旧字迹
    forbidden:
      - 不要让玩家在此处听见对岸的人声或哭声
      - 不要直接说三柱鸟居的"三足"暗示了什么,这是后续解谜

  # --------------------------------------------------------------------------
  - id: scene.aoshi-bridge
    title: 旧青丝桥
    frame:
      summary_md: |
        横跨深谷的木板吊桥,两端各立一根锈得发红的铁柱,桥面木板被踩得发亮。
        风从谷底涌上来,桥身有节奏地摇。桥的另一端,是褄列村。**第一天黄昏**
        过后,这座桥会被一道落雷击断,从此没有人能再凭双腿出去。
      facts:
        - 桥长约 60 米,木板间距宽,谷底深不见底
        - 走过去要 5 分钟,中段晃得最厉害
        - 第一天 16:00 前后桥会被落雷击断,自此 PC 与外界物理隔绝
        - 击断后只剩"直升机降落足塚"一条退路
      exits:
        - to: scene.buseki-misaki
          condition: free
          label: 沿原路退回暮积岬
        - to: scene.village-inner
          condition: free
          label: 走过桥进入褄列村
      npcs_present: []
      available_clues: []
    freedom:
      mood_tags: [深谷的风, 木板的嘎吱, 桥那头的沉默]
      sensory_palette:
        sight: 谷底白雾、桥那端朦胧的村轮廓、铁柱上掉漆的红
        sound: 木板间风声、铁链的咯吱、远处看不见的鸟啼
        smell: 谷底涌上来的潮气、铁锈味
        touch: 手心扶过湿润的栏杆,桥面起伏与心跳错位
      improvisable_props:
        - 桥头一束已经枯透的、不知何人供奉的彼岸花
        - 桥中央木板上一道指甲抠出来的浅痕
    forbidden:
      - 不要在第一天黄昏前提前让桥断
      - 不要让玩家在桥上看见任何"具象"的东西,只允许压迫感

  # --------------------------------------------------------------------------
  - id: scene.zokutsuka
    title: 褄列山顶 · 族塚展望台
    frame:
      summary_md: |
        村后山顶一处小小的展望台,中央立着一座旧式慰灵碑,旁边有一座供路人
        歇脚的木凉亭。从这里可以俯瞰整座褄列村,以及更远处隐在云里的"带乃壁"。
        慰灵碑上刻着"族塚"两个字——但若用手指拂去苔藓,会发现底下还有更早的
        刻痕。这里也是直升机的降落点。
      facts:
        - 慰灵碑表面写着"族塚",但拂去苔藓会显露出底下被刻意覆盖的旧字
        - 展望台地势开阔,是村里少数能用无线电的位置
        - 第三天黎明的直升机将降落于此,完成救援
        - 凉亭里供着几束已经发黑的花,说明这里有人定期来祭拜
      exits:
        - to: scene.village-inner
          condition: free
          label: 沿石阶下山回到村内
        - to: scene.obi-no-kabe
          condition: free
          label: 沿山脊向"带乃壁"方向走
      npcs_present: []
      available_clues: [clue.zokutsuka-real-name]
    freedom:
      mood_tags: [高处的视野, 风一停就压抑的寂静]
      sensory_palette:
        sight: 整座村庄像盆地、远处的山缝里飘着不知是云还是烟
        sound: 风在凉亭顶瓦片间的呜呜声、远处一只鸟叫两声就不叫了
        smell: 苔藓与香灰混合的味道
        touch: 慰灵碑表面冰凉、苔藓底下湿润
      improvisable_props:
        - 凉亭里一只被风压在木桌下的小瓷酒杯
        - 慰灵碑底座一道被反复擦拭过的旧痕
    forbidden:
      - 不要替玩家擦去苔藓——必须由玩家明确动作触发
      - 不要在此处提到"杀婴",慰灵碑只是慰灵碑

  # --------------------------------------------------------------------------
  - id: scene.village-inner
    title: 村内 · 田地与杂木林
    frame:
      summary_md: |
        褄列村的中央地带——零星的田、几条石板小路、一片不算大的杂木林,
        几户人家的木屋顺着坡分散排布。村民对外人客气而克制,孩子很少,
        听不到狗吠。田边偶尔能见到长得有点不像样的稻穗或叶片,村民
        会不动声色地把它们折断丢进背篓。
      facts:
        - 村内由几条石板小路串联,各调查点之间步行 3~10 分钟
        - 田地里偶尔出现畸形的稻穗、扭曲的果实,村民视为家常
        - 杂木林深处有一处被废弃的小神社,残破到几乎看不出原貌
        - 村中大约 40 多户,以中老年为主,5 岁以下孩童几乎没有
      exits:
        - to: scene.aoshi-bridge
          condition: free
          label: 朝吊桥方向走(第一天黄昏后变成"看一眼那道断口")
        - to: scene.zokutsuka
          condition: free
          label: 沿山道上山去族塚展望台
        - to: scene.kubi-falls
          condition: free
          label: 顺着溪流向首瀑走
        - to: scene.kominkan-1f
          condition: free
          label: 走向村中央的公民馆
        - to: scene.igawa-house-1f
          condition: free
          label: 走向井川家
      npcs_present: [npc.ikeda-couple, npc.villagers-chorus]
      available_clues: [clue.distorted-flora-fauna]
    freedom:
      mood_tags: [山村的寂静, 微妙的疏离, 视线的余光]
      sensory_palette:
        sight: 黑瓦顶、土黄色墙、被压低的篱笆、田边风吹过的稻穗
        sound: 远处一两声锄头敲石、谁家屋檐下的风铃、几乎听不见的孩童声
        smell: 湿土、柴火灰、远处一线烧落叶的烟
        touch: 石板小路被踩得光滑、走过田埂泥土黏脚
      improvisable_props:
        - 田边一只被人摆正的木桶,里面是被剪掉的畸形稻穗
        - 杂木林某棵树下一只褪色的小鞋,只有左脚那只
      npc_action_hints:
        npc.ikeda-couple: [主动招呼但只问"什么时候走", 端来茶水时会盯着 PC 的眉眼看]
        npc.villagers-chorus: [背对 PC 干活, 走过身边时降下声调]
    forbidden:
      - 不要在此处直接出现"杀婴"或"星之彩"相关的视觉异常
      - 不要让 PC 在白天遭遇任何超自然实体

  # --------------------------------------------------------------------------
  - id: scene.kubi-falls
    title: 首瀑
    frame:
      summary_md: |
        溪流的尽头一处不算高、但水量很足的瀑布。岩壁上覆着深绿苔藓,
        瀑潭幽暗,水汽在阳光里折出虹彩。这里是电影《天空之桥》的取景地之一。
        若白天来,常能见到**乡田悠树**独自坐在岩石上,神情若有所思。
      facts:
        - 瀑布水声很大,在此地说话不容易被远处的村民偷听到
        - 乡田悠树白天常一个人来此,愿意和"似乎能信任"的 PC 单独聊
        - 瀑潭附近有一块被反复磨光的小石碑,字迹模糊
        - 这里是电影《天空之桥》取景地,圣地巡礼者(摄影师 PC)对此熟悉
      exits:
        - to: scene.village-inner
          condition: free
          label: 沿溪边石路回村内
      npcs_present: [npc.goda-yuki]
      available_clues: [clue.place-name-etymology]
    freedom:
      mood_tags: [水声里的庇护感, 透过水汽的虹光]
      sensory_palette:
        sight: 瀑布溅起的水雾、水面的虹光、岩缝里几枝倔强的山花
        sound: 瀑布连绵不断的轰鸣、远处偶尔几声鸟啼
        smell: 水汽里的青苔味、被太阳晒过的岩石味
        touch: 岩石被水浸得湿滑、水汽落在脸上凉凉的
      improvisable_props:
        - 乡田悠树脚边一支被他无意识折断的小枝
        - 瀑潭边一块被人反复供奉小石头的旧痕
      npc_action_hints:
        npc.goda-yuki: [低头看水面, 不主动开口, 听到 PC 来才慢慢转头]
    forbidden:
      - 不要让乡田悠树在不熟悉 PC 的情况下主动说出真相
      - 不要在白天的瀑布边出现任何超自然现象

  # --------------------------------------------------------------------------
  - id: scene.obi-no-kabe
    title: 带乃壁
    frame:
      summary_md: |
        褄列村西北侧的一道断崖,常年风化得发白,像是被一道无形的刀劈开。
        村中老人称之为"带乃壁"——传说"逝者从此处离开村子"。
        **第二天清晨**会有一段崖体崩塌,从松动的土层里露出几具早已白化的人骨。
      facts:
        - 第一天可远观但不可下到崖底,边缘风大,湿滑
        - 第二天 8:00 前后崖体局部崩塌,露出至少三具新旧不一的白骨
        - 崖底是村民"处理"不被祝福的婴孩的地方,也是 NPC 失足坠崖的标准说辞
        - 风一停,这里的寂静会让人本能后退一步
      exits:
        - to: scene.village-inner
          condition: free
          label: 沿小径回到村内
      npcs_present: []
      available_clues: [clue.obi-collapse-skeleton]
    freedom:
      mood_tags: [崖边的风, 白骨之静, 不可言说的寒意]
      sensory_palette:
        sight: 远处山脊像被刀切过、崖壁上几缕枯藤、风把一片枯叶卷上半空又吹回来
        sound: 风从谷底涌上来时的呜咽、脚下碎石被踢落的滚动声
        smell: 干涸的泥腥味、风里隐约一线动物腐败的甜气
        touch: 崖边的土松软到不敢用力、护栏木桩湿滑
      improvisable_props:
        - 崖边一束已经枯透的彼岸花,扎花的麻绳很新
        - 风化得几乎认不出字的小木牌,上面只剩"○○之碑"几个残字
    forbidden:
      - 不要在第一天让人骨提前出现
      - 不要让 PC 直接看到清晰的婴孩骨骼,以"白色的、过小的什么"暗示

  # --------------------------------------------------------------------------
  - id: scene.kominkan-1f
    title: 公民馆 · 1F
    frame:
      summary_md: |
        村中唯一的公共建筑,也是过路旅人能借宿的地方。1 楼是玄关、多功能室、
        103 号房间和前台。井川洋子是这里的管理员,温柔到让人放下戒心。
        前台书架上摆着几本看似无关的旧书,管理员说"客人想看就拿走"。
      facts:
        - 1F 只有 103 号房间是过夜用的客房,可借宿
        - 前台书架混着县史、农业志和几本旧报告书,无人翻阅
        - 多功能室白天有妇女会聚会,空气里有炒豆和茶水的味道
        - 玄关的鞋柜按辈分摆,外人的鞋会被默默挪到最角落
      exits:
        - to: scene.village-inner
          condition: free
          label: 出公民馆回到村内
        - to: scene.kominkan-2f
          condition: free
          label: 沿木楼梯上 2 楼
      npcs_present: [npc.igawa-yoko]
      available_clues: [clue.yousenjo-report, clue.kominkan-mirror-replaced, clue.kominkan-well-remnant]
    freedom:
      mood_tags: [公共建筑的过度整洁, 木地板的温度, 茶香与霉味]
      sensory_palette:
        sight: 漆色发暗的木柱、前台一只插着野菊的素瓷瓶、墙角一台老式电话
        sound: 楼上偶尔的脚步、远处妇女会的低语、风铃一声两声
        smell: 旧木的香气、茶水气、深处若有若无的霉味
        touch: 木地板被擦得光滑、前台桌沿圆润、电话听筒冰凉
      improvisable_props:
        - 前台一本翻开的留言簿,最后一页的客人停留在三个月前
        - 鞋柜深处一双不属于任何客人的、孩童尺寸的胶鞋
      npc_action_hints:
        npc.igawa-yoko: [声音轻、不打扰任何人、给 PC 端茶时眼神会避开 2 楼方向]
    forbidden:
      - 不要让井川洋子在公共空间主动谈"杀婴"或"星之彩"
      - 不要让前台书架自动展示《疗养所报告书》——必须 PC 翻找

  # --------------------------------------------------------------------------
  - id: scene.kominkan-2f
    title: 公民馆 · 2F
    frame:
      summary_md: |
        2 楼是带阳台的走廊,东侧 204 号房间被改成临时仓库,西侧 **208 号房间**
        长年上锁。井川洋子说她也没钥匙——"是村长那边在管"。
        风从阳台吹过来,会把走廊尽头那扇紧闭的门拍出"哒、哒"两声。
      facts:
        - 208 号房间是 1945 年「山上村疗养所事件」的发生地
        - 房门钥匙据称由村长保管,实际钥匙在井川洋子身上
        - 走廊尽头一面厕所镜子比其它装修明显更新,反光的边缘是干净的金属
        - 阳台栏杆有一处明显被人翻越过的磨痕
      exits:
        - to: scene.kominkan-1f
          condition: free
          label: 沿楼梯下 1 楼
      npcs_present: []
      available_clues: [clue.kominkan-208-lock, clue.kominkan-208-blood-stain, clue.kominkan-208-bed-warped]
    freedom:
      mood_tags: [走廊深处的回响, 镜面反光的不安, 紧闭之门]
      sensory_palette:
        sight: 走廊木地板的反光、208 房门的旧锁有被打磨过的痕迹、镜子里自己的脸看起来比记忆中苍白
        sound: 风把门拍得"哒、哒"、远处楼下水壶烧开的尖鸣
        smell: 走廊深处一线潮湿与铁锈的混合味
        touch: 房门冰凉、锁孔深处一线穿堂风
      improvisable_props:
        - 走廊尽头一只被遗忘的铜制门把手,边沿有被反复抚摸的发亮
        - 阳台栏杆下一缕褪色的红绳,系着不知什么的护身符
    forbidden:
      - 不要在 PC 没有撬开 208 之前让 PC 看到房间内部
      - 不要让 PC 在 208 内"看见"具象的鬼影,只允许"床脚扭曲""窗沿白色的什么"等暗示

  # --------------------------------------------------------------------------
  - id: scene.igawa-house-1f
    title: 井川家 · 1F
    frame:
      summary_md: |
        村东侧坡上的木造两层楼,正门外有一条狭窄的青石小径。1 楼是餐厅、
        和室与浴室。井川博巳与洋子住在这里。这家人对外人很客气,但 2 楼
        和后院从不对外人开放。和室的壁橱深处藏着一些东西。
      facts:
        - 餐厅的饭桌总是摆三副碗筷——夫妇加上不在场的孩子
        - 和室的壁橱里有一沓被压在最下面的旧海报,印着失踪儿童照片
        - 浴室一进门就能闻到一股淡淡的金属气
        - 走廊尽头通往后院,但拉门被一根细绳拴着——绳头打了三个结
      exits:
        - to: scene.village-inner
          condition: free
          label: 出井川家回村内
        - to: scene.igawa-house-2f
          condition: free
          label: 沿木楼梯上 2 楼
        - to: scene.igawa-backyard
          condition: free
          label: 解开拉门绳走向后院
      npcs_present: [npc.igawa-hiromi, npc.igawa-yoko]
      available_clues: [clue.igawa-kondo-poster, clue.nurse-diary]
    freedom:
      mood_tags: [家屋的整洁, 不和谐的第三副碗筷, 走廊尽头的拉门]
      sensory_palette:
        sight: 和室榻榻米的金边、餐厅饭桌的木纹、后院方向走廊的暗
        sound: 远处时钟的滴答、洋子在厨房煮水的声音、楼上博巳偶尔咳嗽
        smell: 米饭味、淡淡的酱菜气、走廊尽头一线潮湿的土味
        touch: 榻榻米柔软、壁橱拉门有微微卡顿
      improvisable_props:
        - 餐桌中央一只小瓷碗,装着已经凉透的、过分精致的婴孩用辅食
        - 和室角落一只被反复擦过的小相框,里面是空的
      npc_action_hints:
        npc.igawa-hiromi: [客气但回避 2 楼话题, 听到"近藤"二字会停下手里的事一秒]
        npc.igawa-yoko: [在 1F 表现得无懈可击, 视线偶尔扫向后院]
    forbidden:
      - 不要让 PC 在没有调查动作的情况下自动发现海报
      - 不要让博巳在洋子面前说出真相

  # --------------------------------------------------------------------------
  - id: scene.igawa-house-2f
    title: 井川家 · 2F
    frame:
      summary_md: |
        2 楼是博巳的书房、堆满杂物的小间、与一处面向后院的小露台。书房书架上
        整齐摆着海运业的工具书,但**第三排深处**藏着几本和工作完全不相干的旧书:
        关于辐射后遗症、孩童畸形与一本破得不能再破的《黑猫》。
      facts:
        - 书房书架第三排深处藏着辐射后遗症与孩童畸形相关的几本旧书
        - 同一格里夹着一本被翻得卷边的《黑猫》
        - 杂物间里有一只上了锁的旧木箱,但博巳称"早就丢了钥匙"
        - 露台正对后院水井,但被一棵长得过分茂盛的山茱萸挡得只剩一道缝
      exits:
        - to: scene.igawa-house-1f
          condition: free
          label: 沿楼梯下 1 楼
      npcs_present: [npc.igawa-hiromi]
      available_clues: [clue.igawa-black-cat-books]
    freedom:
      mood_tags: [书房的整洁, 山茱萸挡住的视线, 一句也没说出口的回避]
      sensory_palette:
        sight: 书架边角被磨亮、露台的光被树叶切碎、杂物间灰尘里浮动的微粒
        sound: 山茱萸枝叶轻轻刮露台栏杆、楼下井川洋子的脚步
        smell: 书纸味、机油味、淡淡的烟草味(博巳偷抽)
        touch: 木地板有微微的下沉、书脊摸上去微微发潮
      improvisable_props:
        - 书桌抽屉一只用旧的怀表,链条早就断了
        - 杂物间一摞旧报纸,最上面一张报道"和歌山辐射事故善后"
      npc_action_hints:
        npc.igawa-hiromi: [对杂物间反应过度礼貌, 对后院方向只字不提]
    forbidden:
      - 不要让博巳在没有 clue 触发前主动谈"近藤理奈"或"杀婴"
      - 不要在 PC 没有先看到带乃壁人骨之前透露第三排深处的书

  # --------------------------------------------------------------------------
  - id: scene.igawa-backyard
    title: 井川家 · 后院 · 井
    frame:
      summary_md: |
        从井川家后门出去,几步路就到一处被藤蔓盖住的小后院。中央有一口已经
        被木板钉死的旧井,板缝里渗着不知是水还是别的什么。空气在这里
        变得粘稠——有时候甚至能看见空中浮着一层极细的、像油膜一样的微光。
        这里是这场闭幕事件**真正的中心**。
      facts:
        - 木板钉得很严,需要两人合作或<STR/SIZ 对抗>才能拆开
        - 井底深处有星之彩的幼体,以及井川洋子女儿被尸蜡化的遗体
        - 从井口往下看时,光线会以违反物理的方式折射成虹彩
        - 第二天深夜的"最终对峙"会发生在这里
      exits:
        - to: scene.igawa-house-1f
          condition: free
          label: 从后门退回 1 楼
      npcs_present: []
      available_clues: [clue.igawa-well-in-backyard]
    freedom:
      mood_tags: [粘稠的空气, 不可名状的虹光, 真相之井]
      sensory_palette:
        sight: 井板缝隙里渗出的湿、藤蔓盖住的旧井栏、空气里浮动的极细虹彩
        sound: 几乎听不见的、像水滴落在很深处的"嗒"
        smell: 一线土腥与某种甜得不正常的气味交织
        touch: 井板冰凉、靠近时手心异常潮湿
      improvisable_props:
        - 井板上一道指甲反复抠出来的浅痕,刚好够一只手伸进去
        - 后院角落一摞被人小心叠好的、孩童尺寸的旧衣
    forbidden:
      - 不要直呼"星之彩",用"虹色的什么""油膜般的微光"等暗示
      - 不要让 PC 在白天看到井底的尸蜡化遗体,必须有充分调查动作触发
      - 不要在第一天就让 PC 进入此处遭遇神话生物级威胁

# ============================================================================
# npcs
# ============================================================================

npcs:
  # --------------------------------------------------------------------------
  - id: npc.igawa-yoko
    name: 井川洋子
    role: 反派
    initial_location: scene.kominkan-1f
    initial_attitude: friendly
    frame:
      public_persona_md: |
        32 岁,公民馆管理员,温柔到让人忽略她的疲倦。嫁入褄列村已七年,
        丈夫是井川博巳。说话总是先低一拍,给客人端茶时手会稳到不像活人。
        她是 PC 在村中最容易遇到、也最愿意帮忙的人。
      secret_md: |
        2013 年与近藤理奈先后产女,理奈把孩子带去山外、自己却被村中
