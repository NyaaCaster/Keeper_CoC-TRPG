# scenes
# ============================================================================

scenes:
  # --------------------------------------------------------------------------
  - id: scene.funeral
    title: 第一章 · 安佩利斯的葬礼
    frame:
      summary_md: |
        下午两点,特拉西诺斯酒庄后的家族墓园。雨未停,灰色的天空压得很低,
        海风从东边吹来,带着咸湿与雨后泥土的味道。三大家族成员、亡者
        生前友人、以及部分酒庄员工陆续到场。这是三位调查员第一次集结
        ——也是岛上各方人物的第一次同框亮相。葬礼下葬时分,新坟将
        渗出**酒香色的血液**,触碰枯藤即刻抽芽——所有目击者损失 0/1
        理智值。下葬后,**律师**会当众宣读令在场所有人哗然的遗嘱。
      facts:
        - 出席者:玛格丽塔、塔洛、达芙妮(特家);特里同缺席,利昂代为出席(奥斐斯家);马泰奥及其妻(菲利波家);酒庄老员工四人;不请自来的渔民阿蒙
        - 棺椁由马泰奥与利昂等六人抬出,抬棺过程中没有人敢直视棺盖
        - 第一把土落下时,新坟下方传来三秒的低沉尖叫,继而泥土渗出酒香色的暗红液体
        - 渗出的液体流过新坟与阿多尼斯墓基,沿途枯萎葡萄藤短暂复活又随即枯死,过程不到十秒
        - 葬礼最后,律师宣布遗嘱:酒庄全数赠予菲利波家族,前提是马泰奥须于一个月内将塔洛与达芙妮嫁出曼提亚永不归岛;若马泰奥未能履行,则由 HO1 继承,条件相同;达芙妮已被许给渔民阿蒙·加拉斯
        - 利昂当场与阿蒙起争执,几乎打了起来;阿蒙将此理解为玛格丽塔默许婚事
      exits:
        - to: scene.trasinos-winery
          condition: free
          label: 葬礼结束后回到酒庄
        - to: scene.santamaria-church
          condition: free
          label: 沿石板路前往圣玛丽亚教堂
        - to: scene.orphys-port
          condition: free
          label: 借故脱身去奥斐斯港口
        - to: scene.filipo-house
          condition: free
          label: 跟随马泰奥回菲利波家
      npcs_present:
        - npc.margarita
        - npc.thalo
        - npc.daphne
        - npc.leon
        - npc.amon
        - npc.mateo
        - npc.lawyer
        - npc.fate-shadow
      available_clues:
        - clue.fate-shadow-vision
        - clue.amber-blood-fertility
        - clue.amphelis-cause-of-death
        - clue.will-content
    freedom:
      mood_tags: [灰雨低云, 海风咸湿, 枯萎葡萄藤, 集体的沉默]
      sensory_palette:
        sight: 黑色丧服在风里翻飞、墓园里没有围墙也没有十字架、阿多尼斯墓前枯萎的风信子与水仙
        sound: 鞋子陷进泥地的闷响、铲子翻土声、玛格丽塔压抑的呼吸、塔洛断续的泣涕
        smell: 雨后泥土的腥气、远处葡萄园里发酵的酒香、丧礼上焚烧的乳香
        touch: 雨水顺着发丝滴落颈后、墓碑石面的湿冷、风衣下摆被风掀起
      improvisable_props:
        - 远处那棵"形状怪异的树"——其实是飘荡的黑纱,手腕处套着一枚金戒指
        - 阿多尼斯墓旁一束已枯萎的风信子(塔洛所放,基莫失踪前所托)
        - 律师皮箱里的一份装订文件,纸页边缘被反复翻动磨毛
      npc_action_hints:
        npc.margarita: [心力交瘁却仍站姿端庄, 偶尔下意识抚摸隆起的腹部, 听到 HO1 名字时手指会顿一下]
        npc.thalo: [独自站在哥哥阿多尼斯墓旁, 不愿与人交谈, 看玛格丽塔的眼神带恨意]
        npc.daphne: [搀扶母亲, 表情平静甚至漠然, 与利昂偶有眼神交错]
        npc.leon: [脸色比平常更苍白, 始终避开棺材, 见到阿蒙时眼神立即变得凶狠]
        npc.amon: [不请自来站在外圈, 衣着粗糙, 手中攥着一只小皮袋]
        npc.mateo: [作为主家代表表情严肃, 对场内每个人都礼貌得过分]
        npc.fate-shadow: [仅在 PC 通过【侦查】或【灵感】检定时短暂可见, 一抹无风自动的黑纱手腕戴金戒指]
    forbidden:
      - 不要让 LLM 在棺椁尚未开始下葬前就触发"地下尖叫 + 血液渗出"的奇景,这是**下葬节点**的硬触发
      - 不要让律师在棺椁下葬完毕之前提前掏出遗嘱
      - 不要让任何 NPC 在葬礼现场主动揭露自己的秘密(玛格丽塔对潘神契约、利昂的杀人、马泰奥的兄弟会、阿蒙是芙提妮之子)
      - 不要直接命名"潘神之血"为何物,只允许 PC 通过【医学】或【灵感】检定关联到酒香与潘神之血
      - 不要让"命运的影子"对未通过侦查/灵感检定的 PC 显形,也不要让 LLM 直接说出"它叫命运的影子"

  # --------------------------------------------------------------------------
  - id: scene.trasinos-winery
    title: 特拉西诺斯酒庄
    frame:
      summary_md: |
        酒庄是一座二层石灰岩老宅,葡萄园绕宅而种,自家酒窖里陈着以
        **「潘神之血」**为名的红酒。葬礼之后,玛格丽塔会以"姐妹"的名义
        留 HO1 在家中过夜,把她安排住进**长子阿多尼斯生前的卧室**。
        塔洛因此与玛格丽塔大吵一架。酒庄外的葡萄园近半年开始枯萎,
        老员工低声议论"今年的酒酿不出去了"。
      facts:
        - 二层木地板,玄关挂着安佩利斯·特拉西诺斯生前最后一张全家福
        - 厨房有一只**古铜色的潘神之血专用酒壶**,壶身浮雕酒神节,中央是吹双管笛的羊腿人形
        - 潘神之血酒精浓度极高,任何体质的人喝一杯便会醉倒,当晚必梦见潘神
        - 长子阿多尼斯的卧室基本被清理空,但床和墙的夹缝里夹着一本布满灰尘的笔记
        - 阿多尼斯笔记中歪扭的字迹记录着未来若干日期与"该做的事",并非他本人能够看到事件起源
        - 酒庄后山坡是安佩利斯每周三次黄昏独饮(其实是与 HO3 幽会)的地点,崖边可见凌乱脚印与一个酒瓶
        - 老员工对"安佩利斯每周三次黄昏独饮"的真相心知肚明,但都没说出去——其中不少人怀疑伊莱妮是安佩利斯的孩子
        - 塔洛因 HO1 入住阿多尼斯卧室与玛格丽塔大吵,言语中暗示"阿多尼斯的死与玛格丽塔有关"
      exits:
        - to: scene.funeral
          condition: free
          label: 走回墓园
        - to: scene.santamaria-church
          condition: free
          label: 步行去镇上的教堂
        - to: scene.filipo-house
          condition: free
          label: 借访友之名去菲利波家
        - to: scene.ancient-ruins
          condition: requires-skill
          required_skill: navigate
          difficulty: regular
          label: 翻越枯萎葡萄园后山去往古代遗址(需导航)
      npcs_present:
        - npc.margarita
        - npc.thalo
        - npc.daphne
      available_clues:
        - clue.pan-blood-jug
        - clue.adonis-prophecy-diary
        - clue.cliff-edge-traces
        - clue.thalo-margarita-quarrel
    freedom:
      mood_tags: [葡萄藤的腐败甜味, 木地板的吱呀, 母与女间的张力]
      sensory_palette:
        sight: 灰泥外墙、二层窗台脱漆、葡萄园成片成片的枯黄、阿多尼斯卧室空得不正常
        sound: 木板地的回响、风穿过破窗的低鸣、塔洛在远处房间压抑的哭声
        smell: 室内潮气、酒窖底层的甜腥、橄榄油与羊奶酪的清淡气
        touch: 床铺被反复换洗过的痕迹、墙皮微微发凉
      improvisable_props:
        - 厨房灶台上一碗未吃完的橄榄(塔洛今晨给玛格丽塔留的)
        - 阿多尼斯床头柜空抽屉里一根断掉的银项链
        - 酒窖墙上一处用炭笔粗糙画下的羊腿人记号
      npc_action_hints:
        npc.margarita:
          - >-
            **核心心机铁规则**:玛格丽塔已秘密购入"公牛之血"剧毒,准备在适当
            时机毒杀 HO1(以解除潘神契约对女儿的威胁)。但**在 PC 主动调查
            或威胁之前**,她不会显露任何敌意——只表现为"心力交瘁的孕妇
            遗孀"。她甚至会主动表现出"友善"与"试探":想知道 HO1 是否
            有办法绕过家族诅咒。
          - 把 HO1 安排进阿多尼斯的卧室,既是节俭也是潜意识的怨念
          - 听到"潘神""葡萄园枯萎""阿多尼斯死因"等关键词时,会下意识攥紧手帕
          - 对达芙妮极度保护;若有人威胁达芙妮,她会立即从"温和遗孀"切到"绝望母亲"
        npc.thalo:
          - 把所有的恨指向继母玛格丽塔,她偷偷怀疑玛格丽塔与阿多尼斯之死有关
          - 对阿多尼斯墓前的风信子异常敏感,那是基莫失踪前托她献的花
          - 不愿与外人交流,但若 PC 表现出对阿多尼斯的关心,她会逐渐松口
        npc.daphne:
          - 平静甚至漠然——继父之死对她而言是解脱,因为可能不必嫁给阿蒙
          - 在意两件事:母亲的安全,以及男朋友利昂
          - 不轻易透露自己与利昂的关系,但若 PC 用【心理学】观察可看出端倪
    forbidden:
      - 不要让玛格丽塔在 PC 没有明显敌对动作之前主动展露杀意——她的危险来自"温柔的伪装"而非外露的恶意
      - 不要让塔洛直接说出"阿多尼斯被父亲献祭"——她不知道,只是怀疑
      - 不要直接说出"潘神之血是真的血"——必须通过线索发现
      - 不要让酒庄出现明显的超自然现象(怪声、显形怪物);葡萄藤的复活/枯死只在葬礼当下出现,日常状态下园中只是枯黄

  # --------------------------------------------------------------------------
  - id: scene.santamaria-church
    title: 圣玛丽亚教堂
    frame:
      summary_md: |
        曼提亚最显眼的地标。纯白的灰泥墙、深蓝色的圆顶、顶端金色十字架。
        正殿可容百五十人,圣像屏画像金箔斑驳。神父尼古拉·拉姆布罗斯是
        镇上"精神的调解人",对特拉西诺斯与奥斐斯持"异教徒"立场。
        教堂下方有一座古老地下室,据说建于某座被埋的神庙之上。
      facts:
        - 公元 10 世纪,教堂建造时挖出栩栩如生的石像与大蛇,曾被特拉西诺斯与奥斐斯阻止砸毁
        - 尼古拉神父知道"特拉西诺斯拜一个叫潘的东西",但不知道更深的契约细节
        - 三个月前基莫·奥斐斯曾来询问古代文献,被神父察觉异常拒绝
        - 教堂下方地下室里藏着中世纪手抄本、修士日记与一卷只剩半卷的【命运之裁】法术残卷
        - 最近两周岛上女人集体梦见金戒指,神父认为这是"邪物的引诱"
      exits:
        - to: scene.funeral
          condition: free
          label: 沿石板路返回特家墓园
        - to: scene.trasinos-winery
          condition: free
          label: 走回特拉西诺斯酒庄
        - to: scene.orphys-port
          condition: free
          label: 转去港口
      npcs_present:
        - npc.father-nikolas
      available_clues:
        - clue.nikolas-old-warning
        - clue.church-construction-record
        - clue.fate-cutting-spell
    freedom:
      mood_tags: [乳香与蜡气, 圣像屏后的阴影, 镇民低声祷告]
      sensory_palette:
        sight: 金箔斑驳的圣像、蜡烛在斜风里轻颤、地下室入口被神父挂的木牌掩住
        sound: 钟楼铜钟的余响、海风穿过钟楼缝隙的低鸣、神父念诵祷词时的尾音
        smell: 蜡烛烧到末段的甜腻、潮湿石材的霉气、乳香木屑的辛辣
        touch: 长椅扶手被磨光、地下室铁锁的冰凉
      improvisable_props:
        - 圣像屏角落一支因裂开而停摆的旧十字架
        - 神父祭袍口袋里的一本被指头摩挲到发白的日课经
        - 入口处铜钱箱里有一枚明显比其余古旧得多的拜占庭硬币
      npc_action_hints:
        npc.father-nikolas:
          - 对 HO1 警觉,告诫"那是魔鬼与异教徒的岛屿,你不该回来"
          - 对 HO2 持"迷途羔羊"的姿态,但若 HO2 蛇瞳显露则立即冷淡
          - 对 HO3 同情,因伊莱妮的"古怪举止"曾在他面前流露过
    forbidden:
      - 不要让神父直接念出"克苏鲁""阿尔克纳"等专名;只允许说"魔鬼""异教"
      - 不要让神父主动给出地下室钥匙——必须通过【说服】或【神秘学】+背景关联才肯开锁
      - 不要让法术残卷在玩家未投出【图书馆使用】检定前自动呈现

  # --------------------------------------------------------------------------
  - id: scene.orphys-port
    title: 奥斐斯港口
    frame:
      summary_md: |
        曼提亚岛唯一的港口,由奥斐斯家族世代经营。今晨"圣尼古拉斯号"
        在岛屿外海翻覆,渔民阿蒙打捞出七具遗体与几尊**栩栩如生的石像**。
        港口仓库里阴冷潮湿,弥漫着海藻腐烂与煤油的气味。一艘修船工坊
        紧贴码头,远处灯塔的轮廓在晨雾中若隐若现。
      facts:
        - 圣尼古拉斯号船底有一个巨大破洞,渔民阿蒙判断为大型生物撞击,而非触礁
        - 仓库存放七具遇难者遗体与十余尊石像,石像面孔与圣尼古拉斯号乘客一一吻合
        - HO1 在遗体认领过程中能从其中一尊石像上认出"昨夜与自己同船的男乘客"
        - 港口员工知晓"灯塔守灯人"传闻——除奥斐斯家外无人见过其面;今年起特里同声称要重新招人
        - 阿蒙的渔船独自停在最东端的小码头,船舱底层与灯塔基座有暗道相通
      exits:
        - to: scene.funeral
          condition: free
          label: 步行回特家墓园
        - to: scene.lighthouse
          condition: requires-skill
          required_skill: navigate
          difficulty: regular
          label: 沿礁石小道走向灯塔(需导航)
        - to: scene.filipo-hospital
          condition: free
          label: 转去菲利波医院
      npcs_present:
        - npc.amon
      available_clues:
        - clue.shipwreck-stones
        - clue.shipwreck-bottom-hole
        - clue.lighthouse-keeper-rumor
    freedom:
      mood_tags: [咸湿冷雾, 海浪拍石板, 远处灯塔的间歇光斑]
      sensory_palette:
        sight: 石像被简陋的麻布盖住,但布角抖动时能瞥见惊恐的脸、湿漉漉的木栈道
        sound: 钢索拍打船舷、远处海鸥孤鸣、调度员沙哑的咒骂
        smell: 鱼腥、煤油、海藻发酵后的腥甜
        touch: 麻绳磨手、石板缝里渗出的咸水
      improvisable_props:
        - 仓库角落一只生锈的捕鲸钩,挂着已经枯掉的海葵
        - 调度员办公桌上一份湿透的乘客名单,字迹晕开
        - 阿蒙渔船甲板上一只装着金币与碎银的旧皮袋(未上锁)
      npc_action_hints:
        npc.amon:
          - 对 HO2 表面恭敬实则戒备(他知道奥斐斯的秘密)
          - 主动提议"陪 PC 到灯塔",但若被拒绝就退回渔船
          - 见到 HO1 时眼神长时间停留——他能本能感知到"潘神契约的气味"
    forbidden:
      - 不要让阿蒙在 PC 未触发"母亲是谁"线索前自报"芙提妮之子"身份
      - 不要在玩家未通过【生物学】或【医学】检查石像之前确认它们是"曾是活人"
      - 不要让石像在场景中"动一下"——它们的恐怖在于"凝固的瞬间",不在动态

  # --------------------------------------------------------------------------
  - id: scene.filipo-house
    title: 菲利波家
    frame:
      summary_md: |
        建于十八世纪的两层石灰岩老宅,由菲利波家族世代居住。一楼是会客厅
        与餐厨,二楼是卧室。地下室上锁,据说存放着家族传家文物——其中
        有一枚被保管了九个世纪的金戒指,但两周前在一场翻船事故中遗落海中。
        马泰奥在书房里有一台保险柜,以及一本上锁的私人日记。
      facts:
        - 二楼儿童房住着马泰奥与 HO3 的女儿伊莱妮(四岁,实际是 HO3 与安佩利斯的孩子)
        - 地下室入口位于厨房后方走廊尽头,门上挂着"地窖"铭牌,需要钥匙或【锁匠】成功
        - 地下室的金戒指保管箱已经空了——保管箱内壁的灰尘里有清晰的指印
        - 马泰奥的私人日记记载了对 HO3 出轨的猜疑,以及"如果伊莱妮不觉醒就只能献给兄弟会"的犹豫
        - 二楼客房书桌上有一封未发出的信:"季米特里斯先生,再宽限两周……"
      exits:
        - to: scene.funeral
          condition: free
          label: 走回特家墓园
        - to: scene.filipo-hospital
          condition: free
          label: 步行去菲利波医院
        - to: scene.santamaria-church
          condition: free
          label: 沿石板路去教堂
      npcs_present:
        - npc.mateo
        - npc.iraini
      available_clues:
        - clue.empty-ring-box
        - clue.mateo-diary
        - clue.creditor-letter
    freedom:
      mood_tags: [灰泥墙的潮气, 上锁的橡木门, 儿童房传出的细碎念诵]
      sensory_palette:
        sight: 客厅墙上挂着十八世纪购入岛屿时的契据复印件、地下室门把上有几道新刮痕
        sound: 二楼地板因空气流动嘎吱、伊莱妮在儿童房用小声反复念预言
        smell: 老木家具的清漆味、地下室透出的金属与硝酸气混合的腥气
        touch: 地下室铁门冰冷,手心贴上去会留下一片潮印
      improvisable_props:
        - 客厅壁炉架上一张菲利波家族三代合影,马泰奥童年照与一位"不在场"的父亲
        - 厨房灶台旁一锅煮糊的羊奶——HO3 早晨没顾得上关火
        - 儿童房床头一只褪色的羊毛小绵羊玩具
      npc_action_hints:
        npc.mateo:
          - 在 HO3 面前过度礼貌、关心、克制,实则在评估其是否怀疑自己
          - 提到"金戒指"时会反射性地走向地下室门口,然后收住脚步
          - 对季米特里斯只字不提,若被追问立即转入"咳嗽 + 倒水"的拖延
        npc.iraini:
          - 反复用奶声奶气念预言,但被询问时露出听不懂的茫然表情
          - 对 HO3 比对马泰奥更黏人,会主动伸手要"金戒指"
          - 看到陌生 PC 时不哭不闹,只是定定地看,直到 PC 别开视线
    forbidden:
      - 不要让马泰奥在 PC 没掌握"地下一层""阿布霍斯之种""金戒指抵债"任一线索前主动坦白
      - 不要让伊莱妮在场上自然显露金羊瞳——金羊瞳只在她"睡着醒来的瞬间"或"金戒指出现时"短暂显形
      - 不要让 PC 单凭一次【侦查】就进入地下室——必须配合钥匙、日记或锁匠

  # --------------------------------------------------------------------------
  - id: scene.lighthouse
    title: 灯塔
    frame:
      summary_md: |
        孤立于岛屿东岬的旧灯塔,由奥斐斯家族世代维护。塔基与海岸礁石融为
        一体,只有一条被礁石遮挡的小径可达。塔内昏暗潮湿,顶层的旋转灯
        仍在按时点燃——但守灯人多年来从未在白天露面。塔基地下有一条
        与阿蒙渔船相连的暗道。
      facts:
        - 灯塔守灯人是**艾奇德娜·奥斐斯**——特里同的姐姐,世代被囚禁的"奥斐斯禁忌"
        - 艾奇德娜今年也将变成大蛇,特里同知道这一点,**故意停止运送物资**意图饿死她
        - 灯塔顶层的旋转灯由海水驱动的简易齿轮组维持,无人值守也能按时点亮
        - 塔基地下密室里,艾奇德娜以人形勉强维持,饥饿、虚弱,但仍能教授法术
        - 暗道尽头是阿蒙的房间,墙上挂着一幅芙提妮的旧素描——艾奇德娜认识她
      exits:
        - to: scene.orphys-port
          condition: free
          label: 沿礁石小径返回港口
        - to: scene.amon-undersea-room
          condition: requires-clue
          required_clue: clue.lighthouse-secret-passage
          label: 通过塔基暗道进入阿蒙的地下房间
      npcs_present:
        - npc.echidna
      available_clues:
        - clue.echidna-existence
        - clue.lighthouse-secret-passage
        - clue.fotini-portrait
    freedom:
      mood_tags: [海浪砸在塔基, 灯室油烟混海腥, 长年无人的木阶]
      sensory_palette:
        sight: 灯室铜镜被海雾蒙了一层水汽、塔基地下的水位线随潮汐缓慢起落
        sound: 旋转齿轮的咯吱、海浪在塔基洞穴里形成的低频共鸣
        smell: 鲸油、腐木、潮气混合的霉味
        touch: 铁旋梯被盐分蛀穿处,会刺手
      improvisable_props:
        - 塔顶守灯日志最后一页停在两年前的春天
        - 地下密室的石床上摊着一卷未读完的赫卡忒赞歌(古希腊语)
        - 暗道墙上一连串用炭笔画的蛇形符号
      npc_action_hints:
        npc.echidna:
          - 警惕奥斐斯家族的人,但若 PC 中有奥斐斯血统者主动给食物,态度可缓和
          - 谈到芙提妮时眼眶湿润——她记得这位多年前调查三大家族诅咒的女巫
          - 不愿离开灯塔,认定"赫卡忒之蛇必须守在海与陆的接缝"
    forbidden:
      - 不要让艾奇德娜在 PC 提供食物或【说服】成功前主动透露自己的姓名
      - 不要让灯塔出现"自动开门""血在墙上写字"等廉价惊吓
      - 不要让艾奇德娜直接命名"克苏鲁""俄菲斯"——只允许说"那位母亲""那条守树的"

  # --------------------------------------------------------------------------
  - id: scene.amon-undersea-room
    title: 阿蒙的地下房间
    frame:
      summary_md: |
        约十平米的人工洞穴,墙体是泥与岩混合,木桩与旧船板加固顶部。
        房间一头通向灯塔暗道,另一头通向阿蒙渔船船底的活板门。
        墙上挂着芙提妮的素描、几尊小型蛇形泥塑、一柄黑色玻璃匕首。
        阿蒙在此度过了半生,却从未告诉任何人。
      facts:
        - 阿蒙是**芙提妮之子**——母亲是被三大家族联手追杀的女巫,父亲是阿蒙未曾谋面的"陌生水手"
        - 房间里的黑曜石匕首是芙提妮留下的法器,尚能施放【诅咒法】
        - 一只木箱里藏着芙提妮的日记残卷,记载她对三大家族诅咒的调查与无能为力
        - 阿蒙长期在此供奉母亲遗物,形成"个人小神坛";接受过艾奇德娜短暂施法指点
      exits:
        - to: scene.lighthouse
          condition: free
          label: 沿暗道返回灯塔
        - to: scene.orphys-port
          condition: requires-clue
          required_clue: clue.lighthouse-secret-passage
          label: 从渔船活板门浮上水面
      npcs_present: []
      available_clues:
        - clue.amon-true-origin
        - clue.fotini-diary
        - clue.obsidian-dagger
    freedom:
      mood_tags: [低顶压抑, 海水渗入墙脚, 油灯静默燃烧]
      sensory_palette:
        sight: 神坛上一束已经枯成灰白的迷迭香、墙角放着一只磨损的旧船桨
        sound: 远处海浪拍打活板门、油灯灯芯偶尔的爆响
        smell: 海盐、迷迭香的草本苦气、潮湿木板的发霉味
        touch: 黑曜石匕首入手冰凉,触碰时手指会麻一瞬
    forbidden:
      - 不要在阿蒙未离开渔船前让 PC 自由进入此处——暗道入口默认隐蔽
      - 不要让神坛的"小奇迹"过度显形(蜡烛自燃、影子动等);芙提妮已死,神坛只是"残留的余温"

  # --------------------------------------------------------------------------
  - id: scene.filipo-hospital
    title: 菲利波医院
    frame:
      summary_md: |
        基克拉泽斯群岛南部知名的医疗中心,马泰奥用净化兄弟会的资金购入了
        最先进的医疗器械。表面是一座普通的两层石灰岩医院,实则地下一层
        藏着马泰奥的"研发部"——焚化炉、动物实验室、阿布霍斯之种冷藏柜。
        季米特里斯·帕帕斯近日以基金会成员身份在此公开调查。
      facts:
        - 一楼药房后方走廊尽头是地下一层入口,挂"装修中"铭牌,门把铜锁需要钥匙或【锁匠】
        - 院长办公室抽屉里有一把.45 自动手枪、地下室钥匙、一张马泰奥的军医旧照
        - 文件室藏着新世代计划进度报告(伪造)与血缘魔力研究(真)
        - 实验室冷藏柜分三层:动物标本、人体组织样本(含阿多尼斯的脑脊髓液)、五瓶阿布霍斯之种
        - 焚化炉内有大量动物骨灰,与一片烧不尽的人类指骨——马泰奥失败实验的产物
      exits:
        - to: scene.funeral
          condition: free
          label: 步行回特家墓园
        - to: scene.filipo-house
          condition: free
          label: 走回菲利波家
        - to: scene.orphys-port
          condition: free
          label: 步行去港口
      npcs_present:
        - npc.dimitris
      available_clues:
        - clue.fake-newgen-report
        - clue.true-bloodline-study
        - clue.abhoth-seed-vial
        - clue.brotherhood-telegram
    freedom:
      mood_tags: [消毒水气味, 走廊尽头的阴影, 医护人员低声议论]
      sensory_palette:
        sight: 走廊地砖的金属光、地下楼梯口的红漆铁门、冷藏柜的微弱白光
        sound: 远处手术室的器械碰撞声、季米特里斯皮鞋的清脆步点
        smell: 消毒水、福尔马林、焚化炉飘出的淡淡焦甜味
        touch: 冷藏柜把手的极低温、地下走廊水泥地的湿冷
      improvisable_props:
        - 一楼挂号台上一份被反复转手的薪资单,墨迹被汗指印晕开
        - 地下走廊一只损坏的医疗担架,皮带上有未洗净的血迹
        - 焚化炉口一片半烧融的金箔——地下储物柜里曾有的圣物
      npc_action_hints:
        npc.dimitris:
          - 表面是商人,实则净化兄弟会"中级修士",言谈彬彬有礼但眼神锐利
          - 主动接近 HO3,以"伊莱妮的健康"为由套话
          - 对 PC 的存在持审视态度,会暗中评估是否可发展为兄弟会成员
    forbidden:
      - 不要在玩家未潜入地下一层前透露阿布霍斯之种的存在
      - 不要让医护人员主动揭穿马泰奥的资金问题——必须通过【社交】成功
      - 不要让季米特里斯在地下被揭穿前显露任何超自然能力

  # --------------------------------------------------------------------------
  - id: scene.theater
    title: 曼提亚剧院
    frame:
      summary_md: |
        建于十九世纪初的露天石阶剧院,曼提亚岛文化的标志。每年先知以利亚日
        的庆典前夕,剧院都会上演同一出名为《**菲莫诺厄的金枝**》的古老
        悲剧——讲述最后一位女先知在金色月桂树下的试炼。今天,剧院因
        排练而暂时关闭,但侧门仍开着一条缝。后台道具间藏着一只**银剪**。
      facts:
        - 《菲莫诺厄的金枝》剧本由特拉西诺斯家族世代抄录,但已遗失关键的"考验三道"具体内容
        - 后台道具间藏着一柄用于"剪断命运之缕"的古老银剪——【命运之裁】法术的施法媒介
        - 剧院老导演记得"五十年前那次彩排,小达芙妮(玛格丽塔的姨妈)在金枝场景倒地后再没醒来"
        - 在剧院顶层包厢可俯瞰整个曼提亚镇,是观察岛上各路人物动向的绝佳视点
      exits:
        - to: scene.funeral
          condition: free
          label: 步行回特家墓园
        - to: scene.santamaria-church
          condition: free
          label: 沿石板路去教堂
        - to: scene.ancient-ruins
          condition: requires-clue
          required_clue: clue.play-script-fragment
          label: 顺着剧本提到的"古祭坛方位"前往古代遗址
      npcs_present:
        - npc.old-director
      available_clues:
        - clue.play-script-fragment
        - clue.silver-scissors
        - clue.old-rehearsal-tragedy
    freedom:
      mood_tags: [空席的回声, 排练间隙的沉默, 顶层包厢的灰尘]
      sensory_palette:
        sight: 舞台幕布褪色为浅灰、观众席木椅刻满游客名字、后台道具间一柄已经变黑的银剪
        sound: 风穿过空席激起的呼啸、远处导演用希腊语轻声背词的尾音
        smell: 旧丝绒幕布的尘香、油彩颜料的淡淡石油味
        touch: 道具间银剪握柄上的细微刻痕
      improvisable_props:
        - 舞台后方一面大镜子,镜面有一道斜向的裂痕
        - 后台衣柜里一件绣金线的"女先知袍",衣摆已被虫蛀
        - 老导演的剧本台本里夹着一封未寄出的辞职信
      npc_action_hints:
        npc.old-director:
          - 对古老剧本与传说倾囊相告,但拒绝谈论"五十年前那场彩排"
          - 见到 HO1 时会一瞬怔住——HO1 与已故的小达芙妮"长得一样"
          - 若 PC 主动询问银剪用途,他会含糊"那是道具",并暗示"别碰它"
    forbidden:
      - 不要让老导演直接说出"命运之裁"法术名;只允许暗示"那剪刀剪过不该剪的"
      - 不要让剧院出现"幕布无风自动""鬼魂上台"等显形怪谈

  # --------------------------------------------------------------------------
  - id: scene.ancient-ruins
    title: 古代遗址
    frame:
      summary_md: |
        位于曼提亚山脚的一处古希腊神庙遗址,只剩三根白色石柱与一座被
        藤蔓掩盖的祭坛。考古学家曾认定这里是阿尔克纳的女祭司菲莫诺厄
        所主持的祭祀场。基莫·奥斐斯三个月前曾来过此处,留下了一些痕迹。
        遗址下方有一处被植被掩藏的洞穴入口,通向曼提亚山的"地下洞穴"。
      facts:
        - 祭坛中央有一个被时间磨平的浅凹槽,正好可以放下一枚戒指
        - 三根石柱上分别刻着古希腊文"出生""婚姻""死亡"——阿尔克纳掌管的三段命运
        - 基莫曾在祭坛旁留下一只布袋,内有干风信子(他失踪前托塔洛献给阿多尼斯的同款)
        - 遗址东南侧的茂密灌木后,一条天然通道通往山中的"地下洞穴"
      exits:
        - to: scene.trasinos-winery
          condition: free
          label: 翻越枯萎葡萄园回酒庄
        - to: scene.theater
          condition: free
          label: 沿山路下到剧院
        - to: scene.hidden-cave
          condition: requires-skill
          required_skill: spot-hidden
          difficulty: regular
          label: 拨开灌木进入隐藏洞穴(需侦查)
      npcs_present: []
      available_clues:
        - clue.altar-ring-slot
        - clue.three-pillars-inscription
        - clue.kymo-trace
    freedom:
      mood_tags: [雨后湿藤, 石柱的白与苔的绿, 远处山风]
      sensory_palette:
        sight: 残柱在乌云间投下断续的影、祭坛凹槽里积着一汪雨水
        sound: 蝉鸣稀薄、山涧水声从地缝深处传上来
        smell: 苔藓与潮湿石面的清苦、被晒干的橄榄叶余香
        touch: 石柱被千年雨水冲出沟壑,纹路像皱纹
      improvisable_props:
        - 祭坛角落一片新鲜的脚印,印子还是塔洛与基莫鞋底的纹路
        - 一只半埋在土里的青铜祭酒杯,内壁仍有酒香色的残渍
        - 一根被刀划过、刻有现代字母 "K" 的橄榄树枝
    forbidden:
      - 不要在玩家未通过【侦查】检定前直接说出洞穴入口的位置
      - 不要让石柱"自己发光"或"自动转动"——遗址的恐怖在于"它什么都没做却让你不安"

  # --------------------------------------------------------------------------
  - id: scene.hidden-cave
    title: 隐藏洞穴
    frame:
      summary_md: |
        从古代遗址灌木后进入的一段天然洞穴。通道狭窄,空气潮湿,弥漫着
        海藻腐烂般的腥气与一种说不清的陌生气味。洞穴深处,一具几乎赤裸
        的身体蜷缩在角落——那是基莫·奥斐斯,正以血肉的代价进行**奥斐斯
        家族独有的蛇蜕**。再往里,洞穴与曼提亚山的内部脉络相连。
      facts:
        - 基莫处于"蛇蜕中期",疼痛、虚弱、暴躁,几乎无法正常对话
        - 基莫脖子上的项链里有一张阿多尼斯的黑白照片——他生前唯一的同性恋人
        - 基莫蜕皮完成需到第二天清晨;在此期间他无法离开,但能听见 PC 的话
        - 洞穴最深处通往**曼提亚山**入口,由"潘神之子"守护(白天极少出现,夜间巡视)
        - 蜕皮中的基莫极度脆弱,战斗难度低;但他若死亡,奥斐斯家就只剩下利昂一人
      exits:
        - to: scene.ancient-ruins
          condition: free
          label: 原路退回遗址
        - to: scene.mantia-mountain
          condition: requires-flag
          required_flag: flag.kimo-tells-mountain-route
          required_value: true
          label: 由基莫指点,沿暗道进入曼提亚山
      npcs_present:
        - npc.kymo
      available_clues:
        - clue.kymo-shedding
        - clue.adonis-photograph
        - clue.mountain-route
    freedom:
      mood_tags: [腥湿低温, 滴水的回响, 蜕下的皮反着病态的光]
      sensory_palette:
        sight: 灰白半透明的死皮挂在岩壁、洞穴顶上偶有水滴坠落、深处的黑暗里有什么微微反光
        sound: 基莫断续的呜咽、远处地下水的流动声、自己心跳格外清晰
        smell: 海藻腐烂味、新生皮肤泛起的甜腥、岩盐的咸
        touch: 岩壁的湿冷,掌心贴上去会感到极微弱的脉动
      improvisable_props:
        - 洞穴中央一堆基莫蜕下的死皮,边缘被血浸成暗红
        - 基莫脚边一柄海军匕首,刀身已经锈蚀
        - 一面被搁在岩缝里的小镜子,镜面映出的人影会延迟半秒
      npc_action_hints:
        npc.kymo:
          - 蜕皮期间无法流畅讲话,只能用断词与手势交流
          - 见到 HO1 时会努力坐起身,因为他认出"那是潘神契约的味道"
          - 听到"阿多尼斯"或"塔洛"时会落泪
    forbidden:
      - 不要在 PC 进入洞穴前让基莫主动出声呼救
      - 不要让基莫与 PC 进行长篇对话——他只会断词、手势、目光
      - 不要让洞穴出现"突然杀出的怪物"——这是个安全屋,危险在洞外

  # --------------------------------------------------------------------------
  - id: scene.mantia-mountain
    title: 曼提亚山
    frame:
      summary_md: |
        曼提亚岛中央的孤峰,海拔不高但坡势陡峭。山腰以上常年云雾,
        山顶则是一片裸露的石灰岩台地。山中暗藏多处洞穴入口,统称为
        "**阿尔克纳之口**",是奥斐斯大蛇族群的栖息地,也是潘神在岛
        上的活动范围。第三天夜半的"金枝之夜"将由此开启**金枝之地**
        最终通道。
      facts:
        - 山中暗道纵横,需要【导航】或基莫提供的路线才能到达"阿尔克纳之口"主入口
        - 沿途有数条奥斐斯大蛇出没,白天蛰伏、夜间巡逻
        - 山腰东侧有一座古老石舍,墙上凿着【潘神请神术】的咒文残迹
        - 阿尔克纳之口主洞穴入口处有一道天然形成的"三柱鸟居"形岩石,与教堂地下挖出的旧拓本吻合
      exits:
        - to: scene.hidden-cave
          condition: free
          label: 沿暗道退回隐藏洞穴
        - to: scene.golden-branch-land
          condition: requires-clue
          required_clue: clue.golden-branch-trial-ready
          label: 在"金枝之夜"启动后进入金枝之地
      npcs_present: []
      available_clues:
        - clue.pan-ritual-stones
        - clue.three-pillar-arch
        - clue.golden-branch-trial-ready
    freedom:
      mood_tags: [山风刺骨, 云雾稀释远景, 远处兽吼]
      sensory_palette:
        sight: 山腰云雾间,偶尔可见远处灯塔的微光与海平线
        sound: 风过石缝形成的"风之笛"、远处某种低沉的蹄声
        smell: 雪松、潮湿的青苔、隐隐的兽腥
        touch: 石灰岩面割手,登山时手心有细密的伤口
      improvisable_props:
        - 山腰石舍内一只被踩烂的羊角酒杯,血渍已干透
        - 山道转角处一具风化的山羊骨架,骨节被某种工具切割过
        - 山顶台地上一块刻着希腊字母 Π(潘神) 的边角已被磨平的石板
    forbidden:
      - 不要在玩家未到第三天夜晚之前让"金枝之地"入口启动
      - 不要让 PC 在白天遇到潘神(萨提尔形态);潘神只在山中夜晚显形
      - 不要让奥斐斯大蛇主动追击进入山道的 PC——它们只在被靠近 5 米内才攻击

  # --------------------------------------------------------------------------
  - id: scene.golden-branch-land
    title: 金枝之地
    frame:
      summary_md: |
        曼提亚山深处的巨大地下洞穴。中央生长着一棵**金色月桂树**,枝叶
        繁茂,每片叶子在黑暗中发出淡淡金光。树根扎入岩石,与岩壁融为一体。
        树周围散落二十余尊石像——历代试炼失败者的最后姿态。**俄菲斯**——
        第一任菲莫诺厄与克苏鲁的子嗣——盘踞在树下,等待新女祭司的到来。
        通过试炼者将折下金枝,继承"菲莫诺厄"之名,成为命运之神阿尔克纳
        的女祭司。这是模组的最终场景。
      facts:
        - 金色月桂树并非植物,而是阿尔克纳力量在岩层中分泌的"珍珠质"凝结
        - 俄菲斯通常半睡(双眼半阖),只在 PC 直视、过近、心怀恶意或喧哗时睁眼
        - 俄菲斯的注视即石化(数秒内从眼球蔓延全身);若它注视水中倒影则反噬,一小时后自动解除
        - 蜂蜜可让俄菲斯短暂分心(1D5+1 轮);黄金蜂皇浆延长至 1D10+5 轮
        - 折下金枝后,折下者获得"菲莫诺厄"继承权;无金戒指者亦可,先到先得
      exits:
        - to: scene.mantia-mountain
          condition: requires-flag
          required_flag: flag.golden-branch-broken
          required_value: true
          label: 折枝完成后回到曼提亚山
      npcs_present:
        - npc.fate-shadow
        - npc.ophis
      available_clues:
        - clue.golden-branch-prophecy
    freedom:
      mood_tags: [树叶的金光, 石化者的凝视, 千年沉睡的呼吸]
      sensory_palette:
        sight: 月桂金光勾勒出洞穴的圆顶轮廓、石像的面孔在金光里仿佛在动
        sound: 巨蛇沉重缓慢的呼吸、金叶之间互相碰撞的细微铃响
        smell: 蜂蜜的甜香混杂蛇腥与石粉
        touch: 金枝入手时的微温与共鸣震动
      improvisable_props:
        - 一尊穿着中世纪长袍的石像,手指还指向月桂枝
        - 树根缠绕处一枚古老的银戒指,主人早已石化
        - 一只装着金黄液体的陶罐(黄金蜂皇浆),被前一位试炼者遗落
    forbidden:
      - 不要让俄菲斯在 PC 安静靠近时立即睁眼——它"半睡"的设定必须严格执行
      - 不要让金色月桂树"自动垂下金枝"——必须由 PC 亲手折下
      - 不要替 PC 决定是否继承菲莫诺厄之名——这必须是玩家的最终抉择

# ============================================================================
# npcs
# ============================================================================

npcs:
  # --------------------------------------------------------------------------
  - id: npc.margarita
    name: 玛格丽塔·特拉西诺斯
    role: 反派
    initial_location: scene.funeral
    initial_attitude: friendly
    frame:
      public_persona_md: |
        安佩利斯·特拉西诺斯的遗孀,嫁入特家不到一年。盛夏怀着身孕,
        丧服下能看出隆起的腹部。脸色苍白却仍保持仪态,被镇上人公认为
        "心力交瘁但坚强"。对外人友善客气、寡言克制,擅长用沉默
        让对方主动倾诉。
      secret_md: |
        她已秘密购入"公牛之血"剧毒,准备在合适时机毒杀 HO1——以防
        HO1 继承潘神契约导致达芙妮成为下一个献祭对象。她对潘神契约的
        厌恶来自:这个孩子是被潘神附体的安佩利斯**强奸**所留,她日复一日
        地痛恨这个未出生的"怪物"。
      secret_unlock_trigger: clue.bull-blood-poison
      stats:
        str: 60
        con: 50
        siz: 60
        dex: 40
        app: 65
        int: 50
        pow: 60
        edu: 40
        hp: 11
        mp: 10
        san: 35
      voice_guidelines:
        - 语速慢、语调温柔、句末多用"……"作软停顿
        - 听到"潘神""葡萄园""阿多尼斯"等关键词时手帕会被攥得更紧
        - 对达芙妮的安全有过度敏感反应,被威胁时立即从"温和"切到"绝望"
    freedom:
      improvisable_quirks:
        - 时不时下意识抚摸隆起的腹部,然后又像被烫到似的把手收回
        - 谈话间会摩挲腰间一只小银盒(那里装着公牛之血)
      catchphrases: [谢谢你来, 我没事, 这都是上帝的安排]
    forbidden:
      - 不要让玛格丽塔在 PC 没有明显敌对动作之前主动展露杀意
      - 不要替她说出"我恨这个孩子"——这是她的内心戏,只能由玩家通过【心理学】+多次接触推断

  # --------------------------------------------------------------------------
  - id: npc.thalo
    name: 塔洛·特拉西诺斯
    role: 中立
    initial_location: scene.funeral
    initial_attitude: wary
    frame:
      public_persona_md: |
        安佩利斯前妻所生,二十出头的少女。深灰长裙,低头盯地,双手紧握。
        哥哥阿多尼斯是她生命里最重要的人;而阿多尼斯一年前被诊断"癫痫
        发作坠下悬崖",她从未相信这个说法。她对继母玛格丽塔抱有强烈的
        怨恨,却没有任何证据。
      stats:
        str: 70
        con: 60
        siz: 60
        dex: 55
        app: 75
        int: 60
        pow: 60
        edu: 55
        hp: 11
        mp: 10
        san: 40
      voice_guidelines:
        - 不主动开口,只回答必要的问题,常以"嗯""我知道"作答
        - 谈到阿多尼斯时眼眶立刻发红,但不会哭出来
        - 对 HO1 怀有复杂情绪——既有"姐姐回来"的本能依赖,又警惕她"会不会和玛格丽塔一样"
    freedom:
      improvisable_quirks:
        - 总把一束已经枯掉的风信子别在腰间口袋
        - 听见"葡萄园""酒"二字会下意识攥紧裙角
      catchphrases: [我哥哥不是那样的人, 别再来烦我了]
    forbidden:
      - 不要让塔洛直接说出"阿多尼斯被父亲献祭"——她不知道,只是怀疑
      - 不要让塔洛在 PC 没建立信任时透露阿多尼斯的笔记本下落

  # --------------------------------------------------------------------------
  - id: npc.daphne
    name: 达芙妮·特拉西诺斯
    role: 中立
    initial_location: scene.funeral
    initial_attitude: neutral
    frame:
      public_persona_md: |
        玛格丽塔与安佩利斯的女儿,十八岁。穿着朴素的黑衣,面容平静得近乎
        漠然。她对继父之死并不悲伤——他的死意味着自己可能不必嫁给渔民
        阿蒙。她最在意两件事:母亲的安全,以及她秘密的男朋友利昂·奥斐斯。
      secret_md: |
        她与利昂·奥斐斯已秘密交往两年,两人都知道家族联姻的禁忌。利昂为
        了她甚至策划过"在阿蒙婚事敲定前先怀孕造成既成事实"——但达芙妮
        拒绝了这个计划,她想等家族崩塌后光明正大在一起。
      secret_unlock_trigger: clue.daphne-leon-affair
      stats:
        str: 60
        con: 65
        siz: 50
        dex: 60
        app: 65
        int: 65
        pow: 65
        edu: 50
        hp: 11
        mp: 13
        san: 65
      voice_guidelines:
        - 语调克制、礼貌、有距离感,不轻易表态
        - 提到母亲时会立即收紧表情;提到利昂时眼神会软一瞬
        - 即便恐惧也不会失态——她已经习惯"在这个家里活下去"
    freedom:
      improvisable_quirks:
        - 经常用一只手指无意识地划过腕间的银手环(利昂送的)
        - 看到达芙妮父亲的旧物时会瞬间冷笑然后压下去
      catchphrases: [妈妈她需要休息, 我没事]
    forbidden:
      - 不要让达芙妮主动透露与利昂的关系——必须由 PC 用【心理学】观察或【侦查】发现物证

  # --------------------------------------------------------------------------
  - id: npc.leon
    name: 利昂·奥斐斯
    role: 中立
    initial_location: scene.funeral
    initial_attitude: wary
    frame:
      public_persona_md: |
        奥斐斯家最小的儿子,二十岁,容貌俊朗,蛇瞳藏在墨镜下。父亲特里同
        变蛇后,他成为家中的"代理男主人"。性格火爆,见到阿蒙就忍不住
        要打架。代表家族出席安佩利斯的葬礼,但全程拒绝直视棺材。
      secret_md: |
        利昂在阿多尼斯死前一周与他争吵过——阿多尼斯请求他"带塔洛
        一起逃离曼提亚",利昂以"不可能,你有家族责任"拒绝。后来阿多尼斯
        坠崖,利昂始终怀疑那不是意外。他不知道父亲特里同才是凶手。
      secret_unlock_trigger: clue.leon-adonis-quarrel
      stats:
        str: 65
        con: 65
        siz: 65
        dex: 60
        app: 70
        int: 50
        pow: 60
        edu: 50
        hp: 13
        mp: 12
        san: 50
      combat:
        weapon: 自动手枪
        damage_formula: 1D8
        skill_value: 50
      voice_guidelines:
        - 言谈直接、粗鲁,经常打断别人
        - 见到阿蒙时眼神立即变得凶狠;见到达芙妮时则会稍微放软
        - 对 HO2 抱有"姐姐"的依赖,但不愿表现出来
    freedom:
