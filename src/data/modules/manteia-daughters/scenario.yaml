      voice_guidelines:
        - 礼貌、克制、永远微笑;对所有人称呼"先生""女士"
        - 谈到伊莱妮时语速会加快一拍
        - 被威胁时不会激动,而是切到"谈生意"的冷静口吻
    freedom:
      improvisable_quirks:
        - 总在交谈中给对方递烟,尽管自己不抽
        - 习惯轻拍胸前口袋(那里放着阿布霍斯之种小瓶)
      catchphrases: [我们都是文明人, 我相信会有圆满的解决]
    forbidden:
      - 不要让季米特里斯在地下被揭穿前显露任何超自然能力
      - 不要让季米特里斯对 PC 主动展示阿布霍斯之种——除非 PC 已选择加入兄弟会

  # --------------------------------------------------------------------------
  - id: npc.old-director
    name: 老导演德米特里
    role: 平民
    initial_location: scene.theater
    initial_attitude: friendly
    frame:
      public_persona_md: |
        曼提亚剧院的老导演,七十多岁,头发花白,戴一副圆框眼镜。年轻时是
        雅典国家剧院的演员,落叶归根回到曼提亚后接管了剧院。他是岛上少有
        的"知道很多但很谨慎"的人。
      stats:
        str: 50
        con: 50
        siz: 55
        dex: 45
        app: 55
        int: 70
        pow: 60
        edu: 75
        hp: 10
        mp: 12
        san: 60
      voice_guidelines:
        - 言语缓慢,每说一句都要顿一顿
        - 谈到《菲莫诺厄的金枝》时眼神会变得遥远
        - 见到 HO1 时会一瞬怔住——HO1 与已故的小达芙妮(玛格丽塔的姨妈)长得一样
    freedom:
      improvisable_quirks:
        - 总把一支已经写不出字的钢笔别在西装口袋
        - 被问到敏感问题时会慢慢起身去倒水
      catchphrases: [那是很久以前的故事了, 别碰那把剪刀]
    forbidden:
      - 不要让老导演直接说出"命运之裁"法术名;只允许暗示

  # --------------------------------------------------------------------------
  - id: npc.ophis
    name: 俄菲斯
    role: 反派
    initial_location: scene.golden-branch-land
    initial_attitude: hostile
    frame:
      public_persona_md: |
        盘踞在金色月桂树下的远古巨蛇——第一任菲莫诺厄与克苏鲁的子嗣。
        身体盘绕成一座小山,鳞片在金光中呈青黑色。它通常半睡(双眼半阖),
        只在被惊扰、直视或心怀恶意者靠近时睁眼。它的注视即石化。
      stats:
        str: 150
        con: 600
        siz: 100
        dex: 90
        app: 0
        int: 80
        pow: 99
        edu: 0
        hp: 70
        mp: 70
        san: 0
      combat:
        weapon: 噬咬 / 抓握 / 尾击
        damage_formula: 4D6
        skill_value: 90
      voice_guidelines:
        - 几乎从不开口;若开口只用古老的、像气息振动般的语调
        - 对真正的女祭司继承者保持半睡,对亵渎者立即睁眼
        - 不与 PC 进行复杂对话,只判断"虔诚"或"亵渎"
    freedom:
      improvisable_quirks:
        - 鳞片间有微细金粉流动
        - 蜂蜜气味会让它的舌头不自觉伸出
    forbidden:
      - 不要让俄菲斯在 PC 安静靠近时立即睁眼
      - 不要让俄菲斯被普通武器击杀——它的皮肤腐蚀任何近战兵器
      - 不要让俄菲斯被驯服或"友善对话"——它是审判者,不是合作者

# ============================================================================
# clues
# ============================================================================

clues:
  # --------------------------------------------------------------------------
  - id: clue.fate-shadow-vision
    title: 葬礼上的黑影
    frame:
      location_scene: scene.funeral
      discovery: { method: skill, skill: spot-hidden, difficulty: regular }
      reveal_md: |
        在墓园外圈那棵风化老树旁,你看到一抹无风自动的黑色身影。它没有
        面孔,但手腕处一枚金戒指清晰可见。当你视线锁定它的瞬间,它仿佛
        感知到了你,缓缓抬手——指向墓园之外、岛中央的方向。
      kp_note_md: |
        这是阿尔克纳意志(命运的影子)的第一次现身。只对通过【侦查】或
        【灵感】检定的 PC 显形。
    freedom:
      sensory_when_found_md: 它出现的方位下一秒一定会有一片金色叶子飘落。
    forbidden:
      - 不要直接告诉 PC 这是"命运的影子";让玩家自行诠释

  # --------------------------------------------------------------------------
  - id: clue.amber-blood-fertility
    title: 新坟渗出的酒香色血液
    frame:
      location_scene: scene.funeral
      discovery: { method: auto-on-enter }
      reveal_md: |
        第一把土落下后约三秒,新坟下方传来低沉的尖叫,泥土渗出酒香色的
        暗红液体——那不是泥水,是真正的"血"。液体流过新坟,沿途枯萎
        的葡萄藤短暂复活、抽芽,然后又骤然枯死。整个过程不到十秒。
        所有目击者损失 0/1 理智值。
      unlocks:
        flags: [flag.witnessed-amber-blood]
      kp_note_md: |
        这是潘神契约"以血换丰收"的具象——安佩利斯的死并未结束契约,
        因为契约还需要新的载体(伊莱妮)。
    freedom:
      sensory_when_found_md: 液体闻起来有发酵葡萄酒的甜腥,触碰会染指尖,洗不掉。
    forbidden:
      - 不要在 PC 未通过【医学】或【神秘学】检定前,直接说出"那是潘神之血"

  # --------------------------------------------------------------------------
  - id: clue.amphelis-cause-of-death
    title: 安佩利斯死因的疑点
    frame:
      location_scene: scene.funeral
      discovery: { method: skill, skill: psychology, difficulty: regular }
      reveal_md: |
        旁观抬棺的过程,你注意到没有人敢直视棺盖。利昂在抬棺时手指微微
        颤抖——他似乎知道里面的尸体并非完全"完整"。低声打听,你能听到
        老员工的窃窃私语:"院长不是失足,是被人推下去的""他坠崖那天
        晚上,玛格丽塔房里有动静"。
      kp_note_md: |
        这是引导 PC 关注"安佩利斯死因"的钩子。真相是:他被潘神附体后
        强奸了玛格丽塔,玛格丽塔反抗时把他推下崖。
    forbidden:
      - 不要让线索直接揭穿真凶——只能引向"有人推他"的方向

  # --------------------------------------------------------------------------
  - id: clue.will-content
    title: 安佩利斯的遗嘱
    frame:
      location_scene: scene.funeral
      discovery: { method: auto-on-enter }
      reveal_md: |
        律师当众宣读:酒庄全数赠予菲利波家族,前提是马泰奥须于一个月内
        将塔洛与达芙妮嫁出曼提亚永不归岛;若马泰奥未能履行,则由 HO1
        继承,条件相同;达芙妮已被许给渔民阿蒙·加拉斯。
      unlocks:
        flags: [flag.will-announced]
      kp_note_md: |
        这是模组的"政治冲突点"。律师宣读完后,利昂当场与阿蒙起争执。
    forbidden:
      - 不要让律师在棺椁下葬完毕之前提前宣读遗嘱

  # --------------------------------------------------------------------------
  - id: clue.shipwreck-vision
    title: 翻船时的金戒指幻象
    frame:
      location_scene: scene.funeral
      discovery: { method: flag, condition_flag: flag.ho1-active }
      reveal_md: |
        昨夜你乘的渡轮在风暴中翻覆。在沉入水中的瞬间,你看见一枚金戒指
        在黑色海水里旋转,一个无面孔的女人伸手——你抓住她的手,被拽
        出水面。清晨四点,你在曼提亚东岸浅滩醒来,身边没有任何幸存者。
      kp_note_md: |
        HO1(神秘学家)开局即持有此线索。引出"命运的影子"的初次接触。
    forbidden:
      - 不要让 LLM 在叙事中点明"她是阿尔克纳的化身"

  # --------------------------------------------------------------------------
  - id: clue.gold-ring-dream
    title: 金戒指的梦境
    frame:
      location_scene: scene.funeral
      discovery: { method: auto-on-enter }
      reveal_md: |
        最近两周,岛上几乎所有女人都做着同一个梦:一枚金戒指在黑暗中
        缓缓旋转,像在水里漂浮。伸手去抓,它穿过手指、穿过黑暗,最后
        落到一张儿童床上,或一片葡萄园里,或一座教堂的圣像屏后方。
        镇上女人见面便会比对梦境的细节。
      kp_note_md: |
        HO2、HO3 开局即持此线索。这是模组"集体无意识"的钩子。
    freedom:
      sensory_when_found_md: 醒来后枕头上常会留下一缕淡淡的、并非自己使用的香膏味。
    forbidden:
      - 不要让梦境的细节"完全一致"——每个 PC 的梦应有 1~2 处个体差异

  # --------------------------------------------------------------------------
  - id: clue.prophecy-text
    title: 菲莫诺厄的预言
    frame:
      location_scene: scene.filipo-house
      discovery: { method: auto-on-enter }
      reveal_md: |
        "**当金环自鱼腹重见天日,三座高门将在血中倾颓。**
        **火焰吞噬父兄之名,海水淹没丈夫的坟。曼提亚重现菲莫诺厄。**"

        伊莱妮今早醒来后反复念诵这段话,声调没有抑扬,像在背书。
      unlocks:
        flags: [flag.prophecy-known]
      kp_note_md: |
        HO3 开局即持此线索。预言将逐字逐句在模组中应验:
        - '"金环自鱼腹"(渔民阿蒙在鱼腹中找到金戒指)'
        - '"三座高门血中倾颓"(三大家族男主皆死)'
        - '"火焰吞噬父兄之名"(菲利波焚化炉烧毁实验记录)'
        - '"海水淹没丈夫的坟"(灯塔涨潮淹没特里同变蛇后被困处)'
    forbidden:
      - 不要让 LLM 在玩家未触发 timeline 节点前,主动逐条对应这段预言

  # --------------------------------------------------------------------------
  - id: clue.pan-blood-jug
    title: 潘神之血专用酒壶
    frame:
      location_scene: scene.trasinos-winery
      discovery: { method: skill, skill: spot-hidden, difficulty: regular }
      reveal_md: |
        厨房灶台后方一只古铜色酒壶。壶身浮雕酒神节场景:男女围圈起舞,
        中央一个吹双管笛的羊腿人形。壶内残留少量浓稠暗红液体,质地比酒
        更稠重。倒一杯尝下,任何体质的人喝一杯都会醉倒,当晚梦见潘神。
    freedom:
      sensory_when_found_md: 提起壶时手心会感到不属于金属的微微温度。
    forbidden:
      - 不要直接说出"潘神之血是真的血"——必须由 PC 通过【医学】或【灵感】关联

  # --------------------------------------------------------------------------
  - id: clue.adonis-prophecy-diary
    title: 阿多尼斯的预言笔记
    frame:
      location_scene: scene.trasinos-winery
      discovery: { method: skill, skill: spot-hidden, difficulty: regular }
      reveal_md: |
        从阿多尼斯床与墙的夹缝中找到的笔记本。字迹歪扭潦草,记录了未来
        若干日期与"该做的事":"7 月 19 日,葬礼,血会从土里渗出";
        "7 月 21 日,父亲会变成不是父亲"——但写到此处便戛然而止。
      kp_note_md: |
        阿多尼斯能看见未来片段,但看不清事件起源。给玩家"预言可读"的实感。
    freedom:
      sensory_when_found_md: 笔记纸面有一处暗淡的褐色指印,像是用沾血的手指翻过。
    forbidden:
      - 不要让阿多尼斯笔记里的"未来"全部直白——保留 30% 模糊与暗示

  # --------------------------------------------------------------------------
  - id: clue.cliff-edge-traces
    title: 悬崖边的凌乱脚印
    frame:
      location_scene: scene.trasinos-winery
      discovery: { method: skill, skill: track, difficulty: regular }
      reveal_md: |
        酒庄后山坡崖边的泥地上,凌乱脚印分作两组:一组属于安佩利斯的
        皮鞋,一组属于女鞋(带后跟,不属于塔洛或达芙妮)。崖边一只
        摔碎的酒瓶,瓶口残留着潘神之血的甜腥。
      unlocks:
        flags: [flag.cliff-traces-found]
    freedom:
      sensory_when_found_md: 雨水冲走了大半,但碎瓶的玻璃在泥里发着冷光。
    forbidden:
      - 不要直接揭示女鞋属于 HO3——这必须通过其他线索串联

  # --------------------------------------------------------------------------
  - id: clue.thalo-margarita-quarrel
    title: 塔洛与玛格丽塔的争吵
    frame:
      location_scene: scene.trasinos-winery
      discovery: { method: skill, skill: listen, difficulty: regular }
      reveal_md: |
        在 HO1 入住阿多尼斯卧室后,塔洛与玛格丽塔在二楼回廊大吵。塔洛
        指责玛格丽塔"不喜欢继母前任的孩子",并暗示"阿多尼斯的死与你
        脱不了干系"。玛格丽塔哭了,但没否认也没承认。
    forbidden:
      - 不要让 PC 因此立即认定玛格丽塔是凶手——她不是凶手,只是知情者

  # --------------------------------------------------------------------------
  - id: clue.nikolas-old-warning
    title: 尼古拉神父的警告
    frame:
      location_scene: scene.santamaria-church
      discovery: { method: npc-give, giver_npc: npc.father-nikolas }
      reveal_md: |
        在 HO1 询问母亲或特拉西诺斯家族事情后,神父犹豫片刻全盘托出:
        "特拉西诺斯拜一个叫潘的东西,不是希腊神话那个,是魔鬼。他们
        用血浇葡萄藤,用长子换丰收。这就是我知道的全部。你不该回来。"
    forbidden:
      - 不要让神父主动开口——必须由 HO1 主动询问

  # --------------------------------------------------------------------------
  - id: clue.church-construction-record
    title: 教堂修缮记录
    frame:
      location_scene: scene.santamaria-church
      discovery: { method: skill, skill: library-use, difficulty: regular }
      reveal_md: |
        中世纪手抄本残页:公元 10 世纪建造圣玛丽亚教堂时,工人挖出
        "栩栩如生的石像和大蛇"。神父命令砸毁石像、杀死大蛇,但被
        本地的特拉西诺斯与奥斐斯家族阻止。手抄本附图绘有一个由三根
        石柱构成的"三柱拱"。
    freedom:
      sensory_when_found_md: 羊皮纸边角发黄、墨迹晕开,空气里有干石灰的味道。
    forbidden:
      - 不要让 PC 看到"克苏鲁"或"俄菲斯"专名——只允许"巨蛇""异教"

  # --------------------------------------------------------------------------
  - id: clue.fate-cutting-spell
    title: 命运之裁残卷
    frame:
      location_scene: scene.santamaria-church
      discovery: { method: skill, skill: library-use, difficulty: hard }
      reveal_md: |
        被虫腐蚀得只剩半卷的古老卷轴。模糊记载着名为【命运之裁】的法术:
        以银剪朝目标方向作剪断动作,念阿尔克纳之名,目标体内的"命运
        之缕"被剪断,造成 3D10 点无视护甲的伤害与"命运迷失"状态。
        消耗:15 MP / 1D8 SAN。
    freedom:
      sensory_when_found_md: 卷轴一展开就有一缕细灰从裂口飘出,像是字迹的一部分掉了下来。
    forbidden:
      - 不要让法术在玩家未投出【图书馆使用】检定前自动呈现

  # --------------------------------------------------------------------------
  - id: clue.shipwreck-stones
    title: 仓库里的栩栩如生石像
    frame:
      location_scene: scene.orphys-port
      discovery: { method: auto-on-enter }
      reveal_md: |
        港口仓库存放着十余尊一人高的石像,每一尊面容都是惊恐与溺水的
        神态。HO1 能在其中认出一张"昨夜与自己同船的男乘客"的脸——
        他不是被淹死的,他是**变成了石头**。目睹损失 0/1 SAN。
    forbidden:
      - 不要让石像在场景中"动"——它们的恐怖在于"凝固的瞬间"

  # --------------------------------------------------------------------------
  - id: clue.shipwreck-bottom-hole
    title: 圣尼古拉斯号的船底破洞
    frame:
      location_scene: scene.orphys-port
      discovery: { method: skill, skill: spot-hidden, difficulty: regular }
      reveal_md: |
        阿蒙打捞上来的船底残片:破洞边缘呈"由外向内"撞击的形状,洞口
        直径超过两米。任何熟悉海事或生物学的人都能判断这不是触礁,而是
        被某种**巨型生物**撞穿的。
    forbidden:
      - 不要点明撞穿者就是俄菲斯——只允许 PC 自行联想

  # --------------------------------------------------------------------------
  - id: clue.lighthouse-keeper-rumor
    title: 灯塔守灯人的传闻
    frame:
      location_scene: scene.orphys-port
      discovery: { method: skill, skill: persuade, difficulty: regular }
      reveal_md: |
        港口员工低声说:除奥斐斯家族外没人见过守灯人,但灯塔一直正常
        运作,偶尔能看见模糊的人影。物资由奥斐斯家专人运送,从今年起
        特里同没再去过,反而说"要重新招聘守灯人"。员工们怀疑"是不是
        守灯人已经死在里面了"。
      unlocks:
        flags: [flag.lighthouse-rumor-known]
    forbidden:
      - 不要让员工直接说出"艾奇德娜"或"奥斐斯禁忌"——他们不知道

  # --------------------------------------------------------------------------
  - id: clue.empty-ring-box
    title: 地下室空了的金戒指保管箱
    frame:
      location_scene: scene.filipo-house
      discovery: { method: skill, skill: locksmith, difficulty: regular }
      reveal_md: |
        菲利波家地下室,一只 18 世纪定制的金属保管箱,内壁衬丝绒。
        丝绒上有一处明显的金戒指压痕,但戒指已经不在。灰尘里有一组
        清晰的指印——属于一个手指比较细长的男性。
      unlocks:
        flags: [flag.ring-missing]
    freedom:
      sensory_when_found_md: 地下室空气干冷,保管箱锁芯里有微量铁锈与极新的指纹油渍并存。
    forbidden:
      - 不要让 PC 立即关联指印是马泰奥的——必须配合书房日记或【心理学】

  # --------------------------------------------------------------------------
  - id: clue.mateo-diary
    title: 马泰奥的私人日记
    frame:
      location_scene: scene.filipo-house
      discovery: { method: skill, skill: spot-hidden, difficulty: hard }
      reveal_md: |
        马泰奥书房抽屉夹层中的小本子。最近半年的记录密密麻麻:
        - '"她又去山坡了。我装作不知道。"'
        - '"伊莱妮的鼻梁、眉骨,一天比一天像那个酒鬼。"'
        - '"金戒指要被卖掉。如果伊莱妮不能在三个月内觉醒,我就把它送出去。"'
        - '"如果她觉醒——那就再撑一阵。"'
      unlocks:
        secrets: [npc.mateo]
        flags: [flag.mateo-secret-known]
    freedom:
      sensory_when_found_md: 日记本封面磨得起毛,夹页里掉出一张被反复折叠的伊莱妮婴儿照。
    forbidden:
      - 不要让日记直接揭示"阿布霍斯之种"——那一线索属于医院文件室

  # --------------------------------------------------------------------------
  - id: clue.creditor-letter
