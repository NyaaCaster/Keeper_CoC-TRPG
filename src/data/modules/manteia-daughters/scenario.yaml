# ============================================================================
# endings
# ============================================================================

endings:
  # --------------------------------------------------------------------------
  - id: ending.tpk
    title: 命运的祭品
    triggers:
      - { flag: flag.party-wiped, value: true }
    priority: 100
    frame:
      epilogue_md: |
        曼提亚的预言不接受拒绝。试图阻挡命运齿轮的人,最终成为齿轮的
        润滑油。三个月后,新的菲莫诺厄从某位寡妇腹中降生,而你们的名字
        将成为镇上母亲哄睡孩子时不肯说出口的"那些人"。
      scenario_end_kind: dead
      rewards:
        skill_growth: false
    freedom:
      atmosphere_md: 海风、墓园新坟、远处灯塔规律的旋转光斑、潘神的笛声从山中飘来。
    forbidden:
      - 不要替死去的调查员写"灵魂归乡"——克系不允许这种安慰

  # --------------------------------------------------------------------------
  - id: ending.became-pythia-with-rescue
    title: 成为菲莫诺厄 · 全员生还
    triggers:
      - { flag: flag.became-pythia, value: true }
      - { flag: flag.golden-branch-broken, value: true }
    priority: 90
    frame:
      epilogue_md: |
        金枝在你掌心轻轻折断。无数女人的声音在耳边低语,整座岛屿的
        命运在你掌纹间流转。你成为新的菲莫诺厄——曼提亚名义上的
        女王。三大家族男主已死,但你以阿尔克纳的女祭司之名,以
        【女祭司】之力修改了那一段预言:同行的调查员都活了下来。
        胜利不洁净,但它确实是胜利。
      scenario_end_kind: victory
      rewards:
        skill_growth: true
        san_reward_formula: "1D6"
        san_reward_conditions:
          - { label: 阻止三大家族男主全部凋零, flag: flag.three-houses-fallen, formula: "1D4" }
          - { label: 揭穿净化兄弟会的实验真相, flag: flag.brotherhood-known, formula: "1D4" }
        cash_reward: 1000
    freedom:
      atmosphere_md: 黎明、海风把金叶吹散到整片葡萄园、远方钟声、命运齿轮缓缓校准。
    forbidden:
      - 不要把"成为女王"写得轻松——金戒指会钳住你的手指,只有死亡才能松动它

  # --------------------------------------------------------------------------
  - id: ending.fled-mantia
    title: 逃离曼提亚
    triggers:
      - { flag: flag.fled-mantia, value: true }
    priority: 60
    frame:
      epilogue_md: |
        当海风把岛屿轮廓推到地平线之外,你才敢回头看一眼。曼提亚的
        预言会照样应验——只是你不再是其中一颗齿轮。从此每个雨夜,
        你都会梦到金戒指在水里旋转,以及一个无面孔的女人伸手。
        你没有去抓那只手。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: "1D3"
    freedom:
      atmosphere_md: 渡轮甲板、海雾、远处灯塔最后一次旋转、口袋里湿透的船票。
    forbidden:
      - 不要给"以后再回来救人"的承诺——克系的逃离是单向的

  # --------------------------------------------------------------------------
  - id: ending.witnessed-fall
    title: 三大家族之死(旁观者)
    triggers:
      - { flag: flag.three-houses-fallen, value: true }
      - { flag: flag.golden-branch-broken, value: false }
    priority: 50
    frame:
      epilogue_md: |
        金戒指最终落到另一位女人手中。预言一字不差地应验:特拉西诺斯、
        奥斐斯、菲利波三家男主皆死,旧秩序在血与海水里倾颓。你站在
        废墟边缘,知道自己**本可以**成为那个继承者,但你没有伸手。
        若干年后,曼提亚仍在,但已不属于你认识的人。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: "1D4"
    freedom:
      atmosphere_md: 雨后泥土、烧黑的医院废墟、新一任菲莫诺厄的背影远远走过山脊。
    forbidden:
      - 不要把"本可以阻止"写成"必然失败"——保留 PC 当时确实做出选择的余地

# ============================================================================
# global_freedom / global_forbidden
# ============================================================================

global_freedom:
  era_atmosphere_md: |
    1920 年代希腊南部小岛。希土战争背景下,男人被征兵带走,女人成为
    岛屿事实上的支撑。日常物件:亚麻丧服、橄榄油灯、青铜酒壶、铜钥匙、
    山羊奶酪、没有冰箱的厨房、电报与油印报纸,以及最初一两台进口的
    打字机。1920 年的曼提亚岛上没有汽车,主要交通工具是骡车与渔船;
    电力刚刚铺到镇上,医院与灯塔有自家的发电设备。
  language_register: |
    现代书面中文翻译式叙事,允许少量希腊语词原音译写(如"芙提妮""阿尔克纳"
    "菲莫诺厄""阿尔克纳之口")。避免现代网络用语、避免成语堆砌、避免
    "刹那""少顷"等过度文言;保留古希腊神话风格的克制典雅。
  npc_default_dialect: |
    岛民日常用希腊语;对外人(HO1 等返岛者)略带北希腊口音的中文译法。
    神父与律师讲究句法,渔民阿蒙用渔民俚语,孩子伊莱妮用奶声奶气的句子。

global_forbidden:
  - 不要主动报出"克苏鲁""阿尔克纳""阿布霍斯""菲莫诺厄"等专名,除非 PC 已通过对应线索读到——遵守 SYSTEM_INSTRUCTION 第 8 节"谜语人原则"
  - 不要让任何 NPC 主动揭穿自己的核心秘密(玛格丽塔的毒杀、马泰奥的实验、阿蒙的身世、利昂的杀人疑云)
  - 不要让"命运的影子"对未通过【侦查】或【灵感】检定的 PC 显形
  - 不要让超自然现象在岛上日常时刻随意出现——只在 timeline 节点、洞穴深处与金枝之夜显形
  - 不要在叙事中跳过"互动门槛"直接推进 timeline——尤其葬礼与下葬节点必须按本表声明的时间触发
  - 不要替 PC 做出"成为菲莫诺厄/逃离/牺牲队友"的最终抉择——这必须留给玩家
  - 不要把孕妇、孩子、女性身体描写为奇观——本模组的恐怖是命运与契约,不是身体

# ============================================================================
# narrative_style:LLM 扮演 KP 时的文风指导
# 设计哲学:一段示范段落 > 十条抽象规则;frame=必须遵守 / freedom=可挑用。
# ============================================================================

narrative_style:
  frame:
    pov: 第二人称
    tense: 现在时
    forbidden_phrasings:
      - 不要写"调查员投出了【侦查】"等元游戏术语
      - 不要使用第四面墙之外的全知评论(例:"读者可能猜到")
      - 不要用"突然""忽然"作为廉价惊吓的开头,改用具体感官变化
      - 不要直接评判 NPC 善恶——保留判断给玩家
  freedom:
    sentence_pacing_md: |
      探索段落用 25~50 字短句,逗号断句多,留白多,让物件与潮气慢慢
      压上来;雨夜与超自然瞬间允许长句铺陈,但不超过两句;受惊或战斗
      切到 8~14 字短句,用换行营造呼吸顿挫。
    vocabulary_register: |
      古希腊海岛克制式中文叙事。允许的具象词:盐分、潮气、橄榄油、
      松脂、青铜、霉味、葡萄藤、风信子、蜡烛、苔石、雾、低海面、
      渡轮汽笛、铁锚、磨损的木窗台。避免成语堆叠、避免现代心理学
      术语、避免互联网比喻。
    metaphor_palette:
      - 风信子在墓前枯萎成褐色——颜色不像一种花
      - 葡萄藤的影子在墙上画出弯曲的字——读不出来,但你知道它在写什么
      - 远处灯塔的光斑掠过窗台——节奏不像人在按
      - 海浪的低频共鸣从灯塔基座传上来——像有什么在地下呼吸
      - 金戒指在梦里旋转——慢得像在水里漂浮
      - 母亲压抑住的呼吸,在身后比说话还响
      - 葬礼上焚烧的乳香——熏得人想退后一步
    reference_works:
      - 帕特里克·怀特《风暴之眼》——海岛家族叙事的克制感
      - 玛格丽特·阿特伍德《珀涅罗珀记》——古希腊神话的当代女性视角
      - 阿喀琉斯·塔提乌斯《琉西帕斯与克利托方的故事》——古希腊语调的句式参考
      - 菲利普·普尔曼《黑暗物质》——命运、宗教、女性觉醒的叙事节奏
    sample_paragraph_md: |
      雨没有停。海风从东边压过来,带着雨后泥土的腥气和远处葡萄园的甜腥。
      你低头,看见自己鞋尖陷进新翻的土里——红得不像泥。
      第一把土落下时,坟下传来一声极低的尖叫,像有人闭着嘴在唱。
      然后——你看见那液体从土里渗出来,顺着新坟的边缘流过去,
      流过去的地方,枯死的葡萄藤抽出了短短的新芽。又枯死。

