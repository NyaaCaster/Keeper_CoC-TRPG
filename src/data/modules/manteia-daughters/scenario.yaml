  - id: npc.mateo
    name: 马泰奥·菲利波
    role: 反派
    initial_location: scene.funeral
    initial_attitude: friendly
    frame:
      public_persona_md: |
        菲利波家族当家,四十出头,曼提亚医院院长。曾在希军中担任军医,
        谈吐儒雅,对岛上所有人礼貌得过分。镇民称他为"调解人"——大家
        以为他是世俗版本的尼古拉神父。
      secret_md: |
        他是**净化兄弟会**的中级修士,六年前以菲利波医院为名义,从兄弟会
        骗取大额经费,但研究全部失败。他偷偷在医院地下一层用动物做阿布霍斯
        实验。两周前他**故意拿金戒指出海"想卖了它"**,但船翻在风暴中——
        他不知道这件事直接催发了岛上一切诅咒的"再生效"。
      secret_unlock_trigger: clue.true-bloodline-study
      stats:
        str: 60
        con: 70
        siz: 60
        dex: 50
        app: 75
        int: 75
        pow: 80
        edu: 80
        hp: 13
        mp: 16
        san: 70
      combat:
        weapon: .45 自动手枪
        damage_formula: 1D10+2
        skill_value: 65
      voice_guidelines:
        - 语调轻柔有教养,擅长用医学术语让对方"听不懂但安心"
        - 谈到伊莱妮时表情会瞬间柔软,然后立刻变回职业性的克制
        - 对 HO3 过度礼貌,实际是恐惧——他怕妻子已经知道一切
    freedom:
      improvisable_quirks:
        - 谈话时会下意识把袖口往下拉,遮住手腕的一道旧针刺纹路(净化兄弟会标记)
        - 听到"季米特里斯"会立即转换话题
      catchphrases: [一切都好, 我会处理, 让她休息]
    forbidden:
      - 不要让马泰奥在 PC 没掌握"地下一层""阿布霍斯之种""金戒指抵债"任一线索前主动坦白
      - 不要让马泰奥在医院之外动用手枪——他更倾向"用语言瓦解对方"

