  - id: flag.mateo-secret-known
    title: 已知马泰奥的伪造研究
    initial: false
    description_md: PC 已读到马泰奥的私人日记或地下一层伪造记录。

  - id: flag.brotherhood-known
    title: 已知净化兄弟会
    initial: false
    description_md: PC 已确认季米特里斯背后是净化兄弟会,与马泰奥有合谋。

  - id: flag.bloodline-research-found
    title: 已知血缘魔力研究
