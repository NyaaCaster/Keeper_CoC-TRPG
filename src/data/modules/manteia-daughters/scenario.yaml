    frame:
      location_scene: scene.filipo-hospital
      discovery: { method: skill, skill: medicine, difficulty: hard }
      reveal_md: |
        新世代计划进度报告。封面印雅典医疗慈善基金会标志,内容声称已对
        数十名孕妇进行"种植"实验,胎儿发育正常。但任何医学专业的人
        都能看出报告在以专业术语**编造数据**——产检记录的时间序列
