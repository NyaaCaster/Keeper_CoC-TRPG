meta:
  id: manteia-daughters
  title: 曼提亚的女儿们
  era: 1920s
  language: zh-CN
  difficulty: 高强度
  tags: [古希腊, 海岛, 家族悲剧, 心理战, 命运]
  cover: assets/cover.jpg
  start_time: { game_day: 1, hour: "14:00" }
  synopsis_md: |
    1920 年盛夏,希土战争已进入第二年。爱琴海的航线日渐萧条,
    征兵令把男人从港口一个个抽走。在基克拉泽斯群岛边缘的小岛
    **曼提亚** 上,三大家族(特拉西诺斯、奥斐斯、菲利波)守着
    世代相传的秘密与积怨。**七月中旬**,人们在海崖下发现了特拉西
    诺斯家主安佩利斯的尸体,官方说法是酒后失足坠崖。如今,葬礼
    即将举行——而对你而言,这场葬礼有着别样的意义。
  author_credits_md: |
    原作者:红色小鸟。本模组为合作创作企划《圣卡琳娜的大秘仪》Ⅱ期
    第二号「女祭司」卡牌模组。本项目转写:Keeper_CoC-TRPG。
  recommended_occupations:
    - 神秘学家
    - 教授
    - 记者
    - 医师
    - 私家侦探
  recommended: false

# ============================================================================
# hook
# ============================================================================

hook:
  start_scene: scene.funeral
  prologue_md: |
    1920 年 7 月 18 日,曼提亚岛。岛上三大家族的恩怨延续了千年:
    最后一位**菲莫诺厄**(古代女先知)死前留下一枚金戒指与一条
    预言——「**当金环自鱼腹重见天日,三座高门将在血中倾颓。
    火焰吞噬父兄之名,海水淹没丈夫的坟。曼提亚重现菲莫诺厄。**」
    两周前,这枚被菲利波家保管了九个世纪的金戒指,因一场翻船事故
    遗落海中;一周前,渔民阿蒙从鱼腹中再次拾起它。同时,葡萄园
    枯萎、女人们集体梦见金戒指、特拉西诺斯家主死于悬崖之下。
    今天下午两点,他的葬礼即将在家族墓园举行。三大家族的现任主妇
    与子嗣都将到场。
  call_to_action_md: |
    今天下午两点,你将出席安佩利斯·特拉西诺斯的葬礼。雨还未停,
    海风带着咸湿与泥土的气味掠过墓园。你来到这里各有理由——也许
    是血缘,也许是责任,也许是那个一直回旋在梦里的金戒指。
  default_initial_clues: []
  occupation_variants:
    "神秘学家":
      call_to_action_md: |
        【HO1·特拉西诺斯的姐妹】你是岛上三大家族特拉西诺斯的长女,
        当今家主安佩利斯是你失散多年的弟弟。你出生即被母亲送离曼提亚
        交给外祖父母抚养,他们警告你"那是魔鬼与异教徒的岛屿"。十五年
        来你从未踏足出生地。直到外祖父母去世、希土战争爆发,你收到
        嫂子玛格丽塔的信:弟弟酒醉坠崖,家中无男丁,请你回岛参加
        葬礼,商议遗产。在青春期觉醒的那项**未知能力**,曾让外祖父母
        把你拖进教堂驱邪而无果——它仍蛰伏在你身上。
        昨夜你乘渡轮自比雷埃夫斯港出发,夜半遭遇暴风雨,船只翻覆。
        清晨四点,你在曼提亚东岸浅滩醒来。
      initial_clues: [clue.shipwreck-vision]
    "教授":
      call_to_action_md: |
        【HO3·菲利波的妻子】你是菲利波家族当家马泰奥·菲利波的妻子,
        曼提亚岛公认的"调解人"——镇上妇女最常向你倾诉的对象。你
        与丈夫之间的关系日渐冷淡,过去四年来,你每周三次在黄昏时分,
        到特拉西诺斯葡萄园尽头的山坡与安佩利斯·特拉西诺斯幽会。你
        与他有一个四岁的女儿伊莱妮——尽管伊莱妮挂着菲利波的姓。前天
        傍晚,你因医院账目与丈夫争执,推迟了与安佩利斯的约会;次日
        清晨便收到他坠崖的死讯。今早醒来,马泰奥不在床上;隔壁儿童房
        传来伊莱妮异常的哭声——她正在反复念诵那句你也梦过无数次的
        古老预言。
      initial_clues: [clue.gold-ring-dream, clue.prophecy-text]
    "记者":
      call_to_action_md: |
        【HO2·奥斐斯的女儿】你是岛上三大家族奥斐斯的次女,当今家主
        特里同·奥斐斯的女儿,二十出头。你的家族世代守着一种"血脉
        遗传病":奇异的蛇瞳、低体温、惊人的水性,以及五十岁时彻底
        蜕去人形的归宿。听说,奥斐斯曾是一个大家族,但不知从何时起,
        只剩你父亲这一脉。今天清晨,父亲变成蛇盘在主卧床上;哥哥
        基莫一周前为躲避征兵躲进山洞与外界失联;弟弟利昂彻夜未归。
        港口调度员凌晨派学徒来敲你的门——风暴中一艘客货船在外海
        翻覆。你必须以代理家主身份处理港口事务。你常年用记笔记本
        记录岛上家族秘密,这是父亲教你的习惯。
      initial_clues: [clue.gold-ring-dream]
    "医师":
      call_to_action_md: |
        【HO3·菲利波的妻子】你是菲利波家族当家马泰奥·菲利波的妻子,
        受过基础助产与急救训练。曼提亚岛公认的"调解人"——镇上妇女
        最常向你倾诉的对象。你与丈夫之间的关系日渐冷淡,过去四年来,
        你每周三次在黄昏时分,到特拉西诺斯葡萄园尽头的山坡与安佩利斯
        ·特拉西诺斯幽会。你与他有一个四岁的女儿伊莱妮——尽管伊莱妮
        挂着菲利波的姓。前天傍晚,你因医院账目与丈夫争执,推迟了与
        安佩利斯的约会;次日清晨便收到他坠崖的死讯。今早醒来,马泰奥
        不在床上;隔壁儿童房传来伊莱妮异常的哭声——她正在反复念诵
        那句你也梦过无数次的古老预言。
      initial_clues: [clue.gold-ring-dream, clue.prophecy-text]
    "私家侦探":
      call_to_action_md: |
        【HO2·奥斐斯的女儿】你是岛上三大家族奥斐斯的次女,二十出头。
        你的家族世代守着一种"血脉遗传病":奇异的蛇瞳、低体温、惊人
        的水性,以及五十岁时彻底蜕去人形的归宿。今天清晨,父亲变成蛇
        盘在主卧床上;哥哥基莫一周前为躲避征兵躲进山洞;弟弟利昂彻夜
        未归。港口调度员凌晨派学徒来敲你的门——风暴中一艘客货船在
        外海翻覆。你必须以代理家主身份处理港口事务,同时调查家族正在
        发生的一切。
      initial_clues: [clue.gold-ring-dream]

