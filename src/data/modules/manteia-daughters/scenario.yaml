      discovery: { method: skill, skill: spot-hidden, difficulty: hard }
      reveal_md: |
        玛格丽塔卧室梳妆台抽屉夹层一只小银盒,内装暗红色粉末,标签
        写着"公牛之血"——希腊民间剧毒,可掺入酒中无色无味,饮后
        二十分钟血液凝固致死。盒底一张小纸条:"为了达芙妮,我必须
        亲手做这件事。"
      unlocks:
        secrets: [npc.margarita]
        flags: [flag.poison-known]
    forbidden:
      - 不要让 PC 直接见到玛格丽塔下毒——这必须是事前发现

  # --------------------------------------------------------------------------
  - id: clue.iraini-goat-eye
    title: 伊莱妮的羊瞳
    frame:
      location_scene: scene.filipo-house
      discovery: { method: auto-on-enter }
      reveal_md: |
        在儿童房,伊莱妮睡着醒来的瞬间,她的眼睛短暂地呈现金色羊瞳——
        瞳孔是横向的椭圆,虹膜是温暖的金色。眨眼后立即恢复正常人类
        眼睛。目睹损失 0/1 SAN。
      unlocks:
        secrets: [npc.iraini]
    forbidden:
      - 不要让羊瞳"持续显现"——只允许"睡着醒来的瞬间"或"金戒指出现时"

# ============================================================================
# timeline(7e 线性日历;按"游戏天 + 时段"组织,关键节点明文化)
# 起点 = 第 1 天 14:00(葬礼);第 3 天 21:00 = 先知以利亚日 / 金枝之夜。
# ============================================================================

timeline:
  # --------------------------------------------------------------------------
  - id: tl.d1-funeral-amber-blood
    title: 第一天 · 14:30 · 新坟渗出酒香色血液
    fires_when: { game_day: 1, hour: "14:30" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        第一把土落下时,新坟下方传来三秒的低沉尖叫。继而,泥土中渗出
        酒香色的暗红液体,流过新坟与阿多尼斯墓基,沿途枯萎葡萄藤短暂
        抽芽又随即枯死,过程不到十秒。所有目击者损失 0/1 SAN。
      effects:
        setFlags:
          - { flag: flag.witnessed-amber-blood, value: true }
        sanCheck:
          loss: { success: 0, fail: "1" }
          reason: 目睹新坟渗出酒香色血液与葡萄藤的瞬间复活枯萎

  # --------------------------------------------------------------------------
  - id: tl.d1-will-announcement
    title: 第一天 · 15:00 · 律师宣读遗嘱
    fires_when: { game_day: 1, hour: "15:00" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        在 [tl.d1-funeral-amber-blood] 之后,葬礼即将散场之际,律师上前
        当众宣读安佩利斯的遗嘱:酒庄全数赠予菲利波家族,前提是马泰奥须于
        一个月内将塔洛与达芙妮嫁出曼提亚永不归岛;若马泰奥未能履行,则由
        HO1 继承,条件相同;达芙妮已被许给渔民阿蒙·加拉斯。利昂当场与
        阿蒙起争执,几乎打了起来。
      effects:
        setFlags:
          - { flag: flag.will-announced, value: true }

  # --------------------------------------------------------------------------
  - id: tl.d2-morning-shipwreck
    title: 第二天 · 08:00 · 港口仓库石像被发现
    fires_when: { game_day: 2, hour: "08:00" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        圣尼古拉斯号船难第二天早晨,阿蒙又拖回三尊石像。仓库的麻布盖不住
        了,镇上人开始议论"这不是雕塑,是被淹死的人"。HO2 作为代理家主
        必须出面应对舆论。

  # --------------------------------------------------------------------------
  - id: tl.d2-noon-newspaper
    title: 第二天 · 12:00 · 镇上张贴"先知以利亚日"庆典公告
    fires_when: { game_day: 2, hour: "12:00" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        中午,圣玛丽亚教堂在镇广场张贴明日(7 月 21 日)先知以利亚日
        庆典公告:上午圣餐礼,下午游行,夜间剧院将上演《菲莫诺厄的金枝》。
        镇上女人三三两两交谈起昨夜的金戒指梦。

  # --------------------------------------------------------------------------
  - id: tl.d2-evening-mateo-meeting
    title: 第二天 · 19:00 · 季米特里斯夜访菲利波医院
    fires_when: { game_day: 2, hour: "19:00" }
    forced: false
    prerequisites:
      - { kind: clue, clue: clue.creditor-letter }
    frame:
      narrative_seed_md: |
        季米特里斯夜访菲利波医院,与马泰奥在地下一层办公室密谈。话题不再
        是债务,而是"伊莱妮的觉醒进度"。如果 PC 此时潜伏在医院,可能
        听到关键对话。
      effects:
        setFlags:
          - { flag: flag.brotherhood-known, value: true }

  # --------------------------------------------------------------------------
  - id: tl.d3-morning-festival
    title: 第三天 · 09:00 · 先知以利亚日庆典开始
    fires_when: { game_day: 3, hour: "09:00" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        7 月 21 日清晨,圣玛丽亚教堂钟声响遍全岛。镇上人陆续涌入广场。
        奇怪的是,玛格丽塔今早未起床——她"高烧不退",由达芙妮代为
        出席。塔洛则消失了。

  # --------------------------------------------------------------------------
  - id: tl.d3-evening-golden-branch-night
    title: 第三天 · 21:00 · 金枝之夜启动
    fires_when: { game_day: 3, hour: "21:00" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        天黑之后,曼提亚山被一种说不清的低沉嗡鸣笼罩。"命运的影子"
        在岛上多处同时显形,引导持有金戒指 / 已知预言 / 蛇瞳血脉的女性
        前往**阿尔克纳之口**。**金枝之地**通道开启,试炼者将面对俄菲斯。
      effects:
        setFlags:
          - { flag: flag.golden-branch-route-known, value: true }
        unlockScenes:
          - scene.golden-branch-land

# ============================================================================
