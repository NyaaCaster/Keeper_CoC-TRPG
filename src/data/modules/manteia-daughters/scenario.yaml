        - 焦虑时会反复摘下又戴上墨镜
      catchphrases: [那条狗(指阿蒙)别想碰她, 这事让我处理]
    forbidden:
      - 不要让利昂主动揭穿父亲特里同变蛇的真相——他自己也未必想接受
      - 不要让利昂在医院或港口动用手枪除非被攻击

  # --------------------------------------------------------------------------
  - id: npc.amon
    name: 阿蒙·加拉斯
    role: 对立
    initial_location: scene.funeral
    initial_attitude: wary
    frame:
      public_persona_md: |
        三十出头的渔民,身材健壮,脸上有海风刻下的沟壑。是岛上唯一敢在
        "芙提妮"台风期出海的人。他不属于三大家族任何一支,却出现在
        葬礼现场——此举令利昂十分不快。手中常攥着一只装满银币的小皮袋。
      secret_md: |
        他是被三大家族联手追杀的女巫**芙提妮**之子,从小被秘密寄养在
        渔民家庭。他知道母亲的诅咒、知道金戒指的传说、知道艾奇德娜的
        存在。他想娶达芙妮的真实理由是"为母亲收回这一脉的血债"——
        通过让自己的孩子成为下一任三大家族继承者来"反向继承诅咒"。
      secret_unlock_trigger: clue.amon-true-origin
      stats:
        str: 80
        con: 75
        siz: 70
        dex: 70
        app: 55
        int: 50
        pow: 50
        edu: 30
        hp: 15
        mp: 12
        san: 45
      combat:
        weapon: 鱼叉
        damage_formula: 1d10
        skill_value: 65
      voice_guidelines:
        - 言简意赅,常用渔民口语;对镇上人客气但有距离
        - 提到达芙妮时眼神会闪烁——那不只是占有欲,还有责任与谋划
        - 对 HO2 表面恭敬,实则戒备:他能闻到奥斐斯血脉的气味
    freedom:
      improvisable_quirks:
        - 谈话间会摩挲随身的小皮袋(里面装着母亲的几枚银币与一缕头发)
        - 闻到酒味会皱眉——他从不饮酒
      catchphrases: [我说话算数, 这片海认识我]
    forbidden:
      - 不要让阿蒙在 PC 未触发"母亲是谁"线索前自报"芙提妮之子"身份
      - 不要让阿蒙对达芙妮表现"爱情"——他对她的占有是冷静的、谋略的

