  - id: clue.true-bloodline-study
    title: 血缘魔力研究档案
    frame:
      location_scene: scene.filipo-hospital
      discovery: { method: skill, skill: library-use, difficulty: regular }
      reveal_md: |
        装订厚实的私人研究文件。马泰奥这些年的真实成果:
        - 阿多尼斯的血液与脑脊髓液标本检验异常;
        - 基莫的"蛇血"特征(低体温、解毒酶活性、角蛋白表达);
        - 结论:特拉西诺斯家族的魔力源自**潘神契约**;奥斐斯家族的
          魔力源自**与巨蛇俄菲斯混血的可遗传基因**——但奥斐斯一旦
          离开曼提亚便会死亡,推测有"环境或契约"的影响。
      unlocks:
        flags: [flag.bloodline-research-found]
    freedom:
