schema_version: 1

# ============================================================================
# meta
# ============================================================================

meta:
  id: false-buddha
  title: 虫佛
  era: 1920s
  language: zh-CN
  difficulty: 高强度
  tags: [都市, 调查, 大正日本, 连环案件, 心理战, 闭门研究]
  cover: assets/cover.jpg
  start_time: { game_day: 1, hour: "09:00" }
  synopsis_md: |
    1924 年 9 月,关东大震灾一年后的东京。一系列**符号杀人案**接连发生
    在工地、咖啡馆与川崎住宅,死者身上无一例外被画上同样形状的梵文符号。
    与此同时,一位退休的东京帝大教授请你**私下**调查一名在震灾中"失踪"
    的研究员——他给你的不只是一张照片,还有一张被红圈标注的旅游地图。
    案件背后,是一桩本应被埋进瓦砾的研究项目,以及那本不知何处而来的
    《永旅经》。
  author_credits_md: |
    原作者:余灰(1134520607@qq.com)。本模组首发于骰声回响,同步发行于
    魔都 TRPG。本项目转写:Keeper_CoC-TRPG。
  recommended_occupations:
    - 警探
    - 警员
    - 私家侦探
    - 记者
    - 摄影师
  recommended: false

# ============================================================================
# hook
# ============================================================================

hook:
  start_scene: scene.briefing-room
  prologue_md: |
    1924 年 9 月 13 日,东京。距离去年那场撼动整个关东平原的大震灾
    已经过去了一年又两周,瓦砾被一点点清走,新的钢筋骨架日复一日地
    在原本是火场的地块上立起来。报纸说"重建已完成八成",但每个早晨
    走进搜查一课办公室的人都知道,这座城市在地壳深处仍有什么没有平息。

    过去一个多月内,东京府辖区内陆续出现了三起死状诡异的命案——
    工地围栏后的男性工人、梅屋咖啡馆走神的女给、川崎区一栋"洋和折衷"
    住宅里独居的老人。三具尸体差异极大,但都被人在身上画下了**同一种**
    形状古怪的符号。地方警署一筹莫展,案件最终被并案到了警视厅搜查
    一课强行犯系系长**佐藤武雄**手上。今天上午九点,他在搜查一课
    会议室里召集了你们。

    案情简报开始之前,搜查一课的电话已经响了不止一次——一通是关于
    川崎那位老人遗体的尸检催促,另一通来自某位住在文京区**同润会
    公寓 A103**的退休教授,他自称想要"更新"昨日委托。你们当中,
    或许有人是被佐藤亲自点名而来,或许有人是带着大隅教授的便签
    与一只装着照片的纸袋进来的。
  call_to_action_md: |
    会议桌上铺着关东地区的地图和三份案卷。佐藤武雄推过一杯尚冒着
    热气的清酒色麦茶,把第一份案卷推到你面前——他需要你今天就动身。
  default_initial_clues: []
  occupation_variants:
    "警探":
      call_to_action_md: |
        【路线 A · 警视厅搜查一课】你是搜查一课强行犯系的现职警探,
        与系长佐藤武雄共事多年。三起符号杀人案被并到他手上后,他
        点名让你带队复勘——他比谁都清楚地方警署"按部就班"的意思
        是什么。简报结束后,他会把案卷与一张通行证留给你,允许你
        以警视厅名义接触证物科与各地方警署的协查记录。
      initial_clues: []
    "警员":
      call_to_action_md: |
        【路线 A · 协查警员】你是搜查一课新调入的警员,资历尚浅,
        但跟着佐藤武雄做了几桩棘手的案子后被记下了名字。这次并案,
        系长把你安排在警探身后做协查与外勤,负责跑工地、咖啡馆
        与川崎那栋老房子,并把现场情况第一手带回会议室。
      initial_clues: []
    "私家侦探":
      call_to_action_md: |
        【路线 B · 大隅良田的委托】昨日下午,你在自己挂着"私家
        调查事务所"小铜牌的事务所里,接到一位自称大隅良田的来访者。
        他是退休的东京帝大教授,神情温和却双眼疲惫,委托内容是寻找
        一名"在去年震灾中失踪"的前同事——黑石隆浩。委托金不算少,
        且**先付了一半**。今早大隅来电请你与警视厅那边接触,理由
        含糊地说成"有些事警方知道得比家人多"。
      initial_clues: [clue.osumi-photo]
    "记者":
      call_to_action_md: |
        【路线 B / A 协助 · 报社记者】你是东京一家中型日报社会版的
        记者,这一个多月接连追三起符号杀人案的报道。昨日报社编辑
        把一封从同润会公寓寄来的信交给你——大隅良田教授请你登门
        访谈。今早他打来加急电话,请你陪同他与警视厅的"老熟人"
        见面。佐藤武雄认得你,愿意让你列席简报并跟队记录,前提是
        发稿时所有细节按警视厅口径来。
      initial_clues: [clue.osumi-photo]
    "摄影师":
      call_to_action_md: |
        【路线 A 协助 · 报社摄影师】你是与多家东京报社合作的自由
        摄影师,擅长在闪光灯发明初期那种昏黄的光线下抓表情。报社
        把佐藤武雄主导的"符号案"系列报道交给你跟拍,并由他亲自
        发出邀请,让你参与今早的简报与后续抓捕行动的现场记录——
        这在大正末年极为罕见,你也很清楚为什么:警视厅希望靠一张
        合适的照片在报纸头条上重塑士气。
      initial_clues: []

# ============================================================================
# scenes
# ============================================================================

scenes:
  # --------------------------------------------------------------------------
  - id: scene.briefing-room
    title: 警视厅搜查一课会议室
    frame:
      summary_md: |
        早晨九点,搜查一课二楼东侧的会议室。墙上是一张被修补过的关东
        地区地图,案发地点用三只红色图钉标了出来:**江之岛对岸的工地**
        (8 月 3 日)、**入船公园西南的梅屋咖啡馆-废弃公寓一线**
        (8 月 9 日)、**川崎区的志村宅**(9 月 13 日凌晨发现)。
        系长**佐藤武雄**已年过六十,拄着轮椅,左腿在去年的震灾中受伤
        至今未完全恢复,他会先用三十分钟把三起案子的死状、符号、地缘
        关系串一遍,再分配协查方向。会议结束后,案卷副本会留给上场调查员。
      facts:
        - 三起命案分别发生在江之岛工地、入船公园西南的废弃公寓、川崎区志村宅
        - 三具尸体身上都被画了同一形状的梵文符号,但符号细节有差异
        - 受害者依次为:工地工人小林浩也、咖啡馆女给中岛敦子、退休职员志村和幸
        - 第一起案件现场在工地基坑底部找到一只男士棕色皮鞋,目前保管在藤泽市警察署证物室
        - 第三起案件由邻居与社工麻美由真发现,现场被肥胖男子从屋内冲出
        - 系长佐藤武雄拄轮椅,会议结束后会把通行证与案卷副本交给警方背景调查员
      kp_secret_md: |
        本场景对所有调查员公开案卷的同时,也发放路线分叉:
        - 路线 A(警方系)继续按工地→咖啡馆→公寓→川崎一路核勘
        - 路线 B(委托系)从大隅良田的同润会公寓 A103 入手
        玩家可以两条路线分头跑、也可以混编,后续在接线站或东和加工厂第一次汇合。
      exits:
        - to: scene.construction-site
          condition: free
          label: (路线 A) 前往江之岛对岸的东和加工厂工地
        - to: scene.umeya-cafe
          condition: free
          label: (路线 A) 前往入船公园西南的梅屋咖啡馆
        - to: scene.abandoned-apartment
          condition: free
          label: (路线 A) 前往废弃公寓地下室案发现场
        - to: scene.shimura-house
          condition: free
          label: (路线 A) 前往川崎区志村宅
        - to: scene.osumi-apartment
          condition: free
          label: (路线 B) 前往同润会公寓 A103 拜访大隅良田
      npcs_present: [npc.sato-takeo]
      available_clues: [clue.case-file-overview]
    freedom:
      mood_tags: [大正末年的清晨, 油墨味, 关东大震灾后的疲惫官僚气]
      sensory_palette:
        sight: 修补过的关东地图上三枚红图钉、案卷封皮上印着的菊花纹徽、佐藤拄轮椅时膝上盖着的灰色羊毛毯
        sound: 钟摆挂表的均匀嘀嗒、远处复印用打字机的咔嗒、轮椅金属轮在地板上短促的转动声
        smell: 浓茶的涩味、油墨与档案柜里积年的纸味、门外走廊飘来的清晨雪茄烟
        touch: 案卷牛皮纸边缘磨手、清酒色麦茶杯壁的余温
      improvisable_props:
        - 桌角一份《东京日日新闻》头版有"凶杀案再发"的标题
        - 墙边的档案柜抽屉露出"震灾失踪人员名册"几个字
        - 佐藤随身的金属拐杖头雕着家纹,他偶尔会用它点案卷强调
      npc_action_hints:
        npc.sato-takeo: [说话简短不绕弯, 用拐杖头敲案卷强调重点, 只在分配任务时主动看下属]
    forbidden:
      - 不要让佐藤武雄在会议上提及"虫"、"寄生"、"震灾时的研究项目"或任何超自然内容
      - 不要让本场景中第三方(如大隅良田)直接出现,他在 scene.osumi-apartment 才登场
      - 不要让 LLM 在简报阶段直接给出符号是梵文的判定——这要等图书馆使用线索

  # --------------------------------------------------------------------------
  - id: scene.construction-site
    title: 东和精密机械加工厂工地
    frame:
      summary_md: |
        江之岛对岸,正在施工的东和精密机械加工厂一期工地。占地约
        2300 平方米,四周 2.2 米高工程围挡。出示证件后值班保安会
        发安全帽并由正门带入。第一起案件现场位于一处停工的基坑
        附近,警戒带圈出约两米见方的区域,粉笔画的人形已经因为时间
        模糊。受害者**小林浩也**生前未婚、无女友、平日多在工地
        宿舍,周末偶尔去附近居酒屋——警方履历记录上无任何特殊。
      facts:
        - 案发现场已被工地施工破坏,无可调查的物理线索残留
        - 基坑深约数十米,凶手不可能从底部爬上来作案
        - 案件当日基坑底部捡到一只男士棕色美津浓 43 码皮鞋,现存藤泽市警察署证物室
        - 工地围挡完整,夜间值班保安在岗,作案手法与入侵路径都不明确
        - 工地名"东和"两字与某张震灾前合影背景的厂房同名
      kp_secret_md: |
        值班保安心里始终怀疑工地是冤魂作祟,但被项目经理以辞退威胁
        压住,用"成功的心理学/交涉"可以让他松口。皮鞋来源是黑石
        隆浩从相模湾地下研究所负二层废墟里爬出时掉落的——是关键
        关联线索,但本场景不直接揭穿。
      exits:
        - to: scene.briefing-room
          condition: free
          label: 离开工地返回警视厅会议室
        - to: scene.fujisawa-evidence
          condition: free
          label: 前往藤泽市警察署证物室查看皮鞋
        - to: scene.coastal-tunnel
          condition: requires-clue
          required_clue: clue.workers-tunnel-rumor
          label: (后期) 沿海岸隐蔽处寻找被封锁的隧道
      npcs_present: [npc.site-guard]
      available_clues:
        - clue.crime-scene-empty
        - clue.workers-tunnel-rumor
        - clue.toa-factory-link
    freedom:
      mood_tags: [钢筋与水泥的冷意, 大正末年工业化的粗粝, 被海风带来的盐味]
      sensory_palette:
        sight: 半成型的厂房骨架、警戒带在风里轻飘飘晃、基坑边缘灰白的粉笔人形、工人间夹着汗渍的束带
        sound: 钢钉敲击声、远处海浪、卡车引擎从远处压过砂石路的轰
        smell: 海风的咸、刚浇筑混凝土的碱涩、保安手卷烟草的焦
        touch: 安全帽带勒在下颌的硬、围挡铁皮在指尖的微微震动
      improvisable_props:
        - 工人收工时塞进胸前的便宜怀表
        - 围挡背面残留的、被人用粉笔写过又抹掉的祭文残迹
        - 基坑边一只被踩扁的香烟盒,牌子是大正末年常见的"敷岛"
      npc_action_hints:
        npc.site-guard: [拿安全帽时手抖了一下, 谈到"出事那天"会下意识看向基坑, 不愿当众表态]
    forbidden:
      - 不要让保安在第一次接触时主动说"冤魂"——必须由 PC 心理学/交涉解锁
      - 不要在本场景就揭示工地名"东和"与研究所合照背景的关联,关联通过 clue.toa-factory-link 引爆
      - 不要描述工地工人对皮鞋有任何"超自然"反应——皮鞋就是普通鞋

  # --------------------------------------------------------------------------
  - id: scene.fujisawa-evidence
    title: 藤泽市警察署证物室
    frame:
      summary_md: |
        位于江之岛上的小型地方警察署。证物室在二层,值班记录员是个
        中年警员,见到警视厅通行证后会带你下到地下证物保管区,在第
        三起案件相关物证中翻出装着皮鞋的纸袋。皮鞋是只价格中等偏上
        的**美津浓 43 码棕色男士皮鞋**,鞋底磨损严重,鞋面有少许
        泥斑——其余无线索。
      facts:
        - 皮鞋整体磨损非常严重,鞋底凹凸已被磨平
        - 鞋码 43,品牌美津浓,价位中等偏上
        - 鞋面附着的泥土颜色与江之岛海岸本地砂石不一致(关联相模湾地下研究所废墟)
        - 证物室登记簿显示该鞋曾被两次提取送往警视厅鉴识科,均无新发现
      exits:
        - to: scene.construction-site
          condition: free
          label: 返回工地继续核勘
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅向佐藤汇报
      npcs_present: []
      available_clues: [clue.muddy-shoe]
    freedom:
      mood_tags: [证物室的低温, 旧书与樟脑混合的静默, 木制档案柜的吱呀]
      sensory_palette:
        sight: 灰绿色铁皮证物柜、鞋面的泥与略发霉的鞋舌、登记本上反复修改的钢笔字
        sound: 头顶吊着的电灯泡发出微弱的嗡声、登记员翻账的纸响
        smell: 樟脑、潮气、皮革久置后的酸涩
        touch: 牛皮纸袋边缘的毛刺、皮鞋鞋面的硬皮
      improvisable_props:
        - 证物柜旁一摞贴着"震灾失物"标签的纸盒,无人认领
        - 登记员桌上的便当盒里只剩下几粒米饭
    forbidden:
      - 不要让登记员主动揭示泥土与相模湾研究所废墟的关联,这要靠后续侦查/地质学
      - 不要让 LLM 把皮鞋说成"沾血"——它只有泥

  # --------------------------------------------------------------------------
  - id: scene.umeya-cafe
    title: 梅屋"纯喫茶"咖啡馆
    frame:
      summary_md: |
        入船公园西南约 800 米的梅屋,一家挂着"純喫茶"小招牌的店铺,
        只供应茶、咖啡与轻食,不卖酒,也不提供女给陪聊。第二位死者
        **中岛敦子**生前在此打工。老板是中年男子,见到证件后愿意配合
        ——他记得敦子来上班那天就开始消瘦,死前三日(8 月 6 日)还来
        过店里,体重明显异常,他给了她两天假并预支了下月薪水。从那
        以后,再没见过她。
      facts:
        - 中岛敦子国中肄业、单亲家庭,母亲在去年震灾中过世
        - 上岗后约一周开始急剧消瘦,死前三日已瘦到老板担心其患病
        - 死亡前最后一次出现在咖啡馆是 8 月 6 日,距案发不到 12 小时
        - 老板未在工作中见过有任何可疑男子出现接触敦子
        - 由咖啡馆回到中岛敦子公寓的途中需要经过那栋废弃公寓
      exits:
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
        - to: scene.abandoned-apartment
          condition: free
          label: 沿敦子下班回家路前往废弃公寓
        - to: scene.akiko-apartment
          condition: free
          label: 前往中岛敦子的旧公寓查看
      npcs_present: [npc.umeya-master]
      available_clues:
        - clue.akiko-weight-loss
        - clue.akiko-route
    freedom:
      mood_tags: [大正都市的咖啡浓香, 知识分子的低声讨论, 西式吧台]
      sensory_palette:
        sight: 老板擦得发亮的木质吧台、靠窗座位上的报纸、墙上挂着的"純喫茶"红字招牌
        sound: 老式磨豆机的低吼、银匙在瓷杯里搅拌的清脆、店外人力车铃声
        smell: 浓缩咖啡、烘豆的焦糖味、淡淡的虹吸壶酒精灯气
        touch: 吧台木面光滑、咖啡杯的把手温度
      improvisable_props:
        - 角落那架黑檀木留声机正放着大正末年风行的爵士唱片
        - 吧台后玻璃柜里的法式糕点已经少得只剩下两块
        - 老板胸前别着一枚掉漆的铜牌,刻着店名与开业年份
      npc_action_hints:
        npc.umeya-master: [说话恭谨, 提到敦子的死会停一下擦杯子, 不愿去想她可能是被骗去的]
    forbidden:
      - 不要让老板把敦子的消瘦解释为"被神秘力量影响"——他只觉得她病了
      - 不要让本场景出现敦子在死前与某男子接触的目击,目击只在废弃公寓附近的流浪汉那里有一点

  # --------------------------------------------------------------------------
  - id: scene.akiko-apartment
    title: 中岛敦子的旧公寓
    frame:
      summary_md: |
        非常老旧狭窄的木造公寓二层,一间四叠半的房间。家中除了一张
        她小时候和母亲的合影外几乎没有装饰,但打扫得相当干净。柜子里
        储备着速食与几袋米——她不是因为没钱买吃的而饿死的。
      facts:
        - 房间里食物储备充足,死因不是物质性的饥饿
        - 唯一的装饰是她童年与母亲的合照,母亲已在震灾中过世
        - 房东说她最近一周连灯都很少开,一到夜里就直接睡了
        - 公寓回家路上一定会经过废弃公寓那个十字路口
      exits:
        - to: scene.umeya-cafe
          condition: free
          label: 返回梅屋咖啡馆方向
        - to: scene.abandoned-apartment
          condition: free
          label: 沿夜归路前往废弃公寓
      npcs_present: []
      available_clues: [clue.akiko-childhood-photo]
    freedom:
      mood_tags: [大正贫民街区, 木造公寓的潮湿, 一个人安静地准备死去]
      sensory_palette:
        sight: 榻榻米发黄的边角、木窗框上贴着的旧纸条、墙上童年合照的相框微微歪斜
        sound: 楼下夫妇压低声音吵架、走廊上人力车经过的木轮震
        smell: 廉价米饭的焦底味、隔壁飘来的味噌汤气
        touch: 榻榻米上发硬的草席、合影相框玻璃上的指纹
      improvisable_props:
        - 抽屉里一只盖着粉色蝶结的小铁盒,里面是几枚母亲留下的发簪
        - 厨房灶台上煮过一半的粥,锅边凝着一圈白浆
    forbidden:
      - 不要让 PC 在此地见到任何超自然异象——这里只是一个人活过的痕迹
      - 不要让 LLM 替敦子写"内心独白"或"她其实早知道自己会死"——她不知道

  # --------------------------------------------------------------------------
  - id: scene.abandoned-apartment
    title: 废弃公寓地下室
    frame:
      summary_md: |
        入船公园西侧约一公里处荒地上的一栋废弃公寓。屋主在去年震灾后
        无力修缮,如今是一栋危房,只有几名流浪汉夜间会在此过夜。地下
        室入口已经塌了一半,警方贴的封条脱了一半还在风里晃。地板大
        部分破裂,白色人形粉笔轮廓一半在地、一半在支撑柱上,代表敦子
        死亡时倚墙而坐的姿势。
      facts:
        - 第二起案件案发现场,死者中岛敦子被铁链拴在支撑柱上至死
        - 现场地板大面积破裂,土壤裸露,无任何凶器或物证残留
        - 流浪汉曾见过一胖一瘦男女前后进入地下室,但当晚未听见动静
        - 流浪汉描述男子曾**单独来过一次**,看起来略显呆滞、身材肥胖
      exits:
        - to: scene.umeya-cafe
          condition: free
          label: 沿原路返回梅屋方向
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
      npcs_present: [npc.homeless-witness]
      available_clues:
        - clue.homeless-sighting
        - clue.symbol-on-victims
    freedom:
      mood_tags: [危房的潮气, 废弃住宅的死寂, 警方封条的徒劳]
      sensory_palette:
        sight: 露出泥土的地板裂口、白色粉笔人形已经因为湿气模糊、墙壁渗出的水渍
        sound: 风从破窗灌进来的低呼、流浪汉粗重的呼吸、远处贫民街区孩子的喊叫
        smell: 霉、塌陷木梁的腐味、流浪汉处廉价烧酒的酸气
        touch: 楼梯扶手上层层灰、断裂的支撑柱木茬扎手
      improvisable_props:
        - 角落一只被丢弃的铁链,链节上还沾着一点褐色锈迹
        - 流浪汉用旧报纸搭的简易铺位,报纸上是案发当周的日期
      npc_action_hints:
        npc.homeless-witness: [开口前先伸手要烟酒, 见到证件不躲也不靠近, 形容男女时动作模仿其步态]
    forbidden:
      - 不要让 PC 在此处直接看到任何凶手身影或听到声音——所有目击都来自流浪汉的回忆
      - 不要让流浪汉把"看起来呆滞"翻译成"被附身",这是他自己也说不上来的违和

  # --------------------------------------------------------------------------
  - id: scene.shimura-house
    title: 川崎区志村宅
    frame:
      summary_md: |
        川崎区一栋"洋和折衷"的二层文化住宅,半木框架外观,西洋客厅居中,
        和式卧室围着,典型的大正末年中产阶级民居。第三起案件就发生在
        客厅。**志村和幸**老人独居,儿女已成家。9 月 13 日上午九点,
        社工**麻美由真**上门时,听到屋内一名男子的低声自语,接着她
        尖叫,那名男子从屋内冲出。
      facts:
        - 志村和幸生前确诊阿兹海默症,常把陌生人误认为自己的儿子
        - 案发前数日邻居见到一名"看起来有点呆傻的肥胖男子"被志村带回家中同住
        - 那名男子陪志村外出买菜、未与邻居交谈,行为温和并无暴力
        - 9 月 13 日上午,麻美由真听到屋内自语:"为什么……为什么……已经完成了……"
        - 志村身上的符号与前两起案件相比少了一笔,但形态明显属于同一系列
      exits:
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
        - to: scene.kawasaki-station
          condition: requires-clue
          required_clue: clue.shimura-trail
          label: 沿凶手下落追到川崎驿车站
      npcs_present: [npc.shimura-neighbor, npc.mami-yuma]
      available_clues:
        - clue.shimura-self-talk
        - clue.shimura-trail
        - clue.symbol-incomplete
    freedom:
      mood_tags: [大正中产民宅的礼节, 阿兹海默症老人那种"等谁回家"的氛围, 社工麻美的茫然恐惧]
      sensory_palette:
        sight: 客厅西式沙发上散落的旧棋盘、和式卧室榻榻米上摆好的两副餐具、玄关处少了一双男用木屐
        sound: 案发后归于死寂的座钟摆动、邻居们隔着栅栏低声议论、麻美由真依旧颤抖的呼吸
        smell: 被打翻的味噌汤酸气、玄关处淡淡的男人汗味、廊下熏蚊草尚未燃尽的青草味
        touch: 玄关地板上一只新的木屐(属凶手),鞋底沾着川崎驿方向的细沙
      improvisable_props:
        - 客厅墙上一张志村与已故妻子的褪色合影
        - 茶几上摆着两份未动的早饭——其中一份明显是给"以为是儿子"的客人准备的
        - 玄关地板上一处擦痕,像是某人匆忙穿鞋时蹭出的
      npc_action_hints:
        npc.shimura-neighbor: [惊魂未定, 说话回头, 反复辩解自己当时不知情]
        npc.mami-yuma: [对自语内容能逐字复述, 不愿再次进入屋内, 提及志村会哽咽]
    forbidden:
      - 不要让邻居或社工主动给凶手起绰号、贴标签——他们形容时只会用客观特征
      - 不要让本场景出现凶手与志村亲密互动的回忆细节,只允许"看似亲密但旁人无法听清对话"的远景

  # --------------------------------------------------------------------------
  - id: scene.kawasaki-station
    title: 川崎驿车站
    frame:
      summary_md: |
        川崎站的木结构候车厅,蒸汽机车的烟雾尚未散尽。售票员能根据
        肥胖男子的描述确认他买了开往**东京文京区**方向的车票,时间
        是案发当日上午十点左右。售票员还提到该男子神色恍惚,买票时
        手抖得连铜板都摸不稳。
      facts:
        - 售票员确认嫌疑人于 9 月 13 日上午 10 点购买开往文京区的车票
        - 嫌疑人状态恍惚,体型与第二起案件流浪汉描述相符
        - 文京区站附近有东京帝国大学医学部附属医院,以及黑石胡桃的工作单位
      exits:
        - to: scene.shimura-house
          condition: free
          label: 返回志村宅继续核勘
        - to: scene.kuroishi-house
          condition: free
          label: (路线 B 协查) 前往墨田区押上的黑石宅
        - to: scene.todai-hospital
          condition: requires-clue
          required_clue: clue.phone-record
          label: (后期) 前往东京帝大附属医院附近设伏
      npcs_present: []
      available_clues: [clue.suspect-train-ticket]
    freedom:
      mood_tags: [大正铁道车站的烟与煤, 候车室长椅上的疲倦旅客, 售票口铜栅栏的反光]
      sensory_palette:
        sight: 黑色蒸汽机车头侧面的菊花徽、候车厅天花板上挂着的木质钟、铜栅栏售票窗口
        sound: 蒸汽机车的"哧——"长鸣、广播员略带回声的报站、铁轮敲过道岔的咔嗒
        smell: 煤烟、厨余、木质长椅久坐后的汗味
        touch: 铜栅栏被无数人摸过的滑、车票的薄硬纸质感
      improvisable_props:
        - 候车厅墙上贴着东京帝大医学部夏季招生海报
        - 售票口边一只装满烟头的铜痰盂
    forbidden:
      - 不要让售票员凭直觉判断"那个男人不正常"——他只能描述客观状态
      - 不要让 LLM 在此处提前披露黑石隆浩的姓名

  # --------------------------------------------------------------------------
  - id: scene.osumi-apartment
    title: 同润会公寓 A103 · 大隅良田宅
    frame:
      summary_md: |
        文京区的同润会公寓,一栋钢筋水泥的三层"震灾后新式公寓"。
        A103 是大隅良田与妻子的居所,客厅西式陈设,矮柜上摆着家庭
        合照与一张"乌洛波罗斯"项目主要参与人员的合影(他不会主动
        提及这张合影的内容)。教授本人六十岁上下,温和、条理清晰,
        谈吐没有学院派的傲气。坐在轮椅旁的妻子偶尔出来奉茶。
      facts:
        - 大隅良田自称是退休东京帝大教授,委托寻找"震灾失踪"的前同事黑石隆浩
        - 他能给出黑石隆浩 32 岁、男性、单眼皮鹰钩鼻、左颧骨痣、身高 177 cm 的照片与外貌描述
        - 他声称自己是凶案受害者亲属——这是谎言,他实际上是项目相关人员
        - 客厅矮柜上的项目合照背景能看到"东和"两字工厂
        - 调查员临走时大隅会送上黑石隆浩的照片,作为协查信物
      kp_secret_md: |
        大隅良田受"乌洛波罗斯"项目的保密协议约束,无法透露《永旅经》
        与项目内容。他的真实动机是想确认黑石是否还在世以及是否卷入了
        其他危险事件——而非寻回失窃的"Ouroboros-01"或那本经书。
        在调查员问及合影中人时,他会回避背景的"东和"两字。
      exits:
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
        - to: scene.todai-university
          condition: requires-clue
          required_clue: clue.osumi-photo
          label: 持照片前往东京帝大理学部寻找羽仓葵
        - to: scene.engakuji-temple
          condition: requires-clue
          required_clue: clue.osumi-tourist-map
          label: (后期) 沿地图所示前往镰仓圆觉寺
        - to: scene.coastal-tunnel
          condition: requires-clue
          required_clue: clue.osumi-tourist-map
          label: (后期) 沿地图所示前往江之岛海岸隧道
      npcs_present: [npc.osumi-yoshida]
      available_clues:
        - clue.osumi-photo
        - clue.project-photo-bg
        - clue.osumi-tourist-map
    freedom:
      mood_tags: [震灾后新公寓的钢筋水泥气, 退休教授家中的茶香, 礼貌却保持距离的对话]
      sensory_palette:
        sight: 客厅墙上的《华严经》挂轴、矮柜上一组青铜佛像、玻璃书橱里成排的医学与生物学典籍
        sound: 老座钟的均匀摆动、教授太太在厨房泡茶时瓷器轻碰、窗外公寓中庭孩子的笑声
        smell: 抹茶的清香、檀香、新公寓未褪尽的灰浆与油漆气
        touch: 西式扶手椅上深色羊毛靠垫的微温、合照相框边缘的木质纹路
      improvisable_props:
        - 书橱顶层一本被翻得发毛的《心経》注释,夹着一支老旧的钢笔
        - 玄关旁一把折叠完好的黑色男士伞,但伞骨内侧粘着一点海岸的细砂
        - 茶几上的菊花茶碗印着旧式家纹
      npc_action_hints:
        npc.osumi-yoshida: [对调查员极为礼貌, 提及黑石时手指会轻按桌面, 谈到"项目"时会快速转移话题]
    forbidden:
      - 不要让大隅良田主动说出《永旅经》《乌洛波罗斯》项目代号或佛牙舍利等任何内幕
      - 不要让大隅在第一次会面时就把旅游地图与红圈交出——必须等调查员**第二次**来访
      - 不要让 LLM 编造大隅妻子的台词,她仅以礼仪出场,不开口讨论案情

  # --------------------------------------------------------------------------
  - id: scene.todai-university
    title: 东京帝国大学理学部
    frame:
      summary_md: |
        本乡的东京帝大理学部,红砖墙与铸铁门刚刚修复完毕。羽仓葵
        是生物化学科的一名普通教师,32 岁,留齐肩短发,穿洋装,
        干净利落的"新女性"打扮。她在自己的小办公室接待调查员,
        墙上挂着震灾前的研究小组合影,合影里能找到她、大隅良田、
        黑石隆浩三人的脸。
      facts:
        - 羽仓葵震灾后退出科研一线,改在帝大教学
        - 她自称两个月前去过江之岛祭典,远远看到一个"很像黑石的"身影
        - 她与黑石的妻子黑石胡桃是同乡,关系不错
        - 她未透露自己仍掌握"乌洛波罗斯"项目部分技术细节
      kp_secret_md: |
        羽仓葵心存疑虑但出于自保不会主动开口。在调查员通过后期
        说服检定后,她可能愿意作为内应协助进入相模湾地下研究所
        (这一节由 KP 在剧情后期判定)。
      exits:
        - to: scene.osumi-apartment
          condition: free
          label: 返回同润会公寓向大隅汇报
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
        - to: scene.library
          condition: free
          label: 前往大学附属图书馆查阅梵文资料
      npcs_present: [npc.hagura-aoi]
      available_clues:
        - clue.aoi-shadow-sighting
        - clue.research-group-photo
    freedom:
      mood_tags: [大正末年大学的红砖, 教师办公室的烟草与茶, 身处专业领域的安静自信]
      sensory_palette:
        sight: 红砖回廊上斑驳的青苔、办公室里堆到天花板的实验册、矮柜上摆着的玻璃培养皿
        sound: 走廊里学生鞋跟敲击地板的回声、远处生化实验室抽气泵的低嗡
        smell: 试剂架的微酸、奶油纸包书的旧纸味、羽仓常喝的咖啡
        touch: 办公桌玻璃压板下夹着的研究小组合影微凸
      improvisable_props:
        - 办公桌一只玻璃笔架,笔杆上还沾着她做笔记时蹭到的紫色钢笔水
        - 墙上挂的钢笔勾画的"细胞分裂示意图",右下角签着她的名字
        - 角落一台旧式留声机,盖子上落着粉笔灰
      npc_action_hints:
        npc.hagura-aoi: [开口前先关上办公室门, 谈到震灾会停顿三秒, 不会主动让座但会请对方坐下]
    forbidden:
      - 不要让羽仓葵在第一次见面时就同意做内应——这必须由 PC 后续多次接触触发
      - 不要让她直接说出"乌洛波罗斯"或"幼虫"——她说"那个项目"已是底线

  # --------------------------------------------------------------------------
  - id: scene.library
    title: 东京帝国大学附属图书馆
    frame:
      summary_md: |
        东京帝大附属图书馆,六十万册藏书,大正末年东京最大的大学图书馆。
        阅览特别区域需要按次付费 5 日元,租借则要押金。在这里,通过
        图书馆使用检定可以从《悉昙章》(梵文启蒙读物)的影印版中找到与
        命案符号大致对应的悉昙体梵文。
      facts:
        - 特别阅览需要 5 日元/次的费用,允许 PC 用现金支付
        - 《悉昙章》是唐代汉传梵文启蒙读物的影印版,字典级参考
        - 图书馆员可以协助调阅并代为查询梵文学者的住址
      exits:
        - to: scene.todai-university
          condition: free
          label: 返回理学部
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
      npcs_present: []
      available_clues:
        - clue.symbol-sanskrit-mapping
        - clue.three-disasters-meaning
    freedom:
      mood_tags: [大学图书馆的羊皮纸气, 早秋阳光透过高窗, 老馆员忌讳吵闹的低声]
      sensory_palette:
        sight: 高至天花板的书架、长条形阅览桌上摆着的绿色铁皮台灯、特别阅览区铁栏外的汉字告示
        sound: 翻书的纸响、远处自修室里学生的笔尖、馆员脚步声压低到几乎无声
        smell: 旧纸、皮装订书的牛皮气、馆员桌上的钢笔水
        touch: 借阅卡的硬壳、抄录用的便笺纸边缘的涩
      improvisable_props:
        - 阅览桌一角一本被反复翻过的《大佛顶首楞严神咒》注疏
        - 馆员脚边一只装着已退还旧借书条的木盒
    forbidden:
      - 不要让馆员直接揭示"虫佛"或"佛教仪轨"概念——他只能给文献参考
      - 不要让 LLM 跳过图书馆使用检定就让 PC 直接读懂梵文

  # --------------------------------------------------------------------------
  - id: scene.kuroishi-house
    title: 墨田区押上 · 黑石宅
    frame:
      summary_md: |
        墨田区押上一丁目 43-9,黑石隆浩与黑石胡桃的住宅——一栋
        小巧的"洋和折衷"二层木造民居。来开门的是**黑石胡桃**,
        30 岁,东京帝大医学部附属医院的药剂师。她对调查员的问话
        显得相当克制——配合,但不情愿主动给信息。客厅矮柜上一
        台木壳座式电话机,机身侧面贴着一张潦草的"号码:本郷局
        三一二"的小条。
      facts:
        - 黑石胡桃自称"丈夫一年前在震灾中死亡",言语谨慎
        - 客厅墙角立着一台木壳电话机,胡桃承认近期收到过几次"沉默的电话"
        - 沉默电话来自下午 7 点左右,持续大约半分钟,无声便挂断
        - 胡桃在医院的工作日程允许她每天傍晚乘电车回家
      kp_secret_md: |
        黑石胡桃实际上仍深爱已经"失踪"的丈夫,如果调查员把抓捕
        计划告知她,她会暗中协助黑石逃跑。这一点 KP 在抓捕场景
        据玩家选择决定;本场景不允许 LLM 主动暗示。
      exits:
        - to: scene.briefing-room
          condition: free
          label: 返回警视厅会议室
        - to: scene.switchboard
          condition: requires-clue
          required_clue: clue.silent-call
          label: 前往墨田区电话接线站查询通话记录
      npcs_present: [npc.kuroishi-kurumi]
      available_clues: [clue.silent-call, clue.kuroishi-bg]
    freedom:
      mood_tags: [大正中产民居的礼数, 寡妇式的礼貌克制, 客厅角落药剂师的香草味]
      sensory_palette:
        sight: 黑色木壳电话机金属支架的反光、客厅长榻上叠放整齐的羊毛毯、墙上一幅未具名的山水画
        sound: 座钟的摆动、电话机底部铜铃的轻响、隔壁病院方向传来的电车铃声
        smell: 药剂房特有的酒精与香草味、矮柜上一束已开始干瘪的菊花
        touch: 电话机听筒上凉冰冰的胶木、长榻坐垫上有一处略凹陷
      improvisable_props:
        - 矮柜抽屉里收着一沓胡桃的医院员工证旧版与新版
        - 玄关木屐架最里层一双男式木屐,已发霉,但摆放得整齐
        - 客厅角落的西式留声机里压着一张未播放的唱片
      npc_action_hints:
        npc.kuroishi-kurumi: [态度礼貌但带距离, 提到"丈夫"时声音低半度, 不愿主动多谈电话内容]
    forbidden:
      - 不要让胡桃在第一次见面就承认"我相信他还活着"——这要靠后续心理学/说服解锁
      - 不要让本场景出现任何与黑石隆浩本人有关的"幻觉"或"目击"

  # --------------------------------------------------------------------------
  - id: scene.switchboard
    title: 墨田区电话接线站
    frame:
      summary_md: |
        墨田区主干道旁的一栋西式三层白色建筑,墙面贴着"電話局"两字。
        接线站负责人需要警视厅协查函才会配合——他可以从打字记录长条
        中检出某号码近一周的通话日志,并配合"公共电话区域分布图"
        定位通话源。在调查员定位到目标公共电话后,可以发现来电源
        正是文京区**东京帝大医学部附属医院附近**——胡桃的工作单位。
      facts:
        - 接线站需以警视厅协查函或正式公文方式访问通话记录
        - 通话日志被打字机打在长条上,登记双方电话机编号与开始时间
        - 公共电话有专属区域分布图,用于由编号反查所在地址
        - 拨往黑石宅的电话号码源在文京区帝大医学部附属医院附近
      exits:
        - to: scene.kuroishi-house
          condition: free
          label: 返回黑石宅与胡桃确认信息
        - to: scene.todai-hospital
          condition: free
          label: 前往帝大医学部附属医院附近设伏
      npcs_present: [npc.switchboard-supervisor]
      available_clues: [clue.phone-record]
    freedom:
      mood_tags: [大正都市公共服务的整洁感, 大量电缆与女接线员的存在, 公文式的严谨]
      sensory_palette:
        sight: 整列女接线员头戴耳机面对接线板、墙上挂着的东京公共电话分布大图、长条状打字记录
        sound: 接线机咔嗒咔嗒、女接线员低声的"莫西莫西"、铜铃式电话短促响动
        smell: 油墨、机油、女接线员制服上残留的茉莉香水
        touch: 长条记录纸边沿粗糙,接线插孔的金属冷
      improvisable_props:
        - 接线员桌上的红色提示灯偶尔亮起一下又熄灭
        - 接线站门口贴着的"市民来电礼仪指南"小海报
        - 负责人办公桌一只装满铅笔头的瓷盘
    forbidden:
      - 不要让 LLM 越过协查函让 PC 凭"个人请求"获得通话记录,这是大正末年极严的官僚程序
      - 不要让接线员或负责人在场景内泄露其他无关人员的隐私通话内容

  # --------------------------------------------------------------------------
  - id: scene.todai-hospital
    title: 东京帝大医学部附属医院 · 围捕现场
    frame:
      summary_md: |
        文京区本郷,东京帝国大学医学部附属医院。一座西式三层白色建筑,
        门诊大厅高顶,大理石地面被反复擦得见镜。下午接近傍晚六点时
        天色逐渐昏暗,医院前的街道上有不少回家的上班族。这里是黑石
        胡桃的工作单位,也是凶手计划进行**仪轨最后一环**的地点。
        佐藤武雄派搜查一课人手在医院四周设伏,并请一名报社摄影师
        随队记录抓捕过程。
      facts:
        - 嫌疑人黑石隆浩可能在 6 点左右出现在医院附近
        - 嫌疑人体型与第二起案件流浪汉描述相符,着黑文明帽与披风、拄拐杖步履蹒跚
        - 帝大医学部附属医院附近的公共电话曾向黑石宅拨过沉默电话
        - 黑石胡桃可能在情感作用下主动协助丈夫逃跑
        - 抓捕现场允许非警方调查员以"报社随行"名义在场
      kp_secret_md: |
        本场景是抓捕高潮。玩家选择直接击毙、克制制服、或被胡桃干扰
        失败,会写入不同 flag,影响后续 endings 路径。
        - 直接击毙:flag.kuroishi-killed
        - 克制制服后被夺走:flag.kuroishi-taken-away(浅沼次郎介入)
        - 抓捕中胡桃中刀失血:flag.kurumi-injured
      exits:
        - to: scene.morgue
          condition: requires-flag
          required_flag: flag.kuroishi-killed
          required_value: true
          label: (击毙后) 押送嫌疑人尸体到帝大附属医院停尸间
        - to: scene.briefing-room
          condition: requires-flag
          required_flag: flag.kuroishi-taken-away
          required_value: true
          label: (嫌疑人被夺走后) 返回警视厅
      npcs_present: [npc.kuroishi-takahiro, npc.sato-takeo, npc.kuroishi-kurumi]
      available_clues: [clue.suspect-overgrown-body]
    freedom:
      mood_tags: [傍晚街灯初上的紧绷, 大正都市抓捕行动, 摄影闪光灯的爆裂瞬间]
      sensory_palette:
        sight: 黑色文明帽下隐隐看不清的脸、披风下肿胀变形的身躯、医院门口三两护士交班、远处电车头灯
        sound: 拐杖在石板路上的笃笃、远处医院门内传来的婴儿啼哭、闪光灯发火药粉的爆裂声
        smell: 医院消毒水、傍晚街市的烤鱼味、嫌疑人衣物上潮湿的霉气
        touch: 风衣领口被风灌起的冷、佩枪握把上汗水的滑
      improvisable_props:
        - 佐藤武雄的轮椅停在街角,他亲自坐镇指挥
        - 报社摄影师抱着木箱式相机蹲在路边
        - 行人中混着一名假装报亭老板的便衣警员
      npc_action_hints:
        npc.kuroishi-takahiro: [嘴里反复念诵"对不起……对不起……胡桃", 受刺激时刀刃会割破胡桃皮肤]
        npc.sato-takeo: [声音低沉, 用拐杖头点地下令, 不允许下属擅动]
        npc.kuroishi-kurumi: [见到丈夫的瞬间会下意识挽住他的手, 试图引导他离开抓捕视线]
    forbidden:
      - 不要让 LLM 替玩家决定击毙/制服/放走嫌疑人——这是抓捕场景的玩家抉择
      - 不要在抓捕过程中直接展示嫌疑人体内的虫体——只允许"披风下肿胀的轮廓"
      - 不要让佐藤武雄在抓捕现场就说出"上级要把案子收走"的预警

  # --------------------------------------------------------------------------
  - id: scene.morgue
    title: 帝大附属医院 · 停尸间
    frame:
      summary_md: |
        东京帝国大学医学部附属医院地下层的停尸间。一面墙是金属冷藏柜,
        另一侧是水泥洗台与解剖灯。佐藤武雄事先就交代了:警视厅高层
        来电,夜里会有人来"移送"嫌疑人尸体。在那之前,无论如何要
        把尸体看住。前半夜安然无事——但凌晨一点左右,挂着"黑石隆浩"
        姓名牌的冷柜门开始有节奏地震动……
      facts:
        - 上级电话指示午夜后会有人来移送嫌疑人尸体,要求警方配合
        - 凌晨一点左右,冷柜内传出有规律的"无线电式"节奏噪音
        - 黑石隆浩的脖颈在死亡后异常伸长,头部触肢具备攻击能力
        - 该状态对应"轱辘首"——必须由 PC 自行联想,LLM 不直接定名
      kp_secret_md: |
        本场景是后段最具冲击力的 SAN 重击。如果 PC 主动开柜,会
        触发轱辘首突袭;如果 PC 选择不动,听到一段时间后噪声归于
        寂静,但浅沼次郎的人会带着担架与公文进来抬走尸体。
        无论哪条路径,都会写入 flag.morgue-witnessed。
      exits:
        - to: scene.todai-hospital
          condition: free
          label: 跑出停尸间到医院走廊
        - to: scene.underground-cave
          condition: requires-flag
          required_flag: flag.morgue-witnessed
          required_value: true
          label: (后期) 沿梦中召唤前往荒川区地下洞穴
      npcs_present: []
      available_clues: [clue.morgue-incident]
    freedom:
      mood_tags: [医院地下的低温, 大正末年医学技术的冰冷感, 凌晨的死寂被节奏性噪音打破]
      sensory_palette:
        sight: 冷藏柜门上手写的姓名牌随震动微微抖动、解剖灯白光下水泥地面的反光
        sound: 起初的死寂、随后那种"像无线电通讯"的复杂节奏噪音、空调送风口的低鸣
        smell: 福尔马林、铁锈、冷藏柜门缝渗出的腐肉甜腥
        touch: 冷柜把手刺骨的金属冷,听诊器在外科台上滑落的碰响
      improvisable_props:
        - 解剖台旁的金属盘里摆着尚未使用的解剖工具
        - 墙上一只钉着的纸质值班表,夜班栏目空白
        - 走廊另一端的安全出口标志在闪烁
    forbidden:
      - 不要让 LLM 直接命名"轱辘首"或"虫佛"——这是 PC 自己关联民俗后才浮现的判断
      - 不要让停尸间内出现额外受害者(护士/学生),恐怖来自空旷与节奏的失控

  # --------------------------------------------------------------------------
  - id: scene.underground-cave
    title: 荒川区地下洞穴 · 受眷者之所
    frame:
      summary_md: |
        在抓捕收尾之后的某个夜里,曾被钻地魔虫心灵感应触碰过的调查员
        会发现自己被"无形的墙"逐渐围拢,只留出一条通道。一路向前,
        意识渐渐模糊,最终来到荒川区某处地下隧道,推开一扇生锈铁门
        后沿粗砌石阶向下。下方是一处高约三丈、宽仅七尺的狭长洞穴,
        顶部点缀着发着荧光的矿物。两侧石壁上是粗犷的远古崇拜图绘,
        洞穴尽头是一道无底的"地渊",地渊上方是一座草结断裂、红漆
        剥落的鸟居。鸟居前趴着一具枯瘦人形——那是一位**受眷者**。
      facts:
        - PC 通过梦境式召唤抵达此地,无法主动定位入口
        - 洞穴顶部荧光矿物提供唯一光源,意识到非自然事件损失 1/1D4 SAN
        - 壁画展示远古崇拜:狭长洞穴尽头的地渊与"巨型生物的子嗣"被推入地渊
        - 受眷者是干瘪人形,双眼空洞,口中反复吐出"永无尽头……"
        - 受眷者会枯萎散去,从眼眶爬出的虫类悄然没入地渊
      kp_secret_md: |
        受眷者最终会以悲苦低语"送归!吾子!……"向 PC 暗示"幼虫
        必须被送回"。如果 PC 没领会,佐藤武雄式的灵感检定可以触发
        该理解。本场景写入 flag.cave-encountered,后续仪轨结局以此
        为前置。
      exits:
        - to: scene.engakuji-temple
          condition: free
          label: 前往镰仓圆觉寺寻找仪轨法器
        - to: scene.coastal-tunnel
          condition: requires-clue
          required_clue: clue.osumi-tourist-map
          label: 前往江之岛海岸隧道入口
      npcs_present: [npc.eyed-ancient]
      available_clues: [clue.cave-mural, clue.send-back-message]
    freedom:
      mood_tags: [远古崇拜遗址的冷, 地渊深渊的回响, 受眷者干瘪的悲悯]
      sensory_palette:
        sight: 顶部矿物荧光像散落的星辰、壁画中崇拜者的轮廓粗砺如碎陶、鸟居断裂的草结垂下
        sound: 地渊深处似有似无的复杂噪音、受眷者枯枝指节的脆响、调查员自己心跳的回声
        smell: 数百年的尘、铁锈、湿润岩壁上苔藓的青气
        touch: 石阶磨破鞋底后脚底的疼、洞穴壁画凹凸不平的粗粝
      improvisable_props:
        - 受眷者身旁一只木碗,内壁刻着古老梵文
        - 鸟居根部一团枯萎的麻绳,曾系过祭祀符纸
        - 洞穴拐角一只生锈的钟,无人敲响
      npc_action_hints:
        npc.eyed-ancient: [极少动作, 偶尔抬枯枝般的手臂指向地渊, 声音从喉咙深处传出]
    forbidden:
      - 不要让 LLM 给"钻地魔虫"定名,描写时只允许"如蜈蚣般的虫"
      - 不要让受眷者主动报名或讲述完整传说,只允许碎片式低语
      - 不要在 PC 未领会"送归"暗示前就让壁画自动"亮起"

  # --------------------------------------------------------------------------
  - id: scene.engakuji-temple
    title: 镰仓圆觉寺
    frame:
      summary_md: |
        镰仓的圆觉兴圣禅寺,位于相模湾沿岸约 10 公里处的瑞鹿山下。
        山门匾上书"圆觉兴圣禅寺",寺内主要建筑均为木造,依山势而建。
        舍利殿在去年震灾中再次起火,如今正在重建。住持**梦窗素识**
        老成沉静,听到调查员问及《永旅经》时会推测它来自那位无名老僧
        或洪参法师。坐禅堂(无名老僧云游时居所)位于舍利殿东侧,堂内
        通铺的木墙上有不少墨迹——其中一处汉字笔迹与《永旅经》某段法事
        仪轨相关。
      facts:
        - 圆觉寺历史可追溯至弘安五年(公元 1282 年),北条家所建
        - 1921 年初舍利殿火灾,洪参法师圆寂前手持《永旅经》
        - 《永旅经》目前存放在住持居所
        - 坐禅堂木墙上汉字笔迹出自《大佛顶首楞严神咒》第七卷
        - 通过侦查 + 协助翻译,可在《永旅经》中找到对应"提空妙药"仪轨
        - 弁天堂"洪钟"无法移动,但若把虫引至山下可一次性驱逐多只
        - 圆觉寺可借出金刚杵、念珠、佛铃、木鱼等普通法器
      exits:
        - to: scene.osumi-apartment
          condition: free
          label: 返回大隅良田处通报新发现
        - to: scene.underground-cave
          condition: requires-clue
          required_clue: clue.eternal-journey-text
          label: 持仪轨与法器返回地下洞穴
      npcs_present: [npc.priest-musou]
      available_clues:
        - clue.eternal-journey-text
        - clue.zen-hall-inscription
        - clue.engakuji-bell
    freedom:
      mood_tags: [禅宗古寺的肃穆, 秋日泛红枫叶, 木造建筑的香与年深]
      sensory_palette:
        sight: 山门匾"圆觉兴圣禅寺"的鎏金字、枫叶覆盖的石阶、舍利殿重建工地的脚手架
        sound: 远处弁天堂洪钟的余音、僧人扫地的竹枝声、风吹过经幡的轻响
        smell: 檀香、霜降前的木叶气、落叶腐殖的微甜
        touch: 山门木柱表面的年轮、坐禅堂榻榻米因常年使用而磨光的边角
      improvisable_props:
        - 住持桌上一卷尚未誊写完毕的禅理偈语
        - 坐禅堂窗外一棵开始落叶的枫树
        - 舍利殿重建脚手架上一袋写着"再建寄付"的米
      npc_action_hints:
        npc.priest-musou: [声音低缓如风, 谈到经折前停顿良久, 提到"洪钟"时双手合十]
    forbidden:
      - 不要让住持主动揭示"佛牙舍利实为虫卵"——这是模组背景,玩家无从亲证
      - 不要让 LLM 在仪轨内容上自由发挥,必须严格按"提空妙药"+普通法器的口径
      - 不要让圆觉寺把洪钟借出——硬规则上洪钟不可移动

  # --------------------------------------------------------------------------
  - id: scene.coastal-tunnel
    title: 江之岛海岸隧道入口
    frame:
      summary_md: |
        江之岛东南侧海岸,一处隐蔽的崖壁内侧:一条用铁丝网围栏封闭
        的隧道通往海岸崖壁深处。围栏上挂着黄色"禁止通行,前方路段
        因塌方暂停施工"的警示牌。隧道内部光线昏暗,延伸约百米后
        曲折下行。再往前一段,可以看到地下实验所的入口——一扇
        哑光漆涂了伪装色的厚重钢制大门,门两侧是同样做了伪装的
        警卫室与装备室。
      facts:
        - 隧道入口由铁丝网围栏封闭,警示牌为伪装
        - 隧道内昏暗光线提供潜行检定的奖励骰
        - 钢制大门两侧分别为警卫室(常驻 2 人)与装备室(常驻 1 人)
        - 警卫室与装备室警员配警用转轮手枪;装备室另存有步枪、冲锋枪、手榴弹与撬棍、绳索、急救包等工具
        - 主干隧道继续深入可达地下研究所核心区
      exits:
        - to: scene.construction-site
          condition: free
          label: 沿海岸返回工地方向
        - to: scene.research-lab
          condition: requires-skill
          required_skill: stealth
          difficulty: regular
          label: 潜行靠近钢制大门
          on_failure_consequence: hp:1D3
      npcs_present: [npc.research-guard]
      available_clues: [clue.tunnel-entrance]
    freedom:
      mood_tags: [江之岛海风咸味, 隧道塌方警示的伪装, 警卫室外松内紧]
      sensory_palette:
        sight: 围栏上的黄色警示牌、被海风磨亮的铁丝、隧道深处略带霉迹的混凝土壁
        sound: 海浪反复扑岸、隧道内回声、远处加工厂施工的隐约金属敲击
        smell: 海腥、潮湿混凝土、警卫室飘出的卷烟味
        touch: 围栏铁丝在指尖刺出的细微划痕、隧道地面砂砾的硌脚
      improvisable_props:
        - 隧道口边一只被海水打来的木箱,印着东和加工厂的字样
        - 警卫室门外一双沾沙的胶靴
        - 围栏内侧地面上一道明显的拖拽痕迹,像是搬运过重物
      npc_action_hints:
        npc.research-guard: [沉默警惕, 看到生面孔会立刻按住佩枪, 不发言时仍保持戒备]
    forbidden:
      - 不要让警卫主动泄露研究所内部情况——他们不知道
      - 不要在本场景出现"Ouroboros-01"实物——它在 scene.research-lab 内冷库中

  # --------------------------------------------------------------------------
  - id: scene.research-lab
    title: 相模湾地下研究所
    frame:
      summary_md: |
        建于江之岛地下、伪装为"东和精密机械加工厂"的研究所核心区。
        三间实验室、办公室、会议室、材料室(含冷库)、宿舍、浴室、
        食堂、配电房、设备间与货运电梯,以及巡逻路线与定时换岗。
        实验室①陈列"Ouroboros-01"形态与行为研究的实验记录与文档;
        实验室②是 OBS-01-1 衍生药物开发场所,有少量原始提取物;
        实验室③目前空置,原计划用于培育"Ouroboros-01"新个体。
        冷库内一只 47 英寸高、14 英寸直径的金属罐状装置中保存着
        休眠中的"Ouroboros-01"。
      facts:
        - 实验室①藏有研究记录,实验室②藏有原始提取物与药物试验记录
        - 冷库金属罐装置脱离基座 + 拔除制冷管后,2 小时内 Ouroboros-01 苏醒
        - 配电房断电后,冷库备用电源可维持 10 小时,其他区域亮应急灯
        - 内部 4 名警卫:1 守电梯、1 守正门、2 名按钟摆方向巡逻
        - 货运电梯为羽仓葵透露的潜入通道
        - 江之岛与陆地间唯一桥梁存在卡口,Ouroboros-01 体型已增至 SIZ 40
      kp_secret_md: |
        本场景为"研究所章节"的核心。是否说服羽仓葵作为内应、
        如何带走 Ouroboros-01、如何穿越卡口,均会写入不同 flag。
        - 偷出冷库罐:flag.ouroboros-stolen
        - 任何形式留下 Ouroboros-01:flag.ouroboros-secured
        - 触发警报被全员压制:flag.research-alarm
      exits:
        - to: scene.coastal-tunnel
          condition: free
          label: 撤回隧道口
        - to: scene.engakuji-temple
          condition: requires-flag
          required_flag: flag.ouroboros-stolen
          required_value: true
          label: 携样本前往圆觉寺谋求仪轨
        - to: scene.kamakura-bay
          condition: requires-flag
          required_flag: flag.asanuma-deal-offered
          required_value: true
          label: 沿海岸前往浅沼次郎的水库
      npcs_present: [npc.hagura-aoi, npc.research-guard]
      available_clues:
        - clue.lab-records
        - clue.obs-extract
        - clue.guard-rotation
    freedom:
      mood_tags: [军方与科研混合的冷酷, 钢板地面与日光灯, 制冷设备低嗡]
      sensory_palette:
        sight: 实验台上的玻璃培养皿与铜制刻度仪、冷库金属门上的霜、走廊尽头办公室的玻璃门反光
        sound: 制冷管循环的嗤嗤、警卫皮鞋在金属地面的笃笃、远处发电机的低鸣
        smell: 消毒水、金属锈味、冷库门缝渗出的微凉空气
        touch: 防护服衣领的硬边、金属罐装置外壳的冰凉
      improvisable_props:
        - 实验室①一只装着 Ouroboros-01 蜕下硬壳的标本盒
        - 实验室②冷柜里一支贴着"OBS-01-1 临床批次"标签的小瓶
        - 办公室角落正在缝补的羽仓葵的备用洋装
      npc_action_hints:
        npc.hagura-aoi: [若被说服后会保持冷静职业感, 切电时手势精准, 强调"十分钟空档"]
        npc.research-guard: [按钟摆方向巡逻, 闻警报立刻向警卫室靠拢]
    forbidden:
      - 不要让 LLM 替玩家做出"是否说服羽仓葵"的决定
      - 不要让 LLM 直接展示 Ouroboros-01 苏醒后的形态描写——它的觉醒发生在罐外
      - 不要让研究所工作人员在战斗中"自爆献身",这是大正末年公务员/研究员

  # --------------------------------------------------------------------------
  - id: scene.kamakura-bay
    title: 相模湾沿岸 · 浅沼水库
    frame:
      summary_md: |
        相模湾沿岸一座中型水库,被某位"暗中负责人"租下并已经抽干。
        几条粗粗修缮过的渠道连接到附近海湾。这里是浅沼次郎为捕获
        Ouroboros-01 成熟个体所准备的"封水围猎场":只要成熟个体
        到达此处,他便会用钢板封闭水库顶部,并开闸放海水倒灌。
      facts:
        - 浅沼次郎已抽干水库储水,粗修了海湾连通渠道
        - 钢板已在工地堆放,准备一旦目标到达即用于封顶
        - 浅沼会要求调查员充当"接触者"诱使成虫前来,作为交换提供权力或金钱
        - 渠道处雇了几名民工昼夜守候,知情人极少
      exits:
        - to: scene.research-lab
          condition: free
          label: 沿海岸返回研究所方向
        - to: scene.engakuji-temple
          condition: free
          label: 转道前往圆觉寺
      npcs_present: [npc.asanuma-jiro]
      available_clues: [clue.water-trap-plan]
    freedom:
      mood_tags: [大正末年地下政治的阴影, 海风、混凝土与抽干水库的怪静, 浅沼带来的压迫感]
      sensory_palette:
        sight: 抽干的水库底部裸露的水泥与海藻残迹、堆积的钢板、连通海湾的渠道开口
        sound: 海风穿过钢板缝的呜咽、远处工人偶尔的咳嗽、浅沼皮鞋在水泥上的回响
        smell: 海腥、水泥粉尘、浅沼大衣上淡淡的西式香水
        touch: 钢板边缘的冷与刮手、水库侧壁干结的盐霜
      improvisable_props:
        - 渠道口插着的临时木牌"工事中,严禁靠近"
        - 水库底部一只被遗落的研究员胸牌
        - 浅沼车驾旁边停着的备用钢瓶
      npc_action_hints:
        npc.asanuma-jiro: [说话客气却不容拒绝, 提到"嘉仁陛下"时降声, 微笑里带威胁]
    forbidden:
      - 不要让浅沼次郎对调查员展示明显的暴力威胁——他更擅长以利益与体制压人
      - 不要让本场景出现 Ouroboros-01 的实体——这是诱捕预备地,不是诱捕现场

