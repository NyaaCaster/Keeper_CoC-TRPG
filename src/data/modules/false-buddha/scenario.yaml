clues:
  # --------------------------------------------------------------------------
  - id: clue.case-file-overview
    title: 三起符号案合并卷宗
    frame:
      location_scene: scene.briefing-room
      discovery: { method: auto-on-enter }
      reveal_md: |
        三份案卷副本:**1) 工地工人小林浩也**(8 月 3 日凌晨,凶器钝物),
        **2) 咖啡馆女给中岛敦子**(8 月 9 日,死因脱水/营养衰竭),
        **3) 退休职员志村和幸**(9 月 13 日早晨,心脏病并发)。
        三具尸体身上均被画下同一系列梵文符号,但符号细节有所差异:
        前两位身上的符号完整,第三位志村身上的符号缺了一笔。
      kp_note_md: |
        三起符号差异分别对应"刀兵灾"、"饥馑灾"、"疾疫灾",但
        志村身上的"疾疫灾"是凶手仪轨的"未完成版"——这是后续
        梵文学者解读的关键。
    forbidden:
      - 不要在第一时间就泄露符号背后的"三灾"含义,需要 PC 自行查阅或访谈

  - id: clue.crime-scene-empty
    title: 案发现场已被破坏
    frame:
      location_scene: scene.construction-site
      discovery: { method: auto-on-enter }
      reveal_md: |
        基坑边白色粉笔人形的轮廓已模糊到看不清姿态。施工继续后,
        案发现场已无任何可调查的物证残留。

  - id: clue.workers-tunnel-rumor
    title: 工人闲聊里的"东南海滩隧道"
    frame:
      location_scene: scene.construction-site
      discovery: { method: skill, skill: spot-hidden, difficulty: hard }
      reveal_md: |
        通过对工地附近两名建筑工人闲聊的偶然偷听,可以得知工人们
