  - id: npc.sato-takeo
    name: 佐藤武雄
    role: 盟友
    initial_location: scene.briefing-room
    initial_attitude: neutral
    frame:
      public_persona_md: |
        警视厅搜查一课强行犯系系长,六十出头。震灾时左腿严重受伤,
        如今坐轮椅,但说话掷地有声。三起符号杀人案被并案到他手上,
        他既要顶住舆论,又要应付暗中要"接走"嫌疑人尸体的高层。
        对下属直接、克制、不爱长篇大论;愿意把案子真相留在搜查
        一课的卷宗里,不让它被悄悄改写。
      stats:
        str: 50
        con: 55
        siz: 65
        dex: 35
        app: 50
        int: 70
        pow: 65
        edu: 70
        hp: 12
        mp: 13
        san: 65
      voice_guidelines:
        - 短句、不绕弯,经常用"行"、"明白了"、"再说"作答
        - 谈到上级或政界压力时声音会压低半度
        - 对下属信任时会直接交付通行证或案卷副本
    freedom:
