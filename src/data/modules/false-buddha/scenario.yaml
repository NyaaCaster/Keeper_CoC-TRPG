# 本模组以场景图与玩家驱动的探索为主,不设固定时刻表。
# 抓捕、停尸间、二次拜访等节奏关键节点由 KP 根据玩家进度临时插入,
# 不写硬性 timeline,以保留玩家驱动调查的张力。
timeline: []

# ============================================================================
# flags
# ============================================================================

flags:
  - id: flag.osumi-photo-seen
    title: 已见过大隅良田的项目合影
    initial: false
    description_md: |
      调查员在大隅良田家见过"乌洛波罗斯"项目主要成员合影,触发后
      可解锁工地名"东和"与合影背景的关联推理。

  - id: flag.osumi-trust-built
    title: 大隅良田信任已建立
    initial: false
    description_md: |
      调查员通过两次以上的访谈或情报交换,使大隅良田愿意拿出
      旅游地图。运行时由 LLM 根据剧情进度通过 scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.toa-link-known
    title: 已发现工地"东和"与研究所的关联
    initial: false
    description_md: |
      调查员推断出加工厂工地之下就是震灾前的"乌洛波罗斯"研究实验所。

  - id: flag.symbol-pattern-known
    title: 已确认三起案件符号同源
    initial: false
    description_md: |
      调查员明确三起命案的符号属于同一系列,可推动梵文/佛教方向的解读。

  - id: flag.three-disasters-known
    title: 已破译三符号 = 刀兵/饥馑/疾疫
    initial: false
    description_md: |
      调查员通过图书馆使用 + 梵文学者咨询,确认三符号对应"小三灾",
      推断凶手仪轨来自佛教宇宙观。

  - id: flag.hospital-stake-out-ready
    title: 抓捕方案已准备就绪
    initial: false
    description_md: |
      调查员已经定位嫌疑人将出现的位置(帝大附属医院附近),布控
      就位。

  - id: flag.kuroishi-killed
    title: 黑石隆浩在抓捕中被击毙
    initial: false
    description_md: |
      抓捕场景的玩家选择:直接击毙嫌疑人,后续只剩处理尸体与
      停尸间事件。运行时由 LLM 通过 scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.kuroishi-taken-away
    title: 嫌疑人被高层秘密带走
    initial: false
    description_md: |
      抓捕未直接击毙,嫌疑人在送审过程中被浅沼次郎方面以"上级
      指示"为由秘密接走。运行时由 LLM 通过 scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.kurumi-injured
    title: 黑石胡桃在抓捕中受伤
    initial: false
    description_md: |
      抓捕过程中黑石胡桃被刀刃割破颈部皮肤甚至更严重。运行时由 LLM 通过
      scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.morgue-witnessed
    title: 已目睹停尸间异象
    initial: false
    description_md: |
      调查员在停尸间值守时目睹了"轱辘首"或类似的异象,损失了显著 SAN。

  - id: flag.cave-encountered
    title: 已在地下洞穴遇到受眷者
    initial: false
    description_md: |
      调查员被受眷者召唤到荒川区地下洞穴,并理解了"送归"暗示的含义。

  - id: flag.send-back-known
    title: 已领会"送归吾子"的请求
    initial: false
    description_md: |
      调查员明白远古崇拜要求把幼虫送回地渊,以阻止又一次大震灾的发生。

  - id: flag.bell-known
    title: 已知晓洪钟的"上策"
    initial: false
    description_md: |
      调查员了解到敲响圆觉寺洪钟可一次性驱逐所有位于日本地下的同类。

  - id: flag.ritual-known
    title: 已学得"提空妙药"仪轨
    initial: false
    description_md: |
      调查员已通过《永旅经》研究 + 圆觉寺协助,完成"提空妙药"仪轨
      的首次学习(困难难度智力检定通过)。

  - id: flag.weakness-water-known
    title: 已掌握 Ouroboros-01 的弱点(水)
    initial: false
    description_md: |
      调查员从研究记录或羽仓葵处确认 Ouroboros-01 对水极敏感。

  - id: flag.aoi-recruited
    title: 羽仓葵已答应作为内应
    initial: false
    description_md: |
      调查员通过多次接触与说服,使羽仓葵答应在研究所内充当内应。
      运行时由 LLM 通过 scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.guard-info-known
    title: 已知晓研究所警卫巡逻空档
    initial: false
    description_md: |
      调查员从羽仓葵处或自行侦查得到研究所警卫巡逻路线与换岗空档。

  - id: flag.asanuma-deal-offered
    title: 浅沼次郎已提出合作要约
    initial: false
    description_md: |
      浅沼次郎已向调查员提出"接触者"合作要约,以权力/金钱作为交换。

  - id: flag.ouroboros-stolen
    title: Ouroboros-01 已被盗出研究所
    initial: false
    description_md: |
      调查员成功从研究所冷库取走 Ouroboros-01 装置。运行时由 LLM 通过
      scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.research-alarm
    title: 研究所警报已被触发
    initial: false
    description_md: |
      调查员行动时被警卫发现并按响警报。运行时由 LLM 通过
      scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.bodhisattva-ending
    title: 主线 - 菩提心(送归吾子)
    initial: false
    description_md: |
      调查员在地下洞穴举行"提空妙药"仪轨,把幼虫送回地渊,阻止
      又一次大震灾。运行时由 LLM 通过 scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.arhat-ending
    title: 主线 - 阿罗汉(独善其身)
    initial: false
    description_md: |
      调查员在政治压力下把案子收尾,Ouroboros-01 留在研究所或浅沼
      手中,东京暂时太平,但隐患未除。运行时由 LLM 通过
      scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.pratyeka-ending
    title: 主线 - 辟支佛(独自悟道)
    initial: false
    description_md: |
      调查员未能阻止又一次震灾,但留下了关于"虫佛"的记录,使
      后人有可能继续追查。运行时由 LLM 通过 scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

  - id: flag.party-wiped
    title: 调查员团灭
    initial: false
    description_md: |
      所有上场调查员阵亡或彻底失能。运行时由 LLM 通过
      scenarioActions.flagSet 写入。
    writable_by: [scenario-actions]

# ============================================================================
# endings
# ============================================================================

endings:
  # --------------------------------------------------------------------------
  - id: ending.tpk
    title: 永无尽头的旅人
    triggers:
      - { flag: flag.party-wiped, value: true }
    priority: 100
    frame:
      epilogue_md: |
        没有人从这场调查里走出来。东京帝大医学部附属医院新出炉的
        尸检报告会被层层上呈,但很快就会被某通来自上层的电话压下;
        这座城市继续假装一切如常。地壳深处的鸣叫将再次响起,只是
        那时已与你们无关。
      scenario_end_kind: dead
      rewards:
        skill_growth: false
    freedom:
      atmosphere_md: 雨夜、油纸伞、电车铃声、远处工地的金属敲击。
    forbidden:
      - 不要替死去的调查员写"灵魂归乡"或"佛祖引渡"——克系不允许这种安慰

  # --------------------------------------------------------------------------
  - id: ending.bodhisattva
    title: 菩提心 · 送归吾子
    triggers:
      - { flag: flag.bodhisattva-ending, value: true }
    priority: 90
    frame:
      epilogue_md: |
        洞穴最深处,你念完了那段无名老僧留下的经文,**提空妙药**
        在地渊上空化作一道淡金色的光晕。如蜈蚣般的幼虫从你掌心
        滑下,沉入地渊。受眷者枯瘦的手臂最后一次抬起,然后归于
        寂静。地壳深处的低鸣慢慢退潮——东京这一次不会再被掀翻
        了。这胜利不洁净,但它确实是胜利:你们带着无法对外人解释
        的颤抖,走出洞穴,迎着重建中城市的晨光。
      scenario_end_kind: victory
      rewards:
        skill_growth: true
        san_reward_formula: "1D6"
        san_reward_conditions:
          - { label: 揭穿"乌洛波罗斯"项目背后的政治阴谋, flag: flag.asanuma-deal-offered, formula: "1D4" }
          - { label: 让大隅良田从浅沼次郎的胁迫中脱身, flag: flag.osumi-trust-built, formula: "1D4" }
        cash_reward: 500
    freedom:
      atmosphere_md: 黎明、城市轮廓在薄雾里、远处警视厅大楼的窗逐一亮起。
    forbidden:
      - 不要把"成为善知识"写成轻松的英雄归来——洞穴里见过的东西不会真的离开你

  # --------------------------------------------------------------------------
  - id: ending.arhat
    title: 阿罗汉 · 独善其身
    triggers:
      - { flag: flag.arhat-ending, value: true }
    priority: 70
    frame:
      epilogue_md: |
        案子合上了。报纸只用了三个版面来写"凶手已伏法",上层的
        电话再也没响起。Ouroboros-01 仍在某处,只是不再是你需要
        担心的事。你保住了自己的位置、你的同事、你写出来的卷宗——
        但每个深夜电车经过医院旁的弯道时,你都会习惯性地数一数
        车窗外那几栋小楼里还有几盏灯亮着。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: "1D3"
    freedom:
      atmosphere_md: 深夜、电车、雨刷、办公桌上摞着的下个月案卷。
    forbidden:
      - 不要让 LLM 在此结局里给"以后还能挽回"的承诺——这是单向的体制选择

  # --------------------------------------------------------------------------
  - id: ending.pratyeka
    title: 辟支佛 · 独自悟道
    triggers:
      - { flag: flag.pratyeka-ending, value: true }
    priority: 50
    frame:
      epilogue_md: |
        震灾再一次降临东京——这次烈度不大,只摧毁了荒川区的一部分,
        但你知道这并非天意。你没能阻止它,但你把所有线索写成厚厚一份
        手稿,与一份用麻纸抄录的《永旅经》仪轨残篇一同藏进神田旧书肆
        的暗格里。如果有后来者读懂,他们或许还有机会。你已不再是这
        条道路上唯一的旅人,但你也不会再独自前行。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: "1D4"
    freedom:
      atmosphere_md: 灰扑扑的清晨、神田旧书肆的木地板、麻纸上墨迹尚未干透。
    forbidden:
      - 不要写"这次失败也是值得的"——保留 PC 当时确实做出了选择的余地

# ============================================================================
# global_freedom / global_forbidden
# ============================================================================

global_freedom:
  era_atmosphere_md: |
    1924 年大正末年的日本东京。关东大震灾过去整整一年,城市处在
    "重建尚未完成、繁华已开始恢复"的拉锯状态。日常物件:木壳
    电话机、铜铃门铃、人力车、电车、新式座式打字机、铸铁路灯、
    刚开始流行的西式咖啡馆与"純喫茶"招牌、男士文明帽与女子
    洋装并存。地图、报纸与手写公文是信息流通的主流;长途通话
    必须经过接线员转接。汽车在东京市中心已不罕见,但多为公务
    或富商所用。
  language_register: |
    现代书面中文翻译式叙事,允许少量大正期日式专有名词原音译
    (如"純喫茶"、"巡查"、"系长"、"同润会公寓");避免现代
    网络用语,避免"刹那""少顷"等过度文言;保留大正末年都市
    日常的克制与礼数。
  npc_default_dialect: |
    大正末年东京标准语的中文译法,夹少量敬语后缀。佐藤武雄说话
    短直,大隅良田带退休教授的克制礼数,流浪汉粗砺夹脏话,寺院
    住持语调舒缓,浅沼次郎言语极尽客气却不容拒绝。

global_forbidden:
  - 不要主动提"克苏鲁""旧日支配者""钻地魔虫""轱辘首""阿撒托斯"等专名,用感官与民俗暗示代替(对齐 SYSTEM_INSTRUCTION 第 8 节)
  - 不要在抓捕完成前让任何 NPC 把"乌洛波罗斯"或《永旅经》全名脱口而出——大隅 / 羽仓 / 浅沼三人都受保密协议或政治压力约束
  - 不要让 LLM 把符号案直接归因于"虫"或"寄生",必须由 PC 通过梵文 + 受眷者 + 停尸间三条线索自行串联
  - 不要写本模组未声明的额外结局
  - 不要让 KP 替玩家做出"是否击毙嫌疑人"、"是否说服羽仓葵"、"是否接受浅沼合作"这三个核心抉择

# ============================================================================
# narrative_style:LLM 扮演 KP 时的文风指导
# 设计哲学:一段示范段落 > 十条抽象规则;frame 是必须遵守的语法层,
# freedom 是可挑用的语料池。
# ============================================================================

narrative_style:
  frame:
    pov: 第二人称
    tense: 现在时
    forbidden_phrasings:
      - 不要写"调查员投出了 Spot Hidden 检定"等元游戏术语
      - 不要使用第四面墙之外的全知评论(例:"读者可能猜到")
      - 不要用"突然""忽然"作为廉价惊吓的开头,改用具体感官变化
      - 不要使用现代办公用语("汇报"、"对接"等),改用大正末年的"呈交"、"协查"、"知会"
  freedom:
    sentence_pacing_md: |
      调查推进段落用 30~60 字的中长句铺氛围,逗号分层、信息密度低;
      抓捕、停尸间、洞穴等高强度时刻切到 8~15 字短句,用换行与省略号
      制造呼吸顿挫;NPC 独白允许长句,但需以"——"切分情绪转折。
    vocabulary_register: |
      大正末年东京日常的中文译法,允许"純喫茶"、"系长"、"同润会公寓"
      等专有名词,避免现代俚语,避免成语堆叠。
    metaphor_palette:
      - 蒸汽机车站台上久未散去的煤烟
      - 电车驶过弯道时玻璃窗上倒映的零落街灯
      - 木壳电话机内部的细铜铃像极了夜里偶尔不合时宜的寒意
      - 木造民居梁柱深处吸饱湿气的呼吸
      - 警视厅档案柜里被反复翻动后纸边卷起的微弱毛刺
      - 寺庙木门推开时榫卯吱呀
    reference_works:
      - 川端康成《雪国》中关于温泉与电车的克制冷静
      - 江户川乱步早期短篇里那种"昭和初年都市"的压抑悬疑
      - 黑泽明《罗生门》开场雨幕下木屋的破败与僧人的喘息
    sample_paragraph_md: |
      档案柜的铁皮在你掌心冰得发涩。系长把案卷推过来时,茶杯里的
      水汽刚刚漫过杯沿。
      "三个人,三种死法。"他说,"但身上画的,是同一张脸。"
      窗外,文京区的电车经过弯道,铃声像旧人念过一半就停下的咒。

