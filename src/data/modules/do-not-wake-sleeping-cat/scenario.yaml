    role: 平民
    initial_location: scene.sleeping-cat-shrine
    initial_attitude: neutral
    frame:
      public_persona_md: |
        22 岁, 自由职业者, 热爱远足。社交平台狂热爱好者——上山途中、
        看到沉眠之猫、雾起之时, 各发了一条 SNS。此时正昏睡在沉眠之猫
        石台旁, 被一群猫围在中间, 没有明显外伤。
      secret_md: |
        因觉得"石猫太可爱了"而碰动了沉眠之猫石像, 是本次事件的起因。
        碰倒石像的瞬间, 她的意识被拉入幻梦境, 至今未醒。在白(Shiro)
        归位之前任何"急救""呼喊""摇晃"都无法唤醒她——她不在这里。
      secret_unlock_trigger: clue.kamakura-sns-trace
      stats:
        str: 50
        con: 55
        siz: 50
        dex: 60
        app: 65
        int: 60
        pow: 50
        edu: 60
        hp: 10
        mp: 10
        san: 50
      combat:
        weapon: 徒手
        damage_formula: 1D3
        skill_value: 25
      voice_guidelines:
        - 在白归位前**完全昏睡**, 不开口、不回应、呼吸均匀但额头微汗
        - '苏醒后语气是"睡了一觉醒来"般迟钝, 不立刻意识到自己引发了灾难'
        - '苏醒后才会开始道歉, 道歉方式带 SNS 网络感: "啊那个真的对不起对不起"'
    freedom:
      improvisable_quirks:
        - 昏睡中手机仍偶尔震动, 是 SNS 私信
        - 衣领别着一只小红叶造型的胸针
        - 苏醒后第一件事是摸口袋找手机
      catchphrases: [呃……怎么回事?, 那只猫真的好可爱嘛, 啊真是的]
    forbidden:
      - 不要让 LLM 替调查员"用急救把她叫醒"——这条路在白归位前永远失败
      - 不要让镰仓在白归位前发出任何呓语级以上的台词
      - 不要让 LLM 替调查员判断"她是不是中毒/受伤了"——只能说"看不出明显外伤"

  # --------------------------------------------------------------------------
  - id: npc.shiro
    name: 白(Shiro)/ 沉眠之猫
    role: 中立
    initial_location: scene.sleeping-cat-shrine
    initial_attitude: neutral
    frame:
      public_persona_md: |
        看上去是一只全身纯白、毛发洁净、金黄色眼瞳的优雅家猫, 体型不算大。
        实际上是一位从幻梦境而来的高贵之猫——"白(Shiro)", 数百年前
        被一位住在静眠山下的樵夫的温柔之心打动, 从此化为石像守护此地。
        会**用日语说话**, 但只对值得对话的人开口。
      secret_md: |
        现在它对粗心游客(镰仓佐羽)碰翻自己石像所引发的"两界连通"非常
        烦躁——这是它再次将现实与幻梦境相连的原因。它会问 PC: "这家伙
        有救的价值吗?"——若 PC 表现出"温柔之心", 它会跳上**幸运最高**
        的调查员手臂, 让其将自己送回石台,过程中体重逐渐增加直至完全
        变成石像; 一旦归位, 现实与幻梦境的连接被切断, 冷蛛也随之
        从此世消失。若 PC 没有表现出温柔之心, 它会失望离开, 群猫随之
        而去, 留 PC 独自面对猎手冷蛛。
      secret_unlock_trigger: clue.shrine-old-tale
      stats:
        str: 5
        con: 30
        siz: 5
        dex: 90
        app: 80
        int: 90
        pow: 90
        edu: 90
        hp: 4
        mp: 18
        san: 99
      voice_guidelines:
        - >-
          **第一句铁律**:走到猫群前的瞬间, 它的台词是用日语
          (现代日本口语)说出 "这家伙有救的价值吗?"——之后停下,
          等待调查员主动作答。**严禁**替调查员答, 严禁追加台词。
        - 它的语气优雅、不带情绪起伏, 像在评估一件供品而不是审讯一个人
        - 调查员表态"温柔之心"后, 它会说"那么, 把我送回我最喜欢的那个地方吧"
        - 跳上 PC 手臂后闭眼, 之后无论 PC 说什么都不再回应——它在睡觉
        - 调查员表态冷漠/敌意后, 它会说"……知道了。那么再见。"——简短至此
        - 它**不会**直接提到"幻梦境""阿特拉克·纳克亚""冷蛛"等名词
    freedom:
      improvisable_quirks:
        - 说话时尾音温和地下沉, 像受过良好教育的成年人, 而非小猫的"喵"
        - 偶尔以一只前爪整理胸前的毛, 动作精致
        - 闭眼后呼吸节奏极轻, 像睡着了一样, 但耳朵会偶尔动一下
      catchphrases: ["这家伙有救的价值吗?", "那么, 把我送回我最喜欢的那个地方吧。", "……知道了。那么再见。"]
    forbidden:
      - >-
        **替玩家做选择的红线**:严禁 LLM 在白发问后, 自己代入"温柔之心"
        台词替调查员答; 必须**等待**调查员的具体行动/对白
      - 不要让白离开沉眠之猫石台的范围(除了变成石像被 PC 抱着送回时)
      - 不要让白与冷蛛直接战斗——它的"对策"是让两界断开, 而不是物理战
      - 不要在镰仓佐羽未苏醒前让白说出"她已经苏醒了"

# ============================================================================
# clues
# ============================================================================

clues:
  # --------------------------------------------------------------------------
  - id: clue.worried-message
    title: 来自重要之人的担心短消息
    frame:
      location_scene: scene.cable-car
      discovery:
        method: auto-on-enter
      reveal_md: |
        手机震动, 屏幕亮起。SNS 私信窗口里是一段你**重要之人**发来的
        担心短消息(年少调查员则可视为父母):
        > 查了一下静眠山的情况, 好像说现在起了大雾。
        > 听说你现在正在那边, 没什么问题吗?
        > 以防万一, 你还是在网上搜一下静眠山的消息比较好。
      kp_note_md: |
        这条短消息是诱导调查员去 SNS 搜"静眠山"的关键钩子——会带出
        clue.sns-kamakura-posts。
      unlocks: {}
    freedom:
      sensory_when_found_md: |
        屏幕的冷光在车厢的暗处被衬得格外刺眼, 耳压因高度上升发胀。
    forbidden:
      - 不要让 LLM 替调查员决定回复内容——回复是 PC 自由

  # --------------------------------------------------------------------------
  - id: clue.cocooned-bodies
    title: 对向缆车舱里的两具"茧"
    frame:
      location_scene: scene.cable-car
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        缆车快到山顶时, 你与一节下行车厢擦肩而过——整个座位连同上面
        蜷缩的两个人, 都被一种像薄纱的东西从外到内层层裹住, 像一只
        巨大的茧。仔细看, 茧里是一男一女两位乘客, 男子紧紧抓住女性,
        以扭曲的姿势被包住, 看上去不像还活着。**穿着工作制服**, 应当是
        缆车站工作人员与商店店员。皮肤上能看见严重变色——是一种你想象
        不出的强力毒物所致。
      kp_note_md: |
        擦肩而过时触发 SAN 1/1D4。【医学】或【科学(药学)】成功者能
        推测出"中毒", 但想不出有什么强力毒药能造成如此程度的变色。
      unlocks:
        flags: [flag.knew-cocoon-victims]
    freedom:
      sensory_when_found_md: |
        车厢擦肩的瞬间, 你能闻到一丝从对向飘来的、像旧药水又像变质蛋白
        的腥气。
    forbidden:
      - 不要让 LLM 描写茧被破开的具体细节——擦肩而过, 看不真切
      - 不要让 LLM 在此时让"包茧的怪物"现身, 它的现身延后到 clue.cable-car-spider-sighting

  # --------------------------------------------------------------------------
  - id: clue.cable-car-spider-sighting
    title: 缆线之间黑色的"广告气球"
    frame:
      location_scene: scene.cable-car
      discovery:
        method: auto-on-enter
      reveal_md: |
        缆线突然剧烈摇晃, 有什么东西飞快从你头上略过——通体黑色、
        像是巨大广告气球似的某种"腹部", 出现在上下行缆车的缆线之间,
        每当它移动, 缆线都剧烈摇动。它向刚刚擦肩而过的两具尸体方向
        离开, 随后从背后传来难以想象的诡异声音(它在进食)。
      kp_note_md: |
        目击触发 SAN 0/1。失去的 SAN 计入"目击冷蛛", 适用规则书 142 页
        "习惯恐惧"规则。
      unlocks:
        flags: [flag.witnessed-spinner-spider, flag.encountered-spider]
    freedom:
      sensory_when_found_md: |
        雾气里那团黑色的轮廓只能看清边缘, 你不敢、也来不及看清它的
        正脸。缆线在它经过时像被一只巨大的手用力拨过的琴弦。
    forbidden:
      - 不要让 LLM 在此处直接说出"冷蛛""阿特拉克·纳克亚""蜘蛛之神"
      - 不要替调查员描写它的整个躯体, 雾里只允许"腹部 / 黑色气球状轮廓"

  # --------------------------------------------------------------------------
  - id: clue.sns-kamakura-posts
    title: SNS 上的镰仓佐羽连发短文
    frame:
      location_scene: scene.cable-car
      discovery:
        method: skill
        skill: library-use
        difficulty: regular
      reveal_md: |
        在 SNS 搜索"静眠山", 一位昵称镰仓佐羽的用户连发了三条带话题
        `#静眠山` 的短文:
        > [30 分钟前] 到静眠山了!景色真美! 太棒了!
        > [20 分钟前] 找到传说中的沉眠之猫了! 比想象中小多了! 抱了一下!
        > [5 分钟前] 好大的雾! 突然好困!
        浏览她的主页, 还能看到她在登山途中给一只小石猫拍的照片——
        台座底下还能看见些许白色, 像是石像被人挪动过的露土。
      unlocks:
        flags: [flag.knew-kamakura-touched-cat]
    freedom:
      sensory_when_found_md: |
        手机屏幕上她的头像是一只举着樱花的卡通柴犬, 与现在山上的诡异
        氛围形成奇怪的反差。
    forbidden:
      - 不要让 LLM 替调查员推断"她抱起石像导致两界连通", 这要等到 clue.shrine-old-tale 解锁后玩家自己拼接

  # --------------------------------------------------------------------------
  - id: clue.cable-car-webbing
    title: 滑轮上的蛛网
    frame:
      location_scene: scene.cable-car-station
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        缆车站滑轮机构上缠绕着大量极细的蛛网——这是缆车异常停止运作
        的真正原因。蛛丝韧性极强且具有粘性, 想徒手拉断不现实。
        修缆车需要相当长的时间, 而筑巢冷蛛随时可能回来。
      kp_note_md: |
        【博物】或【教育】检定成功的调查员可以想起"蛛网怕火"的常识。
      unlocks:
        flags: [flag.knew-spider-weak-to-fire]
    freedom:
      sensory_when_found_md: |
        蛛丝在风里几乎透明, 但伸手摸过滑轮机构时, 指尖能感到一层无法
        洗掉的粘腻。
    forbidden:
      - 不要让 LLM 暗示"修好滑轮就能下山"——修不好, 时间不够

  # --------------------------------------------------------------------------
  - id: clue.shop-map
    title: 静眠山观景台示意图
    frame:
      location_scene: scene.shop
      discovery:
        method: auto-on-enter
      reveal_md: |
        商店收银台后方的墙上贴着一张被红色虚线圈出几处地点的示意图。
        从缆车站出来, 经商店、广场、咖啡店一路向南; 广场东侧立着
        结缘之钟; 广场南端是登山道入口, 沿登山道下山约 5 分钟可见
        "沉眠之猫"看板与石台。
      unlocks:
        flags: [flag.knew-area-map]
    freedom:
      sensory_when_found_md: |
        示意图被反复指过, 边角已经泛黄, 红色虚线却新画上去不久。
    forbidden:
      - 不要让 LLM 替调查员"记下"地图——记下与否是 PC 主动行为

  # --------------------------------------------------------------------------
  - id: clue.smashed-speaker
    title: 茧状音箱与里面的深色液体
    frame:
      location_scene: scene.shop
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        墙上原本装音箱的位置, 现在只剩下被强行扯下的电线与几道明显的
        撕扯痕。音箱本体被搬到角落, 用蛛丝裹成茧状; 茧上有一个不小
        的洞——像是被尖牙咬出来的——洞里渗出深色刺鼻的液体。
      kp_note_md: |
        【医学】或【科学(药学)】成功的调查员可以推测这是某种强力毒液。
        蛛网怕火、毒液致命, 这是冷蛛的双重威胁。
      unlocks:
        flags: [flag.knew-spider-poison, flag.knew-spider-noise-sensitive]
    freedom:
      sensory_when_found_md: |
        毒液闻起来有一种"陈年化学品 + 发酵蛋白"的复合腥气, 离半米远
        鼻子就开始有刺痛感。
    forbidden:
      - 不要让 LLM 替调查员"在毒液里取样", 取了也没人能立刻分析
      - >-
        **冷蛛对声音敏感的事实必须借此 clue 揭示**——它特意把会发出
        声音的音箱专门搬来"咬洞处理", 这是 PC 推断"冷蛛攻击声源"的
        关键提示

  # --------------------------------------------------------------------------
  - id: clue.plaza-pickaxe-marks
    title: 广场上的凿痕与残留蛛网
    frame:
      location_scene: scene.plaza
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        广场鹅卵石上密布像鹤嘴镐凿出的痕迹, 痕迹里附着一层粘性极强的
        蛛网。两种破坏痕迹**叠加**——这意味着有两种不同模式的"重型
        破坏者"曾在此处对峙过。
      unlocks:
        flags: [flag.knew-two-spiders-fight]
    freedom:
      sensory_when_found_md: |
        蹲下细看, 凿痕与鹅卵石地缝里还能看见几丝挣扎过的蛛网, 像谁在
        紧要关头被人扯断又重新粘上。
    forbidden:
      - 不要替调查员说出"这是两只巨大蜘蛛打过架", 必须由调查员主动提出, KP 才肯定

  # --------------------------------------------------------------------------
  - id: clue.bell-trick
    title: 结缘之钟与"用绳子延长拉钟距离"
    frame:
      location_scene: scene.bell
      discovery:
        method: skill
        skill: mechanical-repair
        difficulty: regular
      reveal_md: |
        看着钟内的粗绳和钟体的尺寸, 你想到一个办法:不直接上手拉钟,
        而是把咖啡店或商店里的塑料绳系在钟锤上, 远远地从安全位置一拉,
        既能敲响吸引冷蛛, 又能避免自己直接成为目标。
      unlocks:
        flags: [flag.knew-bell-rope-trick]
    freedom:
      sensory_when_found_md: |
        风从钟体边缘掠过, 仿佛它已经在低低自鸣。
    forbidden:
      - 不要替调查员实施这个计划, 这条线索只是"知道这个办法可行"

  # --------------------------------------------------------------------------
  - id: clue.cafe-pickaxe-marks
    title: 咖啡店内的凿痕与碎裂音箱
    frame:
      location_scene: scene.cafe-siesta
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        咖啡店木地板上密布像鹤嘴镐凿击的痕迹, 与商店里"被撞翻"的破坏
        方式截然不同。墙上的音箱不是被搬走包茧, 而是被**当场凿碎**——
        这是另一种冷蛛(猎手)留下的痕迹: 它不结网、不困猎物, 直接
        扑向声源。
      unlocks:
        flags: [flag.knew-hunter-spider-pattern]
    freedom:
      sensory_when_found_md: |
        音箱碎片散落在收银台后, 上面还残留着几滴和商店茧状音箱里同样
        的深色液体。
    forbidden:
      - 不要让 LLM 替调查员合并"两种冷蛛"的概念, 由调查员主动联想

  # --------------------------------------------------------------------------
  - id: clue.cafe-storage-touko-rescued
    title: 找到藏身仓库的七味桐桐
    frame:
      location_scene: scene.cafe-storage
      discovery:
        method: auto-on-enter
      reveal_md: |
        厨房深处的金属门里传来抽气声。无论是用 SNS 私信她、轻轻敲门
        报姓名, 还是直接从外面呼叫——只要让她确认门外不是怪物, 她就
        会颤抖地搬开木棍, 推开一道仅容一人通过的缝。
      unlocks:
        flags: [flag.touko-rescued]
    freedom:
      sensory_when_found_md: |
        门缝拉开瞬间, 一股仓库的尘味与她身上的咖啡豆香一起飘出来。
    forbidden:
      - 不要让 LLM 替调查员"先拿到武器再开门", 这是 PC 自由
      - 不要让七味在被找到的瞬间就崩溃大哭, 她是认真型

  # --------------------------------------------------------------------------
  - id: clue.storage-supplies
    title: 仓库内的塑料绳与打火机
    frame:
      location_scene: scene.cafe-storage
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        仓库墙上挂着一卷一卷标着"咖啡豆扎口用"的塑料绳——是延长结缘之钟
        拉钟距离的现成材料。架子上还有一只打火机(燃气补充瓶口装置用),
        以及一只小型急救箱、几条厨房用毛巾。
      kp_note_md: |
        塑料绳与打火机分别对应"远程敲钟"和"烧蛛网"两个关键策略道具。
      unlocks:
        flags: [flag.have-rope-and-lighter]
    freedom:
      sensory_when_found_md: |
        塑料绳的塑料味、打火机的金属壳、急救箱的蜡纸味, 共同压在仓库
        微凉的空气里。
    forbidden:
      - 不要让 LLM 替调查员"挑选"具体哪条绳——拿就是了

  # --------------------------------------------------------------------------
  - id: clue.trail-signboard
    title: 登山道入口看板 · 静眠山的旧闻
    frame:
      location_scene: scene.mountain-trail
      discovery:
        method: auto-on-enter
      reveal_md: |
        登山道入口立着一块旧木看板, 上面写着静眠山的古老传说:
        > 过去不知为何总有人在山中睡着, 有时甚至会在沉睡中死去, 因此
        > 人们都害怕进到山中。然而有一位樵夫独自住在山上。他对人和动物
        > 同样友善, 和一只名为白(Shiro)的猫关系很好。也许正因为这样,
        > 每当樵夫在山上睡着时, 白(Shiro)总会将他叫醒。为了得到白
        > 的庇佑, 住在山中的人们开始祭祀名为「沉眠之猫」的石像。
        > 从那之后再也没有人在山上睡着。
      unlocks:
        flags: [flag.knew-shiro-tale]
        clues: [clue.shrine-old-tale]
    freedom:
      sensory_when_found_md: |
        木牌被山风刮得有些发脆, 字迹是手写的, 看得出每隔几年会被
        重新涂一次。
    forbidden:
      - 不要让 LLM 替调查员推断"白还活着且会变成石像"——这要在 sleeping-cat-shrine 处由 NPC 直接表态

  # --------------------------------------------------------------------------
  - id: clue.overturned-truck
    title: 翻倒的货车与店长尸体
    frame:
      location_scene: scene.mountain-trail
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        登山道中段有一辆从业者用的小型厢式货车横翻在道路中央。车体上
        到处是深而宽的凿痕, 引擎已经被破坏得无法发动。车窗碎裂, 大量
        血迹从车内飞散而出。驾驶室里是一具被破坏得不成样子的中年男子
        尸体——咖啡店店长。猎手冷蛛挡下了货车, 但没能把他从驾驶室里
        拖出来, 于是疯狂破坏车体作为发泄。
      kp_note_md: |
        目击触发 SAN 0/1D3。
      unlocks:
        flags: [flag.knew-truck-fate]
    freedom:
      sensory_when_found_md: |
        登山道上方树木被折断的声音突然清晰起来——猎手冷蛛察觉了你的
        到来, 正在迫近。
    forbidden:
      - 不要让 LLM 替调查员决定"要不要救店长"——他已经死了
      - >-
        **猎手冷蛛迫近的预警铁律**:此 clue 触发后, 必须在叙事中
        加入"远处树木剧烈摇晃"的预警, 但**不**让冷蛛立刻扑过来——
        给 PC 一次回头逃跑的机会

  # --------------------------------------------------------------------------
  - id: clue.shrine-old-tale
    title: '"沉眠之猫"传说与石像消失的关联'
    frame:
      location_scene: scene.sleeping-cat-shrine
      discovery:
        method: flag
        condition_flag: flag.knew-shiro-tale
      reveal_md: |
        看板与石台并立——但**石台上没有猫**。结合登山道入口看板上的
        旧闻, 你意识到: 看板说"自从供奉沉眠之猫后, 再没有人在山上
        睡着"——而镰仓佐羽 5 分钟前的 SNS 写着"突然好困!", 现在
        昏睡在台座旁。石像被她抱动了, 庇佑断了。
      unlocks:
        flags: [flag.knew-shrine-broken]
    freedom:
      sensory_when_found_md: |
        台座上猫形的旧痕在风里像是仍有热度, 山道两边的雾比别处淡一些。
    forbidden:
      - 不要让 LLM 替调查员决定"把石像放回去就能解决一切"——必须由白主动表态

  # --------------------------------------------------------------------------
  - id: clue.shrine-empty-pedestal
    title: 石台上消失的猫像
    frame:
      location_scene: scene.sleeping-cat-shrine
      discovery:
        method: auto-on-enter
      reveal_md: |
        石台上空空如也, 只留下与一只小石猫体型完全吻合的长期放置痕迹。
        四周草坪修剪整齐, 茶碗里有人最近还在添水——这里有人定期照看,
        但石像不见了。
      unlocks:
        flags: [flag.knew-empty-pedestal]
    freedom:
      sensory_when_found_md: |
        蹲下时手心贴上石台, 比四周温度低一截。
    forbidden:
      - 不要让 LLM 替调查员推断"石像被谁抱走了", 待 SNS 已读再合并

  # --------------------------------------------------------------------------
  - id: clue.cat-circle
    title: 草丛中的猫群与白(Shiro)
    frame:
      location_scene: scene.sleeping-cat-shrine
      discovery:
        method: skill
        skill: listen
        difficulty: regular
      reveal_md: |
        循着不规则的呼吸声向草丛深处走, 你看到将近 10 只猫围成一圈,
        中央倒着昏迷的镰仓佐羽。猫的种类各异——有戴项圈的, 也明显
        是流浪猫的——但**正中央**有一只全身纯白、眼瞳金黄、坐姿
        优雅得不像家猫的白猫。
      unlocks:
        flags: [flag.met-shiro]
    freedom:
      sensory_when_found_md: |
        猫群像是排过队的, 没有一只回头看你。中央那只白猫的尾巴尖端
        极轻地拂过镰仓佐羽的衣袖。
    forbidden:
      - 不要让 LLM 替白开口——它的第一句一定是"这家伙有救的价值吗?"

  # --------------------------------------------------------------------------
  - id: clue.kamakura-collapsed
    title: 昏睡的镰仓佐羽
    frame:
      location_scene: scene.sleeping-cat-shrine
      discovery:
        method: auto-on-enter
      reveal_md: |
        镰仓佐羽倒在猫群中, 呼吸均匀, 没有明显外伤, 像是熟睡。无论
        【急救】、轻拍肩膀、还是大声呼唤, 她都没有反应。
      kp_note_md: |
        她的意识在幻梦境, 任何"急救"都不会奏效——必须等白归位后才能苏醒。
      unlocks:
        flags: [flag.kamakura-found]
    freedom:
      sensory_when_found_md: |
        她的脖颈微微出汗, 像是从一场跑了很远的梦里走不出来。
    forbidden:
      - 不要让急救骰判定成功——这条线在白归位前永远失败

  # --------------------------------------------------------------------------
  - id: clue.kamakura-sns-trace
    title: 镰仓佐羽手机的 SNS 留痕
    frame:
      location_scene: scene.sleeping-cat-shrine
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        昏睡的镰仓佐羽手中还握着手机, 屏幕被自己的手指压亮。SNS 里
        最后一条草稿是: "好像看到那只白猫在朝我笑——欸真的是笑诶!"
        草稿没有发出去。
      unlocks:
        flags: [flag.knew-kamakura-cause]
    freedom:
      sensory_when_found_md: |
        屏幕的亮度低到几乎看不清, 但她拇指仍按在发送键上, 没有按下去。
    forbidden:
      - 不要把这条 clue 写成"她是恶意的", 她只是好奇心过头

# ============================================================================
# timeline
# ============================================================================

timeline:
  # --------------------------------------------------------------------------
  - id: tl.d1-cable-stop
    title: 第一天 14:05 · 缆车异常停下
    fires_when: { game_day: 1, hour: "14:05" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        缆车在距站台几步的位置突然停下, 缆线还在轻微地摇。雾气像被
        什么从上面压下来, 视线只有十几米。再往后, 你听到缆线之间传来
        不像风的撕扯声。
      effects:
        san_check:
          loss: { success: 1, fail: 1D4 }
          reason: 与对向缆车里两具被茧裹住的尸体擦肩而过
    freedom:
      atmosphere_md: 缆车在风里像被吊在半空的钟摆, 空气里有铁与药水的腥气
    forbidden:
      - 不要替玩家描写"我们必须立刻跳车"——跳车是 PC 主动决策

  # --------------------------------------------------------------------------
  - id: tl.d1-spinner-passed
    title: 第一天 14:08 · 黑色"广告气球"掠过头顶
    fires_when: { game_day: 1, hour: "14:08" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        缆线一阵剧烈摇晃, 有什么东西从你头顶飞快掠过——通体黑色,
        像是一只巨大的广告气球, 从上下行缆线之间穿过。它向那对茧化
        尸体的方向离开了。然后你听到背后传来咀嚼声。
      effects:
        san_check:
          loss: { success: 0, fail: 1 }
          reason: 目击通体黑色的庞大躯体
        set_flags:
          - { flag: flag.witnessed-spinner-spider, value: true }
          - { flag: flag.encountered-spider, value: true }
    freedom:
      atmosphere_md: 雾气、缆线的剧烈摇动、对向方向"被吃掉"的湿润声音
    forbidden:
      - 不要描写它的复眼或獠牙——只允许"巨大的腹部 / 黑色气球状轮廓"

  # --------------------------------------------------------------------------
  - id: tl.d1-police-call-back
    title: 第一天 15:30 · 警方回讯救援延迟
    fires_when: { game_day: 1, hour: "15:30" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.called-police, value: true }
    once: true
    frame:
      narrative_seed_md: |
        手机震动。是先前你报的警有了回讯——但内容并不让人安心。
        缆车已经停摆, 救援队需要绕道徒步登山, 至少需要数小时。
        刚刚出发的另一支救援小队**不知为何失去了联络**, 警方
        正在产生混乱。
      effects:
        san_check:
          loss: { success: 0, fail: 1 }
          reason: 得知出现了新的受害者
        set_flags:
          - { flag: flag.knew-rescue-delayed, value: true }
    freedom:
      atmosphere_md: 屏幕的冷光、对方语速比平常快、最后一句被风噪盖住
    forbidden:
      - 不要让 LLM 替调查员"等待救援即可"——警方明确表示"位于现场的调查员们必须采取行动"

  # --------------------------------------------------------------------------
  - id: tl.d1-spider-pacing
    title: 第一天 16:00 · 雾里那道游荡的影子越来越近
    fires_when: { game_day: 1, hour: "16:00" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.lured-spiders-to-plaza, value: false }
    once: true
    frame:
      narrative_seed_md: |
        雾里有什么大型躯体在缓慢逡巡, 树木的折断声越来越近——但又不
        进入你的视线。两只猎手都在等"声响"。如果再不主动制造一次大
        响动把它们引到广场, 你只能在咖啡店内等到夜里。
    freedom:
      atmosphere_md: 风停的间隙特别长、雾的边缘开始变冷
    forbidden:
      - 不要让 LLM 替玩家敲响结缘之钟——这是 PC 决策
      - 不要让冷蛛此时直接攻击 PC, 它们仍在各自的地盘

  # --------------------------------------------------------------------------
  - id: tl.d1-bell-rings
    title: 第一天 · 结缘之钟敲响后冷蛛聚拢广场
    fires_when: { game_day: 1, hour: "16:30" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.bell-rung, value: true }
    once: true
    frame:
      narrative_seed_md: |
        钟声轰然作响, 在山顶整片雾里炸开。从缆车站方向**一**个、
        从登山道方向**另一**个——两道粗重的躯体几乎同时朝广场
        逼近。两只猎手在广场上撞见彼此, 互相对峙、争夺地盘。
        现在, 是你沿登山道冲下去的唯一窗口。
      effects:
        set_flags:
          - { flag: flag.lured-spiders-to-plaza, value: true }
        san_check:
          loss: { success: 1, fail: 1D10 }
          reason: 近距离目击两只冷蛛对峙
    freedom:
      atmosphere_md: 鹅卵石被两道躯体压得发出嘎嘎声, 雾气在它们身体周围被搅成漩涡
    forbidden:
      - 不要让 LLM 替调查员描写"它们要打到分出胜负", 玩家利用这个窗口逃离
      - 不要在此事件直接判定 PC 的生死, SAN check 走前端通道

  # --------------------------------------------------------------------------
  - id: tl.d1-shiro-question
    title: 第一天 · 白(Shiro)的提问
    fires_when: { game_day: 1, hour: "17:00" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.met-shiro, value: true }
    once: true
    frame:
      narrative_seed_md: |
        猫群中央那只优雅的白猫抬起头, 金黄的瞳孔短暂地停在你脸上,
        随后它**用日语**开口——
        > "这家伙有救的价值吗?"
        群猫毛发竖起, 朝向你身后某处。但白猫的视线只在你和倒地的
        镰仓佐羽之间流转。
    freedom:
      atmosphere_md: 山道的雾气在这一刻变得很薄、风停了、远处折树声反而清晰
    forbidden:
      - 严禁 LLM 替调查员回答白的提问
      - 严禁让白此时主动提及"幻梦境""冷蛛""阿特拉克·纳克亚"

  # --------------------------------------------------------------------------
  - id: tl.d1-hunter-pursuit
    title: 第一天 · 猎手冷蛛迫近沉眠之猫石台
    fires_when: { game_day: 1, hour: "17:10" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.shiro-on-pc-arm, value: true }
    once: true
    frame:
      narrative_seed_md: |
        正当白闭上眼睛、体重在你手臂上一点点变重时, 远处树木开始连片
        折断——猎手冷蛛已经摆脱另一只, 正朝你冲来。守秘人此时进入
        "猎手冷蛛袭来"小段(见 §8 模组流程):分散注意力 / 安抚石像 /
        把石像放回台座, 三层挑战在数回合内完成。
      effects:
        san_check:
          loss: { success: 0, fail: 1D10 }
          reason: 直面冲来的猎手冷蛛
    freedom:
      atmosphere_md: 树木被折断的频率越来越急、白在你怀里像一块越来越冷的石头
    forbidden:
      - 严禁 LLM 替调查员"自动归位石像"——必须按本模组的检定路径走
      - 严禁让 LLM 描写猎手冷蛛被战斗击败——它的"消失"由石像归位触发, 不是被打败

  # --------------------------------------------------------------------------
  - id: tl.d1-shiro-restored
    title: 第一天 · 沉眠之猫归位 · 雾气消散
    fires_when: { game_day: 1, hour: "17:30" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.shiro-restored, value: true }
    once: true
    frame:
      narrative_seed_md: |
        石像归回台座的瞬间, 雾气从山顶向四周散开, 像被一只无形的手
        抹平。猎手冷蛛在最后一跃中扑向你——但它的身体像幻影一样
        穿过你, 随后随雾气一起渐渐变得透明, 直至完全消失。现实
        与幻梦境之间的连接, 就此被切断。
      effects:
        set_flags:
          - { flag: flag.shrine-restored, value: true }
          - { flag: flag.fog-lifted, value: true }
          - { flag: flag.spiders-vanished, value: true }
    freedom:
      atmosphere_md: 风重新吹过、红叶的颜色一寸寸回到视野、镰仓佐羽喉咙里发出小小的"嗯"
    forbidden:
      - 不要让 LLM 替调查员评价"我们成功了"——剧情自然过渡, 不需要总结台词
      - 不要在此事件里再让 SAN check, 危险已经结束

