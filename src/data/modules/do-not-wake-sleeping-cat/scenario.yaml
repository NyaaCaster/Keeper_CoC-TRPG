npcs:
  # --------------------------------------------------------------------------
  - id: npc.nanami-touko
    name: 七味桐桐
    role: 盟友
    initial_location: scene.cafe-storage
    initial_attitude: friendly
    frame:
      public_persona_md: |
        17 岁, 观景台咖啡店「Siesta」打工店员, 本名七海桐子, 七味桐桐
        是她在 SNS(推特/Instagram 之类)上的昵称。性格认真, 适应力强;
        看见怪物从正门撞进来时第一反应是冲到厨房, 现在缩在仓库里发抖, 但
        被找到后会迅速恢复, 配合调查员行动。
      secret_md: |
        她目睹了正门被某种"通体黑色的怪物"砸坏, 又听见广场上传来打斗声;
        最先打算从后门坐车离开, 但店长已经一个人开车先走(后来在登山道
        中段被猎手冷蛛拦下)。她不知道猫群和"沉眠之猫"传说的具体内涵, 但
        她记得当地老人嘱咐过"千万不要碰沉眠之猫的石像"。
      secret_unlock_trigger: clue.cafe-storage-touko-rescued
      stats:
        str: 40
        con: 60
        siz: 40
        dex: 60
        app: 60
        int: 75
        pow: 65
        edu: 45
        hp: 10
        mp: 13
        san: 61
      combat:
        weapon: 徒手
        damage_formula: 1D3
        skill_value: 25
      voice_guidelines:
        - 初见 PC 时声音颤抖, 但 30 秒内会迅速冷静下来; 性格本身是认真型, 不是黏人型
        - 主动称呼 PC 为"先生""小姐""大哥哥""大姐姐", 视年龄差自然调整
        - 不主动指挥战术, 只在 PC 询问时给出诚实回答
        - 提到"店长"时表情下沉; 知道店长开车走了, 但不知道结局
        - 听到"沉眠之猫"会想起当地老人的嘱咐, **不会**主动展开传说全文
        - 大声呼喊会引来冷蛛, 这是她已经吃过的亏——所以她偏好压低嗓音
    freedom:
      improvisable_quirks:
        - 紧张时会下意识擦围裙下摆
        - 走路时会先停一下看 PC 的脚步, 再跟上
        - 拿到打火机/塑料绳等"工具"时会自然地双手递上
      catchphrases: [那个……, 我想起来了, 应该没事吧?]
    forbidden:
      - 不要让七味在战斗中代替 PC 做关键决策
      - 不要让七味主动提到"白(Shiro)"——她不知道白的存在
      - >-
        **道德底线铁规则**:若 PC 做出侮辱 / 威胁 / 骚扰 / 殴打 / 抛弃她不顾
        等触犯道德底线的言行, 七味当回合起**沉默**并**不再透露任何线索**;
        但她不会"消失",仍跟随 PC(她无处可去),只是再不主动开口。直到 PC
        用一段持续的剧情行为修复信任(由 KP 裁定)

  # --------------------------------------------------------------------------
  - id: npc.kamakura-sao
