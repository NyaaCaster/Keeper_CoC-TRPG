schema_version: 1

# ============================================================================
# meta
# ============================================================================

meta:
  id: do-not-wake-sleeping-cat
  title: 不要叫醒沉睡的猫
  era: modern
  language: zh-CN
  difficulty: 标准
  tags: [现代日本, 山岳, 幻梦境, 短篇]
  cover: assets/cover.jpg
  start_time: { game_day: 1, hour: "14:00" }
  synopsis_md: |
    秋日午后,你坐着缆车上静眠山观景台。雾气却异常地浓——下行缆车上一对
    被薄纱缠成茧的男女与你擦肩而过。山顶上有什么大型生物在雾里来回逡巡。
    要趁两只猎手在内斗时活着下山,只能求助于这座山真正的守护神。
  author_credits_md: |
    原作者:内山靖二郎(https://www.pixiv.net/users/74495)。
    中文化译者:洛萨_Lotharthunder。本项目转写:Keeper_CoC-TRPG。
    转载请保留作者名与译者信息。
  recommended_occupations:
    - 摄影师
    - 记者
    - 私家侦探
    - 神秘学家
    - 教授
    - 作家
  recommended: false

# ============================================================================
# hook
# ============================================================================

hook:
  start_scene: scene.cable-car
  prologue_md: |
    秋日下午两点。和歌山以北一座并不出名的山——**静眠山**——半山腰的
    缆车站前,你和同行的旅伴(若有)排在唯一一队还愿意上山的游客末尾。
    山顶**观景台**被宣传为"一览红叶最好的地方",今天天气格外晴朗,
    据说红叶正红到顶峰。和你一同上山的缆车舱里只有调查员;**下山方向**
    的缆车舱也都空着,显得游客异常稀少。
    缆车单程约五分钟。引擎吊在缆线上发出均匀的低鸣,你从座位上回头看
    山脚下的城市,渐渐被一层正在变浓的薄雾遮住。
  call_to_action_md: |
    座位下的脚踩着金属板,空气里有森林湿木与缆车机油混合的味道。
    距离山顶还有几分钟。你刚收到一条来自重要之人的短消息,提到
    "听说静眠山起了大雾"——你掏出手机,信号比想象的稳定。要不要
    顺手在网上查一下"静眠山"最近发生过什么?或者只是望着窗外
    被雾气一点点吞掉的红叶发呆。
  default_initial_clues: [clue.worried-message]
  occupation_variants:
    "摄影师":
      call_to_action_md: |
        你接了一份写真集的临时活——"红叶最盛之日的山顶观景台"。
        相机已经预设好了 ISO 与白平衡。同事在群里催了三次稿,
        你这才发现自己挑的恰好是观景台游客最少的一班缆车。
      initial_clues: [clue.worried-message]
    "记者":
      call_to_action_md: |
        编辑部最近在做"小众观光地"的特辑选题,你抽到了静眠山。
        山脚下镇上的小旅馆老板娘说"上面今天起了雾,劝你别上去",
        但你只剩这一天能跑现场。录音笔已经拧到 ON。
      initial_clues: [clue.worried-message]
    "私家侦探":
      call_to_action_md: |
        一份零碎的活——客户委托你顺路在静眠山观景台找一位失联的
        友人镰仓佐羽。她两个小时前还在 SNS 上更新,后来就没了消息。
        刚好你也想走走山,就坐上了上行缆车。
      initial_clues: [clue.worried-message]
    "神秘学家":
      call_to_action_md: |
        你在一本旧地方志里读到过静眠山"沉眠之猫"的传说——传说山中
        住着一位与樵夫为友的白猫,每当人在山上睡着便将他们唤醒。
        你想去那座石像前合个影,顺便核对一段你在民俗笔记上写下的旧事。
      initial_clues: [clue.worried-message]
    "教授":
      call_to_action_md: |
        你的下学期讲义需要一段山岳民俗的现场素材。同事给你递过来一份
        关于"静眠山"的简报,关键词只有四个字——"沉眠之猫"。这周末
        恰好不忙,你一个人坐了上行缆车。
      initial_clues: [clue.worried-message]
    "作家":
      call_to_action_md: |
        你在写一部以山间小镇为背景的短篇集,需要为最后一章添一处
        "看似平淡却不太对劲"的观景台。静眠山的红叶名声不响,但
        网上一段"沉眠之猫"的旧帖击中了你。你带着空白笔记本上了山。
      initial_clues: [clue.worried-message]

# ============================================================================
# scenes
# ============================================================================

scenes:
  # --------------------------------------------------------------------------
  - id: scene.cable-car
    title: 静眠山缆车 · 上行车厢
    frame:
      summary_md: |
        一只小型滑雪场式的缆车舱,木质座椅、塑料把手、镂空地板。
        你与旅伴(若有)是车厢里仅有的乘客,抬头能看见缆线一路通到
        被雾气吞掉的山顶。**对向**的下行缆车舱里都是空座——除了某一节
        被一种像薄纱的东西从座椅到天花板层层包住,像一只巨大的茧。
        距离山顶还有约三分钟。这是序幕场景——序幕未结束、未跳下车厢
        之前,场景不会切换。
      facts:
        - 缆车单程约 5 分钟,从半山腰直达山顶观景台
        - 上行车厢只有调查员;下行车厢全部空座或被包成茧状
        - 雾气从山顶向半山腰下沉,出发时山下是晴天
        - 手机此时仍有信号,可上 SNS 与新闻
        - 缆车在距站台几步之遥时会异常停下,座位距离地面不算高
      exits:
        - to: scene.cable-car-station
          condition: free
          label: (缆车异常停下后)从车厢跳到站台前的台阶
      npcs_present: []
      available_clues: [clue.cocooned-bodies, clue.sns-kamakura-posts]
    freedom:
      mood_tags: [缆车均匀的咯吱, 越升越浓的白雾, 秋叶被雾吞掉的安静]
      sensory_palette:
        sight: 车窗外掠过的红叶被雾冲淡、缆线随风轻晃、对向车厢里那团白色
        sound: 缆车滑轮的低鸣、风掠过铁支架的呜呜声、座椅靠背的细微吱呀
        smell: 车厢内塑料与机油的旧味、随高度上升越来越湿冷的空气
        touch: 把手金属的凉意、座椅靠背在风里轻微震颤、随高度升高耳压发胀
      improvisable_props:
        - 座椅缝隙夹着的一张被晒褪色的山顶观景台门票
        - 仪表板下贴着的一张早已过期的安全提示
        - 车厢顶角一只挂在金属环上的小铃铛(没有风也偶尔自己响一下)
    forbidden:
      - >-
        **跳车前置铁律**:在调查员**主动决定跳车**之前,严禁让缆车进站、
        严禁描写车厢自动到达站台、严禁让 LLM 替调查员做"我们必须跳"的
        决定。缆车在距离站台几步处异常停下并轻微摇晃,这是事实层面
        必须呈现的状态;但"跳与不跳"是 PC 的选择。
      - >-
        **目击筑巢冷蛛的姓名披露铁律**:在 PC 直观看清冷蛛全貌之前,
        严禁让叙事直接出现"冷蛛"、"蜘蛛之神"、"阿特拉克·纳克亚"等
        词。必须用"通体黑色像广告气球的什么东西"、"巨大的腹部"、
        "一团从缆线之间快速掠过的影子"等外形描述代称。
      - 不要让 LLM 替调查员投 SAN 检定的骰,SAN check 走前端 sanityCheck 通道
      - 不要在序幕阶段就让冷蛛的全貌、复眼、獠牙等具象细节登场
      - >-
        **对向尸体的发现铁律**:对向缆车舱里被"茧"包住的两具尸体是
        硬叙事节点(SanCheck 1/1D4),必须在缆车擦肩而过的瞬间呈现;
        不允许 LLM 提前暴露受害者身份(缆车站工作人员 + 商店店员),
        身份需调查员投【侦查】成功才能识别其制服

  # --------------------------------------------------------------------------
  - id: scene.cable-car-station
    title: 山顶缆车站 · 筑巢冷蛛的巢穴
    frame:
      summary_md: |
        山顶缆车站,整个站房从天花板到滑轮机构都被一种像薄纱、轻得几乎
        透明的东西层层缠绕。下方就是商店区,通往观景台只有这一条通路。
        模组开场时筑巢冷蛛正在缆车线上进食,**暂时不在这里**。
        但只要在这里发出大声响、或不慎触到蛛网,它都会回来。
      facts:
        - 缆车站内整个空间布满筑巢冷蛛织出的极细蛛网
        - 蛛网韧性极强且具有粘性,徒手挣脱不可能,**只有点火烧网**一个办法
        - 滑轮机构上缠满了蛛网,这是缆车异常的真正原因——修缆车需要相当长时间
        - 筑巢冷蛛此时不在站内,但只要有大声响或挣扎就会被引回
        - 通过站内只有一条路:走向下方的商店区
      exits:
        - to: scene.shop
          condition: free
          label: 沿台阶走进商店区
        - to: scene.cable-car
          condition: free
          label: 试图爬回缆车舱(不推荐)
      npcs_present: []
      available_clues: [clue.cable-car-webbing]
    freedom:
      mood_tags: [被薄纱包裹的寂静, 蛛丝在风里几乎无声地颤动, 滑轮被卡死的位置一直没有动]
      sensory_palette:
        sight: 整个站房一层灰白色薄网, 光线被蛛丝过滤后变得乳白, 售票处玻璃后空无一人
        sound: 风掠过蛛丝的极轻"嘶嘶", 远处缆线上传来不像风的撕扯声
        smell: 蛛丝独有的淡腥气混着山风的湿冷
        touch: 一不小心碰到蛛网, 粘性立刻锁住手指, 越挣扎缠得越紧
      improvisable_props:
        - 售票窗口里一只正在播放循环广告的小屏幕(声音被关到最低)
        - 地面上一只被丢下的售票员工作鞋, 半只埋在蛛网里
        - 角落里一个未被蛛网完全覆盖的灭火器
    forbidden:
      - >-
        **筑巢冷蛛行动逻辑铁律**:筑巢冷蛛此时正在缆车线上进食,**不主动**
        出现在站内。**只有**当 PC 在站内/广场制造大声响,或挣扎/破坏蛛网
        发出明显动静时,它才会回来。LLM 不允许"为了戏剧效果"主动让它
        提前现身。
      - 严禁 LLM 替调查员描写"被网困死"的细节——网可挣可烧,但烧网时一定会发出声响
      - 不要在此场景出现"猎手冷蛛"——它的活动区在咖啡店背面登山道,两只冷蛛此时正在争夺地盘
      - 不要把售票员/店员的尸体提前暴露在站内,他们已经被运到下行缆车上变成茧

  # --------------------------------------------------------------------------
  - id: scene.shop
    title: 山顶纪念品商店
    frame:
      summary_md: |
        卖缆车票与山顶纪念品的小店,空无一人。从缆车站到通往观景台的台阶
        之间,柜台被撞翻、商品散落一地——像被失控的卡车撞过。墙上原本
        装着背景音乐音箱的位置,只剩下被强行扯下的电线;音箱已经被搬走,
        被蛛丝紧紧裹成茧状,丢在角落。
      facts:
        - 商店内空无一人,从入口到站台之间一片狼藉,是筑巢冷蛛留下的痕迹
        - 墙上音箱被扯下后被蛛丝包裹成茧, 茧上有一个明显的尖牙咬出的洞, 洞里渗出深色刺鼻液体(冷蛛毒液)
        - 店内能看到一张完整的"静眠山观景台示意图"贴在收银台后方
        - 调查员若想拿景区商店通常会卖的物品(打火机/塑料绳/饮用水/雨衣等), 守秘人可酌情发给
        - 店内没有播放背景音乐——是与山下店铺相反的、刻意的安静
      exits:
        - to: scene.cable-car-station
          condition: free
          label: 退回缆车站方向
        - to: scene.plaza
          condition: free
          label: 走出商店, 来到观景台广场
      npcs_present: []
      available_clues: [clue.shop-map, clue.smashed-speaker]
    freedom:
      mood_tags: [被洗劫的纪念品店, 没有背景音乐的不自然, 散落的红叶钥匙扣]
      sensory_palette:
        sight: 翻倒的明信片架, 滚到地上的红叶钥匙扣, 收银台后那张被红色虚线圈出"沉眠之猫"位置的示意图
        sound: 自动门控制板还在低声"咔嗒"地试着开合, 别处只剩风声
        smell: 商品的纸糖味混进一丝从茧状音箱渗出的发酸药水气
        touch: 摸过柜台上的灰, 指腹会粘上一些极细的丝
      improvisable_props:
        - 货架最下层一盒被压扁的"沉眠之猫"造型饼干
        - 收银台抽屉里一支没墨的圆珠笔, 笔杆上写着"中本"两字(店员名牌)
        - 入口闸门旁一筐折叠雨衣(免费取用)
    forbidden:
      - 不要让 LLM 在此场景描写筑巢冷蛛的本体——它仍在缆车线上进食
      - 不要让 LLM 替调查员判定"音箱内液体是不是有毒",这要走【医学】或【科学(药学)】检定
      - 严禁让"猎手冷蛛"出现在商店内——本店的破坏来自筑巢冷蛛, 与咖啡店性质不同(咖啡店有凿痕)

  # --------------------------------------------------------------------------
  - id: scene.plaza
    title: 观景台广场 · 鹅卵石广场
    frame:
      summary_md: |
        白色鹅卵石铺成的小广场, 此刻被浓雾覆盖看不到原本的红叶景致。
        广场上四下无人。地面上到处是像被鹤嘴镐凿出的深而宽的痕迹, 上面
        还附着一层粘力很强的蛛网——这是两只冷蛛互相争斗后留下的痕迹。
        广场一侧立着一座装饰着粉色心形的结缘之钟。
      facts:
        - 广场地面凿痕和蛛网共存,是两只冷蛛争夺地盘留下的痕迹
        - 广场连接缆车站方向的商店、咖啡店「Siesta」、登山道入口三个出口
        - 鹅卵石上某些蛛网仍然有粘性,是新鲜的
        - 广场上没有任何尸体或血迹,只有打斗痕迹
      exits:
        - to: scene.shop
          condition: free
          label: 退回商店方向
        - to: scene.bell
          condition: free
          label: 走向广场角落的结缘之钟
        - to: scene.cafe-siesta
          condition: free
          label: 推开咖啡店「Siesta」破损的正门
        - to: scene.mountain-trail
          condition: free
          label: 沿登山道下山(危险)
      npcs_present: []
      available_clues: [clue.plaza-pickaxe-marks]
    freedom:
      mood_tags: [雾中无人的鹅卵石, 红叶被雾糊掉的失语感, 凿痕里的蛛丝]
      sensory_palette:
        sight: 鹅卵石被雾压得像泛白的鱼鳞、远处咖啡店「Siesta」破损的正门、登山道入口的看板
        sound: 自己脚步声异常清晰、雾里有什么远处的金属敲击声、风偶尔托着一阵叶子的哗哗
        smell: 山间湿土与红叶腐叶味、鹅卵石上还没干的水迹的清凉
        touch: 鹅卵石滑、蛛网附着的地方踩上去会粘住鞋底
      improvisable_props:
        - 广场中央被踏倒的红叶花坛、几片掉在凿痕里的红叶
        - 一只游客遗失的相机带, 但相机已经不见了
        - 广场指示牌还在, 写着"恋人请向结缘之钟前行"
    forbidden:
      - 不要让任何冷蛛此时出现在广场——它们正在各自的地盘
      - 不要替调查员推断"凿痕是冷蛛打斗造成的", 这必须由调查员收集情报后自行联想; 守秘人在调查员主动提出后才予以肯定
      - 不要让 LLM 替调查员触发结缘之钟敲响, 这是调查员的关键决策动作

  # --------------------------------------------------------------------------
  - id: scene.bell
    title: 结缘之钟
    frame:
      summary_md: |
        广场一侧的巨大西洋钟, 装在一座装饰着粉红色心形的木质钟架上。
        钟架旁立着的介绍板写着"恋人一起来敲的话能获得幸福, 一个人敲
        响则会邂逅恋人"——并未被任何古老传说背书, 只是为吸引游客
        最近才装的。钟内垂下一根编织粗绳, 任何人都可以拉动敲响。
        钟声大得惊人。
      facts:
        - 钟体足以将广场上任何人的注意力拉过来——即使蒙在浓雾里也能听见
        - 拉绳直接敲钟的人, 其本人将立即成为冷蛛的攻击目标
        - 用塑料绳/布条等延长拉钟距离, 可以从安全位置触发, 不直接成为目标
        - 钟一旦敲响, 两只冷蛛会同时朝声源聚拢——这是模组中"引开冷蛛"的核心机会
      exits:
        - to: scene.plaza
          condition: free
          label: 走回广场中央
      npcs_present: []
      available_clues: [clue.bell-trick]
    freedom:
      mood_tags: [甜腻心形装饰, 粗绳的麻味, 钟体冰凉的金属感]
      sensory_palette:
        sight: 粉色心形装饰被雾气压成淡淡的浅粉、绳上磨光的部位、钟体上一些细小的划痕
        sound: 钟体被风轻轻磕碰发出的极轻声响、绳子在风里晃动时绳头的"啪嗒"
        smell: 麻绳的旧味、铁的微涩
        touch: 绳子粗硬, 拉动需要不小的力气, 钟体被风冻得冰凉
      improvisable_props:
        - 介绍板下方一只供游客拍照用的小心形画框
        - 钟架底座一束已经枯透的、不知是哪一对情侣留下的花
        - 介绍板背面有人用油性笔涂改的"独自来的也算"
    forbidden:
      - 不要让 LLM 替调查员描写"钟刚敲响, 冷蛛就到了"的具象细节, 把"冷蛛被吸引过来"延后到广场叙事
      - 不要让钟敲响时本身造成 SAN check, 危险来自之后冷蛛聚拢的余波

  # --------------------------------------------------------------------------
  - id: scene.cafe-siesta
    title: 观景台咖啡店「Siesta」
    frame:
      summary_md: |
        本来是家时尚的小咖啡店, 顾客可以一边欣赏红叶一边享用茶点。
        现在外观已经被破坏得不成样子——正门被完全砸破, 钢质门框
        大幅度变形, 像被卡车撞过。木地板上密布像被鹤嘴镐凿出的痕迹
        (与商店里那种被"撞翻"的破坏方式截然不同, 这是猎手冷蛛留下的
        痕迹)。墙上的音箱也被砸成碎片(凿痕, 不是被搬走包茧)。
        店内大厅与厨房均无人。
      facts:
        - 咖啡店正门被砸毁, 入口附近木地板布满凿痕——猎手冷蛛留下的痕迹
        - 与商店"被撞翻"的痕迹截然不同, 这里是"被凿击"——这是两种冷蛛行为模式的区别
        - 厨房深处有一道相对结实的金属门, 门后是 3~4 平米的小仓库
        - 咖啡店店员七味桐桐躲在仓库里, 用木棍把门从内侧别住
        - 大厅观景玻璃窗面积很大, 但雾气太浓, 现在只是一片纯白
      exits:
        - to: scene.plaza
          condition: free
          label: 退回广场
        - to: scene.cafe-storage
          condition: free
          label: 走向厨房深处的仓库金属门
      npcs_present: []
      available_clues: [clue.cafe-pickaxe-marks]
    freedom:
      mood_tags: [被砸毁的木质咖啡店, 被雾气糊成白板的观景玻璃, 散落的咖啡杯]
      sensory_palette:
        sight: 散落的瓷杯碎片、被掀翻的椅子、吧台上一只仍立着的奶罐
        sound: 咖啡机仍在保温, 偶尔发出"嘶"的一声; 风从破门吹进来掠过桌椅缝
        smell: 咖啡豆的焦香混着木头被砸碎后的木屑味, 还有一丝冷蛛留下的腥气
        touch: 木地板的凿痕边缘还很锋利, 不小心踩上会扎鞋底
      improvisable_props:
        - 吧台上一本翻开的食材采购笔记, 笔迹是七味桐桐的
        - 角落一只刚倒了一半的浓缩咖啡, 杯壁还有温度
        - 一面装饰墙上的圣诞节小灯仍在闪
    forbidden:
      - 不要让筑巢冷蛛此时出现——它仍在缆车线上进食
      - 不要让 LLM 替调查员发现仓库, 仓库需要主动走进厨房才能注意到
      - 不要让七味桐桐主动从仓库内出来, 必须由调查员通过 SNS 联系/敲门/呼喊触发
      - 不要让 LLM 在大厅替调查员拾取武器或重要道具——本店的有用之物是在仓库内的木棍/打火机/塑料绳

  # --------------------------------------------------------------------------
  - id: scene.cafe-storage
    title: 咖啡店仓库 · 七味桐桐藏身处
    frame:
      summary_md: |
        厨房最深处的金属门, 把手已经被擦得发亮——里面是一间 3~4 平米的
        小仓库, 存放食材和清洁杂物。门内侧有一根被仔细别上的木棍, 防止
        从外部被推开。咖啡店店员七味桐桐就缩在仓库最深处, 抱着膝盖
        瑟瑟发抖。门外大声呼喊会引起她的注意, 但同时也有引来猎手冷蛛
        的风险——最稳妥的办法是通过 SNS 联系她。
      facts:
        - 仓库门是金属的, 内侧用木棍别住, 门外人无法直接推开
        - 七味桐桐(七海桐子, 17 岁, 咖啡店店员)就藏在这里
        - 仓库内堆放着面粉袋、塑料绳、打火机(燃气补充用)、清洁剂、急救箱等
        - '七味的 SNS 求救短文 1 分钟前发出: "谁来救救我!就在咖啡店的仓库里!"'
        - 七味因为躲在仓库内而幸免于猎手冷蛛之手
      exits:
        - to: scene.cafe-siesta
          condition: free
          label: 退回咖啡店大厅
      npcs_present: [npc.nanami-touko]
      available_clues: [clue.storage-supplies]
    freedom:
      mood_tags: [金属门的冷, 仓库里的尘味, 七味抱着膝盖的颤抖]
      sensory_palette:
        sight: 仓库墙上一盏小灯仍亮、一袋袋面粉摞在角落、塑料绳一卷卷挂在墙上
        sound: 七味牙齿打颤的细微"哒哒", 门外厨房的咖啡机偶尔发出嗡声
        smell: 面粉的微酸、清洁剂的刺鼻、七味身上未及散去的咖啡豆香
        touch: 金属门的冰、地面有一层薄灰、被七味用手指反复摸过的木棍上有汗渍
      improvisable_props:
        - 仓库门内一张匆匆撕下的咖啡店收银小票, 七味在背面用圆珠笔写了"对不起"三个字
        - 一只放在仓库地上的空咖啡杯, 杯沿沾着她唇膏的颜色
        - 角落一束未拆封的塑料绳, 标签写着"咖啡豆扎口用"
    forbidden:
      - 不要让 LLM 替调查员决定七味的去留——她原则上会跟随调查员, 但可以选择留她在仓库
      - 不要让七味直接说出"沉眠之猫"的全部传说——她只能给提示, 详情在登山道看板上
      - 不要让七味主动指挥调查员的战术决策, 她是补偿型 NPC, 由调查员发问才答

  # --------------------------------------------------------------------------
  - id: scene.mountain-trail
    title: 登山道 · 猎手冷蛛的领地
    frame:
      summary_md: |
        只能容纳一台小型货车通行的精致山间小径, 沿陡坡一路延伸到山脚。
        正常情况下游客可以徒步下山, 但此刻**猎手冷蛛**正沿登山道来回
        巡逻。距离观景台不远处, 一辆从业者用的小型厢式货车横翻在道路
        中央——那是咖啡店店长的车, 车内有他被破坏得不成样子的尸体。
        登山道入口处立着一块写有静眠山旧闻的看板。
      facts:
        - 登山道是非缆车下山的唯一道路, 但被猎手冷蛛占据
        - 登山道入口立着一块木看板, 写有"静眠山的旧闻"——樵夫与白(Shiro)的传说
        - 登山道中段有一辆翻倒的小型厢式货车, 司机是咖啡店店长(姓名不重要)
        - 货车驾驶室内是一具被破坏得不成样子的尸体——目睹时 SanCheck 0/1D3
        - 沿登山道再向下走 5 分钟左右, 路边有一块朴素看板写着"沉眠之猫"
        - 猎手冷蛛**不**在登山道入口附近巡逻, 而是在中段(翻车与沉眠之猫看板之间)游荡
        - 直接沿登山道下山, PC 几乎必死——猎手冷蛛会在中段拦下任何人
      exits:
        - to: scene.plaza
          condition: free
          label: 退回观景台广场
        - to: scene.sleeping-cat-shrine
          condition: requires-flag
          required_flag: flag.lured-spiders-to-plaza
          required_value: true
          label: 趁两只冷蛛在广场对峙时, 沿登山道冲到沉眠之猫石台
      npcs_present: []
      available_clues: [clue.trail-signboard, clue.overturned-truck]
    freedom:
      mood_tags: [山林的湿, 货车残骸的金属冷, 雾里看不清远处的弯道]
      sensory_palette:
        sight: 登山道两侧高大的杉木、被雾气吞掉的远处弯道、看板上发黄的旧字
        sound: 雾里偶尔传来树木被折断的声音(猎手冷蛛在远处折树)、登山道砂石被踩动的细响
        smell: 山林的湿土腐叶、货车机油泄漏的味道、铁锈味
        touch: 看板木质表面被风化得粗糙、车体烤漆已经被凿出深痕、痕缘锋利
      improvisable_props:
        - 登山道一侧一只被遗弃的登山杖, 杖头还沾着新鲜的湿泥
        - 货车驾驶座底下露出的一本送货单, 字迹工整
        - 看板下方一束已经枯透的彼岸花, 不知是哪位游客留下的
    forbidden:
      - >-
        **猎手冷蛛触发铁律**:在调查员沿登山道**主动向下走超过看板距离**
        之前, 猎手冷蛛**不主动**现身。仅当调查员越过看板继续向下、
        或在登山道发出大声响时, 才会触发"远处树木剧烈摇晃, 它在迫近"
        的预警叙事。LLM 不允许凭空让它扑过来。
      - 严禁让 LLM 直接描写猎手冷蛛的全貌——开局阶段只允许"远处一团巨大躯体的一部分"模糊呈现
      - 严禁让调查员"潜行"沿登山道下山就直接逃出——必须先解决两只冷蛛的对峙问题
      - 不要在此场景出现筑巢冷蛛, 它在缆车站

  # --------------------------------------------------------------------------
  - id: scene.sleeping-cat-shrine
    title: 沉眠之猫石台 · 山道中段
    frame:
      summary_md: |
        登山道中段, 路旁突兀立着一块朴素的木看板, 写着"沉眠之猫"。
        看板旁是一座一般用于供奉地藏的石台, 上面摆着几只看似用于
        盛放供品的茶碗。周围的草坪修剪得整齐——有人在维护这里。
        然而台座上**最重要的**沉眠之猫石像, 此刻不见了。台座上只
        留下一处与猫体形吻合的长期放置痕迹。再往前走一段, 你能听见
        一阵不规则的细微动静——像是动物聚在一起呼吸。
      facts:
        - 石台上原本应有一座白色石猫像, 现在不在
        - 石台周围草坪修剪整齐, 茶碗里有新鲜供品的痕迹
        - 沿小路再向前走, 草丛中聚集着将近 10 只猫围成一圈
        - 猫群中央倒着昏迷的镰仓佐羽, 没有明显外伤
        - 猫群里有一只全身纯白、看起来优雅非凡的猫——白(Shiro), 即沉眠之猫的本体
        - 镰仓佐羽因碰倒石像、心智被拉去幻梦境, 处于昏睡状态, 急救无效
      exits:
        - to: scene.mountain-trail
          condition: free
          label: 退回登山道
      npcs_present: [npc.shiro, npc.kamakura-sao]
      available_clues: [clue.shrine-empty-pedestal, clue.cat-circle, clue.kamakura-collapsed]
    freedom:
      mood_tags: [林间小路的安静, 猫群整齐的呼吸, 雾在叶尖凝水]
      sensory_palette:
        sight: 看板上"沉眠之猫"四个字、台座上猫形的旧痕、猫群中那只白猫优雅地坐着
        sound: 猫群轻而整齐的呼吸、远处看不见的鸟啼、镰仓佐羽偶尔的细微梦呓
        smell: 林间湿土与苔藓味、猫毛被雾气打湿的淡淡气息
        touch: 台座石面冰凉、石台底部有一道很浅的、像是被人推动过的擦痕
      improvisable_props:
        - 台座下一只被压扁的小钱包(镰仓佐羽留下的, 钱包夹层有学生证)
        - 看板边缘一只摆着供品的小瓷杯, 还盛着不到半满的清水
        - 草丛中半埋着一支没用完的口红——像是有人着急时掉的
    forbidden:
      - >-
        **白(Shiro)的现身铁律**:在调查员**主动**寻找"动静的来源"或
        通过"向 SNS 上的镰仓佐羽发消息听到提示音"等触发动作之前, 严禁让
        猫群与白主动现身。开局只能听到"草丛中传来不规则的呼吸"。
      - >-
        **白的提问铁律**:当调查员走到猫群面前, 白会**用日语说话**问
        "这家伙有救的价值吗?"——这是模组的关键判定瞬间。LLM 必须在
        此处停下, 等待调查员主动作答, **严禁**替调查员回答, 严禁
        替调查员表态"温柔之心"。
      - 不要让 LLM 替调查员推断"白会变成石像"的剧情发展——必须由白主动表态后才推进
      - 不要让 LLM 在镰仓佐羽身上做任何治疗动作奏效——她的意识在幻梦境, 急救无效
      - >-
        **猫群的恐吓铁律**:猫群"毛发竖起摆出恐吓姿态"的对象**不是**调查员,
        而是身后正在迫近的猎手冷蛛。【科学(生物学)】、【博物】或
        【心理学】检定成功的调查员可识破这一点; 否则可能被吓到自己撤退。

