# ============================================================================
# endings
# ============================================================================

endings:
  # --------------------------------------------------------------------------
  - id: ending.best
    title: 沉眠之猫归位 · 全员生还
    triggers:
      - { flag: flag.shrine-restored, value: true }
      - { flag: flag.kamakura-survived, value: true }
      - { flag: flag.touko-survived, value: true }
    priority: 100
    frame:
      epilogue_md: |
        雾气彻底散去, 红叶恢复了它本来的颜色。沉眠之猫以小小石像的
        姿态重新坐回台座, 闭着眼睛, 像睡着一样。镰仓佐羽喉咙里发出
        小小一声"嗯", 然后慢慢睁开眼。她还不太明白发生了什么, 你也
        不打算一次性告诉她。七味桐桐站在你身后, 第一次露出今天的笑容。
        缆车站的工作人员已经被冷蛛带走, 但救援队再过一会儿就会徒步
        抵达。这件事不会上很多家媒体, 但你知道——你救下了这座山。
      scenario_end_kind: victory
      rewards:
        skill_growth: true
        san_reward_formula: 1D6
        san_reward_conditions:
          - label: 镰仓佐羽幸存
            flag: flag.kamakura-survived
            formula: 1
          - label: 七味桐桐幸存
            flag: flag.touko-survived
            formula: 1
        cash_reward: 0
    freedom:
      atmosphere_md: 慢节奏的释怀, 红叶在新风里显得格外鲜艳
    forbidden:
      - 不要让 LLM 替调查员对镰仓抒情或说教——她苏醒后慢慢说

  # --------------------------------------------------------------------------
  - id: ending.victory-touko-lost
    title: 沉眠之猫归位 · 七味未能跟上
    triggers:
      - { flag: flag.shrine-restored, value: true }
      - { flag: flag.kamakura-survived, value: true }
      - { flag: flag.touko-survived, value: false }
    priority: 90
    frame:
      epilogue_md: |
        石像被你放回台座的瞬间, 雾气消散。但七味桐桐没能撑到这一刻——
        她在你冲下登山道时为掩护你而留在咖啡店, 之后没有再出来。
        镰仓苏醒了, 却没有再多余的力气向你道歉。山被救了下来, 但
        从今以后你每次端起咖啡杯, 都会想起那个 17 岁的认真姑娘。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 1D4
        san_reward_conditions:
          - label: 镰仓佐羽幸存
            flag: flag.kamakura-survived
            formula: 1
        cash_reward: 0
    freedom:
      atmosphere_md: 胜利里嵌着一块永远填不上的洞
    forbidden:
      - 不要把七味的死写成"她为剧情而死", 让她的牺牲是 PC 选择的代价

  # --------------------------------------------------------------------------
  - id: ending.victory-kamakura-lost
    title: 沉眠之猫归位 · 镰仓未能苏醒
    triggers:
      - { flag: flag.shrine-restored, value: true }
      - { flag: flag.kamakura-survived, value: false }
    priority: 85
    frame:
      epilogue_md: |
        雾气退去, 但镰仓佐羽没有再睁眼。她的呼吸越来越浅, 在救援队
        到达前停了下来。事故被记录为"高山反应导致的猝死", 报告里没
        写她抱过的那只石猫。她的 SNS 主页停在那条 "好大的雾, 突然
        好困!"——评论数还在涨, 没人知道她其实没回家。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 1D4
        san_reward_conditions:
          - label: 七味桐桐幸存
            flag: flag.touko-survived
            formula: 1
        cash_reward: 0
    freedom:
      atmosphere_md: 山被救了, 但你来这里之前根本不认识她——这一点更让人喘不过气
    forbidden:
      - 不要让 LLM 把镰仓写成"罪有应得", 她只是好奇心过头

  # --------------------------------------------------------------------------
  - id: ending.flee-without-shiro
    title: 白离开 · 侥幸逃生 · 冷蛛仍在
    triggers:
      - { flag: flag.shiro-disappointed, value: true }
      - { flag: flag.escaped-without-shiro, value: true }
    priority: 60
    frame:
      epilogue_md: |
        你没有表现出白所等待的"温柔之心", 它失望地离开。冷蛛随之
        扑来, 你只能不顾一切地沿登山道滚下去。雾在你下山时仍然
        留在山顶——救援队抵达前, 你再没回头看过那座山。沉眠之猫
        从此消失。如果哪天那条裂缝再次被打开, 那两只巨蛛会再来。
        这种担忧, 会跟着你很久。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 0
        cash_reward: 0
    freedom:
      atmosphere_md: 不带评判的冷静记述, 留白让 PC 自己消化
    forbidden:
      - 不要让 LLM 替调查员"反思"或"后悔"——这是 PC 选择带来的代价
      - 不要写出本结局未声明的"日后冷蛛真的回来了"等额外剧情

  # --------------------------------------------------------------------------
  - id: ending.heroic-sacrifice
    title: 同伴牺牲 · 白被送回石台
    triggers:
      - { flag: flag.shrine-restored, value: true }
      - { flag: flag.pc-sacrificed, value: true }
    priority: 70
    frame:
      epilogue_md: |
        有人留下来, 替你们争取了把石像送回去的几十秒。雾散之后,
        你转身想说一声谢谢, 但身后什么都没有了——只有登山道上一道
        被折断的杉枝, 和一只被风掀起的旧外套。沉眠之猫归位了,
        其余人活了下来, 但救援队抵达时, 只能记录"另一名登山者
        失踪"。山被救了, 代价被记在你心里。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 1D6
        cash_reward: 0
    freedom:
      atmosphere_md: 不需要悲壮的旁白——风、红叶、空荡的登山道, 已经够了
    forbidden:
      - 不要让 LLM 把牺牲者写成"英雄叙事", 他/她只是做了一个安静的选择

  # --------------------------------------------------------------------------
  - id: ending.eaten
    title: 冷蛛的盛宴
    triggers:
      - { flag: flag.shiro-disappointed, value: true }
      - { flag: flag.escaped-without-shiro, value: false }
    priority: 30
    frame:
      epilogue_md: |
        白离开了, 没有片刻的犹豫。猎手冷蛛在群猫散开的瞬间, 从树
        林里扑出。雾里没有听到惨叫——它们的尖牙太利了。第二天救援
        队抵达观景台时, 找到的只是几张被反复擦拭过的座椅, 与一些
        无人认领的随身物。SNS 上"#静眠山"的话题在那一周突然多了
        起来, 然后又突然安静下去, 像什么都没发生。
      scenario_end_kind: dead
      rewards:
        skill_growth: false
        san_reward_formula: 0
        cash_reward: 0
    freedom:
      atmosphere_md: 不写过程, 只写"什么也没留下"
    forbidden:
      - 不要让 LLM 描写吞食过程
      - 不要写出本结局未声明的"灵魂"或"幻梦境延续"剧情

# ============================================================================
# global_freedom / global_forbidden
# ============================================================================

global_freedom:
  era_atmosphere_md: |
    现代日本, 秋季午后。和歌山以北一座并不出名的山。手机仍有信号,
    但被山风撩得断续; 缆车、塑料绳、打火机、急救箱——这些是这本
    模组的基本物件库, 可挑用。
  language_register: |
    简体中文叙述, 短句多, 留白多。雾气与擦肩而过的瞬间允许长句铺陈,
    但不超过两句。受惊或袭击切到 6~12 字的瞬时短句。避免现代网络
    用语, 避免好莱坞式夸张副词。
  npc_default_dialect: |
    七味桐桐口齿清晰, 偶尔带半句关西口音; 镰仓佐羽苏醒后语速接近
    标准东京普通话, 但带 SNS 网络感; 白(Shiro)的日语沉静、用词
    考究, 像一位受过良好教育的成年人。

global_forbidden:
  - 不要直呼"冷蛛""阿特拉克·纳克亚""蜘蛛之神"——用"通体黑色的庞大躯体""那只巨蛛"代替, 直至 PC 主动命名
  - 不要描写冷蛛的复眼/獠牙特写, 除非剧情明确进入"直面"瞬间(对应 SAN check 节点)
  - 不要让 LLM 在 narrative 里替玩家做选择或抒情独白
  - 不要让 LLM 主动报伤害或 SAN 数值, SAN 走前端 sanityCheck 通道, 伤害走 *Formula
  - 不要让 LLM 替调查员投骰判定"白会原谅 PC", 必须由调查员通过具体行动表态"温柔之心"
  - 不要描写 NPC 立绘 / 头像
  - 不要写出本模组未声明的额外结局
  - 不要让 LLM 把猎手冷蛛与筑巢冷蛛搞混(凿痕 vs 茧网, 是两种不同破坏模式)

# ============================================================================
# narrative_style(§14)
# ============================================================================

narrative_style:
  frame:
    pov: 第二人称
    tense: 现在时
    forbidden_phrasings:
      - 不要写"调查员投出了 Spot Hidden 检定"或任何检定术语
      - 不要使用第四面墙之外的全知评论
      - 不要好莱坞式夸张副词("骇人地"/"令人窒息地"/"难以置信地")
      - 不要直白的超自然词("鬼魂"/"怨灵"/"邪神"), 要用具象与比喻替代
      - 不要直接说出"冷蛛"或克苏鲁神话名词, 改写为"那只巨蛛""黑色气球状躯体""通体黑色的庞大躯体"
      - 不要替玩家做出选择或下决心式心理独白("你下定决心要……")

  freedom:
    sentence_pacing_md: |
      探索段落用 25~50 字短句, 逗号断句多, 留白多, 让雾气和湿冷
      慢慢压过来; 雾里有什么大型躯体逡巡的瞬间允许长句铺陈, 但
      不超过两句; 受惊或目击切到 6~12 字的瞬时短句。
    vocabulary_register: |
      现代日本山间观景台的克制、低敬度的简体中文叙事。允许"雾气"、
      "湿木"、"红叶"、"鹅卵石"、"金属凉意"、"塑料把手"、"机油"、
      "蛛丝"、"凿痕"、"茧"、"咖啡豆"、"樟脑"等具象词。避免网络
      用语、避免成语堆叠、避免过度心理描写。
    metaphor_palette:
      - 雾气像被一只看不见的手从上方压下来——不是风
      - 缆线在风里像被巨大的手指拨动的琴弦——节奏不像风的节奏
      - 茧化的座椅像一只巨大的米茧——里面的轮廓你不敢看完
      - 鹅卵石上的凿痕里嵌着蛛丝——两种破坏者在这里彼此等过
      - 红叶在雾里被糊成模糊的橙——颜色不像它本来的颜色
      - 白(Shiro)的尾巴尖端拂过镰仓的衣袖——像在打一个看不懂的招呼
      - 石像在你怀里一寸寸变重——像是你正在抱回一段被借走的时间
    reference_works:
      - 京极夏彦《姑获鸟之夏》开头那种"被雾压下来"的山间叙事
      - 押井守《攻壳机动队》街景里"湿冷里的金属"
      - 桑原裕子《三日间的幸福》对日常被入侵的安静
    sample_paragraph_md: |
      缆车在距站台几步的地方停下了。
      雾气一寸寸贴下来。你看见对向那节缆车——
      像一只巨大的茧, 里面有什么挤在一起。
      然后, 头顶的缆线被一只看不见的手用力拨了一下。

# ============================================================================
# preset_investigators(§12 / §15.3)
# ============================================================================
#
# 本模组原作 PDF 末尾未提供 pre-gens, 仅提及"成年 / 年少调查员"两种扮演方式
# 与 NPC 七味桐桐的属性。按 .docs/scenario-schema.md §15.3 的判定原则:
# 原作未给 pre-gens → preset_investigators 留空, 创角期由 era + recommended_occupations
# 走随机预设流。

preset_investigators: []
