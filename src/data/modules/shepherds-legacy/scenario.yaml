endings:
  # --------------------------------------------------------------------------
  - id: ending.accept-contract
    title: 接受契约 · 新的牧人
    triggers:
      - { flag: flag.contract-accepted, value: true }
      - { flag: flag.lamb-sacrificed, value: true }
    priority: 100
    frame:
      epilogue_md: |
        匕首落下的那一刻,羊群安静下来。土地的产出会变得更加丰厚——
        你成为了潘神的新牧人。羊群表现出一种近乎心灵感应的服从,
        森林深处的笛声从此**清晰地**进入你的梦。每个满月,你都要
        向潘神献祭一只活物,否则厄运便会上门。
        你可以离开这片土地,但你的职责并不会因此而改变。
      scenario_end_kind: ambiguous
      rewards:
        skill_growth: true
        san_reward_formula: 0
        san_reward_conditions: []
        cash_reward: 0
    freedom:
      atmosphere_md: 黎明前最后一片黑、风从你身后绕开、羊群整齐地朝你单膝跪下
    forbidden:
      - 严禁让 LLM 替 PC 抒情独白——这是冷而具体的归属
      - 严禁此结局额外触发"PC 立刻发狂"——压力以"长期精神影响"形式渐显

  # --------------------------------------------------------------------------
  - id: ending.reject-contract
    title: 拒绝契约 · 重获自由
    triggers:
      - { flag: flag.contract-rejected, value: true }
      - { flag: flag.flock-died, value: true }
    priority: 90
    frame:
      epilogue_md: |
        天亮后,你走出屋子——羊群在一夜之间**全部神秘死亡**。尸体
        干瘪,没有任何伤痕或疾病迹象,仿佛它们的生命力被瞬间抽干。
        牧场的土地会迅速变得贫瘠。
        这意味着巨大的经济损失,**足以让你破产或负债**。但潘神
        收回了它的"恩赐",**你重获自由**。律师事务所会为剩余的
        屋舍办手续——它已不值什么钱。
      scenario_end_kind: victory
      rewards:
        skill_growth: true
        san_reward_formula: 1D4
        san_reward_conditions:
          - label: 在直面潘神前已完整拼出契约真相
            flag: flag.knew-dream-contract
            formula: 1
        cash_reward: 0
    freedom:
      atmosphere_md: 风重新变成普通的风、森林仍在那里、但你知道你已经走出去了
    forbidden:
      - 严禁让 LLM 描写羊尸的过分恐怖细节——只写"干瘪、没有伤痕"
      - 严禁让 LLM 替 PC 抒情"我自由了"——以行动结束,不需要总结

  # --------------------------------------------------------------------------
  - id: ending.angered-pan
    title: 激怒潘神 · 加入失踪者
    triggers:
      - { flag: flag.pan-angered, value: true }
      - { flag: flag.pc-vanished, value: true }
    priority: 100
    frame:
      epilogue_md: |
        你没有从梦中醒来。或者说,你醒来后发现自己正站在卧室门口,
        无意识地向屋外走去——你的身体不再属于你。你一步步,
        无法控制地走向黑木森林,走向那片空地。
        第二天,人们只会发现牧场空无一人。而在下一个月圆之夜,
        羊群舞蹈的边缘,会多出一具新的、**保持着两腿站立姿态的
        干尸**,脸上凝固着恐惧与狂喜。
      scenario_end_kind: dead
      rewards:
        skill_growth: false
    freedom:
      atmosphere_md: 不写过程,只写"什么也没留下"
    forbidden:
      - 严禁让 LLM 描写吞食过程
      - 严禁让 LLM 在此结局重新给 PC"一线生机"

# ============================================================================
# global_freedom / global_forbidden
# ============================================================================

global_freedom:
  era_atmosphere_md: |
    1920 年英格兰乡下,初夏到初秋间的某个下午。最近的车站在几十英里外,
    最后一段路靠雇来的马车颠簸抵达;煤油灯、立钟、木质留声机、灶台、
    干板相机、镇上邮局的电报亭——这些是这本模组的基本物件库。可挑用,
    但不要把任何"科技小聪明"用作打破恐怖的捷径(电报要骑马进镇才能发,
    天黑后没人愿意为你套车,森林里只剩月光与风声)。
  language_register: |
    简体中文叙述,短句多,留白多。日间田园诗般的安静与夜晚潘神出场的
    长句铺陈形成节奏对比;受惊或目击切到 6~12 字的瞬时短句。避免
    一切网络用语和现代口语习惯,避免好莱坞式夸张副词,避免把"潘神"
    二字过早抛给玩家。
  npc_default_dialect: |
    威廉·哈蒙德是典型的英格兰乡村牧场主口吻,语速不快,偶尔用"嗯……"
    停顿;说"林主"两字时声音自然下沉。潘神的"声音"沉静、低沉、
    带回响,只问一句话便停下。羔羊不语,但其呼吸节奏会被放进叙事中。

global_forbidden:
  - 严禁让 LLM 在 PC 主动调查前直呼"潘神""莎布-尼古拉丝""牧神"——只能用"林主""祂""那位"等模糊代称
  - 严禁描写潘神面部细节,只允许"长角轮廓、近三米身躯、田野公羊般的恶魔之眼"等克制刻画
  - 严禁让 LLM 在 narrative 里替玩家做选择或抒情独白
  - 严禁让 LLM 主动报伤害或 SAN 数值——SAN 走前端 sanityCheck 通道,伤害走 *Formula
  - 严禁让 LLM 替 PC 投骰判定"潘神接受/拒绝 PC"——必须由 PC 通过具体行动表态
  - 严禁让威廉自报埃利亚斯信仰潘神——他不知道
  - 严禁在白天让羊群表现出"诡异凝视/集体异动"——这只在管乐器声/月圆夜才出现
  - 严禁此模组发生战斗——本模组没有战斗元素,任何冲突都以"逃离/抉择"代替
  - 严禁让本模组未声明的额外结局出现
  - 严禁描写 NPC 立绘 / 头像

# ============================================================================
# narrative_style(§14)
# ============================================================================

narrative_style:
  frame:
    pov: 第二人称克制
    tense: 现在时
    forbidden_phrasings:
      - 严禁出现"作者""读者""模组""KP""守秘人"等元描述词进入正文
      - 严禁出现"恐怖在此爆发""紧张感拉满"等戏剧化总结
      - 严禁让 LLM 在叙事中"提示玩家该做什么"——它只描写正在发生的事
      - 严禁出现"手机""信号""4G/5G""导航""GPS""电脑""电视""录音笔""充电""APP""短信""微信""上网"等任何 1920 年代尚不存在的现代物件或词汇

  freedom:
    sentence_pacing_md: |
      白日田园探索段落用 25~50 字短句,逗号断句,留白多;夜晚或潘神
      出场允许长句铺陈,但不超过两句即收;受惊或目击切到 6~12 字
      的瞬时短句。让阳光与月光的"质感差异"自然呈现节奏对比。
    vocabulary_register: |
      1920 年代英格兰乡村的克制叙事。允许"草浪""栅栏""木地板""立钟"
      "帽檐""马车""木盒""芦笛""煤油灯""留声机""干板相机""电报"
      "树瘤""泥浆""银灰"等具象词。避免成语堆叠、避免过度心理描写、
      避免把"潘神"二字过早抛给玩家。
    metaphor_palette:
      - 草场油绿得像油画——颜色不像本地草该有的颜色
      - 黑木森林像一堵墨绿色的墙——风停在那道颜色上
      - 羊群安静得像被排练过——它们抬头的瞬间像受过训
      - 月光把屋内染成银灰——你的影子比平时短一截
      - 笛声直接在脑海里回荡——像是从颅骨内部升起,而非从外面传来
      - 羔羊在你怀里一寸寸变重——像是抱回一段被借走的时间
      - 长角的影子比身躯更长——月光在祂脚下停得太久
    reference_works:
      - 阿瑟·梅琴《伟大的潘神》开头那种"把田园写到不安"的笔法
      - 雪莉·杰克逊《邸宅》对"过分整洁"的恐惧
      - 罗伯特·艾格斯《女巫》(VVitch)对静默与声音的处理
    sample_paragraph_md: |
      你把行李拎下车。
      草场油绿得不像本地的颜色。
      羊群没有抬头。
      远处那堵墨绿色的墙上,风停了一拍——
      你听见自己钥匙环上小铃铛的轻响,在这片安静里大得反常。

