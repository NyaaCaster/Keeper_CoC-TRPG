# ============================================================================
# meta
# ============================================================================

meta:
  id: shepherds-legacy
  title: 牧人的遗产
  era: 1920s
  language: zh-CN
  difficulty: 入门
  tags: [1920s, 英国, 康沃尔, 乡村, 牧场, 潘神, 单人, 短篇]
  cover: assets/cover.jpg
  start_time: { game_day: 1, hour: "14:30" }
  synopsis_md: |
    一封来自英格兰乡下事务律师的信函,告诉你一位鲜少联系的远房叔父
    去世了——他孤身一人住在黑木森林边缘的小型牧场里,把一切留给了你。
    继承的程序已经走完,屋子的钥匙就在你口袋里。
    你坐了大半天的火车,又雇了一辆马车走完最后一段山路,在午后抵达
    那座连邮政地图上都没标注的牧场,推开吱呀作响的木门。屋子打理得
    过分整洁,羊圈外站着邻居,远处的森林像一堵墨绿色的墙。
    一切看起来恰到好处地平静——直到第一个月圆之夜降临。
  author_credits_md: |
    原作者:红色小鸟。原作联系:1300520367@qq.com。
    原作美术素材为 AI 生成。本项目转写:Keeper_CoC-TRPG。
    原作授权范围:可转载至非公开场合(私聊、群聊),不得擅自修改、商用、
    或公开发布。本目录是为本项目"基于剧本游戏模式"做的中文化转写,
    背景与原作一致设定在 1920 年代英格兰乡下,核心剧情未做改动。
  recommended_occupations:
    - 私家侦探
    - 记者
    - 神秘学家
    - 教授
    - 作家
    - 流浪汉
  recommended: false

# ============================================================================
# hook
# ============================================================================

hook:
  start_scene: scene.farm-arrival
  prologue_md: |
    继承一份你毫无心理准备的遗产——这种事在小说里常见,在你身上还是
    第一次。**埃利亚斯·弗莱彻**是你父亲那一辈的远房叔父,你只在小时候
    见过他一面。他终身未婚,无直系后代;一个月前他死了——上吊在自己
    卧室里,被邻居发现。
    律师寄来的信很短,合同更短。地皮、屋子、栅栏内的羊群、账本上
    一笔不算少的现金——全部归你。**信用评级 +10%**,因继承遗产派生。
    你坐了大半天的火车,在最近的镇子下车;站口只有一辆等活儿的马车,
    车夫把你送到一段修了一半的乡道尽头,就拒绝再往前走——栅栏崭新,
    草场油绿,羊群在围栏里安静地吃着草。屋子在黄昏前的阳光下显得
    过分整洁。最近的电报房在十几英里外的镇子上。
  call_to_action_md: |
    远亲的死、突如其来的牧场、与世隔绝的位置——任何一项都值得你
    停下来想一想。但合同已经签了,行李就堆在马车上。律师在信末写道:
    "钥匙在邮箱里;邻居威廉·哈蒙德先生愿意带你熟悉一下牧场。"
    你把行李一件件拎下来,马车很快掉头远去。门牌写着
    **Fletcher's Folly**——弗莱彻的痴愚。这名字让你笑了一下。
    然后笑容就停住了。
  default_initial_clues: [clue.lawyer-letter]
  occupation_variants:
    "私家侦探":
      call_to_action_md: |
        你接案接久了,看一眼这房子就知道哪里不对——太整洁,整洁得
        像在迎接一场正式的告别。律师在信里没明说"自杀",但措辞
        足够暗示。你顺手带了笔记本和一只袖珍折叠相机,准备先把
        屋子翻一遍。
      initial_clues: [clue.lawyer-letter]
    "记者":
      call_to_action_md: |
        编辑听说你"继承了一座英格兰乡下的牧场"那天笑了三次,然后
        正式让你写一篇"远亲遗产里的乡村奇谈"。你带着速记本、
        钢笔与一台老式干板相机——只是没想到会真有奇谈。
      initial_clues: [clue.lawyer-letter]
    "神秘学家":
      call_to_action_md: |
        埃利亚斯这个名字你查过——他给一份不出名的民俗刊物投过
        几次稿,内容偏向"乡村牧神信仰的活态遗存"。律师寄来的信
        让你既意外又笃定:这趟遗产之旅你必须亲自走一回。
      initial_clues: [clue.lawyer-letter]
    "教授":
      call_to_action_md: |
        你的下学期讲义需要一段"英国乡村古老民俗的活态残响"的现场
        素材。继承牧场的通知意外地与之吻合——你给系里请了几天假,
        把田野笔记本和相机塞进了挎包。
      initial_clues: [clue.lawyer-letter]
    "作家":
      call_to_action_md: |
        你在写一部以"封闭乡村"为主题的长篇,最后一章一直找不到
        合适的现场。继承牧场的通知像被谁推到你桌前——你觉得自己
        欠这位陌生远亲一段认真的守夜。
      initial_clues: [clue.lawyer-letter]
    "流浪汉":
      call_to_action_md: |
        你已经欠了三个月房租。律师从背景调查找到你时,你正睡在
        城南一间廉价旅店。继承一份英格兰乡下的牧场——这事
        听起来像谎言,但律师把火车票连同一点零钱一起寄到了
        你的房东那里。
      initial_clues: [clue.lawyer-letter]

# ============================================================================
# scenes
# ============================================================================

scenes:
  # --------------------------------------------------------------------------
  - id: scene.farm-arrival
    title: 牧场入口 · 抵达
    frame:
      summary_md: |
        马车在牧场入口前停下,车夫把行李一件件卸到地上,接过车资就
        掉头往镇子方向去了。崭新的木栅栏一直沿斜坡铺向远处。
        阳光被前方一片**深暗近黑的森林**(本地人叫黑木森林)挡了一半。
        草场油绿得像油画,羊群安静地分散在围栏里——它们没有惊慌,
        甚至没有抬头。
        屋子坐落在地势稍高处,白漆木门、灰瓦屋顶,看不出"独居老人
        刚去世"的痕迹。屋后是羊圈与一座小棚屋。
        除了风掠过草地的"沙沙",**这里再没有任何人为的声响**——
        最近的镇子在十几英里外,连电报线的杆子都没拉到这一带。
      facts:
        - 牧场坐落在黑木森林边缘的山坡上,最近的小镇在十几英里外
        - 栅栏崭新、草场异常油绿、羊群异常温顺——埃利亚斯死了一个月,这种状态不正常
        - 邻居威廉·哈蒙德的牧场在两英里外,他承诺会过来"带你熟悉"
        - 屋后是羊圈,栅栏完好无损,但月圆之夜羊总是"自己走出去"(后续才会知)
        - 这里完全没有电报与电话线;最近的电报房在镇上,需要骑马或步行半日
      exits:
        - to: scene.farmhouse-living
          condition: free
          label: 推开屋子的木门走进屋
        - to: scene.sheep-pen
          condition: free
          label: 绕到屋后的羊圈看看
        - to: scene.driveway-edge
          condition: free
          label: 走到牧场地势稍高处向四周望
      npcs_present: []
      available_clues: [clue.lawyer-letter, clue.unsupervised-flock]
    freedom:
      mood_tags: [栅栏崭新得不正常的油绿, 黑色森林像一堵墙, 风掠过草地的反常安静]
      sensory_palette:
        sight: 草场被夕照斜斜镀成金黄、羊群一动不动的剪影、远处森林的墨绿色压顶
        sound: 风掠过草浪的"沙沙"、远处一两声极淡的羊叫、屋后木栅栏被风轻磕的"咯哒"
        smell: 草汁的清香、羊毛与肥料的微味、远处森林湿木的潮气
        touch: 钥匙在裤袋里硌大腿、午后阳光把外套晒出一点温热、风里隐约带着一丝冷意
      improvisable_props:
        - 邮箱里露出钥匙环的一角,挂着一个木牌"E.F."
        - 车道一侧立着褪色的"私人土地——勿入"木牌
        - 入口栅栏柱顶钉着一只看上去像是临时拴系绳子的环钩
        - 屋檐下挂着几束已经干透的野花,扎得很工整
    forbidden:
      - 严禁让 LLM 替调查员"听到森林深处传来笛声"——这只在黄昏后或月圆夜才浮现
      - 严禁此场景让羊群表现出任何"非自然"行为——在白天调查员眼里,它们只是过分温顺
      - 严禁邻居威廉在调查员主动叫他、或抵达 30 分钟后(timeline)前出现

  # --------------------------------------------------------------------------
  - id: scene.driveway-edge
    title: 牧场地势稍高处 · 远眺
    frame:
      summary_md: |
        你从车道走到牧场地势稍高的地方,向四周望去。
        一边是深邃、仿佛无边无际的**黑木森林**,像一堵墨绿色的墙。
        另一边则是起伏的荒野和更远处的山丘。除了风掠过草地的声音,
        几乎没有别的声音——空旷得让人耳鸣。
        坡顶视野极佳,远到镇子方向的电报杆都能看到一根模糊的剪影。
      facts:
        - 这是牧场内视野最阔的位置,远眺天气好时可以看到镇子方向的电报杆剪影
        - 视野所及没有任何邻近房屋——除了威廉·哈蒙德牧场方向有一缕炊烟
        - 黑木森林的边缘有一道明显的"颜色断层":森林这边深暗,牧场这边油绿
        - 草场再向远处延伸,接到一段几乎被荒草吞没的旧石墙——估计是上世纪初的牧场分界
      exits:
        - to: scene.farm-arrival
          condition: free
          label: 走回牧场入口
        - to: scene.black-wood-edge
          condition: free
          label: 沿草场边缘走向森林边
      npcs_present: []
      available_clues: [clue.color-cliff]
    freedom:
      mood_tags: [视野极阔的空旷, 颜色断层处的不协调, 远到能看见电报杆的孤立感]
      sensory_palette:
        sight: 远处山丘被薄云镀过、森林边缘那道颜色明显的"分界"、稍远处一段塌了大半的旧石墙
        sound: 风从荒野吹过来时带着一种很淡的"嗡嗡"、远处羊叫一两声
        smell: 风里带着一丝来自森林的湿木气、不算重但持续
        touch: 站到坡上脚步会变沉,坡顶的风比下面要冷一截
      improvisable_props:
        - 一块被打磨光滑的石头,像是有人长期坐在上面
        - 草丛里露出一截生锈的篱笆桩,与现在的栅栏样式不同
        - 远处天空有一只盘旋的鸟(秃鹰之类),很久没下来
    forbidden:
      - 严禁让调查员在此处看到黑木森林"内部"——他只能看到边缘
      - 严禁让 LLM 替调查员推断"森林边缘的颜色断层意味着什么"

  # --------------------------------------------------------------------------
  - id: scene.farmhouse-living
    title: 屋子 · 客厅与玄关
    frame:
      summary_md: |
        屋子内部干净整洁得不像独居老人留下的居所。家具简单实用,
        布置遵循一种**清教徒式**的克制。客厅里没有照片、没有装饰画、
        没有任何能显示个人情感或家庭联系的物品——只有一张餐桌、
        几把椅子、一座立钟和一只木质留声机。
        玄关处有一面挂衣镜,镜子下方的木条上刻着一行很浅的字:
        "勿请勿避,各得其所。"
        二楼通向卧室,客厅尽头是书房。
      facts:
        - 屋子整体清洁,无任何照片、装饰画、家庭合照
        - 桌椅全为实用家具,无装饰物;陈设带"清教徒式"克制
        - 玄关木条上有一行浅刻字:"勿请勿避,各得其所"——埃利亚斯亲手刻
        - 客厅角落有一座老式立钟与一只木壳留声机,屋内对外通讯只能靠骑马进镇发电报
        - 埃利亚斯一个月前在二楼卧室上吊自杀;尸体已被处理
      exits:
        - to: scene.farm-arrival
          condition: free
          label: 走出屋外回到牧场入口
        - to: scene.farmhouse-bedroom
          condition: free
          label: 沿楼梯上二楼卧室
        - to: scene.farmhouse-study
          condition: free
          label: 推开客厅尽头的书房木门
      npcs_present: []
      available_clues: [clue.spartan-decor, clue.entryway-inscription]
    freedom:
      mood_tags: [被擦得极干净的木地板, 没有任何照片的过分克制, 立钟钟摆的稳定回响]
      sensory_palette:
        sight: 木地板的浅黄、墙纸是单一的米色、灶台上一只搪瓷茶壶、立钟黄铜钟摆的微光
        sound: 老木地板被踩出的轻"吱呀"、屋外风掠过窗框、立钟"咔哒咔哒"的钟摆声
        smell: 木屑、肥皂水擦过的清淡气味、隐约一丝奶味与草料味从屋后飘来
        touch: 木门把手是冷的、地板缝里仍有一点细沙、墙纸一摸有薄薄一层粉
      improvisable_props:
        - 餐桌上摆着一只刚被洗净的杯子,杯沿微湿——刚有人擦过(其实是邻居威廉)
        - 灶台上一只罐装黄油,标签是手写的"E.F."
        - 玄关地面有一双干净的胶靴,鞋码与你不太一致
        - 留声机的唱盘上停着一张未取下的旧片子,针头擦着边缘留出一道浅痕
    forbidden:
      - 严禁让 LLM 替调查员发现"屋子里有人来过的痕迹"——只能在调查员主动观察后由【侦查】检定揭示
      - 严禁此场景出现任何超自然元素——这里的恐怖来自"过分整洁"

  # --------------------------------------------------------------------------
  - id: scene.farmhouse-bedroom
    title: 屋子 · 二楼卧室
    frame:
      summary_md: |
        埃利亚斯·弗莱彻自杀的房间。如今,尸体已经被处理,屋子里看不出
        死人的痕迹。床铺被整理得平整,被子折成军队式的方块。
        床头柜上放着一只精心雕刻的木盒。木盒旁边的墙面留有一行
        **看上去像是用尖锐物深深刻划的小字**——刻得很深,甚至破开了
        墙纸,露出底下的木头。字迹潦草狂乱,与屋子其他地方的整洁
        形成鲜明对比。
      facts:
        - 卧室是埃利亚斯上吊自杀的位置;屋顶横梁上仍有一道浅浅的勒痕
        - 床头柜的木盒里装有一支古老粗糙的手工**芦笛**,木质坚硬,工艺粗野
        - 墙上潦草小字写着:"啊!伟大的潘!林间的主宰,欢笑与恐慌的化身!"
        - 字迹深刻入墙体,显然由心智极度激动的人在很短的时间内刻成
        - 卧室窗户朝向黑木森林方向;月圆夜会有月光直接落在床上
      exits:
        - to: scene.farmhouse-living
          condition: free
          label: 回到楼下客厅
      npcs_present: []
      available_clues: [clue.flute-in-box, clue.wall-inscription, clue.beam-mark]
    freedom:
      mood_tags: [军队式的床, 与整洁背离的狂乱刻痕, 木盒被擦得发亮的不和谐]
      sensory_palette:
        sight: 床上方横梁的浅色勒痕、木盒的雕花、墙上深刻的字、窗外越过森林的天际线
        sound: 屋外风掠过烟囱的"呜——"、床下木地板的极轻吱呀
        smell: 床铺一丝旧棉味、木盒里飘出的木质涩香与一丝难辨的草本气
        touch: 木盒拿在手里出乎意料地冷、床铺的被面摸起来挺括、墙上刻痕的边缘锋利
      improvisable_props:
        - 床头柜抽屉里放着一只老式怀表,表盖内侧只刻着"E.F."
        - 床下塞着一只折叠整齐的旧麻布袋,袋口染着草汁
        - 衣柜里只有几件旧呢绒外套和靴子,数量出奇地少
    forbidden:
      - 严禁让 LLM 替调查员吹响芦笛——这是一个重要的剧情触发点,只能由 PC 主动决定
      - 严禁让 LLM 立即将"潘神"与"羊群"关联——必须由调查员通过【神秘学】检定或在书房线索中拼出
      - 严禁卧室此时浮现任何超自然现象,只是"过分克制的整洁"与"狂乱刻字"的对比反差

  # --------------------------------------------------------------------------
  - id: scene.farmhouse-study
    title: 屋子 · 书房
    frame:
      summary_md: |
        书房是这屋子里最像有人住过的房间。木质书柜立在两面墙上,
        书架上摆着关于**农业学、畜牧业**的普通书籍——但仔细看会发现,
        其中一格抽屉锁着,锁不算结实。
        书桌上散落着牧场的日常账本,记录着微乎其微的支出和相当
        可观的收入。屋角立着一只老式落地灯,旁边是一把磨损得十分
        厉害的木椅——埃利亚斯生前最常坐的位置。
      facts:
        - 书柜上层是农业学/畜牧业普通书籍,毫无诡异之处
        - 锁着的抽屉里是埃利亚斯的"研究笔记"与一张祭坛位置图——这是核心线索
        - 桌上账本显示牧场收益惊人——羊毛、羊奶、肉类销售;支出极低
        - 抽屉锁可被【锁匠】打开,或被【力量】检定撬开;失败会损坏抽屉但不留外伤
        - 落地灯旁的椅子坐垫凹陷得很深——他在这里坐过非常多个夜晚
      exits:
        - to: scene.farmhouse-living
          condition: free
          label: 退回客厅
      npcs_present: []
      available_clues: [clue.account-books, clue.locked-drawer, clue.research-notes, clue.altar-map]
    freedom:
      mood_tags: [书房特有的木浆与油墨味, 煤油灯昏黄的光, 椅垫上一只长期坐过的浅凹]
      sensory_palette:
        sight: 桌上账本上工整的钢笔字、抽屉锁孔附近被反复擦拭过的痕迹、椅子坐垫上的深凹
        sound: 煤油灯灯芯偶尔"噼"地一爆、屋外风掠过窗框、抽屉被拉动时的金属轻响
        smell: 旧书纸味、墨水痕、木椅与皮垫的混合气
        touch: 木桌的边缘被磨得圆滑、抽屉锁面凉而细腻
      improvisable_props:
        - 书柜深处一本被翻得极烂的《英国乡村民俗志》
        - 桌上一只插满旧钢笔的笔筒,其中一支笔身上沾着干涸的红色(蜡封)
        - 抽屉旁一本袖珍的"祈祷词手册",但里面写满了不像基督教祷词的句子
    forbidden:
      - 严禁让 LLM 在调查员尚未撬开抽屉前透露其内容
      - 严禁让 LLM 替调查员将研究笔记与"潘神"直接连接——这要走【神秘学】检定
      - 严禁此场景出现幻觉、笛声、动物耳鸣等超自然现象

  # --------------------------------------------------------------------------
  - id: scene.sheep-pen
    title: 屋后 · 羊圈
    frame:
      summary_md: |
        羊圈紧挨着小棚屋,围栏由结实的新木桩组成,毫无破损。
        羊群皮毛均匀、浓密、洁净,呈现一种**教科书般**的健康光泽。
        体型匀称,肌肉饱满。它们极其温顺,不会因为陌生人靠近而惊慌,
        甚至会主动安静地靠近你,用头轻轻蹭你的手。
        圈外不远的草地上,似乎有一些**奇怪的足迹**。
      facts:
        - 羊群皮毛、体型异常完美——埃利亚斯死了一个月,无人照看的羊不该如此健康
        - 它们对陌生人不警惕,反而主动亲近;尤其对你(继承人)异常听话
        - 羊群对**笛声或管乐器**有强烈反应,会停下动作集体凝视声源
        - 羊圈外有不属于任何农场动物的**大型蹄印**,像餐盘那么大;沿足迹一路通向黑木森林边缘
        - 月圆之夜,羊群会"自己走出"完好的栅栏——这一节调查员第一晚才能亲历
      exits:
        - to: scene.farm-arrival
          condition: free
          label: 绕回牧场入口
        - to: scene.shed
          condition: free
          label: 钻进旁边的小棚屋看看
        - to: scene.black-wood-edge
          condition: requires-clue
          required_clue: clue.giant-hoofprints
          label: 沿大型蹄印走向黑木森林边缘
      npcs_present: []
      available_clues: [clue.unsupervised-flock, clue.giant-hoofprints, clue.flock-music-response]
    freedom:
      mood_tags: [栅栏崭新得不正常, 羊群温顺得像被排练过, 草地上格格不入的大蹄印]
      sensory_palette:
        sight: 羊群整齐的皮毛、围栏旁草地被踩出的圆形浅坑、远处森林边缘那道浓墨般的颜色
        sound: 羊群之间几乎没有叫声、围栏被风磕出的轻响、自己脚步陷草的"嗯——"
        smell: 羊毛与干草的暖味、肥料的淡涩、风里带着一丝森林的湿气
        touch: 羊毛厚实蓬松、围栏木桩光滑(看起来才钉上不久)、足迹边缘的泥土松软
      improvisable_props:
        - 羊圈门旁挂着一只哨子,哨身有牙痕(埃利亚斯生前用来召唤羊群)
        - 围栏外一只缺口的木桶,装着干奶粉
        - 一只圈在角落里、与其他羊明显区别的小母羊——肚子明显鼓起,产期临近
    forbidden:
      - 严禁让 LLM 在白日描写羊群"诡异凝视"——它们只在听到笛/管乐器时才集体专注
      - 严禁让 LLM 替调查员推断"蹄印属于潘神"——必须由【神秘学】或【博物】+ 蹄印观察自行联想
      - 严禁让羊圈在白天发生任何超自然事件——所有非常规事件锁定在月圆夜

  # --------------------------------------------------------------------------
  - id: scene.shed
    title: 屋后 · 小棚屋
    frame:
      summary_md: |
        紧贴羊圈的木质小棚屋,是埃利亚斯堆放饲料、工具与"杂物"的
        地方。光线昏暗,空气里飘着干草与机油混合的味道。
        棚屋深处搭了一张矮木桌,桌上有几只被反复使用的陶碗——
        碗底沾着干涸的暗色污渍。一旁堆着用油布盖好的工具。
      facts:
        - 棚屋内有标准农场工具:绳索、铁锹、剪毛剪、马灯
        - 矮木桌上的陶碗碗底有干涸暗色污渍——【医学】或【科学(生物学)】可识别为干血
        - 油布下藏着一只**手工削制的木质盆**,盆缘刻有羊角与笛子的简单图样
        - 棚屋后墙的木板缝里夹着一张被反复折叠的纸条,字迹与卧室墙上的同一人
      exits:
        - to: scene.sheep-pen
          condition: free
          label: 出棚屋回到羊圈
      npcs_present: []
      available_clues: [clue.bowl-residue, clue.shed-paper]
    freedom:
      mood_tags: [昏暗与干草味, 油布下"被刻意藏"的不对劲, 角落里一盏被擦得很亮的马灯]
      sensory_palette:
        sight: 油布的暗灰、马灯灯罩反射的微光、桌上陶碗的釉面、墙板的旧木纹
        sound: 风从棚屋缝隙灌入的"呜——"、自己呼吸的回响、远处羊群极轻的咩声
        smell: 干草的暖味、机油的旧涩、暗色污渍那一丝铁锈感
        touch: 油布粗糙、木盆边缘的雕痕略硌手、马灯的金属把手是凉的
      improvisable_props:
        - 角落一只完好的旧鸟笼,里面没有鸟,但有一根灰色羽毛
        - 一捆被仔细盘好的麻绳,尾端被烧过定型
        - 棚屋顶的横梁上挂着一只看起来很久没用的木质口哨——比羊圈那只要大
    forbidden:
      - 严禁让 LLM 替调查员断言"陶碗里是羊血"——必须由检定结果支撑
      - 严禁此场景出现"潘神显灵"或"森林低语"

  # --------------------------------------------------------------------------
  - id: scene.black-wood-edge
    title: 黑木森林 · 边缘
    frame:
      summary_md: |
        从牧场草场过渡到森林,只需要几步,但这几步带来的差异强烈得
        不可思议——油绿瞬间被深暗吞没,**风的声音也变了**。
        森林里的树木是一种深暗、近乎黑色的品种。**即便在阳光下,森林
        也感觉压抑、寂静得反常**。
        踏入边缘几步,你能看见地上那串大型蹄印继续向森林深处延伸。
      facts:
        - 黑木森林是潘神的"地盘",白日里调查员的探索不会遇到直接危险
        - 白日里森林只允许"压抑感、被注视感、不规则刻痕"等暗示性发现
        - 沿地上蹄印一直走,会找到由腐烂藤蔓捆绑形成的"门"(witch-gate / faerie-gate)
        - 黄昏时分能听到若有若无的笛声——必须停下来"听"才能注意到
        - 月圆夜后白日重返森林,刻痕会变化(留给守秘人裁夺)
      exits:
        - to: scene.driveway-edge
          condition: free
          label: 退回牧场地势稍高处
        - to: scene.witch-gate-day
          condition: free
          label: 沿大型蹄印继续向森林深处
      npcs_present: []
      available_clues: [clue.tree-faces, clue.bark-carvings, clue.grotto-figurines, clue.dusk-flute]
    freedom:
      mood_tags: [树皮上的不自然痕迹, 风声变得压低的诡异, 地上蹄印的连贯方向]
      sensory_palette:
        sight: 树皮上像是常春藤、羊头、多乳房怪异符号的刻痕、树瘤拼出的痛苦人脸或羊头
        sound: 风穿过枝叶的低语般的"嘶嘶"、自己脚踩腐叶的清脆、远处有什么停了一拍的鸟啼
        smell: 腐叶与潮湿苔藓的厚重、隐约一丝甜得发腻的草本香
        touch: 树干像是吸热的黑色铁皮、地面比草场要软,踩下去微微下陷
      improvisable_props:
        - 一棵巨大古树的树洞里塞着几只手工木雕,扭曲怪诞,像长着羊角的人形
        - 一截被绑在低枝上的红色丝带,颜色已经发褐
        - 落叶堆里露出一截动物骨骼,形状与农场动物不符
    forbidden:
      - 严禁让 LLM 在白日描写"潘神现身"——白日只是氛围渲染,无实际危险
      - 严禁笛声在中午时段响起——只在黄昏后才浮现,且必须"调查员停下倾听"才能注意到
      - 严禁让 LLM 替调查员决定"沿蹄印继续"——这是 PC 主动选择的转折点

  # --------------------------------------------------------------------------
  - id: scene.witch-gate-day
    title: 黑木森林 · 白日的门
    frame:
      summary_md: |
        顺着地上蹄印走得越深,光线越暗。终点附近并没有埃利亚斯笔记上
        画的"祭坛"——反而多了一个奇怪的景观:
        几根低矮的树枝被以一种怪异的方式用**腐烂的藤蔓**捆绑起来,
        形成类似拱门的结构,门洞约一人高,刚好能让人弯腰穿过。
        门附近的空气感觉比四周要冷一截。地上没有别的痕迹,
        蹄印在门前消失。
      facts:
        - 这道门是凯尔特/日耳曼传说中的"精灵门(faerie-gate)"或"女巫门"——【神秘学】可识别
        - 白日穿过门会感到一瞬间冰冷刺骨,然后立刻消失;之后伴随强烈的"被注视感"
        - 白日穿过门**到不了祭坛**——只有月圆夜被羊群驮过来,才能抵达祭坛
        - 破坏门会被潘神视为"宣战"——破坏者本人及其家族被施加可怕诅咒(疾病、牲畜死亡、农作物歉收、家庭不和)
        - 修复诅咒需怀着极大的敬畏将结构恢复原状,通常还需要仪式与祭品(原作铁律)
      exits:
        - to: scene.black-wood-edge
          condition: free
          label: 退回森林边缘
      npcs_present: []
      available_clues: [clue.faerie-gate-day, clue.gate-cold-spot]
    freedom:
      mood_tags: [门附近空气的冷点, 被注视感越来越实, 周围一切声音被压低半档]
      sensory_palette:
        sight: 藤蔓上的腐黑斑点、门后景物似乎与门前略有错位、阴影深处隐约一道更深的影
        sound: 自己心跳第一次清晰、风停的间隙比别处长、远处一两声不规则的折枝
        smell: 藤蔓的腐味、门附近一股说不清的草本香与冷金属味
        touch: 穿过门时有"穿过水幕"的瞬间冰凉、藤蔓粗糙却湿冷
      improvisable_props:
        - 门的左立柱上嵌着一颗绿松石样的小玻璃珠,看上去年代不短
        - 门的右立柱底部有半截动物角,被藤蔓缠住
        - 距门十步的地面上,有一团被踩平的草——好像有人在这里跪过很久
    forbidden:
      - 严禁让 LLM 在调查员主动表示要破坏门时,允许"无视诅咒"通过——必须真实承担后果
      - 严禁让祭坛在白日浮现——只有月圆夜的梦境路径才能抵达
      - 严禁此场景让潘神"具象登场"——白日只能用"被注视感、空气冷点、声响错位"渲染

  # --------------------------------------------------------------------------
  - id: scene.dream-altar
    title: 黑木森林 · 月圆夜的祭坛(梦)
    frame:
      summary_md: |
        你以为自己醒着,但你已经在梦里。
        月光下的田野是一种非自然的银灰色。羊群驮着你穿过那道门,
        地面变成黑色的、黏稠的泥浆。你能在泥浆里下沉,泥浆冰冷刺骨,
        像有生命般试图把你拖下去。
        从泥浆里走出,你看见门后浮现一座**古老的石制祭坛**。
        月光下,一个**高大的、长角的轮廓**站立着,正用芦笛吹奏旋律
        无法听清的曲子。羊群从你背上把你卸下,围着这位长角的神明
        起舞,**模仿祂的姿势用两脚站立**。
        在羊群边缘,你看见**数具穿着徒步者衣服的人类干尸**——它们
        也保持着站立的诡异姿态,脸上凝固着极度的恐惧与某种狂喜。
      facts:
        - 这是潘神主动编织的梦境;调查员理论上无法在梦中"逃出"
        - 羊群驮 PC 越过 witch-gate,梦中地面变为冰冷黏稠的泥浆
        - 祭坛旁站立的长角神明是潘神的化身,身高近三米
        - 干尸身份 = 黑木森林历年失踪的徒步爱好者(原作设定)
        - 梦的尽头潘神会询问 PC 是否愿意接过埃利亚斯生前所立的契约
        - 接受 = 献上 PC 接生的羔羊;拒绝 = 自由代价是羊群与牧场;激怒 = PC 永久消失
      exits:
        - to: scene.dream-choice
          condition: free
          label: 在梦里直面潘神的提问
      npcs_present: [npc.pan]
      available_clues: [clue.altar-corpses, clue.dream-contract]
    freedom:
      mood_tags: [银灰色的田野, 黑色泥浆的冰冷, 羊群两脚站立的诡异同步]
      sensory_palette:
        sight: 月光下泛银的草、长角轮廓的剪影、羊群两脚站立的怪异、干尸面部凝固的表情
        sound: 旋律无法听清却直接在脑中回荡的笛声、羊群同步呼吸、泥浆里传来的"咕嘟"
        smell: 树汁、血液、腐烂自然的混合味、潮湿的金属味
        touch: 泥浆冰冷刺骨、羊背温热毛蓬松、空气里贴着一层湿润
      improvisable_props:
        - 祭坛旁一捆奉献用的麦束,看起来异常新鲜
        - 干尸群边缘有一只摔在地上的相机,镜头朝下
        - 一只小羔羊立在祭坛底座边——它就是你白天接生的那只(羔羊跟着你进了梦)
    forbidden:
      - 严禁让 LLM 在此场景"提前给出选项菜单"——选择是 PC 在与潘神对话中亲口表态的
      - 严禁让 LLM 替 PC 决定接受/拒绝/激怒——这是模组的核心抉择
      - 严禁直接描写潘神面部细节——只允许"长角轮廓、笛声、近三米身躯"等克制刻画
      - 严禁让羊群在此场景中以现实逻辑"被攻击/被反抗" —— 它们听命于潘

  # --------------------------------------------------------------------------
  - id: scene.dream-choice
    title: 黑木森林 · 月圆夜的抉择(梦)
    frame:
      summary_md: |
        长角的神明放下芦笛,转过身来。**祂没有走向你**——只是站在那里,
        让月光把它的眼睛映成两枚反光的硬币(像田野上公羊般的恶魔之眼)。
        你听见声音直接出现在脑海里:
        > "你的远亲为我献上了他自己。你呢?"
        梦的尽头,一道选择浮现:**接过这份血契,成为新的牧人;
        拒绝,把恩赐还给我;或者——以恐惧与憎恨回应**。
        守秘人提示:此处玩家**亲口表态**接受 / 拒绝 / 激怒;
        从醒来后的现实路径继续。
      facts:
        - 接受契约 = 在森林里(或屋内)用芦笛伴随仪式杀死刚出生的羔羊,**献给潘神**
        - 拒绝契约 = 直言"把恩赐收回去吧",羊群将在一夜之间神秘死亡
        - 激怒潘神 = 以恐惧与憎恨回应,或试图摧毁祭坛/门——PC 永久消失
        - 醒来后床头柜的芦笛会变为一把匕首(接受路径需要的祭具)
      exits:
        - to: scene.full-moon-night
          condition: free
          label: 抉择已表态——醒来,屋外是真实的满月之夜
      npcs_present: [npc.pan]
      available_clues: [clue.dream-contract]
    freedom:
      mood_tags: [声音从脑海直接出现的非常态, 月光像液体一样停在皮肤上, 选项浮现的瞬间寂静]
      sensory_palette:
        sight: 长角神明的剪影像被月光勾过线、羔羊蹲坐着抬头看你、远处羊群同步晃动
        sound: 芦笛被放下时的极轻"咔哒"、自己呼吸第一次让你警惕、风像消失了一样
        smell: 一股突然变浓的草本香、潮湿的金属冷
        touch: 站着的脚跟还能感到泥浆的冰冷、空气里有一股贴在皮肤上的薄薄湿
      improvisable_props:
        - 祭坛底座出现一行浅浅的拉丁字样,在月光下若隐若现
        - 长角神明的脚边有一只盛着液体的浅盘——你不确定那是什么
        - 你身后的羊群同时抬起前蹄,等待你的决定
    forbidden:
      - 严禁让 LLM 替 PC 选择——必须等待 PC 亲口或行动表态
      - 严禁此处发生 SAN check 之外的"额外创伤"——"目睹此景损失 1/1D6 SAN"已在 timeline 触发
      - 严禁让潘神在 PC 表态前主动追加台词——只问那一句

  # --------------------------------------------------------------------------
  - id: scene.full-moon-night
    title: 满月之夜 · 牧场(回到现实)
    frame:
      summary_md: |
        梦醒后,床头柜的芦笛**不知何时变成了一把匕首**。窗外是
        银白色的满月。屋外羊群的咩咩声不再温顺,而是短促急切。
        你必须在天亮前完成抉择对应的行动:**献上羔羊、释放羊群、
        或是冲向森林**——三种走向通往三种不同的结局。
      facts:
        - 床头柜上的芦笛已变形为匕首——这是接受路径必需的祭具
        - 窗外满月之亮足以让羊圈与森林一目了然
        - 羔羊跟随 PC 而来,此刻仍在屋内或羊圈;它将是接受路径的祭品
        - 现在的抉择直接对应三种结局,不可回退
      exits:
        - to: scene.sheep-pen
          condition: free
          label: 走出屋去羊圈/森林,执行刚才的抉择
      npcs_present: []
      available_clues: [clue.flute-becomes-dagger]
    freedom:
      mood_tags: [非自然的银白满月, 床头柜上变为匕首的芦笛, 屋外羊群急促的呼唤]
      sensory_palette:
        sight: 月光把屋内一切染成银灰、匕首的金属冷光、窗外羊群剪影的躁动
        sound: 羊群急促的咩、屋外栅栏吱呀、远处森林传来的不规则折枝声
        smell: 屋内冷下来的木味、屋外飘进来的草汁与一丝铁锈味
        touch: 匕首握把出乎意料地冷、地板木纹在脚下变得清晰
      improvisable_props:
        - 床头柜上的木盒空了,盒底浮起一行字"献上自己"
        - 窗台上一只飞蛾正在扑灯,翅膀有些发灰
        - 羔羊在屋内的角落里安静等待——它没有逃,也不会逃
    forbidden:
      - 严禁让 LLM 在此场景替 PC 决定动作——抉择必须由 PC 主动声明
      - 严禁让任何 NPC(邻居、羊群、潘神)在 PC 行动前主动出现/介入
      - 严禁让 LLM 抢先描写"PC 已经走到祭坛"——必须按 PC 行动节奏推进

