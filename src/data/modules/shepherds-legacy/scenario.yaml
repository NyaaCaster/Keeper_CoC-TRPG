clues:
  # --------------------------------------------------------------------------
  - id: clue.lawyer-letter
    title: 律师事务所的继承通知信
    frame:
      location_scene: scene.farm-arrival
      discovery:
        method: auto-on-enter
      reveal_md: |
        摩尔与霍金斯律师事务所的抬头纸,信末是一位 P. Hawkins 的签名:
        > 弗莱彻先生于 4 月 12 日逝世。根据法律继承程序,他名下的
        > 牧场(Fletcher's Folly,黑木森林边缘)、羊群、屋内全部
        > 动产、以及账户结余,在程序完成后归您所有。**附:**信用
        > 评级 +10%(继承派生)。一部分财产仍在政府审批流程中,
        > 暂不发放。钥匙置于邮箱内。邻居威廉·哈蒙德先生(详见随附
        > 名片)愿意带您熟悉牧场。
      kp_note_md: |
        这封信是 PC 进入牧场的合法理由。**信用评级 +10%**已在
        创角阶段写入,无需重复结算。
      unlocks:
        flags: [flag.knew-fletcher-died]
    freedom:
      sensory_when_found_md: |
        信纸边缘有几个不显眼的指印,是律师助理留下的;边角因长途
        邮递有微微卷起。
    forbidden:
      - 严禁让 LLM 替 PC 推断"远亲死因可疑"——只能由 PC 主动调查后逐渐拼出

  # --------------------------------------------------------------------------
  - id: clue.unsupervised-flock
    title: 一个月无人照看仍异常健康的羊群
    frame:
      location_scene: scene.farm-arrival
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        埃利亚斯死了一个月,理论上无人照看的羊群不该如此。但
        眼前的羊群皮毛均匀、浓密、洁净,肌肉饱满,体型匀称,
        每一只都像是畜牧展览会上的冠军选手。**这非常不正常**。
      unlocks:
        flags: [flag.knew-flock-anomaly]
    freedom:
      sensory_when_found_md: |
        蹲下来仔细看,羊毛根部干净得像刚被人梳过。
    forbidden:
      - 严禁让 LLM 替 PC 直接得出"超自然"结论——这是异常,但能解释为"邻居偷偷照料"

  # --------------------------------------------------------------------------
  - id: clue.color-cliff
    title: 黑木森林边缘的"颜色断层"
    frame:
      location_scene: scene.driveway-edge
      discovery:
        method: auto-on-enter
      reveal_md: |
        从坡上向森林望去,森林边缘有一道明显的"颜色断层":森林那边
        是几乎黑色的深暗,牧场这边是异常油绿。两种颜色在草叶尖端
        贴在一起,像被一根看不见的绳分开。
      unlocks:
        flags: [flag.knew-color-cliff]
    freedom:
      sensory_when_found_md: |
        风从森林这边吹过来时,你的耳朵会突然安静下来——那不是
        听觉,而像是声音被吸进了那道颜色里。
    forbidden:
      - 严禁让 LLM 给"颜色断层"赋予过度解释——这是潘神领地的边界,但 PC 现在不该明白

  # --------------------------------------------------------------------------
  - id: clue.spartan-decor
    title: 屋子里"清教徒式"的克制陈设
    frame:
      location_scene: scene.farmhouse-living
      discovery:
        method: auto-on-enter
      reveal_md: |
        屋内没有一张照片、没有装饰画、没有任何能显示"我是谁、
        来自哪里、爱过谁"的东西。家具简单到近乎苛刻,墙上唯一的
        装饰是一只挂钟。一个生活了几十年的人,**有意**没有留下
        任何关于自己的痕迹。
      unlocks:
        flags: [flag.knew-spartan-life]
    freedom:
      sensory_when_found_md: |
        手指划过餐桌边缘——没有灰。墙角也没有蛛网。
    forbidden:
      - 严禁让 LLM 替 PC 推断"埃利亚斯有信仰" —— 这要在书房研究笔记发现后才能合并

  # --------------------------------------------------------------------------
  - id: clue.entryway-inscription
    title: 玄关木条上的浅刻字
    frame:
      location_scene: scene.farmhouse-living
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        玄关挂衣镜下方一根横木上有一行很浅的刻字:
        > "勿请勿避,各得其所。"
        像是用小刀慢慢刻成的,字迹一笔一划很认真。
      unlocks:
        flags: [flag.knew-inscription]
    freedom:
      sensory_when_found_md: |
        指腹蹭过刻痕时,木屑早被擦掉了——这行字刻完后被磨过一次。
    forbidden:
      - 严禁让 LLM 替 PC 翻译此句的"宗教含义"——线索的力量在于含糊

  # --------------------------------------------------------------------------
  - id: clue.flute-in-box
    title: 床头柜木盒里的古老芦笛
    frame:
      location_scene: scene.farmhouse-bedroom
      discovery:
        method: auto-on-enter
      reveal_md: |
        床头柜上的木盒打开了——里面是一支**古老粗糙的手工芦笛**。
        颜色像被烟熏过的浅褐,六个音孔的位置不太规整,显然是
        手工削制。盒子内衬是黑布。
      kp_note_md: |
        【神秘学】(困难)成功 → 联想到与"潘神"传说中的牧笛吻合。
        【艺术(乐器)】 / 【聆听】成功 → 试吹时,即便完全外行也能
        发出极简旋律,且羊群会因此聚拢(回到 sheep-pen 时触发)。
      unlocks:
        flags: [flag.knew-flute-found]
        clues: [clue.flock-music-response]
    freedom:
      sensory_when_found_md: |
        把芦笛凑到耳边,会听到一种淡得不真实的回响——像是它
        刚刚才有人吹过。
    forbidden:
      - 严禁让 LLM 替 PC 解释"为什么吹笛羊群会聚拢"——必须由 PC 行动后再合并旧迹

  # --------------------------------------------------------------------------
  - id: clue.wall-inscription
    title: 卧室墙上潦草的尖锐刻字
    frame:
      location_scene: scene.farmhouse-bedroom
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        墙纸下露出一行潦草、狂乱的字迹,像是用某种尖锐物深深
        刻划在墙上写就:
        > **"啊!伟大的潘!林间的主宰,欢笑与恐慌的化身!"**
        字体凌乱,像是写到一半激动得手抖。
      kp_note_md: |
        【神秘学】成功 → 知道潘是古希腊神话中的牧神,半人半羊,
        喜欢吹奏芦笛,与森林、牧场、牲畜和荒野有关。**"恐慌"
        (Panic)一词的词源即来自潘神**。
      unlocks:
        flags: [flag.knew-pan-cult]
        clues: [clue.pan-research]
    freedom:
      sensory_when_found_md: |
        手指贴上刻痕时,墙体后面像有空腔——但敲击声并不空,只是
        那一行字下方的木板比别处冷。
    forbidden:
      - 严禁让 LLM 替 PC 给出 SAN check 数值——SAN 走前端 sanityCheck 通道

  # --------------------------------------------------------------------------
  - id: clue.beam-mark
    title: 卧室房梁上的勒痕与凳子
    frame:
      location_scene: scene.farmhouse-bedroom
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
