        藤蔓捆绑起来**,形成类似拱门的结构。
        【神秘学】可知:这很像凯尔特或日耳曼传说中提到的**精灵门
        / 女巫门**。传说,这种结构标志凡人世界与精灵或超自然领域
        之间的边界。穿过它可能意味着无意中闯入它们的领地——这
        会被视为极大的不敬或一种邀请,从而导致迷路、生病或遭遇
        可怕的厄运。
      kp_note_md: |
        破坏门 = 宣战;穿门 = 进入潘神领地。**白日穿门**只有
        氛围渲染(瞬间冰冷),不进入祭坛——祭坛只在月圆夜的梦中才
        显化。
      unlocks:
        flags: [flag.knew-faerie-gate]
    freedom:
      sensory_when_found_md: |
        即使在阳光下,门口空气也比四周冷一截——像隔着一层
        看不见的水幕。
    forbidden:
      - 严禁让 PC 通过"破坏门"作为"反抗潘神"的捷径——破坏行为会触发激怒结局
      - 严禁白日中走门带 PC 真的去到祭坛——氛围渲染,不进入梦境

  # --------------------------------------------------------------------------
  - id: clue.gate-cold-spot
    title: 门口空气的冰冷刺骨
    frame:
      location_scene: scene.witch-gate-day
      discovery:
        method: skill
        skill: spot-hidden
        difficulty: regular
      reveal_md: |
        【侦查】成功可注意到:即便头顶阳光明亮,门口某一段空气
        是反常地**冰冷刺骨**。穿过那道气幕时,皮肤会有一瞬间的
        电流感——不是风,而是别的什么。
      unlocks:
        flags: [flag.knew-gate-cold]
    freedom:
      sensory_when_found_md: |
        怀表的指针在这里偶尔会"咔哒"一声跳过半秒。
    forbidden:
      - 严禁让 LLM 替 PC 给冷气一个"科学解释"——保留含糊

  # --------------------------------------------------------------------------
  - id: clue.altar-corpses
    title: 祭坛旁的徒步者干尸群
    frame:
      location_scene: scene.dream-altar
      discovery:
        method: auto-on-enter
      reveal_md: |
        在围绕祭坛起舞的羊群边缘,你看见**数具穿着徒步者衣服的
        人类干尸**——它们也保持着两脚站立的诡异姿态,脸上凝固着
        极度的恐惧与某种狂喜。这些人都是黑木森林历年失踪的徒步
        爱好者。
      kp_note_md: |
        SAN check 1/1D6(对应原作"目睹此景象损失 1/1D6 SAN")。
        此 check 由 timeline tl.d2-dream-onset 触发,这条 clue 仅
        承担"为什么会有这些干尸"的解释。
      unlocks:
        flags: [flag.knew-altar-corpses]
    freedom:
      sensory_when_found_md: |
        其中一具干尸的脸,你恍惚觉得在律师寄来的本地报纸里
        见过——也许只是错觉。
    forbidden:
      - 严禁让 LLM 替 PC 描写"被干尸抓住"——它们已经死了
      - 严禁让 LLM 替 PC 决定"加入它们"——选择留给 dream-choice

  # --------------------------------------------------------------------------
  - id: clue.dream-contract
    title: 来自远亲的"血契"在梦里展开
    frame:
      location_scene: scene.dream-altar
      discovery:
        method: auto-on-enter
      reveal_md: |
        长角的神明放下芦笛。**祂不开口**,但你脑海里浮现一段
        埃利亚斯生前所立的契约——以对祂的崇拜为筹码,换取牧场
        的丰饶。每个满月,献上一只活物;终极的奉献是把自己献上,
        融入这份"黑色丰饶"。
        然后那道声音直接出现:
        > "你的远亲为我献上了他自己。**你呢?**"
      kp_note_md: |
        条款不是固定的——埃利亚斯所要的赐福不一定对调查员有效。
        具体由 KP 视情况裁量,但三类结局走向不变。
      unlocks:
        flags: [flag.knew-dream-contract]
        secrets: [npc.pan]
    freedom:
      sensory_when_found_md: |
        契约的内容像一段被压缩的影子贴在你脑壳后侧——你不必读,
        它已经在那里了。
    forbidden:
      - 严禁让 LLM 替 PC 选择——三类抉择由 PC 亲口/亲手表态
      - 严禁让契约文本以可"反复阅读"的形式给 PC——它只在那一刻完整存在

  # --------------------------------------------------------------------------
  - id: clue.flute-becomes-dagger
    title: 床头柜上的芦笛变成了匕首
    frame:
      location_scene: scene.full-moon-night
      discovery:
        method: auto-on-enter
      reveal_md: |
        梦醒后,床头柜上的木盒打开着——但里面**不再是芦笛**,
        而是一把古老粗糙的**手工匕首**,握把缠着风干的麻绳。
        匕首冷得不正常,像刚从冰水里捞出来。
      kp_note_md: |
        这是**接受路径**所必需的祭具——若 PC 选择献上羔羊,
        将以这把匕首在祭坛或屋内完成仪式。
      unlocks:
        flags: [flag.flute-became-dagger]
    freedom:
      sensory_when_found_md: |
        握把上的麻绳里夹着一根白色的羊毛——像羔羊被剃下的那种。
    forbidden:
      - 严禁让 LLM 替 PC 立刻拿起匕首——这是 PC 主动行为
      - 严禁让芦笛在变身后被 PC "看见还原"——变化是单向的

# ============================================================================
# timeline
# ============================================================================

timeline:
  # --------------------------------------------------------------------------
  - id: tl.d1-william-arrives
    title: 第一天 15:30 · 邻居威廉抵达牧场
    fires_when: { game_day: 1, hour: "15:30" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        车道尽头传来马蹄踏在硬土上的"哒、哒、哒"。**威廉·哈蒙德**到了。
        他骑着一匹老栗马,牵绳一勒就下了马,先朝你这边挥了挥手,
        然后才把帽子摁正,把缰绳拴在木桩上。手里拎着一只装着自家
        黄油的纸袋,放在玄关。
      effects:
        npc_relocate:
          - { npc: npc.william-hammond, to: scene.farm-arrival }
        set_flags:
          - { flag: flag.william-met, value: true }
    freedom:
      atmosphere_md: 阳光斜了一些、风开始变冷一截、马蹄声让羊群短暂抬头
    forbidden:
      - 严禁威廉在抵达瞬间就说出"林主"——这是后续聊天的内容
      - 严禁让 LLM 替 PC 立刻接受/拒绝威廉的拜访——节奏由 PC 把握

  # --------------------------------------------------------------------------
  - id: tl.d1-lamb-birth
    title: 第一天 17:00 · 母羊难产 · 接生
    fires_when: { game_day: 1, hour: "17:00" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.william-met, value: true }
    once: true
    frame:
      narrative_seed_md: |
        一阵急促而焦虑的"咩咩"声和羊群的小范围骚动从羊圈方向传来。
        一只**即将生产**的母羊在干草上辗转反侧,显得十分痛苦。
        胎位不正——需要有人伸手进去矫正羔羊的位置才能顺利拉出来。
        威廉在你身旁,**等你做决定**。
      effects:
        force_scene_transition: scene.sheep-pen
        set_flags:
          - { flag: flag.lamb-birth-triggered, value: true }
    freedom:
      atmosphere_md: 母羊额头出汗、其他羊静静围着、威廉袖口卷到胳膊肘
    forbidden:
      - 严禁让 LLM 替 PC 决定"由威廉接生"——必须由 PC 主动表态(包括"让威廉来")
      - 严禁让母羊死亡——潘神的羊群难产但不会死;这个事实本身将成为后续异常的拼图

  # --------------------------------------------------------------------------
  - id: tl.d1-dusk-flute
    title: 第一天 18:30 · 黄昏 · 森林深处的笛声
    fires_when: { game_day: 1, hour: "18:30" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.lamb-birth-triggered, value: true }
    once: true
    frame:
      narrative_seed_md: |
        天色开始压下来,风掠过草地的声音第一次让你觉得"不对"——
        若有若无、令人心神不宁的**笛声**从森林深处传来。它并不
        响亮,却像直接在脑海里回荡。你能感到自己的注意力被它
        轻轻拉过去。
      effects:
        san_check:
          loss: { success: 0, fail: 1 }
          reason: 黄昏时分听见森林深处不该有的笛声
        set_flags:
          - { flag: flag.heard-dusk-flute, value: true }
    freedom:
      atmosphere_md: 太阳下沉的速度像比平时快、羊群第一次集体抬头朝森林
    forbidden:
      - 严禁让 LLM 替 PC 描写"忍不住走向森林"——是否前往是 PC 决定
      - 严禁此处直接揭示"是潘神的笛声"

  # --------------------------------------------------------------------------
  - id: tl.d1-full-moon-rises
    title: 第一天 22:00 · 月圆之夜降临
    fires_when: { game_day: 1, hour: "22:00" }
    forced: true
    once: true
    frame:
      narrative_seed_md: |
        天黑得很彻底。然后,**月亮**升起来了——大、白、亮得不像
        本地的月。你回屋上床,**以为**自己只是要休息;意识却像
        被一只无形的手按下水面,你的身体开始往下沉。
      effects:
        force_scene_transition: scene.dream-altar
        set_flags:
          - { flag: flag.full-moon-night, value: true }
    freedom:
      atmosphere_md: 月光把屋内染成银灰、屋外羊圈骚动起来、窗外远处森林响起笛声
    forbidden:
      - 严禁让 LLM 在此节点替 PC"清醒地阻止入梦"——梦由潘神主动编织,不可避免
      - 严禁让威廉在月圆夜出现在牧场——他会自己回家、不会过夜

  # --------------------------------------------------------------------------
  - id: tl.d1-dream-witnessed
    title: 第一天 22:30 · 梦中目睹长角神明
    fires_when: { game_day: 1, hour: "22:30" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.full-moon-night, value: true }
    once: true
    frame:
      narrative_seed_md: |
        你看见了——长角的轮廓、银灰色的田野、围着祭坛跳舞的羊群、
        以及那群以诡异姿态站立的徒步者干尸。在梦的核心,**祂正在
        看你**。
      effects:
        san_check:
          loss: { success: 1, fail: 1D6 }
          reason: 直面祭坛旁的潘神化身与干尸群
        set_flags:
          - { flag: flag.witnessed-pan, value: true }
    freedom:
      atmosphere_md: 笛声直接在脑海里回荡、羊群同步晃动身体、月光像液体一样停在皮肤上
    forbidden:
      - 严禁让 LLM 直接描写潘神面部细节——只允许长角轮廓
      - 严禁让 LLM 替 PC 投 SAN——SAN 走前端 sanityCheck 通道

  # --------------------------------------------------------------------------
  - id: tl.d2-dawn-choice-resolved
    title: 第二天 05:00 · 黎明 · 抉择的代价显现
    fires_when: { game_day: 2, hour: "05:00" }
    forced: false
    prerequisites:
      - { kind: flag, flag: flag.witnessed-pan, value: true }
    once: true
    frame:
      narrative_seed_md: |
        天将亮。屋外发生的一切——羊群是否仍在围栏内、地面上是否
        散落着干瘪的尸体、羔羊是否仍在你脚边——决定了今天牧场的
        走向。床头柜上躺着的"那把东西"也告诉你昨夜的抉择不是梦。
    freedom:
      atmosphere_md: 第一缕日光从东南打进窗、屋外鸟叫第一次响起、远处的笛声彻底消失
    forbidden:
      - 严禁让 LLM 替 PC 推断"梦真的发生了"——线索由 PC 主动观察
      - 严禁直接结算结局——结局由 endings 表的 trigger flags 决定

